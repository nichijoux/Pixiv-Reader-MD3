name: Release APK

# 推送 v* 版本 tag 时自动构建 Release APK 并发布到 GitHub Release
on:
  push:
    tags:
      - 'v*'

# 创建/更新 GitHub Release 需要写入权限
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 项目按 AGENTS.md 约定使用 JDK 21
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # 缓存 Gradle 依赖与 wrapper 分发
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 从 tag（如 v1.2.3）派生版本名与数字 versionCode（1.2.3 -> 10203）
      - name: Derive version from tag
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          MAJOR="${VERSION%%.*}"
          REST="${VERSION#*.}"
          MINOR="${REST%%.*}"
          PATCH="${REST#*.}"
          # 仅保留数字（兼容 v1.2.3-beta 之类带后缀的 tag）
          MAJOR="$(printf '%s' "$MAJOR" | tr -dc '0-9')"; MAJOR=${MAJOR:-0}
          MINOR="$(printf '%s' "$MINOR" | tr -dc '0-9')"; MINOR=${MINOR:-0}
          PATCH="$(printf '%s' "$PATCH" | tr -dc '0-9')"; PATCH=${PATCH:-0}
          CODE=$(( MAJOR * 10000 + MINOR * 100 + PATCH ))
          [ "$CODE" -le 0 ] && CODE=1
          echo "versionName=$VERSION" >> "$GITHUB_OUTPUT"
          echo "versionCode=$CODE" >> "$GITHUB_OUTPUT"

      # 配置 Release 签名（需在仓库 Secrets 提供 KEYSTORE_BASE64 等；未配置则产出未签名 APK）
      - name: Configure release signing
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$GITHUB_WORKSPACE/keystore.jks"
          cat > "$GITHUB_WORKSPACE/keystore.properties" <<EOF
          storeFile=$GITHUB_WORKSPACE/keystore.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      # 构建 Release APK（按 ABI 拆分为 arm64-v8a / armeabi-v7a 两个瘦身包；未配签名则未签名）
      - name: Build release APK
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --console=plain --no-daemon \
            -PversionName="${{ steps.version.outputs.versionName }}" \
            -PversionCode="${{ steps.version.outputs.versionCode }}"

      # 收集拆分的 ARM APK 并重命名（arm64-v8a / armeabi-v7a 两个瘦身包）
      - name: Collect APK artifacts
        shell: bash
        run: |
          RELEASE_DIR="app/build/outputs/apk/release"
          COUNT=0
          for APK in "$RELEASE_DIR"/*.apk; do
            [ -e "$APK" ] || continue
            BASENAME="$(basename "$APK")"
            case "$BASENAME" in
              *arm64-v8a*)   ABI="arm64-v8a" ;;
              *armeabi-v7a*) ABI="armeabi-v7a" ;;
              *) echo "跳过非 ARM ABI APK：$BASENAME" >&2; continue ;;
            esac
            cp "$APK" "PixivReader-${{ steps.version.outputs.versionName }}-$ABI.apk"
            COUNT=$((COUNT+1))
          done
          if [ "$COUNT" -eq 0 ]; then
            echo "未找到 arm64-v8a / armeabi-v7a 拆分 APK，请检查 splits 配置" >&2
            exit 1
          fi

      # 发布到 GitHub Release（tag 已存在，因此是更新该 tag 的 release）
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: PixivReader-${{ steps.version.outputs.versionName }}-*.apk
          name: v${{ steps.version.outputs.versionName }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: false
          body: |
            ## PixivReader v${{ steps.version.outputs.versionName }}

            ARM 瘦身包（按 ABI 拆分，按设备 ABI 安装对应包）：
            - arm64-v8a（ARMv8 / 64 位）
            - armeabi-v7a（其它 ARM / 32 位）

            若未配置签名密钥，产物为未签名 APK（不可直接安装）。
