7\u5385\u3002\u60a0\u626c\u7684\u53e4\u5178\u4e50\uff0c\u6c34\u6676\u540a\u706f\u6298\u5c04\u51fa\u7684\u7480\u74a8\u5149\u8292\uff0c\u8863\u9999\u9b13\u5f71\uff0c\u89e5\u7b79\u4ea4\u9519\u3002\u8fd9\u91cc\u7684\u4e00\u5207\uff0c\u90fd\u548c\u6211\u683c\u683c\u4e0d\u5165\u3002\u5bbe\u5ba2\u4eec\u7684\u76ee\u5149\u5728\u6211\u4eec\u8eab\u4e0a\u626b\u8fc7\uff0c\u5e26\u7740\u63a2\u7a76\u548c\u7591\u60d1\u3002\u6211\u80fd\u611f\u89c9\u5230\uff0c\u6c5f\u96ea\u633d\u7740\u6211\u7684\u624b\u81c2\uff0c\u53c8\u7d27\u4e86\u4e00\u4e9b\u3002\n\n\u51e0\u4e4e\u662f\u5728\u6211\u4eec\u8e0f\u5165\u5927\u5385\u7684\u77ac\u95f4\uff0c\u4e00\u4e2a\u7a7f\u7740\u8003\u7a76\u7684\u3001\u8138\u4e0a\u6302\u7740\u5b8c\u7f8e\u7b11\u5bb9\u7684\u7537\u4eba\uff0c\u5c31\u7aef\u7740\u9152\u676f\uff0c\u7a7f\u8fc7\u4eba\u7fa4\uff0c\u5f84\u76f4\u5411\u6211\u4eec\u8d70\u6765\u3002\n\n\u662f\u82cf\u6587\u6d69\u3002\n\n\"\u96ea\u513f\uff0c\u4f60\u6765\u4e86\u3002\"\n\n\u4ed6\u7684\u76ee\u5149\u8d8a\u8fc7\u6211\uff0c\u76f4\u63a5\u843d\u5728\u4e86\u6c5f\u96ea\u7684\u8138\u4e0a\uff0c\u773c\u795e\u91cc\u5e26\u7740\u4e00\u79cd\u4e0d\u5bb9\u7f6e\u7591\u7684\u3001\u5c5e\u4e8e\u4e3b\u4eba\u7684\u5360\u6709\u6b32\u3002\n\n\u6c5f\u96ea\u6ca1\u6709\u56de\u7b54\u4ed6\uff0c\u5979\u53ea\u662f\u5f80\u6211\u8eab\u8fb9\u53c8\u9760\u4e86\u9760\uff0c\u7136\u540e\u62ac\u8d77\u5934\uff0c\u770b\u7740\u90a3\u4e2a\u7537\u4eba\uff0c\u90a3\u5f20\u603b\u662f\u51b0\u51b7\u7684\u8138\u4e0a\uff0c\u7b2c\u4e00\u6b21\uff0c\u9732\u51fa\u4e86\u4e00\u4e2a\u6781\u6de1\u7684\u3001\u5374\u53c8\u5e26\u7740\u4e00\u4e1d\u6311\u8845\u7684\u7b11\u5bb9\u3002\n\n\"\u6587\u6d69\uff0c\u7ed9\u4f60\u4ecb\u7ecd\u4e00\u4e0b\u3002\"\n\n\u201c\u8fd9\u4f4d\u662f\u6211\u7684\u7231\u4eba\uff0c\u9646\u6c89\u3002\u201d\n\n\n\n\n69.\n\u201c\u7231\u4eba\uff1f\u201d\n\n\u82cf\u6587\u6d69\u8138\u4e0a\u7684\u7b11\u5bb9\u50f5\u786c\u4e86\u7247\u523b\uff0c\u5c31\u50cf\u4e00\u526f\u7cbe\u7f8e\u7684\u74f7\u5668\u9762\u5177\u51fa\u73b0\u4e86\u4e00\u9053\u7ec6\u5fae\u7684\u88c2\u75d5\u3002\u4f46\u4ed6\u5f88\u5feb\u5c31\u6062\u590d\u4e86\u90a3\u526f\u5b8c\u7f8e\u7684\u3001\u65e0\u53ef\u6311\u5254\u7684\u8868\u60c5\u3002\u4ed6\u751a\u81f3\u8fd8\u7b11\u4e86\u4e00\u58f0\uff0c\u90a3\u7b11\u58f0\u5f88\u8f7b\uff0c\u5728\u60a0\u626c\u7684\u53e4\u5178\u4e50\u91cc\u51e0\u4e4e\u542c\u4e0d\u89c1\u3002\n\n\u4ed6\u6ca1\u6709\u770b\u6211\uff0c\u76ee\u5149\u4f9d\u65e7\u9ecf\u5728\u6c5f\u96ea\u7684\u8138\u4e0a\uff0c\u773c\u795e\u91cc\u5e26\u7740\u4e00\u4e1d\u6210\u5e74\u4eba\u770b\u5f85\u4e0d\u61c2\u4e8b\u7684\u5c0f\u5b69\u822c\u7684\u3001\u5c45\u9ad8\u4e34\u4e0b\u7684\u5bbd\u5bb9\u3002\n\n\u201c\u96ea\u513f\uff0c\u4f60\u8fd9\u4e2a\u73a9\u7b11\uff0c\u53ef\u4e00\u70b9\u90fd\u4e0d\u597d\u7b11\u3002\u201d\n\n\u201c\u8fd9\u4f4d\u5148\u751f\u6709\u70b9\u773c\u719f\u554a\u2026\u2026\u201d\u4ed6\u7ec8\u4e8e\u820d\u5f97\u628a\u76ee\u5149\u5206\u7ed9\u6211\u4e00\u4e1d\uff0c\u5728\u6211\u8eab\u4e0a\u4e0a\u4e0b\u6253\u91cf\u7740\uff0c\u90a3\u773c\u795e\u50cf\u662f\u5728\u8bc4\u4f30\u4e00\u4ef6\u5546\u54c1\u7684\u4ef7\u503c\uff0c\u6700\u540e\uff0c\u4ed6\u7684\u76ee\u5149\u843d\u5728\u4e86\u6211\u65e0\u540d\u6307\u4e0a\u90a3\u679a\u548c\u6c5f\u96ea\u540c\u6b3e\u7684\u6212\u6307\u4e0a\u540e\uff0c\u4ed6\u7684\u8138\u8272\u4e00\u4e0b\u5b50\u96be\u770b\u8d77\u6765\uff0c\u6323\u624e\u4e86\u534a\u5929\uff0c\u624d\u50f5\u786c\u7684\u6324\u51fa\u7b11\u5bb9\uff0c\u201c\u4f60\u7684\u65b0\u670b\u53cb\uff1f\u201d\n\n\u6c5f\u96ea\u6ca1\u6709\u7406\u4f1a\u4ed6\u8bdd\u91cc\u7684\u5632\u8bbd\uff0c\u5979\u53ea\u662f\u628a\u5934\u8f7b\u8f7b\u5730\u9760\u5728\u4e86\u6211\u7684\u80a9\u8180\u4e0a\uff0c\u8fd9\u4e2a\u52a8\u4f5c\u8ba9\u5979\u633d\u7740\u6211\u624b\u81c2\u7684\u59ff\u6001\uff0c\u663e\u5f97\u66f4\u52a0\u4eb2\u5bc6\u65e0\u95f4\u3002\n\n\u201c\u4ed6\u4e0d\u662f\u6211\u7684\u670b\u53cb\u3002\u201d\n\n\u201c\u4ed6\u662f\u6211\u7684\u4e00\u5207\u3002\u201d\n\n\u8fd9\u53e5\u8bdd\u5f88\u8f7b\uff0c\u5374\u50cf\u4e00\u9897\u6295\u5165\u5e73\u9759\u6e56\u9762\u7684\u6df1\u6c34\u70b8\u5f39\uff0c\u5728\u6211\u4eec\u5468\u56f4\u8fd9\u7247\u5c0f\u5c0f\u7684\u7a7a\u95f4\u91cc\uff0c\u6380\u8d77\u4e86\u65e0\u58f0\u7684\u5de8\u6d6a\u3002\u5468\u56f4\u90a3\u4e9b\u5047\u88c5\u5728\u4ea4\u8c08\u3001\u5b9e\u5219\u4e00\u76f4\u7ad6\u7740\u8033\u6735\u542c\u6211\u4eec\u8fd9\u8fb9\u52a8\u9759\u7684\u5bbe\u5ba2\u4eec\uff0c\u90fd\u51fa\u73b0\u4e86\u77ac\u95f4\u7684\u3001\u6574\u9f50\u5212\u4e00\u7684\u5b89\u9759\u3002\n\n\u82cf\u6587\u6d69\u8138\u4e0a\u7684\u7b11\u5bb9\uff0c\u7ec8\u4e8e\u5f7b\u5e95\u6d88\u5931\u4e86\u3002\n\n\u4ed6\u7aef\u7740\u9152\u676f\u7684\u624b\u5fae\u5fae\u6643\u4e86\u4e00\u4e0b\uff0c\u6df1\u7ea2\u8272\u7684\u9152\u6db2\u5728\u676f\u58c1\u4e0a\u8361\u6f3e\u3002\u4ed6\u770b\u7740\u6211\uff0c\u90a3\u53cc\u603b\u662f\u5e26\u7740\u7b11\u610f\u7684\u773c\u775b\u91cc\uff0c\u6b64\u523b\u50cf\u7ed3\u4e86\u4e00\u5c42\u8584\u8584\u7684\u51b0\u3002\n\n\u201c\u8fd9\u4f4d\u2026\u2026\u9646\u5148\u751f\uff0c\u662f\u5417\uff1f\u201d\n\n\u201c\u4e0d\u77e5\u9053\u9646\u5148\u751f\u5728\u54ea\u91cc\u9ad8\u5c31\uff1f\u201d\n\n\u6211\u611f\u89c9\u81ea\u5df1\u8eab\u4e0a\u7684\u897f\u88c5\u50cf\u662f\u88ab\u6c57\u6c34\u6d78\u6e7f\u4e86\uff0c\u9ecf\u7cca\u7cca\u5730\u8d34\u5728\u76ae\u80a4\u4e0a\u3002\u5468\u56f4\u6240\u6709\u4eba\u7684\u76ee\u5149\u90fd\u50cf\u63a2\u7167\u706f\u4e00\u6837\u805a\u7126\u5728\u6211\u8eab\u4e0a\uff0c\u8ba9\u6211\u65e0\u6240\u9041\u5f62\u3002\u6211\u5f20\u4e86\u5f20\u5634\uff0c\u5374\u4e00\u4e2a\u5b57\u90fd\u8bf4\u4e0d\u51fa\u6765\u3002\n\n\u5c31\u5728\u6211\u7ed9\u81ea\u5df1\u52a0\u6cb9\u6253\u6c14\uff0c\u51c6\u5907\u56de\u7b54\u65f6\uff0c\u6c5f\u96ea\u5374\u5ffd\u7136\u52a8\u4e86\u3002\n\n\u5979\u677e\u5f00\u4e86\u633d\u7740\u6211\u624b\u81c2\u7684\u624b\uff0c\u8f6c\u800c\u4f38\u51fa\u53cc\u81c2\uff0c\u73af\u4f4f\u4e86\u6211\u7684\u8116\u5b50\u3002\u7136\u540e\uff0c\u5728\u82cf\u6587\u6d69\u90a3\u77ac\u95f4\u53d8\u5f97\u94c1\u9752\u7684\u8138\u8272\u4e2d\uff0c\u5728\u5468\u56f4\u4eba\u7fa4\u4e00\u7247\u5012\u5438\u51b7\u6c14\u7684\u58f0\u97f3\u91cc\uff0c\u5979\u8e2e\u8d77\u811a\u5c16\uff0c\u5fae\u5fae\u4ef0\u8d77\u5934\uff0c\u5c06\u5979\u90a3\u53cc\u51b0\u51c9\u7684\u3001\u67d4\u8f6f\u7684\u5634\u5507\uff0c\u51c6\u786e\u5730\u5370\u5728\u4e86\u6211\u7684\u5634\u5507\u4e0a\u3002\n\n\u8fd9\u4e2a\u543b\uff0c\u5b83\u5f88\u7b28\u62d9\uff0c\u751a\u81f3\u6709\u4e9b\u4e0d\u7ba1\u4e0d\u987e\u7684\u7c97\u66b4\u3002\u5979\u7684\u7259\u9f7f\u751a\u81f3\u78d5\u5230\u4e86\u6211\u7684\u5634\u5507\uff0c\u4f20\u6765\u4e00\u9635\u7ec6\u5fae\u7684\u523a\u75db\u3002\u4f46\u8fd9\u4e2a\u543b\u91cc\uff0c\u5374\u5e26\u7740\u4e00\u79cd\u8c41\u51fa\u53bb\u4e00\u5207\u7684\u3001\u5b64\u6ce8\u4e00\u63b7\u7684\u51b3\u7edd\u3002\n\n\u5979\u662f\u5728\u7528\u8fd9\u79cd\u6700\u76f4\u63a5\u7684\u65b9\u5f0f\uff0c\u5411\u6240\u6709\u4eba\uff0c\u4e5f\u5411\u5979\u81ea\u5df1\uff0c\u5ba3\u544a\u7740\u5979\u7684\u9009\u62e9\u3002\n\n\u8fd9\u4e2a\u543b\u5e76\u6ca1\u6709\u6301\u7eed\u592a\u4e45\u3002\n\n\u5979\u677e\u5f00\u6211\uff0c\u91cd\u65b0\u633d\u4f4f\u6211\u7684\u624b\u81c2\uff0c\u7136\u540e\u8f6c\u8fc7\u5934\uff0c\u770b\u7740\u90a3\u4e2a\u5df2\u7ecf\u5f7b\u5e95\u50f5\u5728\u539f\u5730\u7684\u82cf\u6587\u6d69\uff0c\u90a3\u53cc\u603b\u662f\u51b0\u51b7\u7684\u773c\u775b\u91cc\uff0c\u7b2c\u4e00\u6b21\uff0c\u71c3\u8d77\u4e86\u4e24\u7c07\u660e\u4eae\u7684\u3001\u80dc\u5229\u7684\u706b\u7130\u3002\n\n\u201c\u73b0\u5728\uff0c\u4f60\u8fd8\u9700\u8981\u6211\u4ecb\u7ecd\u4e00\u904d\u5417\uff1f\u201d\n\n\n\n\n70.\n\u6211\u611f\u89c9\u81ea\u5df1\u7684\u5634\u5507\u4e0a\u8fd8\u6b8b\u7559\u7740\u5979\u90a3\u51b0\u51c9\u3001\u67d4\u8f6f\u7684\u89e6\u611f\uff0c\u4ee5\u53ca\u4e00\u4e1d\u82e5\u6709\u82e5\u65e0\u7684\u3001\u94c1\u9508\u822c\u7684\u8840\u8165\u5473\u3002\u6211\u7684\u5927\u8111\u4e00\u7247\u7a7a\u767d\uff0c\u53ea\u80fd\u50cf\u4e2a\u6728\u5076\u4e00\u6837\uff0c\u4efb\u7531\u5979\u633d\u7740\u6211\u7684\u624b\u81c2\uff0c\u7ad9\u5728\u8fd9\u4e2a\u91d1\u78a7\u8f89\u714c\u7684\u3001\u5145\u6ee1\u4e86\u5ba1\u89c6\u76ee\u5149\u7684\u98ce\u66b4\u4e2d\u5fc3\u3002\n\n\u5927\u5385\u91cc\u6b7b\u4e00\u822c\u7684\u5bc2\u9759\u3002\n\n\u6240\u6709\u4eba\u7684\u52a8\u4f5c\u90fd\u505c\u4f4f\u4e86\uff0c\u8fde\u90a3\u60a0\u626c\u7684\u53e4\u5178\u4e50\u90fd\u50cf\u662f\u88ab\u4e00\u53ea\u65e0\u5f62\u7684\u624b\u6390\u4f4f\u4e86\u8116\u5b50\uff0c\u53d8\u5f97\u5fae\u5f31\u800c\u9065\u8fdc\u3002\u51e0\u5341\u53cc\u773c\u775b\uff0c\u50cf\u65e0\u6570\u76cf\u805a\u5149\u706f\uff0c\u9f50\u5237\u5237\u5730\u805a\u7126\u5728\u6211\u4eec\u4e09\u4e2a\u4eba\u8eab\u4e0a\uff0c\u90a3\u76ee\u5149\u91cc\u6709\u9707\u60ca\uff0c\u6709\u7591\u60d1\uff0c\u6709\u5174\u594b\uff0c\u4e5f\u6709\u5e78\u707e\u4e50\u7978\u3002\n\n\u8fd9\u7247\u5bc2\u9759\u53ea\u6301\u7eed\u4e86\u4e0d\u5230\u4e09\u79d2\u949f\uff0c\u7136\u540e\uff0c\u5c31\u50cf\u6cb9\u9505\u91cc\u6e85\u8fdb\u4e86\u4e00\u6ef4\u6c34\uff0c\u6574\u4e2a\u5927\u5385\u77ac\u95f4\u201c\u55e1\u201d\u7684\u4e00\u58f0\u70b8\u5f00\u4e86\u3002\n\n\u201c\u90a3\u4e0d\u662f\u2026\u2026\u6c5f\u5bb6\u7684\u5927\u5c0f\u59d0\u5417\uff1f\u5979\u65c1\u8fb9\u90a3\u4e2a\u7537\u4eba\u662f\u8c01\uff1f\u201d\n\n\u201c\u524d\u51e0\u5929\u4e0a\u70ed\u641c\u7684\u90a3\u4e2a\u554a\uff01\u5c31\u662f\u548c\u6797\u521d\u590f\u4f20\u7eef\u95fb\u7684\u90a3\u4e2a\u7d20\u4eba\uff01\u201d\n\n\u201c\u6211\u7684\u5929\u2026\u2026\uff1f\u4f46\u662f\u73b0\u5728\u2026\u2026\u6c5f\u5c0f\u59d0\u53c8\u548c\u4ed6\u2026\u2026\u201d\n\n\u201c\u6211\u9760\uff0c\u8fd9\u7537\u7684\u5230\u5e95\u662f\u6797\u521d\u590f\u7684\u7537\u670b\u53cb\u8fd8\u662f\u6c5f\u5c0f\u59d0\u7684\u7537\u670b\u53cb\u554a\uff1f\u201d\n\n\u201c\u8fd9\u5230\u5e95\u662f\u600e\u4e48\u56de\u4e8b\uff1f\u6c5f\u5c0f\u59d0\u7684\u672a\u5a5a\u592b\u4e0d\u662f\u82cf\u603b\u5417\uff1f\u201d\n\n\u7a83\u7a83\u79c1\u8bed\u58f0\u50cf\u6f6e\u6c34\u4e00\u6837\u4ece\u56db\u9762\u516b\u65b9\u6d8c\u6765\uff0c\u4ea4\u7ec7\u6210\u4e00\u5f20\u5de8\u5927\u7684\u3001\u5608\u6742\u7684\u7f51\uff0c\u5c06\u6211\u4eec\u7262\u7262\u7f69\u4f4f\u3002\u6211\u770b\u5230\u5df2\u7ecf\u6709\u4eba\u6084\u6084\u5730\u62ff\u51fa\u4e86\u624b\u673a\uff0c\u88c5\u4f5c\u4e0d\u7ecf\u610f\u5730\uff0c\u5bf9\u51c6\u4e86\u6211\u4eec\u8fd9\u8fb9\u3002\n\n\u8fd9\u53ef\u662f\u6781\u5176\u7a00\u7f3a\uff0c\u4e00\u8f88\u5b50\u672a\u5fc5\u80fd\u89c1\u5230\u4e00\u6b21\u7684\u8868\u6f14\u3002\n\n\u8fd9\u6837\u7684\u573a\u5408\uff0c\u96be\u514d\u4f1a\u6709\u4ece\u4e8b\u65b0\u95fb\u884c\u4e1a\u7684\u4eba\uff0c\u4ed6\u4eec\u654f\u611f\u7684\u6355\u6349\u5230\u4e86\u65b0\u95fb\u5934\u6761\u7684\u5f71\u5b50\u3002\n\n\u82cf\u6587\u6d69\u7684\u8138\uff0c\u5df2\u7ecf\u4ece\u94c1\u9752\u53d8\u6210\u4e86\u732a\u809d\u8272\u3002\u4ed6\u90a3\u5f20\u603b\u662f\u6302\u7740\u5b8c\u7f8e\u7b11\u5bb9\u7684\u8138\uff0c\u6b64\u523b\u56e0\u4e3a\u6781\u5ea6\u7684\u6124\u6012\u548c\u7f9e\u8fb1\u800c\u5fae\u5fae\u626d\u66f2\u7740\uff0c\u63e1\u7740\u9152\u676f\u7684\u624b\u6307\u56e0\u4e3a\u592a\u8fc7\u7528\u529b\u800c\u6307\u8282\u6cdb\u767d\u3002\n\n\u201c\u6c5f\u96ea\uff0c\u4f60\u77e5\u4e0d\u77e5\u9053\u4f60\u81ea\u5df1\u5728\u505a\u4ec0\u4e48\uff1f\u201d\n\n\u4ed6\u51e0\u4e4e\u662f\u4ece\u7259\u7f1d\u91cc\u6324\u51fa\u8fd9\u53e5\u8bdd\uff0c\u58f0\u97f3\u538b\u5f97\u5f88\u4f4e\uff0c\u50cf\u4e00\u6761\u5373\u5c06\u53d1\u52a8\u653b\u51fb\u7684\u6bd2\u86c7\u3002\n\n\u6c5f\u96ea\u6ca1\u6709\u7406\u4f1a\u4ed6\u7684\u5a01\u80c1\uff0c\u4e5f\u6ca1\u6709\u7406\u4f1a\u5468\u56f4\u7684\u8bae\u8bba\u58f0\u3002\u5979\u53ea\u662f\u677e\u5f00\u4e86\u633d\u7740\u6211\u7684\u624b\u81c2\uff0c\u4e0a\u524d\u4e00\u6b65\uff0c\u76f4\u9762\u7740\u82cf\u6587\u6d69\u90a3\u5f20\u626d\u66f2\u7684\u8138\u3002\n\n\u201c\u6211\u5f53\u7136\u77e5\u9053\u6211\u5728\u505a\u4ec0\u4e48\u3002\u201d\n\n\u201c\u5012\u662f\u4f60\uff0c\u82cf\u6587\u6d69\uff0c\u4f60\u77e5\u4e0d\u77e5\u9053\u4f60\u81ea\u5df1\u5728\u505a\u4ec0\u4e48\uff1f\u201d\n\n\u5979\u7684\u58f0\u97f3\u4e0d\u5927\uff0c\u5374\u50cf\u4e00\u628a\u51b0\u51b7\u7684\u3001\u950b\u5229\u7684\u624b\u672f\u5200\uff0c\u7cbe\u51c6\u5730\u5256\u5f00\u4e86\u82cf\u6587\u6d69\u6700\u540e\u7684\u4f2a\u88c5\u3002\u5979\u7684\u76ee\u5149\u626b\u8fc7\u5468\u56f4\u90a3\u4e9b\u7ad6\u7740\u8033\u6735\u7684\u5bbe\u5ba2\uff0c\u7136\u540e\u91cd\u65b0\u843d\u56de\u5230\u82cf\u6587\u6d69\u7684\u8138\u4e0a\uff0c\u58f0\u97f3\u9661\u7136\u63d0\u9ad8\u4e86\u4e00\u4e9b\uff0c\u5e26\u7740\u4e00\u79cd\u4e0d\u5bb9\u7f6e\u7591\u7684\u8d28\u95ee\u3002\n\n\u201c\u4e3a\u4ec0\u4e48\u8981\u82b1\u94b1\u8bf7\u4eba\u4f2a\u9020\u90a3\u4e9b\u7167\u7247\uff1f\u4e3a\u4ec0\u4e48\u8981\u4e70\u901a\u90a3\u4e9b\u8425\u9500\u53f7\uff0c\u7f16\u9020\u9646\u6c89\u548c\u521d\u590f\u7684\u7eef\u95fb\uff1f\u201d\n\n\u201c\u4f60\u4ee5\u4e3a\u7528\u8fd9\u79cd\u4e0b\u4e09\u6ee5\u7684\u624b\u6bb5\uff0c\u79bb\u95f4\u6211\u548c\u6211\u6700\u597d\u670b\u53cb\u521d\u590f\u7684\u5173\u7cfb\uff0c\u5c31\u80fd\u8fbe\u5230\u4f60\u7684\u76ee\u7684\u5417\uff1f\u201d\n\n\u5979\u7684\u8bdd\uff0c\u50cf\u4e00\u9897\u53c8\u4e00\u9897\u7684\u91cd\u78c5\u70b8\u5f39\uff0c\u5728\u4eba\u7fa4\u4e2d\u70b8\u5f00\u3002\n\n\u201c\u8fd8\u662f\u4f60\u4ee5\u4e3a\u8fd9\u6837\u5c31\u53ef\u4ee5\u8ba9\u6211\u548c\u9646\u6c89\u5206\u624b\uff0c\u8ba9\u6211\u548c\u4f60\u5728\u4e00\u8d77\uff1f\u201d\n\n\u201c\u4f60\u672a\u514d\u592a\u5c0f\u770b\u6211\u4e86\uff01\u201d\n\n\u6240\u6709\u4eba\u7684\u8138\u4e0a\u90fd\u9732\u51fa\u4e86\u604d\u7136\u5927\u609f\u7684\u8868\u60c5\u3002\u4ed6\u4eec\u7684\u76ee\u5149\u5728\u82cf\u6587\u6d69\u3001\u6211\u3001\u8fd8\u6709\u4e0d\u8fdc\u5904\u90a3\u4e2a\u626e\u6f14\u7740\u201c\u65e0\u8f9c\u53d7\u5bb3\u8005\u201d\u7684\u6797\u521d\u590f\u4e4b\u95f4\u6765\u56de\u626b\u89c6\u3002\n\n\u201c\u539f\u6765\u662fP\u56fe\u2026\u2026\u201d\n\n\u201c\u6211\u5c31\u8bf4\u561b\uff0c\u6797\u521d\u590f\u600e\u4e48\u53ef\u80fd\u770b\u4e0a\u4e00\u4e2a\u7d20\u4eba\u2026\u2026\u201d\n\n\u201c\u82cf\u603b\u8fd9\u4e48\u505a\uff0c\u4e5f\u592a\u6ca1\u54c1\u4e86\u5427\uff1f\u4e3a\u4e86\u8ffd\u6c5f\u5c0f\u59d0\uff0c\u5c45\u7136\u53bb\u79bb\u95f4\u5979\u7684\u670b\u53cb\uff1f\u201d\n\n\u201c\u4e00\u76f4\u90fd\u6709\u6d88\u606f\u8bf4\u6c5f\u5c0f\u59d0\u548c\u82cf\u6587\u6d69\u611f\u60c5\u4e0d\u548c\uff0c\u4e0d\u4f1a\u7ed3\u5a5a\uff0c\u539f\u6765\u662f\u771f\u7684\uff1f\u201d\n\n\u201c\u54c8\u54c8\uff0c\u8fd9\u4e0b\u7cbe\u5f69\u4e86\uff0c\u8fd9\u662f\u4ed6\u7b2c\u51e0\u6b21\u8054\u59fb\u88ab\u62d2\u7edd\u4e86\uff1f\u201d\n\n\u8bae\u8bba\u58f0\u7684\u98ce\u5411\uff0c\u77ac\u95f4\u5c31\u53d8\u4e86\u3002\n\n\u6211\u770b\u5411\u6797\u521d\u590f\u3002\u5979\u6b63\u7ad9\u5728\u4eba\u7fa4\u7684\u5916\u56f4\uff0c\u8138\u4e0a\u6302\u7740\u6070\u5230\u597d\u5904\u7684\u59d4\u5c48\uff0c\u90a3\u53cc\u603b\u662f\u6c34\u6c6a\u6c6a\u7684\u773c\u775b\u91cc\u84c4\u6ee1\u4e86\u6cea\u6c34\uff0c\u4f46\u5c31\u662f\u5014\u5f3a\u5730\u4e0d\u8ba9\u5b83\u6389\u4e0b\u6765\u3002\u5979\u770b\u7740\u6211\u4eec\u8fd9\u8fb9\uff0c\u50cf\u4e00\u53ea\u88ab\u5377\u5165\u98ce\u66b4\u7684\u3001\u4e0d\u77e5\u6240\u63aa\u7684\u5c0f\u9e7f\u3002\n\n\u5979\u7684\u6f14\u6280\uff0c\u65e0\u53ef\u6311\u5254\u3002\n\n\u800c\u5979\u8eab\u8fb9\u7684\u5f20\u59d0\uff0c\u773c\u775b\u77aa\u5f97\u5927\u5927\u7684\uff0c\u5634\u5df4\u5fae\u5f20\uff0c\u5df2\u7ecf\u662f\u5446\u4f4f\u4e86\u3002\n\n\u6797\u521d\u590f\u8d81\u70ed\u6253\u94c1\uff0c\u53c8\u8f6c\u5934\u770b\u7740\u81ea\u5df1\u8eab\u8fb9\u8fd9\u4f4d\u7ecf\u7eaa\u4eba\uff0c\u773c\u6cea\u6b62\u4e0d\u4f4f\u7684\u5f80\u4e0b\u6389\u3002\n\n\u201c\u5f20\u59d0\u2026\u2026\u201d\n\n\u5979\u54ed\u7740\uff0c\u5341\u5206\u59d4\u5c48\u7684\u9760\u5728\u4e86\u5f20\u59d0\u7684\u6000\u91cc\u3002\n\n\u4f17\u76ee\u777d\u777d\u4e4b\u4e0b\uff0c\u5f20\u59d0\u53ea\u80fd\u8f7b\u8f7b\u62cd\u7740\u5979\u7684\u540e\u80cc\uff0c\u8868\u73b0\u51fa\u5b89\u6170\u7684\u6837\u5b50\u3002\n\n\u82cf\u6587\u6d69\u7684\u8138\u8272\u5df2\u7ecf\u96be\u770b\u5230\u4e86\u6781\u70b9\u3002\u4ed6\u5927\u6982\u4ece\u672a\u60f3\u8fc7\uff0c\u6c5f\u96ea\u4f1a\u5982\u6b64\u4e0d\u7ba1\u4e0d\u987e\u5730\uff0c\u5f53\u7740\u8fd9\u4e48\u591a\u4eba\u7684\u9762\uff0c\u8fd9\u6837\u6253\u4ed6\u7684\u8138\u3002\n\n\u201c\u96ea\u513f\uff0c\u4f60\u559d\u591a\u4e86\u3002\u201d\n\n\u4ed6\u6df1\u5438\u4e86\u4e00\u53e3\u6c14\uff0c\u4f3c\u4e4e\u60f3\u5f3a\u884c\u628a\u8fd9\u573a\u95f9\u5267\u626d\u8f6c\u56de\u6765\uff0c\u201c\u8fd9\u4e9b\u6355\u98ce\u6349\u5f71\u7684\u4e8b\u60c5\uff0c\u6211\u4eec\u79c1\u4e0b\u518d\u8bf4\uff0c\u4e0d\u8981\u5728\u8fd9\u91cc\u2026\u2026\u201d\n\n\u201c\u79c1\u4e0b\uff1f\u201d\u6c5f\u96ea\u51b7\u7b11\u4e86\u4e00\u58f0\uff0c\u6253\u65ad\u4e86\u4ed6\uff0c\u201c\u4f60\u6d3e\u4eba\u76d1\u89c6\u6211\u4eec\u7684\u65f6\u5019\uff0c\u600e\u4e48\u6ca1\u60f3\u5230\u8981\u79c1\u4e0b\uff1f\u4f60\u82b1\u94b1\u627e\u4eba\u634f\u9020\u4e8b\u5b9e\u7684\u65f6\u5019\uff0c\u600e\u4e48\u6ca1\u60f3\u5230\u8981\u79c1\u4e0b\uff1f\u201d\n\n\u201c\u82cf\u6587\u6d69\uff0c\u6211\u4eca\u5929\u5c31\u628a\u8bdd\u653e\u5728\u8fd9\u91cc\u3002\u201d\n\n\u5979\u6307\u7740\u6211\uff0c\u4e00\u5b57\u4e00\u987f\u5730\uff0c\u5bf9\u6240\u6709\u4eba\u8bf4\u3002\n\n\u201c\u9646\u6c89\uff0c\u662f\u6211\u6c5f\u96ea\u7684\u7537\u4eba\u3002\u8c01\u6562\u52a8\u4ed6\uff0c\u5c31\u662f\u8ddf\u6211\u6c5f\u5bb6\u8fc7\u4e0d\u53bb\u3002\u201d\n\n\u201c\u800c\u4f60\u548c\u6211\uff0c\u6c38\u8fdc\u4e0d\u53ef\u80fd\u3002\u201d\n\n\u5979\u8bf4\u5b8c\uff0c\u62c9\u7740\u6211\u7684\u624b\uff0c\u8f6c\u8eab\u5c31\u8d70\uff0c\u7559\u4e0b\u8eab\u540e\u4e00\u7247\u6b7b\u5bc2\uff0c\u548c\u90a3\u4e2a\u5f7b\u5e95\u50f5\u5728\u539f\u5730\uff0c\u50cf\u4e2a\u5c0f\u4e11\u4e00\u6837\u7684\u82cf\u6587\u6d69\u3002\n\n\n\n\n71.\n\u7b2c\u4e8c\u5929\uff0c\u6574\u4e2a\u5a31\u4e50\u5708\u90fd\u9707\u60ca\u4e86\u3002\n\n\u6211\u662f\u5728\u9e7f\u7720\u7684\u60ca\u547c\u58f0\u4e2d\u9192\u6765\u7684\u3002\u7b49\u6211\u63c9\u7740\u773c\u775b\u8d70\u5230\u5ba2\u5385\u65f6\uff0c\u5979\u6b63\u5149\u7740\u8eab\u5b50\uff0c\u8eba\u5728\u6c99\u53d1\u4e0a\uff0c\u6000\u91cc\u7684\u7b14\u8bb0\u672c\u7535\u8111\u5c4f\u5e55\u4e0a\uff0c\u662f\u94fa\u5929\u76d6\u5730\u7684\u3001\u7528\u5404\u79cd\u523a\u773c\u989c\u8272\u6807\u6ce8\u7684\u65b0\u95fb\u6807\u9898\u3002\n\n\u3010\u60ca\u5929\u53cd\u8f6c\uff01\u6797\u521d\u590f\u7eef\u95fb\u7adf\u662f\u8c6a\u95e8\u516c\u5b50\u82cf\u6587\u6d69\u4e00\u624b\u7b56\u5212\uff01\u3011\n\u3010\u535a\u745e\u96c6\u56e2\u80a1\u4ef7\u5f00\u76d8\u5373\u8dcc\u505c\uff0c\u6df1\u9677\u8206\u8bba\u6f29\u6da1\uff01\u3011\n\u3010\u6c5f\u6c0f\u96c6\u56e2\u5343\u91d1\u9ad8\u8c03\u793a\u7231\uff0c\u6797\u521d\u590f\u7eef\u95fb\u7537\u4e3b\u7adf\u662f\u5176\u6b63\u724c\u7537\u53cb\uff1f\u3011\n\n\u6bcf\u4e00\u6761\u65b0\u95fb\u4e0b\u9762\uff0c\u90fd\u914d\u4e0a\u4e86\u4e00\u4e9b\u7531\u4e0d\u77e5\u540d\u5bbe\u5ba2\u5077\u62cd\u7684\u3001\u753b\u8d28\u6a21\u7cca\u4f46\u4fe1\u606f\u91cf\u5de8\u5927\u7684\u89c6\u9891\u3002\u89c6\u9891\u91cc\uff0c\u6c5f\u96ea\u90a3\u4e2a\u51b3\u7edd\u7684\u543b\uff0c\u5979\u90a3\u756a\u63b7\u5730\u6709\u58f0\u7684\u8d28\u95ee\uff0c\u90fd\u88ab\u6e05\u6670\u5730\u8bb0\u5f55\u4e86\u4e0b\u6765\u3002\n\n\u7136\u540e\uff0c\u662f\u8bb8\u8bb8\u591a\u591a\u4e3a\u6797\u521d\u590f\u53d1\u58f0\uff0c\u632f\u632f\u6709\u8bcd\u75db\u65a5\u5a31\u4e50\u5708\u9ed1\u6697\u7684\u4eba\u3002\n\n\u7f51\u7edc\u4e0a\u50cf\u662f\u88ab\u6295\u4e0b\u4e86\u4e00\u9897\u539f\u5b50\u5f39\uff0c\u4e00\u591c\u4e4b\u95f4\uff0c\u98ce\u5411\u5f7b\u5e95\u53d8\u4e86\u3002\u82cf\u6587\u6d69\u548c\u4ed6\u7684\u535a\u745e\u96c6\u56e2\uff0c\u6210\u4e86\u4eba\u4eba\u558a\u6253\u7684\u8fc7\u8857\u8001\u9f20\u3002\n\n\u800c\u6797\u521d\u590f\uff0c\u5219\u6210\u4e86\u5355\u7eaf\u800c\u53c8\u65e0\u8f9c\u7684\u53d7\u5bb3\u8005\u3002\n\n\u6c5f\u96ea\u5df2\u7ecf\u51fa\u95e8\u4e86\uff0c\u5979\u88ab\u5bb6\u65cf\u7684\u957f\u8f88\u7d27\u6025\u53ec\u56de\uff0c\u6e29\u7476\u548c\u5979\u4e00\u8d77\u53bb\u7684\u3002\u6797\u521d\u590f\u7684\u623f\u95e8\u7d27\u95ed\u7740\uff0c\u4e0d\u77e5\u9053\u662f\u4ec0\u4e48\u60c5\u51b5\u3002\n\n\u6211\u770b\u7740\u90a3\u4e9b\u75af\u72c2\u5237\u5c4f\u7684\u65b0\u95fb\uff0c\u611f\u89c9\u81ea\u5df1\u50cf\u5728\u770b\u4e00\u90e8\u4e8b\u4e0d\u5173\u5df1\u7684\u7535\u5f71\u3002\n\n\u76f4\u5230\u6797\u521d\u590f\u7684\u623f\u95e8\u6253\u5f00\u3002\n\n\u5979\u5df2\u7ecf\u6362\u597d\u4e86\u8863\u670d\uff0c\u8138\u4e0a\u753b\u7740\u6de1\u5986\uff0c\u770b\u4e0d\u51fa\u4efb\u4f55\u54ed\u8fc7\u7684\u75d5\u8ff9\u3002\u5979\u8d70\u5230\u6211\u9762\u524d\uff0c\u773c\u795e\u5e73\u9759\u5f97\u50cf\u4e00\u6f6d\u6df1\u6c34\u3002\n\n\u201c\u9646\u6c89\uff0c\u966a\u6211\u53bb\u4e2a\u5730\u65b9\u3002\u201d\n\n\u6700\u7ec8\uff0c\u6211\u4eec\u5750\u5728\u4e86\u5f20\u59d0\u90a3\u95f4\u4f4d\u4e8e\u9876\u697c\u7684\u3001\u53ef\u4ee5\u4fef\u77b0\u534a\u4e2a\u57ce\u5e02\u7684\u529e\u516c\u5ba4\u91cc\u3002\n\n\u5f20\u59d0\u770b\u8d77\u6765\u4e00\u591c\u6ca1\u7761\uff0c\u773c\u4e0b\u7684\u9752\u9ed1\u8fde\u539a\u539a\u7684\u7c89\u5e95\u90fd\u906e\u4e0d\u4f4f\u3002\u5979\u6ca1\u6709\u50cf\u4e0a\u6b21\u90a3\u6837\u6545\u4f5c\u59ff\u6001\uff0c\u53ea\u662f\u75b2\u60eb\u5730\u9760\u5728\u6905\u5b50\u4e0a\uff0c\u770b\u7740\u6211\u4eec\uff0c\u773c\u795e\u91cc\u5145\u6ee1\u4e86\u590d\u6742\u7684\u60c5\u7eea\u3002\n\n\u201c\u5750\u5427\u3002\u201d\n\n\u5979\u6307\u4e86\u6307\u5bf9\u9762\u7684\u6c99\u53d1\u3002\n\n\u6211\u4eec\u5750\u4e0b\u540e\uff0c\u8c01\u90fd\u6ca1\u6709\u5148\u5f00\u53e3\u3002\u529e\u516c\u5ba4\u91cc\u5b89\u9759\u5f97\u53ef\u6015\uff0c\u53ea\u6709\u7a7a\u6c14\u51c0\u5316\u5668\u53d1\u51fa\u7684\u8f7b\u5fae\u55e1\u9e23\u3002\n\n\u201c\u2026\u2026\u6240\u4ee5\uff0c\u8fd9\u662f\u4f60\u4eec\u7684\u8ba1\u5212\uff1f\u201d\n\n\u5f20\u59d0\u7684\u58f0\u97f3\u5f88\u54d1\uff0c\u50cf\u4e24\u7247\u7802\u7eb8\u5728\u6469\u64e6\u3002\n\n\u6797\u521d\u590f\u6ca1\u6709\u56de\u7b54\u5979\u7684\u95ee\u9898\uff0c\u5979\u53ea\u662f\u4ece\u81ea\u5df1\u7684\u5305\u91cc\uff0c\u62ff\u51fa\u4e86\u9e7f\u7720\u65e9\u5c31\u51c6\u5907\u597d\u7684\u4e00\u4e2aU\u76d8\uff0c\u8f7b\u8f7b\u5730\u653e\u5728\u4e86\u90a3\u5f20\u5de8\u5927\u7684\u3001\u5149\u53ef\u9274\u4eba\u7684\u7ea2\u6728\u529e\u516c\u684c\u4e0a\u3002\n\n\u201c\u5f20\u59d0\uff0c\u8fd9\u91cc\u9762\uff0c\u662f\u4f60\u548c\u82cf\u6587\u6d69\u6240\u6709\u8d44\u91d1\u5f80\u6765\u7684\u8bb0\u5f55\u3002\u6bcf\u4e00\u7b14\uff0c\u90fd\u5f88\u6e05\u695a\u3002\u201d\n\n\u6797\u521d\u590f\u7684\u58f0\u97f3\u4e5f\u5f88\u5e73\u9759\uff0c\u90a3\u662f\u4e00\u79cd\u7ecf\u5386\u8fc7\u5de8\u5927\u98ce\u66b4\u540e\uff0c\u6b7b\u800c\u590d\u751f\u7684\u5e73\u9759\u3002\n\n\u5f20\u59d0\u7684\u8eab\u4f53\u731b\u5730\u4e00\u50f5\uff0c\u5979\u6b7b\u6b7b\u5730\u76ef\u7740\u90a3\u4e2a\u5c0f\u5c0f\u7684U\u76d8\uff0c\u773c\u795e\u91cc\u7b2c\u4e00\u6b21\u9732\u51fa\u4e86\u771f\u6b63\u7684\u3001\u65e0\u6cd5\u63a9\u9970\u7684\u60ca\u614c\u3002\n\n\u6211\u4f38\u51fa\u624b\uff0c\u5728\u684c\u5b50\u4e0b\u9762\uff0c\u8f7b\u8f7b\u5730\u63e1\u4f4f\u4e86\u6797\u521d\u590f\u90a3\u53ea\u51b0\u51c9\u7684\u3001\u8fd8\u5728\u5fae\u5fae\u53d1\u6296\u7684\u624b\u3002\n\n\u6797\u521d\u590f\u770b\u4e86\u6211\u4e00\u773c\uff0c\u4f3c\u4e4e\u4ece\u6211\u8fd9\u91cc\u5f97\u5230\u4e86\u529b\u91cf\u3002\u5979\u6df1\u5438\u4e00\u53e3\u6c14\uff0c\u7ee7\u7eed\u8bf4\u3002\n\n\u201c\u6211\u4eca\u5929\u6765\uff0c\u4e0d\u662f\u4e3a\u4e86\u548c\u4f60\u8ffd\u7a76\u8d23\u4efb\u3002\u201d\n\n\u201c\u8fc7\u53bb\u8fd9\u4e48\u591a\u5e74\uff0c\u4f60\u867d\u7136\u628a\u6211\u5f53\u5546\u54c1\uff0c\u4f46\u4e5f\u786e\u5b9e\u4e3a\u6211\u4ed8\u51fa\u4e86\u5f88\u591a\u3002\u6211\u4eec\u4e24\u6e05\u4e86\u3002\u201d\n\n\u201c\u73b0\u5728\uff0c\u4f60\u6709\u4e24\u4e2a\u9009\u62e9\u3002\u201d\n\n\u201c\u7b2c\u4e00\uff0c\u6211\u628a\u8fd9\u4e2aU\u76d8\u4ea4\u7ed9\u5a92\u4f53\uff0c\u6211\u4eec\u5f7b\u5e95\u6495\u7834\u8138\u3002\u4e00\u4e2a\u4e3a\u4e86\u94b1\uff0c\u548c\u5916\u4eba\u4e00\u8d77\u8bbe\u8ba1\u9677\u5bb3\uff0c\u9020\u8c23\u81ea\u5df1\u827a\u4eba\u7684\u7ecf\u7eaa\u4eba\uff0c\u4ee5\u540e\u662f\u6b7b\u662f\u6d3b\uff0c\u90fd\u548c\u6211\u6ca1\u5173\u7cfb\u3002\u201d\n\n\u201c\u7b2c\u4e8c\u2026\u2026\u201d\n\n\u6797\u521d\u590f\u987f\u4e86\u4e00\u4e0b\uff0c\u5979\u7684\u76ee\u5149\u8fce\u4e0a\u4e86\u5f20\u59d0\u90a3\u53cc\u5199\u6ee1\u4e86\u9707\u60ca\u548c\u6323\u624e\u7684\u773c\u775b\u3002\n\n\u201c\u2026\u2026\u6c5f\u96ea\u8ba9\u6211\u7ed9\u4f60\u5e26\u53e5\u8bdd\u3002\u201d\n\n\u201c\u6c5f\u6c0f\u96c6\u56e2\u660e\u5e74\u7684\u54c1\u724c\u5168\u7ebf\u4ee3\u8a00\uff0c\u8fd8\u6ca1\u6709\u5b9a\u3002\u201d\n\n\u201c\u5979\u8bf4\uff0c\u5979\u4e2a\u4eba\uff0c\u5f88\u5e0c\u671b\u80fd\u548c\u4f60\u8fd9\u6837\u6709\u80fd\u529b\u7684\u91d1\u724c\u7ecf\u7eaa\u4eba\uff0c\u957f\u671f\u5408\u4f5c\u3002\u201d\n\n\u529e\u516c\u5ba4\u91cc\u9677\u5165\u4e86\u957f\u4e45\u7684\u3001\u6b7b\u4e00\u822c\u7684\u5bc2\u9759\u3002\n\n\u7a97\u5916\u7684\u9633\u5149\u5f88\u597d\uff0c\u7167\u5728\u5f20\u59d0\u90a3\u5f20\u4fdd\u517b\u5f97\u5b9c\u7684\u8138\u4e0a\uff0c\u5374\u770b\u4e0d\u51fa\u4efb\u4f55\u6e29\u5ea6\u3002\u6211\u770b\u5230\u5979\u653e\u5728\u684c\u5b50\u4e0a\u7684\u90a3\u53cc\u624b\uff0c\u4e0d\u77e5\u4ec0\u4e48\u65f6\u5019\uff0c\u5df2\u7ecf\u7d27\u7d27\u5730\u6525\u6210\u4e86\u62f3\u5934\u3002\n\n\u8fc7\u4e86\u5f88\u4e45\u5f88\u4e45\uff0c\u5979\u624d\u50cf\u662f\u6cc4\u4e86\u6c14\u7684\u76ae\u7403\u4e00\u6837\uff0c\u7f13\u7f13\u5730\u9760\u56de\u4e86\u6905\u80cc\u4e0a\uff0c\u95ed\u4e0a\u4e86\u773c\u775b\u3002\n\n\u201c\u2026\u2026\u6211\u9700\u8981\u4e00\u676f\u5496\u5561\u3002\u201d\n\n\u5979\u7684\u58f0\u97f3\u91cc\uff0c\u5145\u6ee1\u4e86\u65e0\u6cd5\u8a00\u55bb\u7684\u75b2\u60eb\u3002\n\n\u201c\u4e0d\u52a0\u7cd6\u3002\u201d\n\n\n\n\n72.\n\u90a3\u573a\u60ca\u5fc3\u52a8\u9b44\u7684\u9152\u4f1a\uff0c\u50cf\u662f\u4e0a\u4e2a\u4e16\u7eaa\u53d1\u751f\u7684\u4e00\u573a\u65e7\u68a6\u3002\n\n\u5f53\u4e00\u5207\u5c18\u57c3\u843d\u5b9a\uff0c\u6211\u4eec\u7684\u751f\u6d3b\uff0c\u91cd\u65b0\u56de\u5230\u4e86\u90a3\u680b\u90ca\u533a\u7684\u522b\u5885\u91cc\uff0c\u56de\u5230\u4e86\u90a3\u4e71\u7cdf\u7cdf\u7684\u3001\u5145\u6ee1\u4e86\u70df\u706b\u6c14\u7684\u65e5\u5e38\u91cc\u3002\n\n\u53a8\u623f\u91cc\uff0c\u6e29\u7476\u6b63\u7cfb\u7740\u56f4\u88d9\uff0c\u6709\u6761\u4e0d\u7d0a\u5730\u5207\u7740\u83dc\u3002\u5200\u5203\u548c\u7827\u677f\u78b0\u649e\uff0c\u53d1\u51fa\u6e05\u8106\u800c\u5bcc\u6709\u8282\u594f\u7684\u201c\u7b03\u7b03\u201d\u58f0\u3002\u5979\u8eab\u540e\u7684\u7096\u9505\u91cc\uff0c\u6b63\u201c\u5495\u561f\u5495\u561f\u201d\u5730\u5192\u7740\u70ed\u6c14\uff0c\u4e00\u80a1\u6d53\u90c1\u7684\u3001\u5e26\u7740\u9999\u6599\u5473\u9053\u7684\u8089\u9999\uff0c\u5f25\u6f2b\u4e86\u6574\u4e2a\u5c4b\u5b50\u3002\n\n\u6797\u521d\u590f\u50cf\u53ea\u5077\u8165\u7684\u732b\uff0c\u8e51\u624b\u8e51\u811a\u5730\u51d1\u8fc7\u53bb\uff0c\u8d81\u6e29\u7476\u4e0d\u6ce8\u610f\uff0c\u98de\u5feb\u5730\u4ece\u76d8\u5b50\u91cc\u634f\u8d77\u4e00\u6839\u521a\u6d17\u597d\u7684\u9ec4\u74dc\u585e\u8fdb\u5634\u91cc\uff0c\u7136\u540e\u53c8\u50cf\u6ca1\u4e8b\u4eba\u4e00\u6837\uff0c\u5feb\u901f\u8dd1\u56de\u6765\u9760\u5728\u6211\u8eab\u4e0a\uff0c\u770b\u7740\u6211\u6253\u6e38\u620f\u3002\n\n\u201c\u5582\uff0c\u9646\u6c89\uff0c\u4f60\u5f80\u5de6\u8fb9\u70b9\u554a\uff01\u7b28\u86cb\uff0c\u602a\u5237\u4f60\u8138\u4e0a\u4e86\uff01\u201d\n\n\u9e7f\u7720\u5219\u5149\u7740\u8eab\u5b50\uff0c\u76d8\u817f\u5750\u5728\u6211\u53e6\u4e00\u8fb9\uff0c\u53cc\u624b\u6491\u7740\u5927\u817f\uff0c\u805a\u7cbe\u4f1a\u795e\u5730\u770b\u7740\u6211\u7684\u6e38\u620f\u5c4f\u5e55\uff0c\u6bd4\u6211\u81ea\u5df1\u8fd8\u8981\u7d27\u5f20\u3002\u6bcf\u5f53\u6211\u88ab\u653b\u51fb\u5230\uff0c\u5979\u90fd\u4f1a\u53d1\u51fa\u4e00\u58f0\u5c0f\u5c0f\u7684\u60ca\u547c\u3002\n\n\u6c5f\u96ea\u6ca1\u6709\u53c2\u4e0e\u6211\u4eec\u7684\u6253\u95f9\uff0c\u5979\u53ea\u662f\u5b89\u9759\u5730\u5750\u5728\u4e00\u8fb9\uff0c\u624b\u91cc\u6367\u7740\u4e00\u672c\u4e66\uff0c\u9633\u5149\u4ece\u5979\u8eab\u540e\u7684\u7a97\u6237\u91cc\u7167\u8fdb\u6765\uff0c\u7ed9\u5979\u6574\u4e2a\u4eba\u90fd\u9540\u4e0a\u4e86\u4e00\u5c42\u6e29\u6696\u7684\u91d1\u8fb9\u3002\n\n\u6e38\u620f\u7ed3\u675f\u3002\n\n\u6211\u653e\u4e0b\u6e38\u620f\u624b\u67c4\uff0c\u53f9\u4e86\u53e3\u6c14\uff0c\u8f93\u4e86\u5c31\u8f93\u4e86\u5427\u3002\n\n\u201c\u8ba9\u6211\u6765\uff01\u8ba9\u6211\u6765\uff01\u201d\n\n\u9e7f\u6657\u5
