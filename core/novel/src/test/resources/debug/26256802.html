a\u9ed1\u6d1e\u3002\n\n\u5979\u4ec0\u4e48\u90fd\u6ca1\u8bf4\uff0c\u53ea\u662f\u53d1\u4e86\u8fd9\u4e48\u4e00\u5f20\u7167\u7247\u8fc7\u6765\u3002\u50cf\u4e00\u79cd\u65e0\u58f0\u7684\u793a\u5a01\uff0c\u53c8\u50cf\u4e00\u79cd\u65e0\u58f0\u7684\u63a7\u8bc9\u3002\n\n\u6211\u9501\u6389\u5c4f\u5e55\uff0c\u628a\u624b\u673a\u585e\u8fdb\u4e86\u62bd\u5c49\u7684\u6700\u6df1\u5904\u3002\n\n\u6211\u9700\u8981\u5b89\u9759\u3002\n\n\u53ef\u6211\u7684\u4e16\u754c\uff0c\u5df2\u7ecf\u6ca1\u6709\u5b89\u9759\u7684\u5730\u65b9\u4e86\u3002\n\n\u529e\u516c\u5ba4\u91cc\u7684\u4eba\u9646\u9646\u7eed\u7eed\u8d77\u8eab\uff0c\u4e09\u4e09\u4e24\u4e24\u5730\u7ed3\u4f34\u53bb\u5403\u5348\u996d\u3002\u70ed\u95f9\u7684\u58f0\u97f3\u6e10\u6e10\u8fdc\u53bb\uff0c\u6700\u540e\uff0c\u6574\u4e2a\u533a\u57df\u53ea\u5269\u4e0b\u6211\u4e00\u4e2a\u4eba\u3002\n\n\u6211\u6ca1\u6709\u52a8\uff0c\u4e5f\u6ca1\u6709\u611f\u89c9\u5230\u997f\u3002\n\n\u4e0d\u77e5\u9053\u8fc7\u4e86\u591a\u4e45\uff0c\u624b\u673a\u5728\u62bd\u5c49\u91cc\uff0c\u50cf\u88ab\u538b\u6291\u4e86\u8bb8\u4e45\u4e00\u6837\uff0c\u75af\u72c2\u5730\u9707\u52a8\u4e86\u8d77\u6765\uff0c\u5e26\u7740\u4e0d\u4f9d\u4e0d\u6320\u7684\u55e1\u9e23\u58f0\u3002\u4e0d\u662f\u6d88\u606f\uff0c\u662f\u7535\u8bdd\u3002\n\n\u6211\u72b9\u8c6b\u4e86\u4e00\u4e0b\uff0c\u6700\u7ec8\u8fd8\u662f\u62ff\u4e86\u51fa\u6765\u3002\n\n\u5c4f\u5e55\u4e0a\u8df3\u52a8\u7740\u7684\u540d\u5b57\uff0c\u662f\u6c5f\u96ea\u3002\n\n\n\n15.\n\u6211\u76ef\u7740\u5c4f\u5e55\u4e0a\u201c\u6c5f\u96ea\u201d\u4e24\u4e2a\u5b57\uff0c\u611f\u89c9\u81ea\u5df1\u7684\u6307\u5c16\u90fd\u5728\u53d1\u9ebb\u3002\u624b\u673a\u7684\u9707\u52a8\u58f0\u5728\u7a7a\u65e0\u4e00\u4eba\u7684\u529e\u516c\u5ba4\u91cc\u56de\u54cd\uff0c\u50cf\u6b7b\u795e\u7684\u50ac\u547d\u7b26\u3002\n\n\u6211\u4e0d\u80fd\u5728\u8fd9\u91cc\u63a5\u3002\n\n\u6211\u731b\u5730\u7ad9\u8d77\u8eab\uff0c\u6905\u5b50\u817f\u548c\u5730\u9762\u6469\u64e6\uff0c\u53d1\u51fa\u523a\u8033\u7684\u58f0\u54cd\u3002\u6211\u5feb\u6b65\u8d70\u51fa\u529e\u516c\u533a\uff0c\u7a7f\u8fc7\u957f\u957f\u7684\u8d70\u5eca\uff0c\u4e00\u76f4\u8d70\u5230\u4e86\u6d88\u9632\u901a\u9053\u7684\u697c\u68af\u95f4\u3002\u8fd9\u91cc\u7a7a\u65e0\u4e00\u4eba\uff0c\u53ea\u6709\u5934\u9876\u4e00\u76cf\u660f\u6697\u7684\u58f0\u63a7\u706f\uff0c\u6563\u53d1\u7740\u60e8\u767d\u7684\u5149\u3002\u6d53\u91cd\u7684\u7070\u5c18\u5473\u545b\u5f97\u6211\u9f3b\u5b50\u53d1\u75d2\u3002\n\n\u6211\u9760\u5728\u51b0\u51b7\u7684\u5899\u58c1\u4e0a\uff0c\u6df1\u5438\u4e86\u4e00\u53e3\u6c14\uff0c\u8fd9\u624d\u5212\u5f00\u4e86\u63a5\u542c\u952e\u3002\n\n\u201c\u5582\u3002\u201d\n\n\u6211\u7684\u58f0\u97f3\u5e72\u6da9\u5f97\u50cf\u751f\u4e86\u9508\u7684\u94c1\u7247\u3002\n\n\u7535\u8bdd\u90a3\u5934\u4e00\u7247\u6c89\u9ed8\uff0c\u53ea\u6709\u5f88\u8f7b\u5fae\u7684\u3001\u51e0\u4e4e\u542c\u4e0d\u89c1\u7684\u547c\u5438\u58f0\u3002\u90a3\u547c\u5438\u58f0\u6709\u4e9b\u6025\u4fc3\uff0c\u5e26\u7740\u538b\u6291\u4e0d\u4f4f\u7684\u8d77\u4f0f\u3002\u6211\u80fd\u60f3\u8c61\u51fa\u5979\u6b64\u523b\u6b63\u63e1\u7740\u624b\u673a\uff0c\u5634\u5507\u7d27\u7d27\u62bf\u7740\uff0c\u4ec0\u4e48\u8bdd\u90fd\u8bf4\u4e0d\u51fa\u6765\u3002\n\n\u6211\u4e5f\u6ca1\u6709\u8bf4\u8bdd\uff0c\u6211\u4eec\u5c31\u50cf\u5728\u8fdb\u884c\u4e00\u573a\u65e0\u58f0\u7684\u89d2\u529b\uff0c\u6bd4\u8c01\u66f4\u80fd\u6c89\u5f97\u4f4f\u6c14\u3002\n\n\u6700\u7ec8\uff0c\u8fd8\u662f\u5979\u5148\u5f00\u4e86\u53e3\u3002\n\n\u201c\u4f60\u5728\u516c\u53f8\uff1f\u201d\n\n\u5979\u7684\u58f0\u97f3\u542c\u8d77\u6765\u5f88\u5e73\u9759\u3002\n\n\u201c\u55ef\u3002\u201d\u6211\u5e94\u4e86\u4e00\u58f0\u3002\n\n\u53c8\u662f\u4e00\u9635\u6c89\u9ed8\u3002\u6211\u80fd\u542c\u5230\u7535\u8bdd\u90a3\u5934\u4f3c\u4e4e\u6709\u98ce\u58f0\uff0c\u8fd8\u6709\u8fdc\u5904\u9690\u7ea6\u4f20\u6765\u7684\u9e23\u7b1b\u3002\u5979\u4e0d\u5728\u5ba4\u5185\u3002\n\n\u201c\u6211\u770b\u5230\u6ee8\u6c5f\u5927\u6865\u7684\u5e7f\u544a\u724c\u4e86\uff0c\u662f\u4f60\u516c\u53f8\u90a3\u4e2a\u9879\u76ee\u7684\u3002\u201d\n\n\u5979\u5ffd\u7136\u8bf4\u4e86\u4e00\u53e5\u6beb\u4e0d\u76f8\u5e72\u7684\u8bdd\u3002\n\n\u6211\u7684\u5fc3\u731b\u5730\u6c89\u4e86\u4e0b\u53bb\u3002\u6ee8\u6c5f\u5927\u6865\u79bb\u6211\u4eec\u516c\u53f8\u5f88\u8fdc\uff0c\u5f00\u8f66\u81f3\u5c11\u8981\u4e00\u4e2a\u5c0f\u65f6\u3002\u5979\u65e9\u4e0a\u4ece\u5bb6\u91cc\u79bb\u5f00\uff0c\u6f2b\u65e0\u76ee\u7684\u5730\u5f00\u4e86\u90a3\u4e48\u4e45\u7684\u8f66\uff0c\u5c31\u505c\u5728\u4e86\u90a3\u91cc\uff1f\n\n\u201c\u6c5f\u96ea\uff0c\u4f60\u2026\u2026\u201d\u6211\u4e0d\u77e5\u9053\u8be5\u8bf4\u4ec0\u4e48\u3002\n\n\u201c\u633a\u597d\u770b\u7684\uff0c\u6797\u521d\u590f\u7684\u65b0\u6b4c\u5e7f\u544a\u4e5f\u6302\u5728\u65c1\u8fb9\uff0c\u4f60\u4eec\u771f\u822c\u914d\u3002\u201d\n\n\u5979\u7684\u8bdd\u50cf\u4e00\u628a\u6dec\u4e86\u51b0\u7684\u5200\u5b50\uff0c\u6bcf\u4e00\u4e2a\u5b57\u90fd\u624e\u5728\u6211\u7684\u5fc3\u4e0a\u3002\u5979\u7684\u8bed\u6c14\u5f88\u5e73\uff0c\u5e73\u5f97\u50cf\u5728\u8bf4\u522b\u4eba\u7684\u4e8b\uff0c\u4f46\u90a3\u5e73\u9759\u4e0b\u9762\uff0c\u662f\u8db3\u4ee5\u6380\u7ffb\u4e00\u5207\u7684\u6ed4\u5929\u5de8\u6d6a\u3002\n\n\u201c\u4e0d\u662f\u4f60\u60f3\u7684\u90a3\u6837\u3002\u201d\u6211\u7ec8\u4e8e\u8bf4\u51fa\u4e86\u4e00\u53e5\u82cd\u767d\u65e0\u529b\u7684\u8fa9\u89e3\u3002\n\n\u201c\u6211\u60f3\u7684\u662f\u54ea\u6837\uff1f\u201d\u5979\u7acb\u523b\u53cd\u95ee\uff0c\u58f0\u97f3\u63d0\u9ad8\u4e86\u4e00\u70b9\uff0c\u90a3\u5c42\u4f2a\u88c5\u7684\u5e73\u9759\u7ec8\u4e8e\u88c2\u5f00\u4e86\u4e00\u9053\u7f1d\uff0c\u201c\u662f\u6211\u4eb2\u773c\u770b\u5230\u7684\u90a3\u6837\uff0c\u8fd8\u662f\u6797\u521d\u590f\u4eb2\u53e3\u8bf4\u51fa\u6765\u7684\u90a3\u6837\uff1f\u201d\n\n\u201c\u9646\u6c89\uff0c\u6211\u53ea\u662f\u60f3\u95ee\u4f60\u4e00\u53e5\u8bdd\u3002\u201d\n\n\u5979\u7684\u58f0\u97f3\u5ffd\u7136\u53c8\u4f4e\u4e86\u4e0b\u53bb\uff0c\u5e26\u7740\u4e00\u79cd\u75b2\u60eb\u5230\u6781\u70b9\u7684\u6c99\u54d1\u3002\n\n\u201c\u8fd9\u5c31\u662f......\u4f60\u7684\u9009\u62e9\u5417\uff1f\u201d\n\n\u8fd9\u4e2a\u95ee\u9898\u50cf\u4e00\u8bb0\u91cd\u9524\uff0c\u72e0\u72e0\u5730\u7838\u5728\u6211\u7684\u80f8\u53e3\uff0c\u8ba9\u6211\u77ac\u95f4\u5598\u4e0d\u8fc7\u6c14\u6765\u3002\u697c\u68af\u95f4\u7684\u58f0\u63a7\u706f\u56e0\u4e3a\u957f\u65f6\u95f4\u6ca1\u6709\u58f0\u97f3\uff0c\u556a\u55d2\u4e00\u58f0\uff0c\u706d\u4e86\u3002\n\n\u4e16\u754c\u9677\u5165\u4e86\u5f7b\u5e95\u7684\u9ed1\u6697\u3002\u6211\u53ea\u80fd\u542c\u5230\u6211\u548c\u5979\uff0c\u9694\u7740\u7535\u8bdd\uff0c\u540c\u6837\u6c89\u91cd\u800c\u538b\u6291\u7684\u547c\u5438\u58f0\u3002\n\n\n16.\n\u6211\u7684\u5634\u5507\u52a8\u4e86\u52a8\uff0c\u5374\u53d1\u4e0d\u51fa\u4efb\u4f55\u58f0\u97f3\u3002\u6211\u80fd\u8bf4\u4ec0\u4e48\uff1f\u8bf4\u201c\u4e0d\u662f\u201d\u5417\uff1f\u8fd9\u53e5\u5426\u8ba4\uff0c\u5982\u6b64\u7684\u8d2a\u5a6a\u548c\u4e0d\u8d1f\u8d23\u4efb\u3002\n\n\u7535\u8bdd\u90a3\u5934\uff0c\u6c5f\u96ea\u7684\u547c\u5438\u58f0\u4e5f\u6d88\u5931\u4e86\u3002\u5979\u4f3c\u4e4e\u5728\u7b49\u5f85\u6211\u7684\u56de\u7b54\uff0c\u53c8\u4f3c\u4e4e\u5df2\u7ecf\u77e5\u9053\u4e86\u7b54\u6848\uff0c\u53ea\u662f\u5728\u7b49\u5f85\u6700\u540e\u7684\u5ba3\u5224\u3002\n\n\u6211\u4e0d\u80fd\u518d\u8ba9\u5979\u7b49\u4e0b\u53bb\u4e86\u3002\n\n\u201c\u4f60\u5728\u54ea\u513f\uff1f\u201d\n\n\u6211\u7ec8\u4e8e\u5f00\u4e86\u53e3\uff0c\u58f0\u97f3\u6c99\u54d1\u5f97\u4e0d\u50cf\u6211\u81ea\u5df1\u7684\u3002\n\n\u7535\u8bdd\u90a3\u5934\u6c89\u9ed8\u4e86\u7247\u523b\u3002\n\n\u201c\u2026\u2026\u6ee8\u6c5f\u516c\u56ed\uff0c\u89c2\u666f\u5e73\u53f0\u3002\u201d\n\n\u5979\u7684\u58f0\u97f3\u542c\u8d77\u6765\u75b2\u60eb\u4e0d\u582a\u3002\n\n\u201c\u5728\u90a3\u91cc\u7b49\u6211\u3002\u201d\n\n\u6211\u6ca1\u6709\u7ed9\u5979\u62d2\u7edd\u7684\u673a\u4f1a\uff0c\u76f4\u63a5\u6302\u65ad\u4e86\u7535\u8bdd\u3002\n\n\u6211\u63a8\u5f00\u6d88\u9632\u901a\u9053\u6c89\u91cd\u7684\u94c1\u95e8\uff0c\u5916\u9762\u529e\u516c\u5ba4\u660e\u4eae\u7684\u5149\u7ebf\u523a\u5f97\u6211\u773c\u775b\u751f\u75bc\u3002\u6211\u6ca1\u6709\u56de\u5de5\u4f4d\uff0c\u6ca1\u6709\u62ff\u6211\u7684\u5305\uff0c\u4ec0\u4e48\u90fd\u6ca1\u6709\u62ff\u3002\u6211\u76f4\u63a5\u8f6c\u8eab\uff0c\u8d70\u5411\u7535\u68af\u95f4\u3002\n\n\u88e4\u5b50\u53e3\u888b\u91cc\u7684\u8f66\u94a5\u5319\u56e0\u4e3a\u6211\u7684\u52a8\u4f5c\uff0c\u548c\u5927\u817f\u4e00\u4e0b\u4e0b\u5730\u78b0\u649e\u7740\u3002\n\n\u7535\u68af\u7684\u6570\u5b57\u5728\u7f13\u6162\u5730\u8df3\u52a8\uff0c\u6bcf\u4e00\u79d2\u90fd\u50cf\u4e00\u4e2a\u4e16\u7eaa\u90a3\u4e48\u957f\u3002\n\n\u4e2d\u5348\u7535\u68af\u7528\u7684\u4eba\u592a\u591a\u4e86\uff0c\u592a\u6162\u4e86\u3002\n\n\u6211\u653e\u5f03\u4e86\u7b49\u5f85\uff0c\u8f6c\u8eab\u53c8\u51b2\u8fdb\u4e86\u697c\u68af\u95f4\u3002\u6211\u51e0\u4e4e\u662f\u8fde\u6eda\u5e26\u722c\u5730\u4ece\u697c\u68af\u95f4\u8dd1\u4e0b\u53bb\uff0c\u76ae\u978b\u8e29\u5728\u6c34\u6ce5\u53f0\u9636\u4e0a\uff0c\u53d1\u51fa\u7a7a\u6d1e\u800c\u6742\u4e71\u7684\u56de\u54cd\u3002\n\n\u4f46\u6211\u505c\u4e0d\u4e0b\u6765\u3002\n\n\u6211\u51b2\u51fa\u529e\u516c\u697c\u7684\u5927\u95e8\uff0c\u5348\u540e\u707c\u70ed\u7684\u9633\u5149\u7167\u5728\u6211\u7684\u8138\u4e0a\uff0c\u6c57\u6c34\u77ac\u95f4\u5c31\u6d41\u4e86\u4e0b\u6765\uff0c\u6a21\u7cca\u4e86\u6211\u7684\u89c6\u7ebf\u3002\u6211\u8dd1\u5230\u505c\u8f66\u573a\uff0c\u7528\u98a4\u6296\u7684\u624b\u6309\u4e86\u597d\u51e0\u6b21\uff0c\u624d\u89e3\u5f00\u4e86\u8f66\u9501\u3002\n\n\u5750\u8fdb\u8f66\u91cc\uff0c\u8f66\u53a2\u88ab\u592a\u9633\u6652\u5f97\u50cf\u4e2a\u84b8\u7b3c\u3002\u6211\u987e\u4e0d\u4e0a\u5f00\u7a7a\u8c03\uff0c\u76f4\u63a5\u53d1\u52a8\u4e86\u6c7d\u8f66\u3002\u5f15\u64ce\u53d1\u51fa\u4e00\u58f0\u8f70\u9e23\uff0c\u6211\u4e00\u811a\u6cb9\u95e8\u8e29\u5230\u5e95\uff0c\u8f66\u5b50\u731b\u5730\u7a9c\u4e86\u51fa\u53bb\uff0c\u8f6e\u80ce\u548c\u5730\u9762\u6469\u64e6\u53d1\u51fa\u5c16\u9510\u7684\u523a\u54cd\u3002\n\n\u6211\u4ece\u6765\u6ca1\u6709\u5f00\u8fc7\u8fd9\u4e48\u5feb\u7684\u8f66\u3002\n\n\u8def\u8fb9\u7684\u666f\u7269\u98de\u5feb\u5730\u5411\u540e\u5012\u9000\uff0c\u53d8\u6210\u4e00\u56e2\u56e2\u6a21\u7cca\u7684\u8272\u5757\u3002\u6211\u7684\u8111\u5b50\u91cc\u4e00\u7247\u7a7a\u767d\uff0c\u53ea\u6709\u4e00\u4e2a\u5ff5\u5934\uff1a\u627e\u5230\u5979\u3002\n\n\u6211\u5fc5\u987b\u627e\u5230\u5979\u3002\n\n\u4e00\u4e2a\u5c0f\u65f6\u7684\u8def\u7a0b\uff0c\u6211\u53ea\u7528\u4e86\u56db\u5341\u5206\u949f\u3002\u6211\u628a\u8f66\u968f\u610f\u5730\u4e22\u5728\u516c\u56ed\u95e8\u53e3\u7684\u505c\u8f66\u4f4d\u91cc\uff0c\u8fde\u706b\u90fd\u6ca1\u7184\uff0c\u5c31\u8df3\u4e0b\u8f66\u5f80\u91cc\u8dd1\u3002\n\n\u89c2\u666f\u5e73\u53f0\u5728\u516c\u56ed\u7684\u6700\u6df1\u5904\uff0c\u8981\u7a7f\u8fc7\u4e00\u7247\u5f88\u5927\u7684\u8349\u576a\u3002\u6211\u4e00\u773c\u5c31\u770b\u5230\u4e86\u5979\u3002\n\n\u5979\u5c31\u7ad9\u5728\u5e73\u53f0\u7684\u680f\u6746\u8fb9\uff0c\u7a7f\u7740\u65e9\u4e0a\u79bb\u5f00\u65f6\u90a3\u8eab\u7070\u8272\u7684\u8fd0\u52a8\u670d\uff0c\u957f\u957f\u7684\u9a6c\u5c3e\u88ab\u98ce\u5439\u5f97\u6709\u4e9b\u4e71\u3002\u5979\u80cc\u5bf9\u7740\u6211\uff0c\u773a\u671b\u7740\u6c5f\u9762\u4e0a\u6765\u6765\u5f80\u5f80\u7684\u8239\u53ea\uff0c\u6574\u4e2a\u4eba\u770b\u8d77\u6765\u5355\u8584\u53c8\u5b64\u5355\uff0c\u597d\u50cf\u968f\u65f6\u90fd\u4f1a\u88ab\u98ce\u5439\u8d70\u3002\n\n\u6211\u653e\u6162\u4e86\u811a\u6b65\uff0c\u4e00\u6b65\u4e00\u6b65\u5730\u671d\u5979\u8d70\u8fc7\u53bb\u3002\n\n\u5979\u4f3c\u4e4e\u542c\u5230\u4e86\u6211\u7684\u811a\u6b65\u58f0\uff0c\u8eab\u4f53\u50f5\u4e86\u4e00\u4e0b\uff0c\u4f46\u6ca1\u6709\u56de\u5934\u3002\n\n\u6211\u8d70\u5230\u5979\u8eab\u540e\uff0c\u505c\u4e0b\uff0c\u548c\u5979\u9694\u7740\u4e00\u6b65\u7684\u8ddd\u79bb\u3002\u6211\u80fd\u95fb\u5230\u5979\u5934\u53d1\u4e0a\u6de1\u6de1\u7684\u6d17\u53d1\u6c34\u5473\u9053\uff0c\u548c\u5bb6\u91cc\u7684\u4e00\u6837\u3002\n\n\u6211\u4eec\u8c01\u90fd\u6ca1\u6709\u8bf4\u8bdd\u3002\u6c5f\u9762\u4e0a\u7684\u98ce\u5f88\u5927\uff0c\u5439\u5f97\u6211\u6ee1\u8eab\u7684\u6c57\u90fd\u51c9\u4e86\u3002\n\n\u6700\u540e\uff0c\u6211\u4f38\u51fa\u624b\uff0c\u5c06\u5979\u8f6c\u8fc7\u6765\uff0c\u8f7b\u8f7b\u5730\u62b1\u4f4f\u4e86\u5979\u3002\n\n\u5979\u7684\u8eab\u4f53\u731b\u5730\u4e00\u98a4\uff0c\u7ef7\u5f97\u50cf\u4e00\u5f20\u62c9\u6ee1\u4e86\u7684\u5f13\u3002\u6211\u80fd\u611f\u89c9\u5230\u5979\u808c\u8089\u7684\u50f5\u786c\u548c\u6297\u62d2\u3002\n\n\u6211\u6ca1\u6709\u8bf4\u8bdd\uff0c\u53ea\u662f\u628a\u5979\u62b1\u5f97\u66f4\u7d27\u4e86\u4e00\u4e9b\u3002\n\n\u5979\u7684\u8eab\u4f53\uff0c\u5728\u6211\u6000\u91cc\uff0c\u4e00\u70b9\u4e00\u70b9\u5730\uff0c\u6162\u6162\u5730\uff0c\u653e\u677e\u4e86\u4e0b\u6765\u3002\n\n\u6211\u4e0d\u77e5\u9053\u62b1\u4e86\u591a\u4e45\u3002\n\n\u98ce\u5728\u8033\u8fb9\u547c\u5578\uff0c\u6c5f\u9762\u4e0a\u7684\u8239\u53ea\u9e23\u7740\u60a0\u957f\u7684\u6c7d\u7b1b\uff0c\u65f6\u95f4\u597d\u50cf\u90fd\u9759\u6b62\u4e86\u3002\u6211\u53ea\u662f\u62b1\u7740\u5979\uff0c\u611f\u53d7\u7740\u5979\u8eab\u4f53\u7684\u6e29\u5ea6\uff0c\u4ece\u4e00\u5f00\u59cb\u7684\u51b0\u51c9\u3001\u50f5\u786c\uff0c\u6162\u6162\u53d8\u5f97\u6e29\u70ed\u3001\u67d4\u8f6f\u3002\u5979\u7684\u5934\u8f7b\u8f7b\u5730\u9760\u5728\u6211\u7684\u80f8\u53e3\uff0c\u6211\u80fd\u611f\u89c9\u5230\u5979\u5747\u5300\u7684\u547c\u5438\uff0c\u4e00\u4e0b\uff0c\u53c8\u4e00\u4e0b\uff0c\u5e73\u7a33\u4e86\u4e0b\u6765\u3002\n\n\u5979\u6ca1\u6709\u54ed\uff0c\u81f3\u5c11\u6211\u6ca1\u6709\u542c\u5230\u54ed\u58f0\u3002\n\n\u4f46\u6211\u611f\u89c9\u5230\uff0c\u6211\u7684\u886c\u886b\uff0c\u5728\u5979\u8138\u988a\u9760\u7740\u7684\u90a3\u4e00\u5757\u5730\u65b9\uff0c\u6e7f\u4e86\u3002\u6e29\u70ed\u7684\uff0c\u4e00\u5c0f\u7247\u3002\n\n\u5979\u7684\u624b\uff0c\u539f\u672c\u65e0\u529b\u5730\u5782\u5728\u8eab\u4f53\u4e24\u4fa7\uff0c\u4e0d\u77e5\u4ec0\u4e48\u65f6\u5019\u62ac\u4e86\u8d77\u6765\uff0c\u8f7b\u8f7b\u5730\u6293\u4f4f\u4e86\u6211\u73af\u5728\u5979\u8170\u95f4\u7684\u624b\u81c2\u3002\u5979\u7684\u624b\u6307\u5f88\u51c9\uff0c\u6293\u5f97\u5f88\u7528\u529b\uff0c\u6307\u7532\u51e0\u4e4e\u8981\u5d4c\u8fdb\u6211\u7684\u8089\u91cc\u3002\n\n\u201c\u8fd9\u6837\u7b97\u4ec0\u4e48\uff1f\u201d\n\n\u5979\u7684\u58f0\u97f3\u4ece\u6211\u6000\u91cc\u4f20\u6765\uff0c\u95f7\u95f7\u7684\u3002\n\n\u6211\u62b1\u7740\u5979\u7684\u624b\u81c2\u7d27\u4e86\u7d27\uff0c\u5374\u4e0d\u77e5\u9053\u8be5\u600e\u4e48\u56de\u7b54\u3002\n\n\u5979\u4f3c\u4e4e\u4e5f\u6ca1\u6307\u671b\u6211\u56de\u7b54\u3002\u5979\u4ece\u6211\u6000\u91cc\u6323\u8131\u51fa\u6765\uff0c\u8f6c\u8fc7\u8eab\uff0c\u548c\u6211\u5e76\u6392\u7ad9\u7740\uff0c\u4e00\u8d77\u770b\u7740\u6c5f\u9762\u3002\u5979\u7684\u4fa7\u8138\u88ab\u98ce\u5439\u5f97\u6709\u4e9b\u53d1\u767d\uff0c\u773c\u89d2\u8fd8\u6b8b\u7559\u7740\u672a\u5e72\u7684\u6cea\u75d5\uff0c\u4f46\u773c\u795e\u5df2\u7ecf\u6062\u590d\u4e86\u60ef\u5e38\u7684\u5e73\u9759\u3002\n\n\u5979\u6ca1\u6709\u770b\u6211\uff0c\u53ea\u662f\u770b\u7740\u6c5f\u9762\u4e0a\u90a3\u8258\u6b63\u5728\u7f13\u7f13\u9a76\u8fc7\u5927\u6865\u7684\u8d27\u8f6e\u3002\n\n\u201c\u6211\u65e9\u4e0a\u5f00\u8f66\u51fa\u6765\u7684\u65f6\u5019\uff0c\u6ca1\u6709\u60f3\u597d\u8981\u53bb\u54ea\u91cc\uff0c\u5c31\u6765\u4e86\u8fd9\u91cc\u3002\u201d\n\n\u5979\u81ea\u5632\u5730\u7b11\u4e86\u4e00\u4e0b\uff0c\u671b\u5411\u90a3\u7247\u5f00\u9614\u7684\u6c5f\u9762\u3002\n\n\u201c\u6211\u4eec\u56de\u53bb\u5427\u3002\u201d\n\n\u5979\u8bf4\u3002\n\n\u201c\u8fd9\u91cc\u98ce\u592a\u5927\u4e86\u3002\u201d\n\n\n\n16.\n\u6211\u4eec\u5e76\u6392\u8d70\u5728\u516c\u56ed\u7684\u5c0f\u5f84\u4e0a\uff0c\u50cf\u4e24\u6761\u6c38\u4e0d\u76f8\u4ea4\u7684\u5e73\u884c\u7ebf\u3002\u5979\u8d70\u5728\u5de6\u8fb9\uff0c\u6211\u8d70\u5728\u53f3\u8fb9\uff0c\u4e2d\u95f4\u9694\u7740\u4e00\u4e2a\u6210\u5e74\u4eba\u4e5f\u65e0\u6cd5\u586b\u6ee1\u7684\u8ddd\u79bb\u3002\u9633\u5149\u900f\u8fc7\u6811\u53f6\u7684\u7f1d\u9699\u6d12\u4e0b\u6765\uff0c\u5728\u6211\u4eec\u811a\u4e0b\u6295\u4e0b\u6591\u9a73\u7684\u5149\u5f71\uff0c\u968f\u7740\u6211\u4eec\u7684\u8d70\u52a8\u800c\u4e0d\u65ad\u53d8\u5316\u3001\u788e\u88c2\u3002\n\n\u4e00\u8def\u65e0\u8bdd\u3002\n\n\u76f4\u5230\u505c\u8f66\u573a\uff0c\u5979\u624d\u8bf4\u4e86\u4e00\u53e5\uff1a\u201c\u5750\u4f60\u7684\u8f66\u3002\u201d\n\n\u6211\u4e3a\u5979\u62c9\u5f00\u8f66\u95e8\uff0c\u5979\u4e5f\u53ea\u662f\u4f4e\u7740\u5934\u5750\u4e86\u8fdb\u53bb\uff0c\u6ca1\u6709\u770b\u6211\uff0c\u4e5f\u6ca1\u6709\u8bf4\u8c22\u8c22\u3002\n\n\u6211\u56de\u5230\u9a7e\u9a76\u5ea7\uff0c\u5173\u4e0a\u8f66\u95e8\u3002\u72ed\u5c0f\u800c\u95f7\u70ed\u7684\u7a7a\u95f4\u77ac\u95f4\u5c06\u6211\u4eec\u4e24\u4e2a\u4eba\u5305\u88f9\u8d77\u6765\u3002\u6211\u80fd\u95fb\u5230\u5979\u8eab\u4e0a\u6b8b\u7559\u7684\u3001\u88ab\u6c5f\u98ce\u5439\u6563\u7684\u6de1\u6de1\u9999\u6c14\uff0c\u6df7\u5408\u7740\u6211\u8eab\u4e0a\u56e0\u5954\u8dd1\u800c\u4ea7\u751f\u7684\u6c57\u5473\u3002\u6211\u53d1\u52a8\u6c7d\u8f66\uff0c\u6253\u5f00\u4e86\u7a7a\u8c03\u3002\u51b7\u6c14\u4ece\u51fa\u98ce\u53e3\u91cc\u5636\u5636\u5730\u5439\u51fa\u6765\uff0c\u5439\u6563\u4e86\u8f66\u91cc\u7684\u71e5\u70ed\uff0c\u5374\u5439\u4e0d\u6563\u90a3\u80a1\u51dd\u6ede\u5f97\u51e0\u4e4e\u8ba9\u4eba\u7a92\u606f\u7684\u6c89\u9ed8\u3002\n\n\u6211\u628a\u8f66\u5f00\u4e0a\u4e3b\u8def\u3002\u8f66\u6d41\u5e73\u7a33\uff0c\u8def\u51b5\u5f88\u597d\u3002\u6211\u628a\u6240\u6709\u7684\u6ce8\u610f\u529b\u90fd\u96c6\u4e2d\u5728\u524d\u65b9\u7684\u9053\u8def\u4e0a\uff0c\u63e1\u7740\u65b9\u5411\u76d8\u7684\u624b\u6307\u5173\u8282\u6709\u4e9b\u53d1\u767d\u3002\u6211\u7684\u773c\u89d2\u4f59\u5149\u80fd\u77a5\u5230\u5979\uff0c\u5979\u628a\u5934\u9760\u5728\u8f66\u7a97\u73bb\u7483\u4e0a\uff0c\u4fa7\u7740\u8138\uff0c\u770b\u7740\u7a97\u5916\u98de\u901f\u5012\u9000\u7684\u57ce\u5e02\u666f\u8272\u3002\u9633\u5149\u7167\u5728\u5979\u7684\u4fa7\u8138\u4e0a\uff0c\u957f\u957f\u7684\u776b\u6bdb\u6295\u4e0b\u4e00\u5c0f\u7247\u9634\u5f71\uff0c\u770b\u4e0d\u51fa\u662f\u4ec0\u4e48\u60c5\u7eea\u3002\n\n\u6211\u5589\u5499\u53d1\u5e72\uff0c\u5f88\u60f3\u8bf4\u70b9\u4ec0\u4e48\u6765\u6253\u7834\u8fd9\u7247\u6c89\u9ed8\u3002\u4e00\u53e5\u201c\u5bf9\u4e0d\u8d77\u201d\uff0c\u6216\u8005\u4e00\u53e5\u201c\u4f60\u8fd8\u597d\u5417\u201d\uff0c\u4f46\u8fd9\u4e9b\u8bdd\u5230\u4e86\u5634\u8fb9\uff0c\u53c8\u90fd\u50cf\u94c5\u5757\u4e00\u6837\u6c89\u91cd\uff0c\u600e\u4e48\u4e5f\u8bf4\u4e0d\u51fa\u53e3\u3002\n\n\u4e8e\u662f\u6211\u4f38\u51fa\u624b\uff0c\u6253\u5f00\u4e86\u6536\u97f3\u673a\u3002\n\n\u4e00\u9635\u5608\u6742\u7684\u7535\u6d41\u58f0\u540e\uff0c\u4e00\u4e2a\u751c\u7f8e\u5973\u4e3b\u64ad\u7684\u58f0\u97f3\u6d41\u6dcc\u51fa\u6765\uff0c\u6b63\u5728\u64ad\u62a5\u5348\u95f4\u7684\u60c5\u611f\u4e13\u680f\u3002\n\n\u201c\u2026\u2026\u5f88\u591a\u65f6\u5019\uff0c\u611f\u60c5\u91cc\u7684\u6c89\u9ed8\uff0c\u4e0d\u662f\u56e0\u4e3a\u65e0\u8bdd\u53ef\u8bf4\uff0c\u800c\u662f\u56e0\u4e3a\u5931\u671b\u5230\u4e86\u6781\u81f4\u2026\u2026\u201d\n\n\u6211\u7684\u624b\u50cf\u88ab\u7535\u51fb\u4e86\u4e00\u6837\uff0c\u731b\u5730\u6309\u4e0b\u4e86\u5207\u6362\u952e\u3002\u6536\u97f3\u673a\u91cc\u7acb\u523b\u6362\u6210\u4e86\u4e00\u9996\u8282\u594f\u6b22\u5feb\u7684\u6d41\u884c\u6b4c\u66f2\u3002\n\n\u201c\u9633\u5149~\u5f69\u8679~\u5c0f\u767d\u9a6c~\u201d\n\n\u6211\u611f\u89c9\u81ea\u5df1\u7684\u592a\u9633\u7a74\u53c8\u5f00\u59cb\u4e00\u8df3\u4e00\u8df3\u5730\u75bc\u4e86\u3002\u6211\u518d\u6b21\u6309\u4e0b\u6309\u94ae\uff0c\u76f4\u63a5\u5173\u6389\u4e86\u6536\u97f3\u673a\u3002\n\n\u8f66\u91cc\u53c8\u6062\u590d\u4e86\u90a3\u79cd\u4ee4\u4eba\u53d1\u75af\u7684\u5b89\u9759\u3002\n\n\u8eab\u65c1\u7684\u6c5f\u96ea\uff0c\u4ece\u59cb\u81f3\u7ec8\u90fd\u6ca1\u6709\u52a8\u4e00\u4e0b\uff0c\u4eff\u4f5b\u521a\u624d\u90a3\u4e00\u573a\u5c0f\u5c0f\u7684\u6df7\u4e71\u5b8c\u5168\u6ca1\u6709\u53d1\u751f\uff0c\u53c8\u6216\u8005\uff0c\u5979\u6839\u672c\u5c31\u4e0d\u5728\u610f\u3002\n\n\u8f66\u5b50\u62d0\u8fdb\u6211\u4eec\u4f4f\u7684\u90a3\u7247\u90ca\u533a\uff0c\u719f\u6089\u7684\u9053\u8def\u4e24\u65c1\u662f\u9ad8\u5927\u7684\u68a7\u6850\u6811\u3002\u5f53\u90a3\u680b\u719f\u6089\u7684\u72ec\u680b\u522b\u5885\u51fa\u73b0\u5728\u89c6\u91ce\u91cc\u65f6\uff0c\u6211\u5fc3\u91cc\u975e\u4f46\u6ca1\u6709\u677e\u4e00\u53e3\u6c14\uff0c\u53cd\u800c\u60ac\u5f97\u66f4\u9ad8\u4e86\u3002\n\n\u6211\u628a\u8f66\u505c\u8fdb\u9662\u5b50\uff0c\u7184\u4e86\u706b\u3002\n\n\u201c\u8c22\u8c22\u3002\u201d\n\n\u5979\u89e3\u5f00\u5b89\u5168\u5e26\uff0c\u58f0\u97f3\u5e73\u6de1\u5f97\u50cf\u5728\u8bf4\u4e00\u4ef6\u548c\u81ea\u5df1\u65e0\u5173\u7684\u4e8b\u3002\u5979\u6ca1\u6709\u7b49\u6211\u56de\u7b54\uff0c\u63a8\u5f00\u8f66\u95e8\uff0c\u5f84\u76f4\u4e0b\u4e86\u8f66\uff0c\u7136\u540e\u5934\u4e5f\u4e0d\u56de\u5730\u671d\u5927\u95e8\u8d70\u53bb\uff0c\u7528\u6307\u7eb9\u6253\u5f00\u4e86\u95e8\u3002\n\n\u5728\u5979\u8eab\u5f71\u6d88\u5931\u5728\u95e8\u540e\u7684\u90a3\u4e00\u523b\uff0c\u6211\u624d\u53d1\u73b0\uff0c\u5979\u4ece\u516c\u56ed\u548c\u6211\u89c1\u9762\uff0c\u76f4\u5230\u73b0\u5728\uff0c\u90fd\u6ca1\u6709\u6b63\u773c\u770b\u8fc7\u6211\u4e00\u6b21\u3002\n\n\n\n17.\n\u75b2\u60eb\u7684\u4e00\u5929\u8fc7\u53bb\u4e86\u3002\n\n\u4e0b\u73ed\u56de\u5bb6\uff0c\u6211\u5750\u5728\u8f66\u91cc\uff0c\u770b\u7740\u90a3\u6247\u719f\u6089\u7684\uff0c\u5173\u4e0a\u7684\u95e8\uff0c\u770b\u4e86\u5f88\u4e45\u3002\n\n\u76f4\u5230\u8f66\u5185\u7a7a\u8c03\u5439\u51fa\u7684\u51b7\u98ce\u8ba9\u6211\u6253\u4e86\u4e2a\u54c6\u55e6\uff0c\u6211\u624d\u50cf\u4ece\u4e00\u4e2a\u6f2b\u957f\u7684\u68a6\u91cc\u60ca\u9192\u8fc7\u6765\u3002\u6211\u4e0b\u4e86\u8f66\uff0c\u811a\u6b65\u6c89\u91cd\u5f97\u50cf\u704c\u4e86\u94c5\u3002\u6bcf\u4e00\u6b65\u90fd\u8e29\u5728\u81ea\u5df1\u7834\u788e\u7684\u5fc3\u8df3\u4e0a\u3002\n\n\u6253\u5f00\u95e8\uff0c\u7384\u5173\u7684\u611f\u5e94\u706f\u5e94\u58f0\u800c\u4eae\uff0c\u5149\u7ebf\u67d4\u548c\uff0c\u548c\u79bb\u5f00\u65f6\u4e00\u6a21\u4e00\u6837\u3002\u6211\u6362\u4e0a\u62d6\u978b\uff0c\u5c4b\u5b50\u91cc\u9759\u5f97\u80fd\u542c\u89c1\u81ea\u5df1\u7684\u547c\u5438\u58f0\u3002\n\n\u5ba2\u5385\u7684\u7535\u89c6\u5173\u7740\uff0c\u90a3\u5f20\u6211\u4eec\u6628\u665a\u8fd8\u6324\u5728\u4e00\u8d77\u7684\u6c99\u53d1\uff0c\u6b64\u523b\u7a7a\u8361\u8361\u5730\u9677\u5728\u90a3\u91cc\uff0c\u9e7f\u7720\u7684\u90a3\u53ea\u5927\u718a\u73a9\u5076\u88ab\u968f\u610f\u5730\u4e22\u5728\u89d2\u843d\uff0c\u6b6a\u7740\u8111\u888b\uff0c\u7528\u4e24\u9897\u9ed1\u8272\u7684\u73bb\u7483\u73e0\u773c\u775b\u65e0\u8f9c\u5730\u770b\u7740\u6211\u3002\n\n\u6574\u4e2a\u5c4b\u5b50\u90fd\u7a7a\u4e86\u3002\n\n\u4e0d\uff0c\u4e0d\u662f\u7269\u7406\u4e0a\u7684\u7a7a\u3002\u6211\u77e5\u9053\u6c5f\u96ea\u5c31\u5728\u697c\u4e0a\uff0c\u53ef\u80fd\u5728\u5979\u7684\u623f\u95f4\uff0c\u4e5f\u53ef\u80fd\u5728\u4e66\u623f\uff0c\u4f46\u5979\u7684\u5b58\u5728\u611f\u5c31\u50cf\u7a7a\u6c14\u4e00\u6837\uff0c\u4f60\u80fd\u611f\u89c9\u5230\uff0c\u5374\u770b\u4e0d\u89c1\uff0c\u4e5f\u6478\u4e0d\u7740\u3002\u8fd9\u4e2a\u7a7a\u95f4\u91cc\uff0c\u5145\u6ee1\u4e86\u5979\u65e0\u58f0\u7684\u3001\u51b0\u51b7\u7684\u62d2\u7edd\u3002\n\n\u8fd9\u91cc\u4e0d\u518d\u662f\u5bb6\u4e86\u3002\n\n\u8d77\u7801\u5728\u8fd9\u4e00\u523b\uff0c\u4e0d\u662f\u4e86\u3002\n\n\u6211\u8d70\u5230\u53a8\u623f\uff0c\u65e9\u4e0a\u90a3\u573a\u6df7\u4e71\u7684\u201c\u6218\u573a\u201d\u5df2\u7ecf\u88ab\u6536\u62fe\u5e72\u51c0\u4e86\u3002\u7897\u7b77\u90fd\u6d17\u5237\u4e00\u65b0\uff0c\u6574\u9f50\u5730\u7801\u653e\u5728\u6ca5\u6c34\u67b6\u4e0a\uff0c\u53f0\u9762\u4e0a\u4e5f\u64e6\u5f97\u4e00\u5c18\u4e0d\u67d3\u3002\u53ea\u6709\u5783\u573e\u6876\u91cc\uff0c\u90a3\u4e9b\u51e0\u4e4e\u6ca1\u52a8\u8fc7\u7684\u9762\u6761\uff0c\u8fd8\u5728\u65e0\u58f0\u5730\u63d0\u9192\u7740\u6211\u65e9\u4e0a\u53d1\u751f\u7684\u4e00\u5207\u6709\u591a\u4e48\u771f\u5b9e\u3002\n\n\u662f\u8c01\u6536\u62fe\u7684\uff1f\u6c5f\u96ea\u5417\uff1f\n\n\u6211\u4e0d\u77e5\u9053\u3002\n\n\u6211\u62c9\u5f00\u51b0\u7bb1\uff0c\u91cc\u9762\u585e\u6ee1\u4e86\u5404\u79cd\u98df\u6750\uff0c\u852c\u83dc\u6c34\u679c\uff0c\u725b\u5976\u9178\u5976\uff0c\u4e95\u4e95\u6709\u6761\u3002\u6e29\u7476\u603b\u662f\u628a\u51b0\u7bb1\u6574\u7406\u5f97\u50cf\u827a\u672f\u54c1\u3002\u6211\u62ff\u51fa\u4e00\u74f6\u82cf\u6253\u6c34\uff0c\u62e7\u5f00\u76d6\u5b50\uff0c\u4ef0\u5934\u4e00\u996e\u800c\u5c3d\u3002\n\n\u51b0\u51c9\u7684\u6db2\u4f53\u987a\u7740\u98df\u9053\u6ed1\u4e0b\u53bb\uff0c\u5374\u6ca1\u6709\u5e26\u6765\u4e1d\u6beb\u7684\u6e05\u723d\uff0c\u53cd\u800c\u8ba9\u6211\u7684\u80c3\u4e00\u9635\u62bd\u75db\u3002\n\n\u6211\u8d70\u4e0a\u4e8c\u697c\uff0c\u811a\u6b65\u5f88\u8f7b\uff0c\u6015\u60ca\u6270\u5230\u4ec0\u4e48\u3002\n\n\u6c5f\u96ea\u7684\u623f\u95e8\u7d27\u95ed\u7740\u3002\u6797\u521d\u590f\u7684\u623f\u95e8\u4e5f\u7d27\u95ed\u7740\u3002\u6e29\u7476\u7684\u623f\u95e8\u4e5f\u662f\u3002\n\n\u6211\u8d70\u8fc7\u90a3\u6247\u6d74\u5ba4\u7684\u95e8\u3002\u6628\u665a\u4e4b\u524d\uff0c\u8fd9\u6247\u95e8\u5f88\u591a\u65f6\u5019\u90fd\u4e0d\u4f1a\u5173\u4e25\uff0c\u603b\u4f1a\u900f\u51fa\u6a21\u7cca\u7684\u6c34\u6c7d\u548c\u54d7\u54d7\u7684\u6c34\u58f0\uff0c\u6709\u65f6\u5019\u8fd8\u80fd\u4ece\u95e8\u7f1d\u91cc\u770b\u5230\u67d0\u4f4d\u820d\u53cb\u767d\u7699\u7684\u3001\u6cbe\u7740\u6c34\u73e0\u7684\u76ae\u80a4\u3002\n\n\u4f46\u73b0\u5728\uff0c\u5b83\u4e5f\u5173\u5f97\u4e25\u4e25\u5b9e\u5b9e\u3002\n\n\u6700\u540e\uff0c\u6211\u8d70\u5230\u4e86\u9e7f\u7720\u7684\u623f\u95e8\u53e3\u3002\u5979\u7684\u95e8\u603b\u662f\u865a\u63a9\u7740\u7684\uff0c\u4e3a\u4e86\u65b9\u4fbf\u5979\u968f\u65f6\u80fd\u8dd1\u51fa\u6765\u627e\u6211\u3002\u6211\u72b9\u8c6b\u4e86\u4e00\u4e0b\uff0c\u8fd8\u662f\u8f7b\u8f7b\u63a8\u5f00\u4e86\u95e8\u3002\n\n\u623f\u95f4\u91cc\u62c9\u7740\u539a\u539a\u7684\u7a97\u5e18\uff0c\u5149\u7ebf\u5f88\u6697\u3002\u5979\u6b63\u8db4\u5728\u5e8a\u4e0a\uff0c\u8eab\u4e0a\u4f9d\u65e7\u4ec0\u4e48\u90fd\u6ca1\u7a7f\uff0c\u50cf\u4e00\u53ea\u767d\u8272\u7684\u3001\u6beb\u65e0\u9632\u5907\u7684\u8f6f\u4f53\u52a8\u7269\u3002\u94f6\u767d\u8272\u7684\u957f\u53d1\u94fa\u6563\u5728\u6795\u5934\u4e0a\uff0c\u50cf\u6708\u5149\u4e0b\u7684\u7011\u5e03\u3002\u5979\u7761\u5f97\u5f88\u6c89\uff0c\u6000\u91cc\u62b1\u7740\u4e00\u4e2a\u5de8\u5927\u7684\u80e1\u841d\u535c\u62b1\u6795\u3002\n\n\u5979\u7684\u76f4\u64ad\u8bbe\u5907\u5b89\u9759\u5730\u7acb\u5728\u89d2\u843d\uff0c\u5c4f\u5e55\u662f\u9ed1\u7684\u3002\u4eca\u5929\uff0c\u5979\u6ca1\u6709\u76f4\u64ad\u3002\n\n\u770b\u7740\u5979\u5b89\u7a33\u7684\u7761\u989c\uff0c\u6211\u5fc3\u91cc\u90a3\u5757\u88ab\u538b\u5f97\u5598\u4e0d\u8fc7\u6c14\u7684\u77f3\u5934\uff0c\u4f3c\u4e4e\u7ec8\u4e8e\u677e\u52a8\u4e86\u4e00\u4e1d\u3002\u5728\u8fd9\u4e2a\u5df2\u7ecf\u5f00\u59cb\u5206\u5d29\u79bb\u6790\u7684\u5bb6\u91cc\uff0c\u53ea\u6709\u5979\uff0c\u8fd8\u505c\u7559\u5728\u539f\u6765\u7684\u65f6\u95f4\u91cc\u3002\n\n\u6211\u8f7b\u8f7b\u5730\u4e3a\u5979\u5e26\u4e0a\u4e86\u95e8\u3002\n\n\u56de\u5230\u5ba2\u5385\uff0c\u6211\u762b\u5012\u5728\u6c99\u53d1\u4e2d\uff0c\u90a3\u4e2a\u6797\u521d\u590f\u548c\u9e7f\u7720\u4e00\u5de6\u4e00\u53f3\u6324\u7740\u6211\u7684\u4f4d\u7f6e\u3002\u6c99\u53d1\u5f88\u8f6f\uff0c\u9677\u4e0b\u53bb\uff0c\u628a\u6211\u5305\u88f9\u4f4f\u3002\u6211\u95ed\u4e0a\u773c\u775b\uff0c\u5374\u600e\u4e48\u4e5f\u7761\u4e0d\u7740\u3002\n\n\u4e0d\u77e5\u9053\u8fc7\u4e86\u591a\u4e45\uff0c\u6211\u542c\u5230\u697c\u4e0a\u4f20\u6765\u5f00\u95e8\u7684\u58f0\u97f3\u3002\n\n\u662f\u9e7f\u7720\u3002\n\n\u5979\u5149\u7740\u811a\uff0c\u63c9\u7740\u773c\u775b\uff0c\u8ff7\u8ff7\u7cca\u7cca\u5730\u4ece\u697c\u4e0a\u8d70\u4e0b\u6765\uff0c\u5168\u8eab\u8d64\u88f8\u3002\n\n\u201c\u9646\u6c89\u2026\u2026\u201d\n\n\u5979\u770b\u5230\u6211\uff0c\u58f0\u97f3\u5e26\u7740\u521a\u7761\u9192\u7684\u9f3b\u97f3\u3002\n\n\u5979\u8d70\u5230\u6211\u9762\u524d\uff0c\u7136\u540e\u5f88\u81ea\u7136\u5730\u722c\u4e0a\u6c99\u53d1\uff0c\u94bb\u8fdb\u4e86\u6211\u7684\u6000\u91cc\uff0c\u8c03\u6574\u4e86\u4e00\u4e2a\u8212\u670d\u7684\u59ff\u52bf\uff0c\u76f4\u76f4\u5730\u770b\u7740\u6211\u3002\n\n\u201c\u4f60\u597d\u51b7\u3002\u201d\n\n\u5979\u5728\u6211\u6000\u91cc\u8e6d\u4e86\u8e6d\uff0c\u50cf\u53ea\u5bfb\u627e\u70ed\u6e90\u7684\u5c0f\u732b\u3002\n\n\u201c\u6211\u611f\u89c9\u4eca\u5929\u6709\u4e9b\u4e0d\u5bf9\u3002\u201d\n\n\n\n18.\n\u6211\u770b\u7740\u9e7f\u7720\u90a3\u53cc\u6e05\u6f88\u5f97\u4e0d\u542b\u4e00\u4e1d\u6742\u8d28\u7684\u773c\u775b\uff0c\u611f\u89c9\u81ea\u5df1\u50cf\u662f\u88ab\u770b\u7a7f\u4e86\u3002\u8fd9\u4e2a\u5bb6\u91cc\uff0c\u5927\u6982\u4e5f\u53ea\u6709\u5979\uff0c\u80fd\u8fd9\u6837\u6beb\u65e0\u5fc3\u673a\u5730\uff0c\u76f4\u63a5\u8bf4\u51fa\u81ea\u5df1\u7684\u611f\u53d7\u3002\n\n\u201c\u4e0d\u5bf9\u201d\u8fd9\u4e2a\u8bcd\uff0c\u4ece\u5979\u5634\u91cc\u8bf4\u51fa\u6765\uff0c\u6bd4\u4efb\u4f55\u590d\u6742\u7684\u5f62\u5bb9\u90fd\u66f4\u7cbe\u51c6\u3002\n\n\u6211\u5f20\u4e86\u5f20\u5634\uff0c\u5374\u4e0d\u77e5\u9053\u8be5\u600e\u4e48\u8ddf\u5979\u89e3\u91ca\u3002\u662f\u554a\uff0c\u4e0d\u5bf9\u52b2\uff0c\u4e00\u5207\u90fd\u4e71\u5957\u4e86\u3002\u53ef\u6211\u80fd\u8bf4\u4ec0\u4e48\uff1f\u544a\u8bc9\u5979\uff0c\u56e0\u4e3a\u6211\u7684\u61e6\u5f31\u548c\u8d2a\u5fc3\uff0c\u8fd9\u4e2a\u6211\u4eec\u5171\u540c\u751f\u6d3b\u4e86\u8fd9\u4e48\u4e45\u7684\u5bb6\uff0c\u6b63\u5728\u4e00\u70b9\u70b9\u5730\u788e\u6389\u5417\uff1f\n\n\u6211\u53ea\u80fd\u4f38\u51fa\u624b\uff0c\u6478\u4e86\u6478\u5979\u67d4\u8f6f\u7684\u5934\u53d1\u3002\n\n\u201c\u997f\u4e0d\u997f\uff1f\u60f3\u5403\u4ec0\u4e48\uff1f\u201d\n\n\u6211\u7684\u58f0\u97f3\u5f88\u54d1\u3002\n\n\u9e7f\u7720\u5728\u6211\u6000\u91cc\u8e6d\u4e86\u8e6d\uff0c\u5f88\u8ba4\u771f\u5730\u601d\u8003\u4e86\u4e00\u4e0b\u3002\n\n\u201c\u60f3\u5403\u6628\u5929\u7476\u7476\u59d0\u505a\u7684\u7ea2\u70e7\u8089\u3002\u201d\n\n\u201c\u6ca1\u4e86\u3002\u201d\u6211\u56de\u7b54\u3002\n\n\u201c\u54e6\u3002\u201d\u5979\u6709\u4e9b\u5931\u671b\uff0c\u4f46\u5f88\u5feb\u53c8\u632f\u4f5c\u8d77\u6765\uff0c\u201c\u90a3\u2026\u2026\u5403\u6ce1\u9762\u5427\uff01\u8981\u6d77\u9c9c\u5473\u7684\uff01\u201d\n\n\u6211\u53f9\u4e86\u53e3\u6c14\uff0c\u4ece\u6c99\u53d1\u4e0a\u5750\u8d77\u6765\u3002\u5979\u4e5f\u987a\u52bf\u4ece\u6211\u6000\u91cc\u6ed1\u4e86\u4e0b\u53bb\uff0c\u5149\u7740\u811a\u8ddf\u5728\u6211\u8eab\u540e\uff0c\u50cf\u6761\u5c0f\u5c3e\u5df4\u3002\n\n\u6211\u4ece\u50a8\u85cf\u5ba4\u91cc\u627e\u51fa\u4e24\u5305\u6ce1\u9762\uff0c\u70e7\u6c34\uff0c\u6253\u9e21\u86cb\u3002\u6574\u4e2a\u8fc7\u7a0b\uff0c\u9e7f\u7720\u5c31\u642c\u4e86\u4e2a\u77ee\u77ee\u7684\u5c0f\u51f3\u5b50\uff0c\u5750\u5728\u53a8\u623f\u95e8\u53e3\uff0c\u5149\u7740\u8eab\u5b50\uff0c\u4e0b\u5df4\u6401\u5728\u819d\u76d6\u4e0a\uff0c\u5b89\u5b89\u9759\u9759\u5730\u770b\u7740\u6211\u3002\u5979\u4e0d\u8bf4\u8bdd\u7684\u65f6\u5019\uff0c\u5c31\u50cf\u4e00\u5c0a\u7cbe\u81f4\u7684\u4eba\u5076\u3002\n\n\u6c34\u5728\u9505\u91cc\u5495\u565c\u5495\u565c\u5730\u5192\u7740\u70ed\u6c14\uff0c\u767d\u8272\u7684\u84b8\u6c7d\u5f25\u6f2b\u5f00\u6765\uff0c\u6a21\u7cca\u4e86\u6211\u7684\u89c6\u7ebf\u3002\n\n\u5c31\u5728\u8fd9\u65f6\uff0c\u7384\u5173\u5904\u4f20\u6765\u4e86\u6307\u7eb9\u9501\u89e3\u9501\u7684\u7535\u5b50\u97f3\u3002\n\n\u6211\u548c\u9e7f\u7720\u540c\u65f6\u671d\u95e8\u53e3\u770b\u53bb\u3002\n\n\u662f\u6e29\u7476\u3002\n\n\u5979\u56de\u6765\u4e86\uff0c\u8138\u4e0a\u5e26\u7740\u65e0\u6cd5\u63a9\u9970\u7684\u75b2\u60eb\u3002\u5979\u8d70\u8fdb\u7384\u5173\uff0c\u6362\u4e0a\u62d6\u978b\uff0c\u62ac\u5934\u770b\u5230\u4e86\u53a8\u623f\u95e8\u53e3\u7684\u6211\u548c\u9e7f\u7720\u3002\n\n\u5979\u7684\u76ee\u5149\u5728\u6211\u4eec\u8eab\u4e0a\u505c\u7559\u4e86\u4e00\u79d2\uff0c\u7279\u522b\u662f\u5728\u9e7f\u7720\u8d64\u88f8\u7684\u8eab\u4f53\u4e0a\uff0c\u7136\u540e\u5c31\u50cf\u770b\u5230\u4e24\u4e2a\u964c\u751f\u4eba\u4e00\u6837\uff0c\u5e73\u9759\u5730\u79fb\u5f00\u4e86\u89c6\u7ebf\u3002\n\n\u5979\u6ca1\u6709\u50cf\u5f80\u5e38\u4e00\u6837\u7b11\u7740\u8bf4\u201c\u6211\u56de\u6765\u4e86\u201d\uff0c\u4e5f\u6ca1\u6709\u95ee\u6211\u4eec\u665a\u996d\u5403\u4ec0\u4e48\u3002\u5979\u53ea\u662f\u6c89\u9ed8\u5730\u628a\u5305\u653e\u5728\u67dc\u5b50\u4e0a\uff0c\u7136\u540e\u5f84\u76f4\u8d70\u5411\u697c\u68af\u3002\n\n\u201c\u7476\u7476\u59d0\u3002\u201d\u9e7f\u7720\u5ffd\u7136\u5f00\u53e3\u53eb\u4f4f\u4e86\u5979\u3002\n\n\u6e29\u7476\u7684\u811a\u6b65\u987f\u4f4f\u4e86\uff0c\u5979\u6276\u7740\u697c\u68af\u7684\u6276\u624b\uff0c\u8f6c\u8fc7\u534a\u4e2a\u8eab\u5b50\uff0c\u770b\u7740\u6211\u4eec\u3002\u5979\u7684\u8138\u4e0a\u6ca1\u6709\u4efb\u4f55\u8868\u60c5\u3002\n\n\u201c\u6211\u4eec\u665a\u4e0a\u5403\u6ce1\u9762\u3002\u201d\u9e7f\u7720\u8bf4\uff0c\u8bed\u6c14\u91cc\u5e26\u7740\u4e00\u4e1d\u5c0f\u5c0f\u7684\u3001\u4e0d\u6613\u5bdf\u5bdf\u89c9\u7684\u70ab\u8000\uff0c\u597d\u50cf\u5728\u5206\u4eab\u4ec0\u4e48\u4e86\u4e0d\u5f97\u7684\u7f8e\u98df\u3002\n\n\u6e29\u7476\u770b\u7740\u5979\uff0c\u6c89\u9ed8\u4e86\u51e0\u79d2\u949f\u3002\n\n\u201c\u5c11\u5403\u70b9\uff0c\u6ca1\u8425\u517b\u3002\u201d\n\n\u5979\u8bf4\u5b8c\uff0c\u5c31\u8f6c\u8fc7\u8eab\uff0c\u5934\u4e5f\u4e0d\u56de\u5730\u4e0a\u4e86\u697c\u3002\u811a\u6b65\u58f0\u5f88\u8f7b\uff0c\u5f88\u5feb\u5c31\u6d88\u5931\u5728\u4e86\u4e8c\u697c\u7684\u8d70\u5eca\u91cc\u3002\n\n\u53a8\u623f\u91cc\uff0c\u9505\u91cc\u7684\u6c34\u5df2\u7ecf\u5f7b\u5e95\u6cb8\u817e\u4e86\uff0c\u53d1\u51fa\u201c\u5495\u561f\u5495\u561f\u201d\u7684\u58f0\u54cd\uff0c\u50cf\u662f\u5728\u50ac\u4fc3\u7740\u4ec0\u4e48\u3002\n\n\u6211\u628a\u9762\u997c\u548c\u8c03\u6599\u5305\u653e\u8fdb\u9505\u91cc\uff0c\u7528\u7b77\u5b50\u6405\u6563\u3002\u6d53\u90c1\u7684\u3001\u5e26\u7740\u5de5\u4e1a\u9999\u7cbe\u5473\u9053\u7684\u9999\u6c14\uff0c\u5f88\u5feb\u5c31\u5145\u6ee1\u4e86\u6574\u4e2a\u53a8\u623f\u3002\n\n\u8eab\u540e\uff0c\u9e7f\u7720\u5750\u5728\u5c0f\u51f3\u5b50\u4e0a\uff0c\u6ca1\u6709\u518d\u8bf4\u8bdd\u3002\n\n\u6ca1\u8fc7\u591a\u4e45\uff0c\u95e8\u9501\u53c8\u54cd\u4e86\u3002\n\n\u8fd9\u6b21\u662f\u6797\u521d\u590f\u3002\u5979\u56de\u6765\u7684\u6bd4\u5e73\u65f6\u665a\u4e86\u5f88\u591a\uff0c\u8138\u4e0a\u8fd8\u5e26\u7740\u5de5\u4f5c\u65f6\u7684\u6d53\u5986\uff0c\u4f46\u90a3\u5986\u5bb9\u5df2\u7ecf\u6709\u4e9b\u82b1\u4e86\uff0c\u8ba9\u5979\u770b\u8d77\u6765\u50cf\u4e00\u53ea\u75b2\u60eb\u7684\u3001\u6389\u5149\u4e86\u7fbd\u6bdb\u7684\u534e\u4e3d\u5c0f\u9e1f\u3002\n\n\u5979\u770b\u5230\u6211\u4eec\uff0c\u4e5f\u53ea\u662f\u6123\u4e86\u4e00\u4e0b\uff0c\u7136\u540e\u50cf\u662f\u6ca1\u770b\u5230\u4e00\u6837\uff0c\u8e22\u6389\u9ad8\u8ddf\u978b\uff0c\u751a\u81f3\u8fde\u62d6\u978b\u90fd\u6ca1\u6362\uff0c\u5c31\u5149\u7740\u811a\uff0c\u6447\u6447\u6643\u6643\u5730\u4e5f\u5f80\u697c\u4e0a\u8d70\u53bb\u3002\u5979\u8eab\u4e0a\u5e26\u7740\u4e00\u80a1\u6d53\u91cd\u7684\u3001\u6df7\u6742\u7740\u9999\u6c34\u548c\u9152\u7cbe\u7684\u5473\u9053\u3002\n\n\u5979\u559d\u9152\u4e86\u3002\n\n\u5728\u5979\u7ecf\u8fc7\u53a8\u623f\u95e8\u53e3\u7684\u65f6\u5019\uff0c\u9e7f\u7720\u53c8\u4e00\u6b21\u5f00\u4e86\u53e3\u3002\n\n\u201c\u521d\u590f\u59d0\uff0c\u4f60\u8981\u5403\u9762\u5417\uff1f\u201d\n\n\u6797\u521d\u590f\u505c\u4e0b\u811a\u6b65\uff0c\u5979\u9760\u5728\u5899\u4e0a\uff0c\u4fa7\u7740\u5934\uff0c\u7528\u4e00\u79cd\u964c\u751f\u7684\u76ee\u5149\u770b\u7740\u6211\uff0c\u53c8\u770b\u5411\u9e7f\u7720\uff0c\u62bf\u4e86\u62bf\u5634\u3002\n\n\u201c\u4e0d\u5403\u4e86\u3002\u201d\n\n\u5979\u8bf4\u5b8c\uff0c\u8f6c\u8eab\u4e0a\u4e86\u697c\u3002\n\n\n\n19.\n\u6211\u628a\u4e24\u7897\u6ce1\u9762\u7aef\u5230\u9910\u684c\u4e0a\uff0c\u9762\u6761\u56e0\u4e3a\u5728\u9505\u91cc\u6ce1\u4e86\u4e00\u4f1a\u513f\uff0c\u5df2\u7ecf\u6709\u4e9b\u6da8\u4e86\u3002\u9ec4\u8272\u7684\u9762\u997c\u5438\u9971\u4e86\u7ea2\u8272\u7684\u6c64\u6c41\uff0c\u4e0a\u9762\u6f02\u7740\u51e0\u70b9\u5ec9\u4ef7\u7684\u8131\u6c34\u852c\u83dc\u548c\u4e00\u5c42\u4eae\u6676\u6676\u7684\u6cb9\u82b1\u3002\u4e24\u4e2a\u8377\u5305\u86cb\u714e\u5f97\u6709\u4e9b\u8001\uff0c\u86cb\u767d\u7684\u8fb9\u7f18\u5e26\u7740\u4e00\u5708\u7126\u9ed1\u8272\u3002\n\n\u8fd9\u5927\u6982\u662f\u6211\u8fd9\u8f88\u5b50\u505a\u8fc7\u7684\u6700\u8270\u96be\u7684\u4e00\u987f\u996d\u3002\n\n\u9e7f\u7720\u4ece\u5979\u7684\u5c0f\u51f3\u5b50\u4e0a\u7ad9\u8d77\u6765\uff0c\u62c9\u5f00\u6905\u5b50\uff0c\u5750\u5728\u6211\u5bf9\u9762\u3002\u5979\u62ff\u8d77\u7b77\u5b50\uff0c\u719f\u7ec3\u5730\u5377\u8d77\u4e00\u5927\u53e3\u9762\uff0c\u585e\u8fdb\u5634\u91cc\u3002\n\n\u201c\u5438\u6e9c\u2014\u2014\u201d\n\n\u54cd\u4eae\u7684\u3001\u6beb\u4e0d\u63a9\u9970\u7684\u5438\u98df\u58f0\u5728\u5bc2\u9759\u7684\u9910\u5385\u91cc\u56de\u8361\uff0c\u663e\u5f97\u683c\u5916\u7a81\u5140\u3002\u5979\u7684\u816e\u5e2e\u5b50\u88ab\u585e\u5f97\u9f13\u9f13\u7684\uff0c\u50cf\u4e00\u53ea\u6b63\u5728\u8fc7\u51ac\u7684\u4ed3\u9f20\u3002\n\n\u201c\u597d\u5403\uff01\u201d\u5979\u542b\u7cca\u4e0d\u6e05\u5730\u79f0\u8d5e\u4e86\u4e00\u53e5\uff0c\u773c\u775b\u56e0\u4e3a\u6ee1\u8db3\u800c\u772f\u4e86\u8d77\u6765\u3002\n\n\u56e0\u4e3a\u52a8\u4f5c\u592a\u731b\u7684\u7f18\u6545\uff0c\u4e00\u4e9b\u6c64\u6c41\u6e85\u5230\u4e86\u5979\u7684\u8eab\u4e0a\uff0c\u6e85\u5230\u4e86\u5979\u5e76\u4e0d\u7b97\u4e30\u6ee1\u7684\u4e73\u623f\u4e0a\u3002\n\n\u201c\u563f\u563f\u3002\u201d\n\n\u9e7f\u7720\u6709\u4e9b\u4e0d\u597d\u610f\u601d\u7684\u7b11\u4e86\u7b11\uff0c\u8fde\u5fd9\u62bd\u51fa\u9910\u5dfe\u7eb8\u64e6\u62ed\u8d77\u6765\u3002\n\n\u6211\u770b\u7740\u5979\uff0c\u4e5f\u62ff\u8d77\u7b77\u5b50\uff0c\u673a\u68b0\u5730\u628a\u9762\u6761\u5f80\u5634\u91cc\u9001\u3002\u9762\u6761\u5f88\u70eb\uff0c\u5e26\u7740\u4e00\u80a1\u6d53\u91cd\u7684\u5473\u7cbe\u548c\u9632\u8150\u5242\u7684\u5473\u9053\uff0c\u9ecf\u7cca\u7cca\u7684\uff0c\u6ca1\u6709\u4efb\u4f55\u53e3\u611f\u53ef\u8a00\u3002\u6211\u5c1d\u4e0d\u51fa\u54b8\u6de1\uff0c\u4e5f\u5c1d\u4e0d\u51fa\u9999\u8fa3\uff0c\u53ea\u662f\u9ebb\u6728\u5730\u5480\u56bc\uff0c\u7136\u540e\u541e\u54bd\u3002\n\n\u6211\u4eec\u5c31\u8fd9\u6837\u9762\u5bf9\u9762\u5730\u5403\u7740\uff0c\u4e00\u4e2a\u72fc\u541e\u864e\u54bd\uff0c\u4e00\u4e2a\u5473\u540c\u56bc\u8721\u3002\n\n\u697c\u4e0a\u4f20\u6765\u9690\u7ea6\u7684\u6c34\u58f0\uff0c\u5e94\u8be5\u662f\u6709\u4eba\u5728\u6d17\u6fa1\u3002\u7136\u540e\u662f\u5439\u98ce\u673a\u5de5\u4f5c\u7684\u55e1\u9e23\u58f0\uff0c\u65ad\u65ad\u7eed\u7eed\u3002\u5979\u4eec\u90fd\u5728\uff0c\u90fd\u5728\u8fd9\u4e2a\u5c4b\u5b50\u91cc\uff0c\u5728\u5404\u81ea\u7684\u623f\u95f4\u91cc\uff0c\u50cf\u4e00\u5ea7\u5ea7\u5b64\u5c9b\u3002\u6211\u4eec\u5171\u4eab\u7740\u540c\u4e00\u4e2a\u5c4b\u9876\uff0c\u540c\u4e00\u7247\u7a7a\u6c14\uff0c\u5374\u53c8\u9694\u7740\u6bd4\u6d77\u6d0b\u8fd8\u8981\u9065\u8fdc\u7684\u8ddd\u79bb\u3002\n\n\u662f\u554a\uff0c\u65e9\u665a\u4f1a\u6709\u8fd9\u4e48\u4e00\u5929\u7684\u3002\n\n\u5f88\u5feb\uff0c\u9e7f\u7720\u5c31\u5403\u5b8c\u4e86\u5979\u90a3\u4e00\u7897\uff0c\u8fde\u6c64\u90fd\u559d\u5f97\u4e00\u6ef4\u4e0d\u5269\u3002\u5979\u6ee1\u8db3\u5730\u6253\u4e86\u4e2a\u55dd\uff0c\u7528\u9910\u5dfe\u7eb8\u64e6\u4e86\u64e6\u5634\u3002\n\n\u5979\u6ca1\u6709\u50cf\u5f80\u5e38\u4e00\u6837\u7acb\u523b\u8dd1\u56de\u5ba2\u5385\u53bb\u9738\u5360\u6c99\u53d1\uff0c\u800c\u662f\u6258\u7740\u4e0b\u5df4\uff0c\u9759\u9759\u5730\u770b\u7740\u6211\u7897\u91cc\u5269\u4e0b\u7684\u5927\u534a\u7897\u9762\u3002\n\n\u201c\u9646\u6c89\uff0c\u4f60\u4e0d\u5403\u4e86\u5417\uff1f\u201d\n\n\u6211\u6447\u4e86\u6447\u5934\uff0c\u653e\u4e0b\u4e86\u7b77\u5b50\u3002\u6211\u5403\u4e0d\u4e0b\u3002\n\n\u5979\u201c\u54e6\u201d\u4e86\u4e00\u58f0\uff0c\u6ca1\u6709\u518d\u529d\u3002\u5979\u4ece\u6905\u5b50\u4e0a\u6ed1\u4e0b\u6765\uff0c\u5149\u7740\u811a\u8dd1\u5230\u5ba2\u5385\uff0c\u6253\u5f00\u4e86\u7535\u89c6\u3002\u5f88\u5feb\uff0c\u4e00\u9635\u5938\u5f20\u7684\u52a8\u6f2b\u97f3\u6548\u5c31\u5145\u6ee1\u4e86\u6574\u4e2a\u5c4b\u5b50\uff0c\u9a71\u6563\u4e86\u90a3\u4ee4\u4eba\u7a92\u606f\u7684\u5bc2\u9759\uff0c\u5374\u4e5f\u8ba9\u8fd9\u4efd\u5bc2\u9759\u663e\u5f97\u66f4\u52a0\u523b\u610f\u3002\n\n\u6211\u7ad9\u8d77\u8eab\uff0c\u6536\u62fe\u7897\u7b77\u3002\n\n\u7b49\u6211\u4ece\u53a8\u623f\u51fa\u6765\u7684\u65f6\u5019\uff0c\u9e7f\u7720\u5df2\u7ecf\u8db4\u5728\u6c99\u53d1\u524d\u7684\u5730\u6bef\u4e0a\uff0c\u805a\u7cbe\u4f1a\u795e\u5730\u770b\u7740\u7535\u89c6\u4e86\u3002\u5c4f\u5e55\u4e0a\u4e94\u989c\u516d\u8272\u7684\u5149\u8292\uff0c\u6620\u5728\u5979\u94f6\u767d\u8272\u7684\u5934\u53d1\u548c\u5149\u6d01\u7684\u540e\u80cc\u4e0a\uff0c\u5f62\u6210\u4e00\u7247\u6d41\u52a8\u7684\u5149\u6591\u3002\n\n\u6211\u6ca1\u6709\u8fc7\u53bb\uff0c\u53ea\u662f\u7ad9\u5728\u9910\u5385\u7684\u9634\u5f71\u91cc\uff0c\u770b\u7740\u5979\u7684\u80cc\u5f71\u3002\n\n\u6b64\u523b\uff0c\u8fd9\u4e2a\u5bb6\u91cc\uff0c\u4f3c\u4e4e\u53ea\u5269\u4e0b\u6211\u548c\u5979\uff0c\u8fd8\u505c\u7559\u5728\u8fc7\u53bb\u7684\u65f6\u7a7a\u91cc\u3002\u4f46\u5c31\u8fde\u5979\uff0c\u4e5f\u5bdf\u89c9\u5230\u4e86\u4ec0\u4e48\u3002\u5979\u4e0d\u518d\u50cf\u4ee5\u524d\u90a3\u6837\u65f6\u65f6\u523b\u523b\u9ecf\u7740\u6211\uff0c\u800c\u662f\u9009\u62e9\u4e86\u4e00\u4e2a\u4eba\u6295\u5165\u5230\u52a8\u6f2b\u7684\u4e16\u754c\u91cc\u3002\n\n\u6211\u8d70\u4e0a\u4e8c\u697c\uff0c\u6bcf\u4e00\u6b65\u90fd\u611f\u89c9\u50cf\u8e29\u5728\u68c9\u82b1\u4e0a\u3002\n\n\u8d70\u5eca\u91cc\u4e00\u7247\u660f\u6697\uff0c\u53ea\u6709\u5c3d\u5934\u7684\u591c\u706f\u6563\u53d1\u7740\u5fae\u5f31\u7684\u5149\u3002\u6bcf\u4e00\u6247\u95e8\u90fd\u5173\u5f97\u4e25\u4e25\u5b9e\u5b9e\uff0c\u95e8\u7f1d\u91cc\u6ca1\u6709\u900f\u51fa\u4e00\u70b9\u5149\u4eae\uff0c\u4e5f\u6ca1\u6709\u4f20\u51fa\u4e00\u70b9\u58f0\u97f3\u3002\n\n\u6211\u56de\u5230\u81ea\u5df1\u7684\u623f\u95f4\uff0c\u5173\u4e0a\u95e8\u3002\n\n\u6211\u6ca1\u6709\u5f00\u706f\uff0c\u76f4\u63a5\u5012\u5728\u4e86\u5e8a\u4e0a\uff0c\u628a\u8138\u57cb\u8fdb\u6795\u5934\u91cc\u3002\u6795\u5934\u4e0a\uff0c\u4f3c\u4e4e\u8fd8\u6b8b\u7559\u7740\u6797\u521d\u590f\u6d17\u53d1\u6c34\u7684\u9999\u6c14\uff0c\u548c\u9e7f\u7720\u8eab\u4e0a\u6de1\u6de1\u7684\u4f53\u9999\u3002\n\n\u4f46\u8fd9\u6c14\u5473\uff0c\u6b64\u523b\u95fb\u8d77\u6765\uff0c\u5374\u50cf\u4e00\u79cd\u65e0\u58f0\u7684\u8bbd\u523a\u3002\n\n\u6211\u7741\u7740\u773c\u775b\uff0c\u770b\u7740\u6f06\u9ed1\u7684\u5929\u82b1\u677f\u3002\u8033\u6735\u91cc\u662f\u697c\u4e0b\u4f20\u6765\u7684\u3001\u8f7b\u5fae\u7684\u52a8\u6f2b\u58f0\u97f3\uff0c\u8fd8\u6709\u81ea\u5df1\u6c89\u91cd\u7684\u5fc3\u8df3\u58f0\u3002\n\n\u8fd9\u4e00\u591c\uff0c\u6211\u7761\u5728\u5e8a\u7684\u6b63\u4e2d\u592e\u3002\n\n\u5e8a\u5f88\u5927\uff0c\u4e5f\u5f88\u7a7a\u3002\n\n\u51b7\u5f97\u50cf\u4e00\u5757\u51b0\u3002\n\n\n\n20.\n\u7b2c\u4e8c\u5929\uff0c\u6211\u662f\u5728\u4e00\u9635\u6025\u4fc3\u7684\u624b\u673a\u94c3\u58f0\u4e2d\u60ca\u9192\u7684\u3002\n\n\u4e0d\u662f\u6211\u81ea\u5df1\u7684\u95f9\u949f\uff0c\u58f0\u97f3\u662f\u4ece\u5ba2\u5385\u4f20\u6765\u7684\uff0c\u5728\u5b89\u9759\u7684\u65e9\u4e0a\u683c\u5916\u660e\u663e\u3002\u6211\u731b\u5730\u4ece\u5e8a\u4e0a\u5750\u8d77\u6765\uff0c\u5fc3\u810f\u56e0\u4e3a\u8fd9\u7a81\u5982\u5176\u6765\u7684\u58f0\u54cd\u800c\u72c2\u8df3\u4e0d\u6b62\u3002\u7a97\u5916\u5929\u5149\u5927\u4eae\uff0c\u770b\u6837\u5b50\u6211\u5df2\u7ecf\u7761\u8fc7\u4e86\u5934\u3002\n\n\u6211\u6293\u8d77\u5e8a\u5934\u7684\u624b\u673a\u770b\u4e86\u4e00\u773c\uff0c\u6bd4\u6211\u5e73\u65f6\u8d77\u5e8a\u7684\u65f6\u95f4\u665a\u4e86\u6574\u6574\u4e00\u4e2a\u5c0f\u65f6\u3002\u6628\u665a\u7684\u75b2\u60eb\u50cf\u6f6e\u6c34\u4e00\u6837\uff0c\u5728\u6211\u7761\u7740\u540e\u5c06\u6211\u5f7b\u5e95\u6df9\u6ca1\u3002\n\n\u6211\u6380\u5f00\u88ab\u5b50\u4e0b\u5e8a\uff0c\u5367\u5ba4\u91cc\u7a7a\u8361\u8361\u7684\uff0c\u53ea\u6709\u6211\u4e00\u4e2a\u4eba\u3002\u6628\u665a\u90a3\u79cd\u51b0\u51b7\u7684\u611f\u89c9\uff0c\u4f3c\u4e4e\u8fd8\u6b8b\u7559\u5728\u5e8a\u5355\u4e0a\u3002\u6211\u5957\u4e0aT\u6064\uff0c\u8d70\u51fa\u623f\u95f4\u3002\n\n\u8d70\u5eca\u91cc\u5b89\u5b89\u9759\u9759\u7684\uff0c\u6bcf\u4e00\u6247\u95e8\u90fd\u7d27\u95ed\u7740\u3002\u90a3\u9635\u624b\u673a\u94c3\u58f0\u5df2\u7ecf\u505c\u4e86\u3002\n\n\u6211\u8d70\u4e0b\u697c\uff0c\u770b\u5230\u9e7f\u7720\u6b63\u5149\u7740\u8eab\u5b50\uff0c\u76d8\u5750\u5728\u8336\u51e0\u524d\u7684\u5730\u6bef\u4e0a\uff0c\u624b\u91cc\u62ff\u7740\u4e00\u90e8\u624b\u673a\uff0c\u4f3c\u4e4e\u5728\u7814\u7a76\u7740\u4ec0\u4e48\u3002\u7535\u89c6\u8fd8\u5f00\u7740\uff0c\u4f46\u88ab\u6309\u4e86\u9759\u97f3\u3002\n\n\u201c\u600e\u4e48\u4e86\uff1f\u201d\u6211\u95ee\u5979\u3002\n\n\u5979\u542c\u5230\u6211\u7684\u58f0\u97f3\uff0c\u62ac\u8d77\u5934\u3002\n\n\u201c\u662f\u521d\u590f\u59d0\u7684\u624b\u673a\uff0c\u521a\u624d\u4e00\u76f4\u5728\u54cd\u3002\u201d\n\n\u5979\u628a\u624b\u673a\u9012\u7ed9\u6211\u3002\u5c4f\u5e55\u4e0a\u663e\u793a\u7740\u5341\u51e0\u4e2a\u672a\u63a5\u6765\u7535\uff0c\u90fd\u6765\u81ea\u540c\u4e00\u4e2a\u540d\u5b57\u2014\u2014\u5f20\u59d0\u3002\n\n\u6797\u521d\u590f\u7684\u7ecf\u7eaa\u4eba\u3002\n\n\u6211\u628a\u624b\u673a\u653e\u5728\u8336\u51e0\u4e0a\uff0c\u6ca1\u6709\u53bb\u7ba1\u5b83\u3002\n\n\u201c\u5176\u4ed6\u4eba\u5462\uff1f\u201d\n\n\u201c\u90fd\u8d70\u4e86\u3002\u201d\u9e7f\u7720\u56de\u7b54\uff0c\u58f0\u97f3\u5f88\u8f7b\u3002\n\n\u201c\u8d70\u4e86\uff1f\u201d\u6211\u6123\u4e86\u4e00\u4e0b\uff0c\u201c\u4ec0\u4e48\u65f6\u5019\uff1f\u201d\n\n\u201c\u5f88\u65e9\u5c31\u8d70\u4e86\uff0c\u5929\u8fd8\u6ca1\u4eae\u7684\u65f6\u5019\uff0c\u6211\u5c31\u542c\u5230\u7476\u7476\u59d0\u51fa\u95e8\u4e86\u3002\u540e\u6765\u96ea\u59d0\u59d0\u4e5f\u8d70\u4e86\u3002\u521d\u590f\u59d0\u662f\u521a\u521a\u8d70\u7684\uff0c\u5979\u8d70\u5f97\u5f88\u6025\uff0c\u8fde\u624b\u673a\u90fd\u5fd8\u4e86\u62ff\u3002\u201d\n\n\u9e7f\u7720\u8bf4\u5b8c\uff0c\u7ee7\u7eed\u770b\u5979\u7684\u52a8\u6f2b\u3002\n\n\u6211\u7ad9\u5728\u5ba2\u5385\u4e2d\u592e\uff0c\u73af\u987e\u7740\u8fd9\u4e2a\u7a7a\u65e0\u4e00\u4eba\u7684\u5bb6\u3002\u9633\u5149\u4ece\u5de8\u5927\u7684\u843d\u5730\u7a97\u7167\u8fdb\u6765\uff0c\u5728\u5730\u677f\u4e0a\u6295\u4e0b\u660e\u4eae\u7684\u5149\u6591\uff0c\u628a\u5c4b\u5b50\u7167\u5f97\u901a\u900f\u660e\u4eae\u3002\u53ef\u6211\u5374\u611f\u89c9\u4e0d\u5230\u4e00\u4e1d\u6696\u610f\u3002\n\n\u5979\u4eec\u2026\u2026\u662f\u5728\u523b\u610f\u907f\u5f00\u6211\u5417\uff1f\n\n\u8fde\u65e9\u9910\u90fd\u6ca1\u6709\u5403\uff0c\u5c31\u4e00\u4e2a\u63a5\u4e00\u4e2a\u5730\uff0c\u50cf\u9003\u79bb\u4e00\u6837\u5730\u79bb\u5f00\u4e86\u8fd9\u91cc\u3002\n\n\u6211\u8d70\u5230\u53a8\u623f\uff0c\u9910\u684c\u4e0a\u5e72\u5e72\u51c0\u51c0\uff0c\u6628\u5929\u6211\u6d17\u8fc7\u7684\u7897\u7b77\u8fd8\u6574\u9f50\u5730\u6446\u5728\u6ca5\u6c34\u67b6\u4e0a\u3002\u51b0\u7bb1\u95e8\u4e0a\u8d34\u7740\u4e00\u5f20\u65b0\u7684\u4fbf\u5229\u8d34\uff0c\u662f\u6e29\u7476\u7684\u5b57\u8ff9\uff0c\u5f88\u6f02\u4eae\uff0c\u4e5f\u5f88\u51b7\u6f20\u3002\n\n\u201c\u5783\u573e\u8bb0\u5f97\u5012\u3002\u201d\n\n\u6ca1\u6709\u79f0\u547c\uff0c\u4e5f\u6ca1\u6709\u843d\u6b3e\uff0c\u5c31\u50cf\u4e00\u5f20\u5199\u7ed9\u964c\u751f\u4eba\u7684\u6307\u4ee4\u3002\n\n\u6211\u6495\u4e0b\u90a3\u5f20\u4fbf\u5229\u8d34\uff0c\u628a\u5b83\u63c9\u6210\u4e00\u56e2\uff0c\u6254\u8fdb\u4e86\u5783\u573e\u6876\u3002\n\n\u201c\u9646\u6c89\u3002\u201d\u9e7f\u7720\u7684\u58f0\u97f3\u4ece\u5ba2\u5385\u4f20\u6765\u3002\n\n\u6211\u56de\u5934\u770b\u5979\u3002\u5979\u6b63\u4ef0\u7740\u8138\uff0c\u770b\u7740\u6211\uff0c\u90a3\u53cc\u603b\u662f\u6709\u4e9b\u8ff7\u832b\u7684\u773c\u775b\u91cc\uff0c\u6b64\u523b\u5199\u6ee1\u4e86\u4e0d\u5b89\u3002\n\n\u201c\u6211\u4eec\u2026\u2026\u662f\u4e0d\u662f\u8981\u6563\u4e86\uff1f\u201d\n\n\u6211\u611f\u89c9\u81ea\u5df1\u7684\u5fc3\u810f\uff0c\u50cf\u662f\u88ab\u5979\u8fd9\u53e5\u8bdd\u8f7b\u8f7b\u5730\u634f\u4e86\u4e00\u4e0b\uff0c\u4e0d\u75bc\uff0c\u4f46\u5f88\u9178\uff0c\u5f88\u6da9\u3002\u6211\u8d70\u8fc7\u53bb\uff0c\u5728\u5979\u8eab\u8fb9\u5750\u4e0b\uff0c\u4f38\u624b\u628a\u5979\u63fd\u8fdb\u6000\u91cc\u3002\n\n\u5979\u7684\u8eab\u4f53\u5f88\u8f6f\uff0c\u4e5f\u5f88\u6e29\u6696\uff0c\u662f\u8fd9\u4e2a\u51b0\u51b7\u7684\u65e9\u6668\u91cc\uff0c\u552f\u4e00\u7684\u6e29\u5ea6\u3002\n\n\u201c\u65e9\u996d\u60f3\u5403\u4ec0\u4e48\uff1f\u714e\u86cb\u4e09\u660e\u6cbb\u600e\u4e48\u6837\uff1f\u201d\n\n\u6211\u6ca1\u6709\u56de\u7b54\u5979\u7684\u95ee\u9898\uff0c\u53ea\u662f\u4f4e\u5934\u95ee\u5979\u3002\n\n\u5979\u5728\u6211\u6000\u91cc\u6c89\u9ed8\u4e86\u4e00\u4f1a\u513f\uff0c\u7136\u540e\u8f7b\u8f7b\u5730\u70b9\u4e86\u70b9\u5934\u3002\n\n\u201c\u55ef\u3002\u201d\n\n\u5c31\u5728\u8fd9\u65f6\uff0c\u88ab\u6211\u653e\u5728\u8336\u51e0\u4e0a\u7684\u90a3\u90e8\u624b\u673a\uff0c\u53c8\u4e00\u6b21\u75af\u72c2\u5730\u632f\u52a8\u4e86\u8d77\u6765\u3002\u5c4f\u5e55\u4e0a\uff0c\u4f9d\u65e7\u662f\u201c\u5f20\u59d0\u201d\u90a3\u4e24\u4e2a\u5b57\uff0c\u6267\u7740\u5730\u8df3\u52a8\u7740\u3002\u8fd9\u4e00\u6b21\uff0c\u4e0d\u53ea\u662f\u7535\u8bdd\uff0c\u5c4f\u5e55\u9876\u7aef\u8fd8\u5f39\u51fa\u4e86\u4e00\u6761\u9884\u89c8\u6d88\u606f\u3002\n\n\u201c\u6797\u521d\u590f\uff01\u4f60\u6b7b\u54ea\u53bb\u4e86\uff01\u4f60\u548c\u9646\u6c89\u540c\u5c45\u7684\u7167\u7247\u4e0a\u70ed\u641c\u4e86\uff01\u201d\n\n\n\n21.\n\u90a3\u884c\u5b57\u50cf\u4e00\u6839\u70e7\u7ea2\u7684\u94a2\u9488\uff0c\u77ac\u95f4\u523a\u7a7f\u4e86\u6211\u7684\u773c\u7403\uff0c\u5728\u5927\u8111\u91cc\u70b8\u5f00\u4e00\u56e2\u6df7\u4e71\u7684\u767d\u5149\u3002\n\n\u540c\u5c45\uff1f\u7167\u7247\uff1f\u70ed\u641c\uff1f\n\n\u6bcf\u4e00\u4e2a\u5b57\u6211\u90fd\u8ba4\u8bc6\uff0c\u4f46\u7ec4\u5408\u5728\u4e00\u8d77\uff0c\u5374\u5f62\u6210\u4e86\u4e00\u79cd\u6211\u5b8c\u5168\u65e0\u6cd5\u7406\u89e3\u7684\u3001\u8352\u8bde\u7684\u8bed\u8a00\u3002\u6211\u7684\u5927\u8111\u5b95\u673a\u4e86\uff0c\u6240\u6709\u7684\u601d\u7ef4\u90fd\u505c\u6ede\u5728\u8fd9\u4e00\u523b\uff0c\u8033\u8fb9\u53ea\u5269\u4e0b\u81ea\u5df1\u8d8a\u6765\u8d8a\u54cd\u3001\u8d8a\u6765\u8d8a\u5feb\u7684\u5fc3\u8df3\u58f0\u3002\n\n\u201c\u55e1\u2014\u2014\u55e1\u2014\u2014\u201d\n\n\u8336\u51e0\u4e0a\u7684\u624b\u673a\u8fd8\u5728\u4e0d\u77e5\u75b2\u5026\u5730\u632f\u52a8\u7740\uff0c\u50cf\u4e00\u53ea\u6fd2\u6b7b\u7684\u8749\u3002\n\n\u6211\u6000\u91cc\u7684\u9e7f\u7720\u611f\u53d7\u5230\u4e86\u6211\u8eab\u4f53\u77ac\u95f4\u7684\u50f5\u786c\uff0c\u5979\u4ef0\u8d77\u5c0f\u8138\uff0c\u90a3\u53cc\u603b\u662f\u6709\u4e9b\u8ff7\u832b\u7684\u773c\u775b\u91cc\uff0c\u6b64\u523b\u6e05\u6670\u5730\u6620\u51fa\u4e86\u6211\u8138\u4e0a\u9519\u6115\u548c\u5446\u6ede\u7684\u8868\u60c5\u3002\n\n\u201c\u9646\u6c89\uff0c\u4f60\u7684\u8138\u2026\u2026\u767d\u4e86\u3002\u201d\n\n\u5979\u7684\u58f0\u97f3\u628a\u6211\u4ece\u90a3\u7247\u6df7\u4e71\u7684\u767d\u5149\u4e2d\u62c9\u4e86\u56de\u6765\u3002\u6211\u4f4e\u4e0b\u5934\uff0c\u770b\u5230\u5979\u6b63\u62c5\u5fe7\u5730\u770b\u7740\u6211\uff0c\u5c0f\u5c0f\u7684\u7709\u5934\u90fd\u76b1\u4e86\u8d77\u6765\u3002\n\n\u6211\u677e\u5f00\u62b1\u7740\u5979\u7684\u624b\uff0c\u8eab\u4f53\u524d\u503e\uff0c\u7528\u4e00\u6839\u6709\u4e9b\u98a4\u6296\u7684\u624b\u6307\uff0c\u5212\u5f00\u4e86\u624b\u673a\u7684\u5c4f\u5e55\u3002\u6ca1\u6709\u5bc6\u7801\uff0c\u6797\u521d\u590f\u7684\u624b\u673a\u4e3b\u5c4f\u5e55\u5c31\u90a3\u4e48\u6beb\u65e0\u9632\u5907\u5730\u5c55\u73b0\u5728\u6211\u9762\u524d\u3002\u58c1\u7eb8\u662f\u6211\u4eec\u7684\u5408\u7167\uff0c\u5927\u5b66\u6bd5\u4e1a\u65f6\u5728\u793e\u56e2\u6d3b\u52a8\u5ba4\u62cd\u7684\uff0c\u7167\u7247\u4e0a\u7684\u4e94\u4e2a\u4eba\u90fd\u7b11\u5f97\u50cf\u4e2a\u50bb\u5b50\u3002\n\n\u6211\u6ca1\u6709\u65f6\u95f4\u53bb\u611f\u6000\uff0c\u624b\u6307\u51e0\u4e4e\u662f\u51ed\u7740\u672c\u80fd\uff0c\u70b9\u5f00\u4e86\u90a3\u4e2a\u6700\u5e38\u7528\u7684\u793e\u4ea4\u8f6f\u4ef6\u56fe\u6807\u3002\n\n\u4e0d\u9700\u8981\u641c\u7d22\u3002\n\n\u751a\u81f3\u4e0d\u9700\u8981\u53bb\u770b\u70ed\u641c\u699c\u5355\u3002\n\n\u5f00\u5c4f\u5e7f\u544a\u4e4b\u540e\uff0c\u7b2c\u4e00\u4e2a\u6620\u5165\u773c\u5e18\u7684\uff0c\u5c31\u662f\u4e00\u6761\u88ab\u9876\u5230\u6700\u9ad8\u5904\u7684\u5a31\u4e50\u65b0\u95fb\u63a8\u9001\uff0c\u6807\u9898\u7528\u7329\u7ea2\u7684\u3001\u52a0\u7c97\u7684\u5b57\u4f53\u5199\u7740\u2014\u2014\n\n\u3010\u7206\uff01\u9876\u6d41\u5973\u661f\u6797\u521d\u590f\u7591\u4f3c\u79d8\u604b\u540c\u5c45\uff0c\u7537\u53cb\u7adf\u662f\u7d20\u4eba\uff1f\uff01\u3011\n\n\u6211\u7684\u6307\u5c16\u50cf\u662f\u88ab\u70eb\u4e86\u4e00\u4e0b\uff0c\u4e0d\u53d7\u63a7\u5236\u5730\u6296\u52a8\u7740\uff0c\u70b9\u5f00\u4e86\u90a3\u6761\u65b0\u95fb\u3002\n\n\u52a0\u8f7d\u7684\u5708\u8f6c\u4e86\u4e24\u5708\uff0c\u7136\u540e\uff0c\u4e00\u5f20\u5f20\u9ad8\u6e05\u7684\u7167\u7247\uff0c\u5c31\u90a3\u4e48\u731d\u4e0d\u53ca\u9632\u5730\uff0c\u5360\u6ee1\u4e86\u6574\u4e2a\u5c4f\u5e55\u3002\n\n\u7167\u7247\u7684\u80cc\u666f\uff0c\u662f\u6211\u4eec\u522b\u5885\u7684\u9662\u5b50\uff0c\u90a3\u6247\u6211\u6bcf\u5929\u90fd\u4f1a\u8fdb\u51fa\u7684\u5927\u95e8\u3002\u62cd\u6444\u7684\u89d2\u5ea6\u5f88\u5201\u94bb\uff0c\u5e94\u8be5\u662f\u4ece\u9662\u5b50\u5916\u9762\u7684\u67d0\u4e2a\u9ad8\u5904\uff0c\u7528\u957f\u7126\u955c\u5934\u5077\u62cd\u7684\u3002\n\n\u7b2c\u4e00\u5f20\u7167\u7247\uff0c\u662f\u67d0\u5929\u4e0b\u73ed\u56de\u5bb6\uff0c\u6797\u521d\u590f\u4ece\u540e\u9762\u62b1\u4f4f\u6211\uff0c\u628a\u4e0b\u5df4\u6401\u5728\u6211\u80a9\u8180\u4e0a\u7684\u753b\u9762\u3002\u7167\u7247\u62cd\u5f97\u5f88\u6e05\u6670\uff0c\u8fde\u5979\u8138\u4e0a\u5e26\u7740\u6492\u5a07\u7684\u7b11\u610f\uff0c\u548c\u6211\u8138\u4e0a\u65e0\u5948\u7684\u8868\u60c5\uff0c\u90fd\u4e00\u6e05\u4e8c\u695a\u3002\n\n\u7b2c\u4e8c\u5f20\u7167\u7247\uff0c\u662f\u6211\u67d0\u5929\u65e9\u4e0a\u5f00\u8f66\u79bb\u5f00\uff0c\u800c\u51e0\u4e4e\u662f\u540c\u4e00\u65f6\u95f4\uff0c\u5979\u4e5f\u4ece\u5927\u95e8\u91cc\u8d70\u51fa\u6765\uff0c\u8d70\u5411\u5979\u81ea\u5df1\u7684\u90a3\u8f86\u8f66\u3002\u7167\u7247\u7684\u914d\u6587\u6781\u5177\u717d\u52a8\u6027\uff1a\u201c\u7591\u4f3c\u5171\u5ea6\u826f\u5bb5\u540e\uff0c\u4e3a\u907f\u5acc\u5206\u5f00\u4e0a\u73ed\u201d\u3002\n\n\u7b2c\u4e09\u5f20\uff0c\u7b2c\u56db\u5f20\u2026\u2026\u751a\u81f3\u8fd8\u6709\u6211\u4eec\u4e4b\u524d\u4e00\u8d77\u53bb\u8d85\u5e02\u8d2d\u7269\uff0c\u6211\u63a8\u7740\u8d2d\u7269\u8f66\uff0c\u5979\u4eb2\u5bc6\u5730\u633d\u7740\u6211\u80f3\u818a\u7684\u753b\u9762\u3002\u8fd8\u6709\u4e00\u6b21\u6e29\u7476\u8fc7\u751f\u65e5\uff0c\u6211\u4eec\u5728\u9662\u5b50\u91cc\u70e7\u70e4\uff0c\u5979\u628a\u4e00\u5757\u70e4\u597d\u7684\u8089\u5582\u5230\u6211\u5634\u8fb9\u7684\u77ac\u95f4\u3002\n\n\u6240\u6709\u7684\u7167\u7247\uff0c\u90fd\u88ab\u622a\u53d6\u4e86\u6700\u66a7\u6627\u3001\u6700\u5f15\u4eba\u9050\u60f3\u7684\u7247\u6bb5\u3002\u5728\u8fd9\u4e9b\u7167\u7247\u91cc\uff0c\u6e29\u7476\u3001\u6c5f\u96ea\u3001\u9e7f\u7720\u7684\u8eab\u5f71\u88ab\u523b\u610f\u5730\u6a21\u7cca\u6389\uff0c\u6216\u8005\u76f4\u63a5\u88c1\u526a\u6389\uff0c\u53ea\u5269\u4e0b\u6211\u548c\u5979\uff0c\u50cf\u662f\u6d3b\u5728\u4e8c\u4eba\u4e16\u754c\u91cc\u7684\u70ed\u604b\u60c5\u4fa3\u3002\n\n\u597d\u5728\u9e7f\u7720\u53ea\u6709\u5728\u5bb6\u91cc\u624d\u4f1a\u88f8\u4f53\uff0c\u4e0d\u7136\u6211\u90fd\u4e0d\u6562\u60f3\u4f1a\u53d1\u751f\u4ec0\u4e48\u4e8b\u60c5\u3002\n\n\u65b0\u95fb\u7684\u672b\u5c3e\uff0c\u8fd8\u9644\u4e0a\u4e86\u6211\u7684\u4e2a\u4eba\u4fe1\u606f\u3002\u6211\u7684\u540d\u5b57\uff0c\u6211\u7684\u5e74\u9f84\uff0c\u6211\u6240\u5728\u7684\u516c\u53f8\uff0c\u751a\u81f3\u8fde\u6211\u7684\u5927\u5b66\u4e13\u4e1a\uff0c\u90fd\u88ab\u6252\u5f97\u4e00\u5e72\u4e8c\u51c0\u3002\n\n\u6211\u7684\u5927\u8111\u201c\u55e1\u201d\u7684\u4e00\u58f0\uff0c\u4e00\u7247\u7a7a\u767d\u3002\n\n\u5b8c\u4e86\u3002\n\n\u8fd9\u4e0d\u662f\u7eef\u95fb\u3002\n\n\u8fd9\u662f\u5904\u5fc3\u79ef\u8651\u7684\u3001\u7cbe\u51c6\u7684\u72d9\u51fb\u3002\n\n\u624b\u673a\u4ece\u6211\u65e0\u529b\u7684\u624b\u4e2d\u6ed1\u843d\uff0c\u6389\u5728\u5730\u6bef\u4e0a\uff0c\u53d1\u51fa\u4e00\u58f0\u95f7\u54cd\u3002\n\n\u201c\u9646\u6c89\uff0c\u4f60\u600e\u4e48\u4e86\uff1f\u4f60\u5728\u53d1\u6296\u3002\u201d\n\n\u9e7f\u7720\u7684\u58f0\u97f3\u4f20\u6765\uff0c\u5979\u770b\u7740\u6211\uff0c\u4e0d\u77e5\u6240\u63aa\u3002\n\n\u6211\u770b\u7740\u5979\uff0c\u5f20\u4e86\u5f20\u5634\uff0c\u60f3\u8bf4\u70b9\u4ec0\u4e48\u5b89\u6170\u5979\uff0c\u544a\u8bc9\u5979\u201c\u6ca1\u4e8b\u7684\u201d\u3002\n\n\u53ef\u6211\u4e00\u4e2a\u5b57\u90fd\u8bf4\u4e0d\u51fa\u6765\u3002\n\n\u6211\u7684\u7259\u9f7f\u5728\u4e0d\u53d7\u63a7\u5236\u5730\u6253\u98a4\uff0c\u53d1\u51fa\u201c\u54af\u54af\u201d\u7684\u8f7b\u54cd\u3002\u4e00\u80a1\u5f7b\u9aa8\u7684\u5bd2\u610f\uff0c\u4ece\u6211\u7684\u811a\u5e95\u677f\u5347\u8d77\uff0c\u77ac\u95f4\u4f20\u904d\u4e86\u56db\u80a2\u767e\u9ab8\u3002\n\n\u82e5\u662f\u666e\u901a\u7684\u660e\u661f\u88ab\u66dd\u5149\u604b\u60c5\uff0c\u4e5f\u8bb8\u5e76\u4e0d\u4f1a\u6380\u8d77\u591a\u5927\u7684\u98ce\u6d6a\u3002\n\n\u4f46\u5979\u662f\u6797\u521d\u590f\uff0c\u662f\u90a3\u4e2a\u706b\u5f97\u4e00\u584c\u7cca\u6d82\u7684\u6797\u521d\u590f\u3002\n\n\u8fd9\u662f\u4e2a\u8f70\u52a8\u5a31\u4e50\u5708\u7684\u5927\u4e8b\u4ef6\u3002\n\n\u8fd9\u4e0d\u662f\u7ed3\u675f\u3002\n\n\u8fd9\u4ec5\u4ec5\u662f\u4e2a\u5f00\u59cb\u3002\n\n\n\n22.\n\u6211\u7684\u5927\u8111\u5728\u77ed\u6682\u7684\u7a7a\u767d\u540e\uff0c\u5f00\u59cb\u88ab\u65e0\u6570\u6df7\u4e71\u7684\u601d\u7eea\u548c\u5c16\u9510\u7684\u55e1\u9e23\u58f0\u586b\u6ee1\u3002\n\n\u6797\u521d\u590f\u8be5\u600e\u4e48\u529e\uff1f\u5979\u7684\u4e8b\u4e1a\uff0c\u5979\u90a3\u4e48\u591a\u5e74\u8f9b\u82e6\u5efa\u7acb\u8d77\u6765\u7684\u4e00\u5207\uff0c\u4f1a\u4e0d\u4f1a\u56e0\u4e3a\u6211\uff0c\u5c31\u8fd9\u4e48\u6bc1\u4e8e\u4e00\u65e6\uff1f\u8fd8\u6709\u8fd9\u4e2a\u5bb6\uff0c\u6e29\u7476\uff0c\u6c5f\u96ea\u2026\u2026\u5979\u4eec\u770b\u5230\u8fd9\u4e9b\u7167\u7247\u4f1a\u600e\u4e48\u60f3\uff1f\u7167\u7247\u91cc\u90a3\u4e2a\u88ab\u523b\u610f\u6a21\u7cca\u6389\u7684\u80cc\u666f\u677f\uff0c\u4f1a\u4e0d\u4f1a\u6709\u4e00\u5929\u4e5f\u88ab\u6252\u51fa\u6765\uff1f\n\n\u6050\u60e7\u50cf\u4e00\u53ea\u51b0\u51b7\u7684\u624b\uff0c\u7d27\u7d27\u5730\u6525\u4f4f\u4e86\u6211\u7684\u5fc3\u810f\uff0c\u8ba9\u6211\u51e0\u4e4e\u65e0\u6cd5\u547c\u5438\u3002\n\n\u201c\u9646\u6c89\uff01\u201d\n\n\u9e7f\u7720\u7684\u58f0\u97f3\u731b\u5730\u628a\u6211\u62c9\u56de\u73b0\u5b9e\u3002\u5979\u7684\u5c0f\u624b\u6293\u4f4f\u4e86\u6211\u6b63\u5728\u53d1\u6296\u7684\u624b\u81c2\uff0c\u7528\u529b\u5730\u6447\u6643\u7740\u3002\n\n\u201c\u7535\u8bdd\uff01\u201d\n\n\u6211\u8fd9\u624d\u53cd\u5e94\u8fc7\u6765\uff0c\u90a3\u90e8\u88ab\u6211\u5931\u624b\u6389\u5728\u5730\u6bef\u4e0a\u7684\u624b\u673a\uff0c\u8fd8\u5728\u56fa\u6267\u5730\u54cd\u7740\u3002\u5c4f\u5e55\u7684\u5149\u4eae\u5728\u5730\u6bef\u4e0a\u5f62\u6210\u4e00\u4e2a\u4e0d\u65ad\u95ea\u70c1\u7684\u65b9\u5757\u3002\n\n\u6211\u50cf\u662f\u88ab\u4ec0\u4e48\u4e1c\u897f\u9a71\u4f7f\u7740\uff0c\u50f5\u786c\u5730\u5f2f\u4e0b\u8170\uff0c\u6361\u8d77\u4e86\u624b\u673a\u3002\u5c4f\u5e55\u4e0a\uff0c\u201c\u5f20\u59d0\u201d\u90a3\u4e24\u4e2a\u5b57\u4eff\u4f5b\u5e26\u7740\u5343\u94a7\u7684\u91cd\u91cf\u3002\n\n\u6211\u6df1\u5438\u4e86\u4e00\u53e3\u6c14\uff0c\u624b\u6307\u5728\u5c4f\u5e55\u4e0a\u5212\u8fc7\uff0c\u63a5\u901a\u4e86\u7535\u8bdd\u3002\n\n\u6211\u751a\u81f3\u6ca1\u6765\u5f97\u53ca\u628a\u624b\u673a\u653e\u5230\u8033\u8fb9\uff0c\u4e00\u4e2a\u5973\u4eba\u7684\u5486\u54ee\u58f0\u5c31\u4ece\u542c\u7b52\u91cc\u70b8\u4e86\u51fa\u6765\uff0c\u5c16\u9510\u5f97\u50cf\u8981\u523a\u7834\u6211\u7684\u8033\u819c\u3002\n\n\u201c\u6797\u521d\u590f\uff01\u4f60\u7ec8\u4e8e\u80af\u63a5\u7535\u8bdd\u4e86\uff01\u4f60\u73b0\u5728\u5728\u54ea\u91cc\uff1f\u4f60\u662f\u4e0d\u662f\u75af\u4e86\uff01\u6211\u8ddf\u4f60\u8bf4\u8fc7\u591a\u5c11\u6b21\uff0c\u79bb\u90a3\u4e2a\u53eb\u9646\u6c89\u7684\u8fdc\u4e00\u70b9\uff01\u4f60\u770b\u770b\u73b0\u5728\uff01\u5168\u5b8c\u4e86\uff01\u4f60\u77e5\u4e0d\u77e5\u9053\u516c\u53f8\u7684\u80a1\u4ef7\u8dcc\u4e86\u591a\u5c11\uff1f\u4f60\u77e5\u4e0d\u77e5\u9053\u4f60\u73b0\u5728\u6709\u591a\u5c11\u4ee3\u8a00\u8981\u89e3\u7ea6\uff1f\u4f60\u8bf4\u8bdd\u554a\uff01\u201d\n\n\u90a3\u58f0\u97f3\u5145\u6ee1\u4e86\u6124\u6012\u548c\u5931\u671b\uff0c\u6bcf\u4e00\u4e2a\u5b57\u90fd\u50cf\u4e00\u8bb0\u8033\u5149\uff0c\u72e0\u72e0\u5730\u6247\u5728\u6211\u7684\u8138\u4e0a\u3002\n\n\u201c\u6211\u2026\u2026\u6211\u4e0d\u662f\u2026\u2026\u201d\n\n\u6211\u5f20\u4e86\u5f20\u5634\uff0c\u5589\u5499\u91cc\u50cf\u662f\u88ab\u585e\u4e86\u4e00\u56e2\u6c99\u5b50\uff0c\u53ea\u80fd\u53d1\u51fa\u51e0\u4e2a\u5e72\u6da9\u7684\u3001\u4e0d\u6210\u8c03\u7684\u97f3\u8282\u3002\u6211\u751a\u81f3\u4e0d\u77e5\u9053\u8be5\u600e\u4e48\u79f0\u547c\u5bf9\u65b9\uff0c\u8be5\u600e\u4e48\u89e3\u91ca\u73b0\u5728\u7684\u60c5\u51b5\u3002\n\n\u7535\u8bdd\u90a3\u5934\u7684\u5486\u54ee\u58f0\u621b\u7136\u800c\u6b62\u3002\n\n\u6b7b\u4e00\u822c\u7684\u5bc2\u9759\u3002\n\n\u8fc7\u4e86\u51e0\u79d2\u949f\uff0c\u5f20\u59d0\u7684\u58f0\u97f3\u518d\u6b21\u4f20\u6765\uff0c\u8fd9\u4e00\u6b21\uff0c\u5979\u7684\u58f0\u97f3\u91cc\u6ca1\u6709\u4e86\u6124\u6012\uff0c\u53ea\u5269\u4e0b\u4e00\u79cd\u51b0\u51b7\u5230\u6781\u70b9\u7684\u3001\u4e0d\u5e26\u4efb\u4f55\u611f\u60c5\u7684\u5e73\u9759\u3002\n\n\u201c\u4f60\u662f\u9646\u6c89\uff1f\u201d\n\n\u201c\u2026\u2026\u662f\u3002\u201d\n\n\u201c\u6797\u521d\u590f\u7684\u624b\u673a\uff0c\u4e3a\u4ec0\u4e48\u5728\u4f60\u624b\u4e0a\uff1f\u201d\n\n\u201c\u5979\u2026\u2026\u5979\u8d70\u5f97\u6025\uff0c\u5fd8\u5e26\u4e86\u3002\u201d\n\n\u201c\u5fd8\u5e26\u4e86\uff1f\u201d\u5f20\u59d0\u51b7\u7b11\u4e86\u4e00\u58f0\uff0c\u90a3\u7b11\u58f0\u91cc\u5145\u6ee1\u4e86\u5632\u8bbd\uff0c\u201c\u6211\u770b\u5979\u662f\u6ca1\u8138\u89c1\u6211\u4e86\u5427\u3002\u9646\u6c89\uff0c\u6211\u4e0d\u7ba1\u4f60\u662f\u8c01\uff0c\u4e0d\u7ba1\u4f60\u548c\u521d\u590f\u662f\u4ec0\u4e48\u5173\u7cfb\uff0c\u73b0\u5728\uff0c\u7acb\u523b\uff0c\u9a6c\u4e0a\uff0c\u5e26\u7740\u5979\u7684\u624b\u673a\uff0c\u5230\u6211\u4eec\u516c\u53f8\u6765\u3002\u5730\u5740\u6211\u4f1a\u53d1\u7ed9\u4f60\u3002\u534a\u4e2a\u5c0f\u65f6\u5185\uff0c\u6211\u8981\u89c1\u5230\u4f60\u3002\u5982\u679c\u4f60\u4e0d\u6765\uff0c\u6216\u8005\u6562\u800d\u4ec0\u4e48\u82b1\u6837\u2026\u2026\u201d\n\n\u5979\u987f\u4e86\u4e00\u4e0b\uff0c\u58f0\u97f3\u538b\u5f97\u66f4\u4f4e\uff0c\u50cf\u6bd2\u86c7\u5410\u4fe1\u3002\n\n\u201c\u6211\u4f1a\u8ba9\u4f60\u77e5\u9053\uff0c\u6bc1\u6389\u4e00\u4e2a\u666e\u901a\u4eba\u7684\u4eba\u751f\uff0c\u6709\u591a\u4e48\u7b80\u5355\u3002\u201d\n\n\u7535\u8bdd\u88ab\u201c\u561f\u201d\u7684\u4e00\u58f0\u6302\u65ad\u4e86\u3002\n\n\u7d27\u63a5\u7740\uff0c\u4e00\u6761\u5e26\u7740\u5730\u5740\u7684\u77ed\u4fe1\u5c31\u53d1\u4e86\u8fc7\u6765\u3002\n\n\u6211\u63e1\u7740\u624b\u673a\uff0c\u7ad9\u5728\u5ba2\u5385\u4e2d\u592e\uff0c\u611f\u89c9\u5168\u8eab\u7684\u529b\u6c14\u90fd\u88ab\u62bd\u5e72\u4e86\u3002\u7a97\u5916\u7684\u9633\u5149\u660e\u5a9a\u5f97\u523a\u773c\uff0c\u53ef\u6211\u5374\u611f\u89c9\u81ea\u5df1\u50cf\u662f\u5760\u5165\u4e86\u4e00\u4e2a\u65e0\u5e95\u7684\u3001\u51b0\u51b7\u7684\u6df1\u6e0a\u3002\n\n\u201c\u9646\u6c89\u2026\u2026\u201d\n\n\u9e7f\u7720\u62c9\u4e86\u62c9\u6211\u7684\u8863\u89d2\uff0c\u4ef0\u7740\u8138\uff0c\u90a3\u53cc\u603b\u662f\u6c34\u6c6a\u6c6a\u7684\u773c\u775b\u91cc\uff0c\u6b64\u523b\u5145\u6ee1\u4e86\u6050\u60e7\u548c\u4e0d\u5b89\u3002\n\n\u201c\u90a3\u4e2a\u963f\u59e8\uff0c\u597d\u51f6\u3002\u201d\n\n\u6211\u4f4e\u4e0b\u5934\uff0c\u770b\u7740\u5979\u3002\u770b\u7740\u5979\u8d64\u88f8\u7684\u3001\u6beb\u65e0\u9632\u5907\u7684\u8eab\u4f53\uff0c\u770b\u7740\u5979\u90a3\u5f20\u5199\u6ee1\u4e86\u4f9d\u8d56\u548c\u4fe1\u4efb\u7684\u8138\u3002\n\n\u6211\u5ffd\u7136\u610f\u8bc6\u5230\uff0c\u6211\u4e0d\u80fd\u5012\u4e0b\u3002\n\n\u5982\u679c\u6211\u5012\u4e0b\u4e86\uff0c\u8c01\u6765\u4fdd\u62a4\u5979\u4eec\uff1f\n\n\u6211\u4f38\u51fa\u624b\uff0c\u7528\u5c3d\u5168\u8eab\u7684\u529b\u6c14\uff0c\u63c9\u4e86\u63c9\u5979\u7684\u5934\u53d1\u3002\n\n\u201c\u7720\u7720\uff0c\u4f60\u5446\u5728\u5bb6\u91cc\uff0c\u628a\u95e8\u9501\u597d\uff0c\u4e0d\u7ba1\u8c01\u6572\u95e8\u90fd\u4e0d\u8981\u5f00\uff0c\u597d\u5417\uff1f\u201d\n\n\u201c\u90a3\u4f60\u5462\uff1f\u201d\n\n\u201c\u6211\u51fa\u53bb\u4e00\u8d9f\uff0c\u5f88\u5feb\u5c31\u56de\u6765\u3002\u201d\n\n\u6211\u7684\u58f0\u97f3\u5f88\u5e73\u9759\uff0c\u5e73\u9759\u5f97\u8fde\u6211\u81ea\u5df1\u90fd\u611f\u5230\u60ca\u8bb6\u3002\n\n\n\n23.\n\u6211\u770b\u7740\u9e7f\u7720\uff0c\u5979\u90a3\u53cc\u6e05\u6f88\u7684\u773c\u775b\u91cc\u5012\u6620\u7740\u6211\u7684\u5f71\u5b50\uff0c\u4e00\u4e2a\u6e3a\u5c0f\u7684\u3001\u6b63\u5728\u53d1\u6296\u7684\u5f71\u5b50\u3002\u6211\u4e0d\u80fd\u8ba9\u5979\u770b\u5230\u6211\u8fd9\u4e2a\u6837\u5b50\u3002\n\n\u201c\u7a7f\u4e0a\u8863\u670d\u3002\u201d\n\n\u6211\u5bf9\u5979\u8bf4\uff0c\u58f0\u97f3\u91cc\u5e26\u7740\u4e00\u79cd\u6211\u81ea\u5df1\u90fd\u672a\u66fe\u5bdf\u89c9\u7684\u3001\u4e0d\u5bb9\u7f6e\u7591\u7684\u529b\u5ea6\u3002\n\n\u9e7f\u7720\u6123\u4e86\u4e00\u4e0b\uff0c\u4f3c\u4e4e\u6ca1\u53cd\u5e94\u8fc7\u6765\u3002\u8fd9\u662f\u6211\u7b2c\u4e00\u6b21\u7528\u8fd9\u79cd\u8fd1\u4e4e\u547d\u4ee4\u7684\u53e3\u543b\u548c\u5979\u8bf4\u8bdd\u3002\u5979\u7728\u4e86\u7728\u773c\uff0c\u7136\u540e\u5f88\u542c\u8bdd\u5730\u201c\u54e6\u201d\u4e86\u4e00\u58f0\uff0c\u4ece\u5730\u6bef\u4e0a\u722c\u8d77\u6765\uff0c\u5149\u7740\u8eab\u5b50\u8dd1\u4e0a\u697c\u53bb\u4e86\u3002\n\n\u5ba2\u5385\u91cc\u53ea\u5269\u4e0b\u6211\u4e00\u4e2a\u4eba\u3002\n\n\u6211\u6ca1\u6709\u7acb\u523b\u52a8\u8eab\uff0c\u800c\u662f\u5148\u8d70\u5230\u53a8\u623f\uff0c\u7ed9\u81ea\u5df1\u5012\u4e86\u4e00\u5927\u676f\u51b7\u6c34\uff0c\u4e00\u53e3\u6c14\u704c\u4e86\u4e0b\u53bb\u3002\u51b0\u51b7\u7684\u6db2\u4f53\u987a\u7740\u5589\u5499\u6d41\u8fdb\u80c3\u91cc\uff0c\u50cf\u4e00\u5757\u51b0\uff0c\u6682\u65f6\u9547\u4f4f\u4e86\u6211\u90a3\u9897\u72c2\u8df3\u4e0d\u6b62\u7684\u5fc3\u810f\u3002\n\n\u6211\u9700\u8981\u51b7\u9759\u3002\n\n\u6124\u6012\u548c\u6050\u60e7\u89e3\u51b3\u4e0d\u4e86\u4efb\u4f55\u95ee\u9898\u3002\u5f20\u59d0\u8bf4\u5f97\u5bf9\uff0c\u6bc1\u6389\u4e00\u4e2a\u666e\u901a\u4eba\u7684\u4eba\u751f\uff0c\u5f88\u7b80\u5355\u3002\u4f46\u6211\u4e0d\u80fd\u88ab\u5979\u5413\u4f4f\u3002\u5982\u679c\u6211\u9000\u7f29\u4e86\uff0c\u90a3\u6797\u521d\u590f\u600e\u4e48\u529e\uff1f\n\n\u6211\u56de\u5230\u5ba2\u5385\uff0c\u6361\u8d77\u5730\u4e0a\u7684\u624b\u673a\uff0c\u628a\u5b83\u63e3\u8fdb\u515c\u91cc\u3002\u7136\u540e\u4e0a\u697c\uff0c\u7528\u6700\u5feb\u7684\u901f\u5ea6\u51b2\u4e86\u4e2a\u6fa1\uff0c\u6362\u4e0a\u4e86\u4e00\u8eab\u8fd8\u7b97\u4f53\u9762\u7684\u886c\u886b\u548c\u957f\u88e4\u3002\u522e\u80e1\u5b50\u7684\u65f6\u5019\uff0c\u6211\u7684\u624b\u8fd8\u5728\u6296\uff0c\u5200\u7247\u5728\u8138\u4e0a\u5212\u51fa\u4e86\u4e00\u9053\u7ec6\u5c0f\u7684\u8840\u75d5\uff0c\u6211\u7528\u51b7\u6c34\u51b2\u4e86\u51b2\uff0c\u6beb\u4e0d\u5728\u610f\u3002\n\n\u4e0b\u697c\u7684\u65f6\u5019\uff0c\u9e7f\u7720\u5df2\u7ecf\u7a7f\u597d\u4e86\u4e00\u4ef6\u5bbd\u5927\u7684\u767d\u8272T\u6064\uff0cT\u6064\u7684\u4e0b\u6446\u4e00\u76f4\u5782\u5230\u5979\u7684\u5927\u817f\u6839\uff0c\u5c06\u5c06\u906e\u4f4f\u91cd\u70b9\u90e8\u4f4d\uff0c\u8ba9\u5979\u770b\u8d77\u6765\u50cf\u5077\u7a7f\u4e86\u5927\u4eba\u8863\u670d\u7684\u5c0f\u5b69\u3002\u5979\u6b63\u62b1\u7740\u5979\u90a3\u53ea\u5927\u718a\u73a9\u5076\uff0c\u8737\u7f29\u5728\u6c99\u53d1\u7684\u4e00\u89d2\uff0c\u770b\u5230\u6211\u4e0b\u6765\uff0c\u7acb\u523b\u5750\u76f4\u4e86\u8eab\u4f53\u3002\n\n\u201c\u5185\u88e4\u4e5f\u8981\u7a7f\u54e6\u3002\u201d\n\n\u6211\u53ee\u5631\u7740\u3002\n\n\u9e7f\u7720\u7528\u529b\u7684\u70b9\u70b9\u5934\uff0c\u6380\u5f00\u81ea\u5df1\u7684\u4e0b\u6446\uff0c\u8ba9\u6211\u770b\u5230\u4e86\u90a3\u6761\u7c89\u8272\u7684\u5c0f\u718a\u5185\u88e4\u3002\n\n\u201c\u4f60\u8981\u8d70\u4e86\u5417\uff1f\u201d\n\n\u201c\u55ef\u3002\u201d\u6211\u8d70\u5230\u7384\u5173\uff0c\u6362\u4e0a\u978b\uff0c\u201c\u8bb0\u4f4f\u6211\u521a\u624d\u8bf4\u7684\u8bdd\uff0c\u9501\u597d\u95e8\uff0c\u8c01\u6765\u90fd\u522b\u5f00\u3002\u997f\u4e86\u5c31\u81ea\u5df1\u53eb\u5916\u5356\uff0c\u94b1\u4e0d\u591f\u7684\u8bdd\u2026\u2026\u201d\n\n\u201c\u6211\u6709\u94b1\u7684\uff0c\u522b\u5c0f\u770b\u6211\u54e6\u3002\u201d\n\n\u5979\u8bf4\u3002\n\n\u6211\u70b9\u70b9\u5934\uff0c\u62c9\u5f00\u4e86\u5927\u95e8\u3002\n\n\u662f\u554a\uff0c\u6211\u4eec\u4e94\u4e2a\u4eba\u5f53\u4e2d\uff0c\u6211\u624d\u662f\u6700\u7a77\u7684\u90a3\u4e2a\u3002\n\n\u201c\u6211\u8d70\u4e86\u3002\u201d\n\n\u8eab\u540e\u6ca1\u6709\u4f20\u6765\u56de\u7b54\u3002\u6211\u5173\u4e0a\u95e8\uff0c\u542c\u5230\u4e86\u91cc\u9762\u4f20\u6765\u95e8\u9501\u53cd\u9501\u7684\u201c\u5494\u54d2\u201d\u58f0\u3002\n\n\u6211\u5750\u8fdb\u8f66\u91cc\uff0c\u6309\u7167\u77ed\u4fe1\u4e0a\u7684\u5730\u5740\u8bbe\u7f6e\u4e86\u5bfc\u822a\u3002\u90a3\u662f\u4e00\u5bb6\u5a31\u4e50\u516c\u53f8\uff0c\u5728\u5e02\u4e2d\u5fc3\u6700\u7e41\u534e\u7684\u5730\u6bb5\uff0c\u4e00\u680b\u9ad8\u8038\u5165\u4e91\u7684\u5199\u5b57\u697c\u91cc\u3002\u6211\u53d1\u52a8\u6c7d\u8f66\uff0c\u8f66\u5b50\u7f13\u7f13\u9a76\u51fa\u9662\u5b50\u3002\u6211\u4e0b\u610f\u8bc6\u5730\u770b\u4e86\u4e00\u773c\u9662\u5b50\u5916\u9762\uff0c\u90a3\u4e9b\u6211\u4ece\u672a\u6ce8\u610f\u8fc7\u7684\u89d2\u843d\u548c\u9ad8\u5899\uff0c\u6b64\u523b\u5728\u6211\u773c\u91cc\uff0c\u90fd\u50cf\u662f\u9690\u85cf\u7740\u65e0\u6570\u53cc\u7aa5\u63a2\u7684\u773c\u775b\u3002\n\n\u8f66\u5f00\u5728\u8def\u4e0a\uff0c\u6211\u7684\u5927\u8111\u53cd\u800c\u524d\u6240\u672a\u6709\u5730\u6e05\u9192\u3002\n\n\u5f20\u59d0\u7684\u76ee\u7684\u662f\u4ec0\u4e48\uff1f\u6b62\u635f\u3002\u5982\u4f55\u6b62\u635f\uff1f\u6700\u7b80\u5355\u7684\u65b9\u6cd5\uff0c\u5c31\u662f\u8ba9\u6211\u548c\u6797\u521d\u590f\u5f7b\u5e95\u6487\u6e05\u5173\u7cfb\uff0c\u8ba9\u6211\u4ece\u8fd9\u4e2a\u4e16\u754c\u4e0a\u201c\u6d88\u5931\u201d\u3002\u5979\u4f1a\u7528\u94b1\uff0c\u8fd8\u662f\u7528\u5a01\u80c1\uff1f\u6216\u8005\u4e24\u8005\u90fd\u6709\uff1f\n\n\u6797\u521d\u590f\u73b0\u5728\u5728\u54ea\u91cc\uff1f\u5979\u770b\u5230\u65b0\u95fb\u4e86\u5417\uff1f\u5979\u77e5\u4e0d\u77e5\u9053\u81ea\u5df1\u624b\u673a\u843d\u5728\u4e86\u5bb6\u91cc\uff1f\u5979\u73b0\u5728\u662f\u4e00\u4e2a\u4eba\uff0c\u8fd8\u662f\u548c\u5f20\u59d0\u5728\u4e00\u8d77\uff1f\n\n\u8fd8\u6709\u6e29\u7476\u548c\u6c5f\u96ea\u3002\u5979\u4eec\u662f\u4e0d\u662f\u4e5f\u770b\u5230\u4e86\u65b0\u95fb\uff1f\u5979\u4eec\u4f1a\u600e\u4e48\u60f3\u6211\uff1f\u600e\u4e48\u60f3\u6797\u521d\u590f\uff1f\n\n\u4e00\u4e2a\u53c8\u4e00\u4e2a\u95ee\u9898\u5728\u6211\u8111\u5b50\u91cc\u76d8\u65cb\uff0c\u50cf\u4e00\u7fa4\u627e\u4e0d\u5230\u51fa\u53e3\u7684\u871c\u8702\u3002\n\n\u8f66\u5b50\u9a76\u5165\u5e02\u4e2d\u5fc3\uff0c\u5468\u56f4\u7684\u8f66\u6d41\u53d8\u5f97\u62e5\u6324\uff0c\u9ad8\u697c\u5927\u53a6\u6295\u4e0b\u7684\u9634\u5f71\u5c06\u6211\u7684\u8f66\u5b8c\u5168\u7b3c\u7f69\u3002\u6211\u62ac\u5934\u770b\u7740\u90a3\u680b\u5728\u9633\u5149\u4e0b\u95ea\u95ea\u53d1\u5149\u7684\u73bb\u7483\u5e55\u5899\u5927\u697c\uff0c\u611f\u89c9\u81ea\u5df1\u50cf\u4e00\u53ea\u5373\u5c06\u88ab\u6295\u5165\u5e9e\u5927\u673a\u5668\u91cc\u78be\u788e\u7684\u8682\u8681\u3002\n\n\u8fdc\u8fdc\u7684\uff0c\u80fd\u770b\u5230\u5927\u53a6\u7684\u5927\u95e8\u53e3\u5df2\u7ecf\u6324\u6ee1\u4e86\u8bb0\u8005\u3002\n\n\u6211\u628a\u8f66\u505c\u5728\u5730\u4e0b\u8f66\u5e93\uff0c\u7136\u540e\u5750\u7535\u68af\u4e0a\u697c\u3002\u7535\u68af\u91cc\u5149\u53ef\u9274\u4eba\uff0c\u6620\u51fa\u6211\u6709\u4e9b\u82cd\u767d\u7684\u8138\uff0c\u548c\u6211\u773c\u91cc\u7684\u7ea2\u8840\u4e1d\u3002\n\n\u201c\u53ee\u201d\u7684\u4e00\u58f0\uff0c\u7535\u68af\u95e8\u5f00\u4e86\u3002\n\n\u4e00\u4e2a\u5de8\u5927\u7684\u3001\u8bbe\u8ba1\u611f\u5341\u8db3\u7684\u516c\u53f8LOGO\u6620\u5165\u773c\u5e18\u3002\u524d\u53f0\u7684\u5973\u5b69\u7a7f\u7740\u7cbe\u81f4\u7684\u804c\u4e1a\u88c5\uff0c\u770b\u5230\u6211\uff0c\u5979\u8138\u4e0a\u9732\u51fa\u4e86\u804c\u4e1a\u5316\u7684\u3001\u6070\u5230\u597d\u5904\u7684\u5fae\u7b11\u3002\n\n\u201c\u662f\u9646\u6c89\u5148\u751f\u5417\uff1f\u201d\n\n\u6211\u70b9\u4e86\u70b9\u5934\u3002\n\n\u201c\u5f20\u59d0\u5728\u4f1a\u8bae\u5ba4\u7b49\u60a8\uff0c\u8bf7\u8ddf\u6211\u6765\u3002\u201d\n\n\u5979\u8138\u4e0a\u7684\u7b11\u5bb9\u6ca1\u6709\u4efb\u4f55\u53d8\u5316\uff0c\u4f46\u773c\u795e\u91cc\uff0c\u5374\u591a\u4e86\u4e00\u4e1d\u6211\u80fd\u8bfb\u61c2\u7684\u4e1c\u897f\u3002\n\n\u662f\u601c\u60af\u3002\n\n\n\n\n24.\n\u6211\u8ddf\u7740\u524d\u53f0\u5973\u5b69\u7a7f\u8fc7\u4e00\u6761\u5b89\u9759\u5f97\u6709\u4e9b\u8fc7\u5206\u7684\u8d70\u5eca\uff0c\u811a\u4e0b\u7684\u5730\u6bef\u5f88\u539a\uff0c\u8e29\u4e0a\u53bb\u4e00\u70b9\u58f0\u97f3\u90fd\u6ca1\u6709\uff0c\u5438\u6536\u4e86\u6240\u6709\u7684\u811a\u6b65\u58f0\uff0c\u4e5f\u4eff\u4f5b\u5438\u6536\u4e86\u6211\u7684\u52c7\u6c14\u3002\u5979\u5728\u4e00\u6247\u539a\u91cd\u7684\u78e8\u7802\u73bb\u7483\u95e8\u524d\u505c\u4e0b\uff0c\u8f7b\u8f7b\u6572\u4e86\u6572\u3002\n\n\u91cc\u9762\u4f20\u6765\u4e00\u4e2a\u5e73\u9759\u7684\u5973\u58f0\u3002\n\n\u201c\u8fdb\u3002\u201d\n\n\u524d\u53f0\u5973\u5b69\u4e3a\u6211\u63a8\u5f00\u95e8\uff0c\u505a\u4e86\u4e00\u4e2a\u201c\u8bf7\u201d\u7684\u624b\u52bf\uff0c\u7136\u540e\u5c31\u8f6c\u8eab\u79bb\u5f00\u4e86\uff0c\u81ea\u59cb\u81f3\u7ec8\uff0c\u5979\u8138\u4e0a\u7684\u5fae\u7b11\u90fd\u6ca1\u6709\u53d8\u8fc7\u3002\n\n\u6211\u6df1\u5438\u4e00\u53e3\u6c14\uff0c\u8d70\u4e86\u8fdb\u53bb\u3002\n\n\u4f1a\u8bae\u5ba4\u5f88\u5927\uff0c\u4e5f\u5f88\u7a7a\u3002\u4e00\u5f20\u5de8\u5927\u7684\u9ed1\u8272\u692d\u5706\u5f62\u4f1a\u8bae\u684c\u6446\u5728\u4e2d\u592e\uff0c\u8868\u9762\u64e6\u5f97\u9503\u4eae\uff0c\u80fd\u6e05\u6670\u5730\u5012\u6620\u51fa\u5929\u82b1\u677f\u4e0a\u60e8\u767d\u7684\u706f\u7ba1\u3002\u623f\u95f4\u91cc\u6ca1\u6709\u5f00\u4e3b\u706f\uff0c\u53ea\u6709\u767e\u53f6\u7a97\u7684\u7f1d\u9699\u91cc\u900f\u8fdb\u7684\u9633\u5149\uff0c\u5728\u5730\u4e0a\u548c\u5899\u58c1\u4e0a\u5207\u5272\u51fa\u4e00\u6761\u6761\u6591\u9a6c\u7ebf\u4e00\u6837\u7684\u5149\u5f71\uff0c\u8ba9\u6574\u4e2a\u7a7a\u95f4\u663e\u5f97\u6709\u4e9b\u51b0\u51b7\u3002\n\n\u7a7a\u8c03\u7684\u51b7\u6c14\u5f00\u5f97\u5f88\u8db3\uff0c\u5439\u5728\u6211\u7684\u8138\u4e0a\uff0c\u8ba9\u6211\u8d77\u4e86\u4e00\u5c42\u9e21\u76ae\u7599\u7629\u3002\n\n\u4e00\u4e2a\u5973\u4eba\u6b63\u5750\u5728\u4f1a\u8bae\u684c\u7684\u4e3b\u4f4d\u4e0a\uff0c\u80cc\u5bf9\u7740\u6211\uff0c\u770b\u7740\u7a97\u5916\u7684\u57ce\u5e02\u666f\u8272\u3002\u5979\u7a7f\u7740\u4e00\u8eab\u526a\u88c1\u5f97\u4f53\u7684\u9ed1\u8272\u804c\u4e1a\u5957\u88d9\uff0c\u5934\u53d1\u4e00\u4e1d\u4e0d\u82df\u5730\u76d8\u5728\u8111\u540e\uff0c\u53ea\u9732\u51fa\u4e00\u622a\u767d\u7699\u4f46\u7d27\u7ef7\u7684\u540e\u9888\u3002\n\n\u5979\u6ca1\u6709\u56de\u5934\uff0c\u4f46\u6211\u77e5\u9053\uff0c\u5979\u5c31\u662f\u5f20\u59d0\u3002\n\n\u6211\u5173\u4e0a\u95e8\uff0c\u95e8\u5408\u4e0a\u7684\u77ac\u95f4\u53d1\u51fa\u6c89\u95f7\u7684\u201c\u5494\u201d\u7684\u4e00\u58f0\uff0c\u50cf\u662f\u7262\u7b3c\u7684\u9501\u88ab\u6263\u4e0a\u4e86\u3002\n\n\u5979\u4f3c\u4e4e\u542c\u5230\u4e86\u8fd9\u58f0\u54cd\uff0c\u8f6c\u52a8\u8eab\u4e0b\u7684\u6ed1\u8f6e\u6905\uff0c\u65e0\u58f0\u5730\u8f6c\u4e86\u8fc7\u6765\uff0c\u9762\u5bf9\u7740\u6211\u3002\n\n\u5979\u7684\u5e74\u7eaa\u770b\u8d77\u6765\u5927\u7ea6\u56db\u5341\u5c81\u5de6\u53f3\uff0c\u4fdd\u517b\u5f97\u5f88\u597d\uff0c\u8138\u4e0a\u753b\u7740\u7cbe\u81f4\u7684\u5986\u5bb9\uff0c\u4f46\u90a3\u5986\u5bb9\u4e5f\u63a9\u76d6\u4e0d\u4f4f\u5979\u773c\u89d2\u7684\u51cc\u5389\u548c\u7709\u5b87\u95f4\u7684\u75b2\u60eb\u3002\u5979\u7684\u773c\u795e\u5f88\u9510\u5229\uff0c\u50cf\u4e24\u628a\u624b\u672f\u5200\uff0c\u5728\u6211\u8eab\u4e0a\u6765\u56de\u626b\u89c6\uff0c\u4eff\u4f5b\u8981\u5c06\u6211\u4ece\u91cc\u5230\u5916\u5256\u5f00\u6765\u770b\u3002\n\n\u6211\u611f\u89c9\u81ea\u5df1\u7684\u624b\u5fc3\u53c8\u5f00\u59cb\u51fa\u6c57\u4e86\uff0c\u4e0b\u610f\u8bc6\u5730\u5728\u88e4\u5b50\u4e0a\u64e6\u4e86\u64e6\u3002\n\n\u6211\u8fd9\u8be5\u6b7b\u7684\u61e6\u5f31\u554a\u3002\n\n\u5979\u6ca1\u6709\u8bf4\u8bdd\uff0c\u53ea\u662f\u9759\u9759\u5730\u770b\u7740\u6211\uff0c\u90a3\u79cd\u5ba1\u89c6\u7684\u76ee\u5149\u8ba9\u6211\u611f\u89c9\u81ea\u5df1\u50cf\u4e00\u4e2a\u8d70\u9519\u4e86\u5730\u65b9\u7684\u3001\u8d64\u8eab\u88f8\u4f53\u7684\u5c0f\u4e11\u3002\n\n\u201c\u559d\u70b9\u4ec0\u4e48\uff1f\u5496\u5561\u8fd8\u662f\u6c34\uff1f\u201d\n\n\u5979\u7ec8\u4e8e\u5f00\u53e3\u4e86\uff0c\u58f0\u97f3\u548c\u6211\u9884\u60f3\u4e2d\u7684\u5486\u54ee\u5b8c\u5168\u4e0d\u540c\uff0c\u5e73\u9759\uff0c\u5ba2\u6c14\uff0c\u751a\u81f3\u53ef\u4ee5\u8bf4\u662f\u6e29\u548c\u3002\u4f46\u8fd9\u79cd\u6e29\u548c\uff0c\u6bd4\u5486\u54ee\u66f4\u8ba9\u6211\u611f\u5230\u5bd2\u51b7\u3002\n\n\u201c\u4e0d\u2026\u2026\u4e0d\u7528\u4e86\uff0c\u8c22\u8c22\u3002\u201d\u6211\u611f\u89c9\u81ea\u5df1\u7684\u820c\u5934\u6709\u70b9\u6253\u7ed3\u3002\n\n\u5979\u70b9\u70b9\u5934\uff0c\u4f3c\u4e4e\u5bf9\u6211\u7684\u53cd\u5e94\u6beb\u4e0d\u610f\u5916\u3002\u5979\u4f38\u624b\u6307\u4e86\u6307\u6211\u5bf9\u9762\u90a3\u628a\u6905\u5b50\u3002\n\n\u201c\u5750\u3002\u201d\n\n\u53ea\u6709\u4e00\u4e2a\u5b57\uff0c\u5374\u50cf\u4e00\u9053\u547d\u4ee4\u3002\n\n\u6211\u62c9\u5f00\u90a3\u628a\u51b0\u51b7\u7684\u91d1\u5c5e\u6905\u5b50\uff0c\u5750\u4e86\u4e0b\u6765\u3002\u5de8\u5927\u7684\u4f1a\u8bae\u684c\u5c06\u6211\u4eec\u9694\u5f00\uff0c\u6211\u611f\u89c9\u6211\u4eec\u4e4b\u95f4\u9694\u7740\u4e00\u6761\u65e0\u6cd5\u903e\u8d8a\u7684\u9e3f\u6c9f\u3002\n\n\u5979\u6ca1\u6709\u6025\u7740\u8fdb\u5165\u6b63\u9898\uff0c\u800c\u662f\u6162\u6761\u65af\u7406\u5730\u4ece\u624b\u8fb9\u62ff\u8d77\u4e00\u4e2a\u6587\u4ef6\u5939\uff0c\u6253\u5f00\u3002\n\n\u201c\u9646\u6c89\uff0c26\u5c81\uff0c\u6bd5\u4e1a\u4e8eA\u5927\u8ba1\u7b97\u673a\u7cfb\uff0c\u76ee\u524d\u5728\u4e00\u5bb6\u4e92\u8054\u7f51\u516c\u53f8\u5de5\u4f5c\uff0c\u6708\u85aa\u4e00\u4e07\u4e8c\uff0c\u65e0\u8f66\u8d37\uff0c\u65e0\u623f\u8d37\uff0c\u56e0\u4e3a\u4f60\u6839\u672c\u4e70\u4e0d\u8d77\u623f\u3002\u7236\u6bcd\u5728\u5916\u5730\uff0c\u662f\u666e\u901a\u5de5\u4eba\uff0c\u5bb6\u5883\u4e00\u822c\u3002\u6211\u8bf4\u7684\u5bf9\u5417\uff1f\u201d\n\n\u5979\u62ac\u8d77\u773c\u76ae\uff0c\u770b\u7740\u6211\uff0c\u50cf\u662f\u5728\u5ff5\u4e00\u4efd\u65e9\u5df2\u51c6\u5907\u597d\u7684\u5224\u51b3\u4e66\u3002\n\n\u6211\u7684\u5fc3\u4e00\u70b9\u70b9\u5730\u6c89\u4e86\u4e0b\u53bb\u3002\u5979\u4e0d\u4ec5\u77e5\u9053\u6211\u662f\u8c01\uff0c\u5979\u77e5\u9053\u6211\u7684\u4e00\u5207\u3002\n\n\u6211\u6ca1\u6709\u56de\u7b54\uff0c\u53ea\u662f\u6c89\u9ed8\u5730\u770b\u7740\u5979\u3002\n\n\u5979\u4f3c\u4e4e\u4e5f\u4e0d\u9700\u8981\u6211\u7684\u56de\u7b54\u3002\u5979\u5408\u4e0a\u6587\u4ef6\u5939\uff0c\u53cc\u624b\u4ea4\u53e0\u653e\u5728\u684c\u9762\u4e0a\uff0c\u8eab\u4f53\u5fae\u5fae\u524d\u503e\u3002\n\n\u201c\u6211\u4eca\u5929\u627e\u4f60\u6765\uff0c\u4e0d\u662f\u4e3a\u4e86\u8ffd\u7a76\u8c01\u7684\u8d23\u4efb\u3002\u4e8b\u60c5\u5df2\u7ecf\u53d1\u751f\u4e86\uff0c\u73b0\u5728\u6700\u91cd\u8981\u7684\u662f\uff0c\u5982\u4f55\u89e3\u51b3\u3002\u201d\n\n\u5979\u505c\u987f\u4e86\u4e00\u4e0b\uff0c\u76ee\u5149\u7d27\u7d27\u5730\u9501\u7740\u6211\u7684\u773c\u775b\u3002\n\n\u201c\u6240\u4ee5\uff0c\u5f00\u4e2a\u4ef7\u5427\u3002\u201d\n\n\u201c\u79bb\u5f00\u6797\u521d\u590f\uff0c\u4ece\u5979\u7684\u4e16\u754c\u91cc\u5f7b\u5e95\u6d88\u5931\u3002\u4f60\u60f3\u8981\u591a\u5c11\u94b1\uff1f\u201d\n\n\n\n25.\n\u201c\u94b1\uff1f\u201d\n\n\u6211\u611f\u89c9\u81ea\u5df1\u50cf\u662f\u542c\u5230\u4e86\u4e00\u4e2a\u7b11\u8bdd\u3002\u8fd9\u4e2a\u5b57\u4ece\u6211\u5634\u91cc\u8bf4\u51fa\u6765\uff0c\u5e26\u7740\u4e00\u80a1\u8fde\u6211\u81ea\u5df1\u90fd\u611f\u5230\u964c\u751f\u7684\u3001\u5e72\u5df4\u5df4\u7684\u5473\u9053\u3002\n\n\u4f1a\u8bae\u5ba4\u91cc\u5b89\u9759\u6781\u4e86\uff0c\u6211\u751a\u81f3\u80fd\u542c\u5230\u81ea\u5df1\u8840\u6db2\u5728\u8033\u8fb9\u5954\u6d41\u7684\u8f70\u9e23\u58f0\u3002\u7a7a\u8c03\u7684\u51b7\u98ce\u8fd8\u5728\u5439\uff0c\u5439\u5728\u6211\u7684\u540e\u9888\u4e0a\uff0c\u6fc0\u8d77\u4e00\u9635\u51c9\u610f\u3002\n\n\u6211\u770b\u7740\u5bf9\u9762\u90a3\u4e2a\u5973\u4eba\uff0c\u5979\u8138\u4e0a\u6302\u7740\u4e00\u79cd\u7a0b\u5f0f\u5316\u7684\u3001\u5c3d\u5728\u638c\u63e1\u7684\u8868\u60c5\uff0c\u4eff\u4f5b\u5979\u63d0\u51fa\u7684\u4e0d\u662f\u4e00\u4e2a\u5145\u6ee1\u4e86\u7f9e\u8fb1\u7684\u4ea4\u6613\uff0c\u800c\u662f\u4e00\u4efd\u7406\u6240\u5e94\u5f53\u7684\u5546\u4e1a\u5408\u540c\u3002\n\n\u5728\u5979\u7684\u4e16\u754c\u91cc\uff0c\u5927\u6982\u4e00\u5207\u90fd\u662f\u53ef\u4ee5\u660e\u7801\u6807\u4ef7\u7684\u3002\u611f\u60c5\uff0c\u5c0a\u4e25\uff0c\u4e00\u4e2a\u4eba\u7684\u4eba\u751f\u3002\n\n\u6211\u7684\u8111\u5b50\u91cc\u4e00\u77ac\u95f4\u95ea\u8fc7\u4e86\u5f88\u591a\u4e1c\u897f\u3002\u95ea\u8fc7\u4e86\u6797\u521d\u590f\u8db4\u5728\u6211\u8eab\u4e0a\u6492\u5a07\u7684\u6837\u5b50\uff0c\u95ea\u8fc7\u4e86\u6c5f\u96ea\u9ed8\u9ed8\u4e3a\u6211\u6362\u4e0a\u70ed\u6c34\u7684\u80cc\u5f71\uff0c\u95ea\u8fc7\u4e86\u6e29\u7476\u4e3a\u6211\u64e6\u6c57\u65f6\u6e29\u67d4\u7684\u6307\u5c16\uff0c\u4e5f\u95ea\u8fc7\u4e86\u9e7f\u7720\u5728\u6211\u6000\u91cc\u5bfb\u627e\u6e29\u6696\u65f6\u6beb\u65e0\u9632\u5907\u7684\u7761\u989c\u3002\n\n\u6211\u8fd8\u60f3\u5230\u4e86\u90a3\u4e2a\u51b0\u51b7\u7684\u3001\u7a7a\u65e0\u4e00\u4eba\u7684\u5ba2\u5385\uff0c\u548c\u6e29\u7476\u7559\u5728\u51b0\u7bb1\u4e0a\u90a3\u5f20\u201c\u5783\u573e\u8bb0\u5f97\u5012\u201d\u7684\u4fbf\u7b7e\u3002\n\n\u4e00\u80a1\u6df7\u
