c\u8f7b\u8f7b\u5730\u73af\u4f4f\u4e86\u6211\u7684\u8116\u5b50\u3002\n\n\u7136\u540e\uff0c\u5979\u5fae\u5fae\u8e2e\u8d77\u811a\u5c16\uff0c\u5728\u6211\u8033\u8fb9\uff0c\u7528\u4e00\u79cd\u53ea\u6709\u6211\u4eec\u4e24\u4e2a\u4eba\u80fd\u542c\u5230\u7684\u3001\u8f7b\u5f97\u50cf\u7fbd\u6bdb\u4e00\u6837\u7684\u58f0\u97f3\uff0c\u8bf4\u3002\n\n\u201c\u53ef\u4ee5\u3002\u201d\n\n\u201c\u4f46\u662f\u2026\u2026\u201d\n\n\u201c\u4f60\u5f97\u95ed\u4e0a\u773c\u775b\u3002\u201d\n\n\u4e0b\u4e00\u79d2\uff0c\u4e00\u7247\u67d4\u8f6f\u7684\u3001\u6e29\u70ed\u7684\u89e6\u611f\uff0c\u5c31\u8f7b\u8f7b\u5730\u843d\u5728\u4e86\u6211\u7684\u5634\u5507\u4e0a\u3002\n\n\u50cf\u4e00\u7247\u82b1\u74e3\uff0c\u5e26\u7740\u4e00\u4e1d\u6e05\u751c\u7684\u3001\u9752\u82f9\u679c\u5473\u786c\u7cd6\u7684\u9999\u6c14\u3002\n\n\u7d27\u63a5\u7740\uff0c\u7b2c\u4e8c\u7247\u3001\u7b2c\u4e09\u7247\u3001\u7b2c\u56db\u7247\u2026\u2026\n\n\u6211\u611f\u89c9\u81ea\u5df1\u50cf\u662f\u88ab\u4e16\u754c\u4e0a\u6700\u67d4\u8f6f\u3001\u6700\u6e29\u6696\u7684\u6f6e\u6c34\u5f7b\u5e95\u6df9\u6ca1\u4e86\u3002\u5979\u4eec\u7684\u543b\uff0c\u50cf\u96e8\u70b9\u4e00\u6837\uff0c\u5bc6\u96c6\u5730\u3001\u6beb\u65e0\u7ae0\u6cd5\u5730\u843d\u5728\u4e86\u6211\u7684\u989d\u5934\uff0c\u6211\u7684\u8138\u988a\uff0c\u6211\u7684\u8116\u9888\u2026\u2026\n\n\u6797\u521d\u590f\u7684\u543b\uff0c\u5e26\u7740\u4e00\u4e1d\u6025\u5207\u548c\u9738\u9053\uff0c\u50cf\u662f\u5728\u5ba3\u793a\u4e3b\u6743\u3002\u6c5f\u96ea\u7684\u543b\uff0c\u51b0\u51c9\u800c\u7b28\u62d9\uff0c\u50cf\u662f\u5728\u8bd5\u63a2\u3002\u9e7f\u7720\u7684\u543b\uff0c\u5219\u50cf\u5c0f\u9e21\u5544\u7c73\u4e00\u6837\uff0c\u597d\u5947\u800c\u7eaf\u7cb9\u3002\n\n\u800c\u6e29\u7476\u7684\u543b\uff0c\u59cb\u7ec8\u505c\u7559\u5728\u6211\u7684\u5507\u4e0a\uff0c\u6e29\u67d4\u5730\u3001\u8010\u5fc3\u5730\uff0c\u5f15\u5bfc\u7740\u6211\uff0c\u64ac\u5f00\u6211\u6240\u6709\u7684\u9632\u7ebf\uff0c\u5c06\u5979\u6240\u6709\u7684\u3001\u538b\u6291\u4e86\u8bb8\u4e45\u7684\u6b32\u671b\u548c\u7231\u610f\uff0c\u4e00\u70b9\u4e00\u70b9\u5730\uff0c\u6e21\u4e86\u8fc7\u6765\u3002\n\n\u6211\u95ed\u7740\u773c\u775b\uff0c\u4efb\u7531\u5979\u4eec\u5728\u6211\u8eab\u4e0a\u63a2\u7d22\u3001\u70b9\u706b\u3002\n\n\u6211\u611f\u89c9\u81ea\u5df1\u50cf\u4e00\u8258\u5728\u9ed1\u6697\u7684\u3001\u51b0\u51b7\u7684\u6d77\u9762\u4e0a\u6f02\u6cca\u4e86\u592a\u4e45\u7684\u5b64\u821f\uff0c\u7ec8\u4e8e\u5728\u8fd9\u4e00\u523b\uff0c\u627e\u5230\u4e86\u53ef\u4ee5\u505c\u9760\u7684\u3001\u6e29\u6696\u7684\u6e2f\u6e7e\u3002\n\n\u8fd9\u91cc\uff0c\u6709\u56db\u5ea7\u4e3a\u6211\u800c\u4eae\u7684\u3001\u6c38\u4e0d\u7184\u706d\u7684\u706f\u5854\u3002\n\n\n\n59.\n\u6211\u7684\u8111\u6d77\u4e2d\uff0c\u6240\u6709\u7eb7\u4e71\u7684\u601d\u7eea\u90fd\u6c89\u6dc0\u4e86\u4e0b\u53bb\uff0c\u53ea\u5269\u4e0b\u773c\u524d\u8fd9\u56db\u5177\u5728\u70db\u5149\u4e0b\u5fae\u5fae\u98a4\u6296\u7684\u3001\u6563\u53d1\u7740\u5723\u6d01\u5149\u8f89\u7684\u8eab\u4f53\u3002\n\n\u5979\u4eec\u662f\u6211\u7684\u4e86\u3002\n\n\u8fd9\u4e2a\u8ba4\u77e5\uff0c\u50cf\u4e00\u9053\u6e29\u6696\u7684\u3001\u8fdf\u6765\u7684\u95ea\u7535\uff0c\u5288\u5f00\u4e86\u6211\u5fc3\u4e2d\u6240\u6709\u56e0\u4e3a\u81ea\u5351\u548c\u61e6\u5f31\u800c\u4ea7\u751f\u7684\u9634\u973e\u3002\n\n\u6211\u770b\u7740\u5979\u4eec\uff0c\u770b\u7740\u5979\u4eec\u8138\u4e0a\u90a3\u6df7\u5408\u7740\u7f9e\u6da9\u3001\u671f\u5f85\u548c\u4e00\u4e1d\u4e0d\u5b89\u7684\u8868\u60c5\uff0c\u6211\u5ffd\u7136\u610f\u8bc6\u5230\uff0c\u73b0\u5728\uff0c\u8be5\u8f6e\u5230\u6211\u4e86\u3002\n\n\u8be5\u8f6e\u5230\u6211\uff0c\u6765\u56de\u5e94\u8fd9\u4efd\u6c89\u91cd\u5230\u8db3\u4ee5\u538b\u57ae\u6211\u7684\u7231\u610f\u4e86\u3002\n\n\u6211\u677e\u5f00\u4e86\u5979\u4eec\u7684\u624b\uff0c\u7136\u540e\uff0c\u5728\u5979\u4eec\u4e0d\u89e3\u7684\u76ee\u5149\u4e2d\uff0c\u6211\u7f13\u7f13\u5730\u8e72\u4e0b\u4e86\u8eab\u3002\n\n\u6211\u6ca1\u6709\u518d\u8dea\u4e0b\u3002\n\n\u6211\u53ea\u662f\u8e72\u4e0b\u8eab\uff0c\u4f38\u51fa\u624b\uff0c\u6309\u4e0b\u811a\u8fb9\u7684\u67d0\u4e2a\u5f00\u5173\uff0c\u5c06\u5730\u4e0a\u90a3\u4e9b\u6563\u843d\u7684\u3001\u6447\u66f3\u7684\u7535\u5b50\u8721\u70db\uff0c\u4e00\u6839\u4e00\u6839\u5730\u7184\u706d\u3002\n\n\u6bcf\u7184\u706d\u4e00\u6839\uff0c\u623f\u95f4\u91cc\u7684\u5149\u7ebf\u5c31\u6697\u6de1\u4e00\u5206\u3002\n\n\u5f53\u6700\u540e\u4e00\u6839\u8721\u70db\u7684\u5149\u8292\u6d88\u5931\u65f6\uff0c\u6574\u4e2a\u5ba2\u5385\uff0c\u5f7b\u5e95\u9677\u5165\u4e86\u7edd\u5bf9\u7684\u3001\u53ea\u5269\u4e0b\u7a97\u5916\u57ce\u5e02\u9065\u8fdc\u706f\u706b\u7684\u660f\u6697\u4e4b\u4e2d\u3002\n\n\u5979\u4eec\u7684\u8eab\u4f53\u8f6e\u5ed3\uff0c\u5728\u9ed1\u6697\u4e2d\u53d8\u5f97\u6a21\u7cca\uff0c\u53ea\u5269\u4e0b\u767d\u7699\u7684\u808c\u80a4\u53cd\u5c04\u7740\u7a97\u5916\u5fae\u5f31\u7684\u5149\uff0c\u50cf\u56db\u5c0a\u6c89\u9ed8\u7684\u3001\u7b49\u5f85\u7740\u88ab\u5524\u9192\u7684\u7389\u96d5\u3002\n\n\u9ed1\u6697\uff0c\u603b\u662f\u80fd\u6ecb\u751f\u51fa\u6bd4\u5149\u660e\u66f4\u8bda\u5b9e\u7684\u52c7\u6c14\u3002\n\n\u6211\u7ad9\u8d77\u8eab\uff0c\u5230\u4e00\u8fb9\u8131\u6389\u4e86\u81ea\u5df1\u7684\u8863\u670d\uff0c\u7136\u540e\u8d70\u5230\u5979\u4eec\u9762\u524d\u3002\n\n\u6211\u6ca1\u6709\u8bf4\u8bdd\uff0c\u53ea\u662f\u4f38\u51fa\u624b\uff0c\u7528\u6307\u5c16\uff0c\u8f7b\u8f7b\u5730\u78b0\u4e86\u78b0\u6797\u521d\u590f\u90a3\u56e0\u4e3a\u7d27\u5f20\u800c\u5fae\u5fae\u98a4\u6296\u7684\u80a9\u8180\u3002\u5979\u7684\u76ae\u80a4\u5f88\u70eb\uff0c\u50cf\u4e00\u5757\u88ab\u592a\u9633\u6652\u8fc7\u7684\u77f3\u5934\u3002\u5979\u731b\u5730\u4e00\u98a4\uff0c\u4f46\u6ca1\u6709\u8eb2\u5f00\u3002\n\n\u6211\u7684\u624b\uff0c\u987a\u7740\u5979\u5706\u6da6\u7684\u80a9\u8180\uff0c\u7f13\u7f13\u5730\u6ed1\u4e0b\u3002\u6ed1\u8fc7\u5979\u7cbe\u81f4\u7684\u9501\u9aa8\uff0c\u6ed1\u8fc7\u5979\u80f8\u524d\u90a3\u4e24\u9897\u56e0\u4e3a\u7d27\u5f20\u800c\u633a\u7acb\u8d77\u6765\u7684\u3001\u5c0f\u5c0f\u7684\u84d3\u857e\u3002\u6211\u80fd\u6e05\u6670\u5730\u611f\u89c9\u5230\uff0c\u6211\u7684\u6307\u5c16\u6240\u5230\u4e4b\u5904\uff0c\u5979\u7684\u76ae\u80a4\u4e0a\uff0c\u90fd\u8fc5\u901f\u5730\u8d77\u4e86\u4e00\u5c42\u7ec6\u5bc6\u7684\u3001\u6218\u6817\u7684\u9e21\u76ae\u7599\u7629\u3002\n\n\u6211\u4fef\u4e0b\u8eab\uff0c\u5634\u5507\u8d34\u7740\u5979\u7684\u8033\u5ed3\uff0c\u7528\u4e00\u79cd\u6211\u81ea\u5df1\u90fd\u611f\u5230\u964c\u751f\u7684\u3001\u6c99\u54d1\u7684\u55d3\u97f3\uff0c\u8f7b\u58f0\u8bf4\u3002\n\n\u201c\u4f60\u597d\u9999\u3002\u201d\n\n\u6211\u7684\u624b\uff0c\u7ee7\u7eed\u5411\u4e0b\uff0c\u6ed1\u8fc7\u5979\u5e73\u5766\u7684\u3001\u56e0\u4e3a\u5c4f\u4f4f\u547c\u5438\u800c\u7ef7\u7d27\u7684\u5c0f\u8179\u3002\u6700\u540e\uff0c\u505c\u5728\u4e86\u5979\u53cc\u817f\u4e4b\u95f4\uff0c\u90a3\u7247\u88ab\u7cbe\u5fc3\u4fee\u526a\u8fc7\u7684\u3001\u67d4\u8f6f\u7684\u795e\u79d8\u5730\u5e26\u3002\n\n\u6211\u80fd\u611f\u89c9\u5230\u5979\u6574\u4e2a\u4eba\u90fd\u5728\u6211\u7684\u638c\u5fc3\u4e0b\uff0c\u5267\u70c8\u5730\u98a4\u6296\u8d77\u6765\u3002\n\n\u201c\u9646\u2026\u2026\u6c89\u2026\u2026\u201d\u5979\u4ece\u7259\u7f1d\u91cc\u6324\u51fa\u6211\u7684\u540d\u5b57\uff0c\u58f0\u97f3\u91cc\u5e26\u7740\u54ed\u8154\u3002\n\n\u6211\u6ca1\u6709\u7406\u4f1a\u5979\u7684\u54c0\u6c42\u3002\u6211\u7684\u624b\u6307\uff0c\u5e26\u7740\u4e00\u4e1d\u4e0d\u5bb9\u7f6e\u7591\u7684\u529b\u5ea6\uff0c\u8f7b\u8f7b\u5730\u5206\u5f00\u4e86\u5979\uff0c\u7136\u540e\uff0c\u51c6\u786e\u5730\u627e\u5230\u4e86\u90a3\u9897\u5df2\u7ecf\u56e0\u4e3a\u60c5\u52a8\u800c\u53d8\u5f97\u6e7f\u6da6\u3001\u80bf\u80c0\u7684\u5c0f\u5c0f\u7684\u9634\u8482\u3002\n\n\u6211\u5f00\u59cb\u4e0d\u8f7b\u4e0d\u91cd\u5730\uff0c\u7f13\u7f13\u5730\uff0c\u63c9\u6413\u7740\u3002\n\n\u201c\u55ef\u2026\u2026\u201d\n\n\u5979\u518d\u4e5f\u65e0\u6cd5\u6291\u5236\uff0c\u53d1\u51fa\u4e00\u58f0\u7ec6\u788e\u7684\u3001\u50cf\u5c0f\u732b\u4e00\u6837\u65e0\u52a9\u7684\u547b\u541f\u3002\u5979\u7684\u53cc\u817f\u4e00\u8f6f\uff0c\u6574\u4e2a\u4eba\u90fd\u5411\u6211\u5012\u4e86\u8fc7\u6765\uff0c\u88ab\u6211\u987a\u52bf\u63fd\u8fdb\u4e86\u6000\u91cc\u3002\n\n\u6211\u62b1\u7740\u5979\u762b\u8f6f\u7684\u8eab\u4f53\uff0c\u76ee\u5149\u5374\u8d8a\u8fc7\u5979\u7684\u80a9\u8180\uff0c\u770b\u5411\u4e86\u7ad9\u5728\u5979\u8eab\u540e\u7684\u6c5f\u96ea\u3002\n\n\u6c5f\u96ea\u4f9d\u65e7\u7ad9\u5728\u90a3\u91cc\uff0c\u4e00\u52a8\u4e0d\u52a8\u3002\u4f46\u5728\u660f\u6697\u7684\u5149\u7ebf\u4e0b\uff0c\u6211\u80fd\u6e05\u6670\u5730\u770b\u5230\uff0c\u5979\u90a3\u53cc\u603b\u662f\u51b0\u51b7\u7684\u773c\u775b\u91cc\uff0c\u6b64\u523b\u6b63\u71c3\u70e7\u7740\u4e24\u7c07\u5e7d\u6697\u7684\u3001\u77db\u76fe\u7684\u706b\u7130\u3002\u4e00\u534a\u662f\u6050\u60e7\uff0c\u4e00\u534a\u662f\u2026\u2026\u671f\u5f85\u3002\n\n\u800c\u5979\u7684\u53cc\u817f\uff0c\u4e0d\u77e5\u4ec0\u4e48\u65f6\u5019\uff0c\u5df2\u7ecf\u5e76\u5f97\u7d27\u7d27\u7684\uff0c\u8eab\u4f53\u5728\u5fae\u5fae\u5730\u3001\u51e0\u4e4e\u770b\u4e0d\u89c1\u5730\u98a4\u6296\u7740\u3002\n\n\u6211\u7a7a\u4e0b\u6765\u7684\u53e6\u4e00\u53ea\u624b\uff0c\u4f38\u5411\u4e86\u5979\u3002\n\n\u6211\u7684\u624b\u6307\uff0c\u5e26\u7740\u6797\u521d\u590f\u8eab\u4e0a\u6cbe\u67d3\u7684\u3001\u6e7f\u6ed1\u7684\u871c\u6db2\uff0c\u76f4\u63a5\u63a2\u8fdb\u4e86\u5979\u7d27\u95ed\u7684\u817f\u95f4\u3002\n\n\u548c\u6797\u521d\u590f\u7684\u53cd\u5e94\u4e0d\u540c\uff0c\u6c5f\u96ea\u7684\u8eab\u4f53\u5728\u63a5\u89e6\u5230\u6211\u624b\u6307\u7684\u77ac\u95f4\uff0c\u731b\u5730\u4e00\u50f5\uff0c\u50cf\u4e00\u5757\u88ab\u77ac\u95f4\u51bb\u4f4f\u7684\u51b0\u3002\u4f46\u90a3\u51b0\u9762\u4e4b\u4e0b\uff0c\u6211\u5374\u80fd\u6e05\u6670\u5730\u611f\u89c9\u5230\uff0c\u4e00\u80a1\u6eda\u70eb\u7684\u3001\u538b\u6291\u4e86\u8bb8\u4e45\u7684\u5ca9\u6d46\uff0c\u6b63\u5728\u75af\u72c2\u5730\u5954\u6d8c\u3002\n\n\u5979\u7684\u9634\u9053\u53e3\uff0c\u5e72\u6da9\u800c\u7d27\u81f4\uff0c\u50cf\u662f\u5728\u6297\u62d2\uff0c\u53c8\u50cf\u662f\u5728\u9080\u8bf7\u3002\n\n\u800c\u7ad9\u5728\u53e6\u4e00\u8fb9\u7684\u6e29\u7476\uff0c\u5979\u6ca1\u6709\u770b\u6211\uff0c\u4e5f\u6ca1\u6709\u770b\u6211\u6000\u91cc\u7684\u6797\u521d\u590f\u548c\u6b63\u5728\u88ab\u6211\u63a2\u7d22\u7684\u6c5f\u96ea\u3002\u5979\u53ea\u662f\u5fae\u5fae\u4f4e\u7740\u5934\uff0c\u4e00\u53ea\u624b\uff0c\u4e0d\u77e5\u4ec0\u4e48\u65f6\u5019\uff0c\u5df2\u7ecf\u6084\u6084\u5730\u4f38\u5230\u4e86\u81ea\u5df1\u7684\u817f\u95f4\u3002\n\n\u5979\u7684\u547c\u5438\uff0c\u53d8\u5f97\u6709\u4e9b\u6025\u4fc3\u3002\n\n\n\n60.\n\u6211\u62b1\u7740\u6000\u91cc\u5df2\u7ecf\u762b\u8f6f\u5982\u6c34\u7684\u6797\u521d\u590f\uff0c\u611f\u53d7\u7740\u5979\u7ec6\u788e\u7684\u3001\u538b\u6291\u4e0d\u4f4f\u7684\u547b\u541f\u548c\u8eab\u4f53\u4e0d\u53d7\u63a7\u5236\u7684\u98a4\u6296\u3002\u53e6\u4e00\u53ea\u624b\uff0c\u5219\u5728\u6c5f\u96ea\u90a3\u7d27\u81f4\u3001\u6297\u62d2\u7684\u817f\u95f4\uff0c\u7f13\u7f13\u5730\u6df1\u5165\u3002\n\n\u6c5f\u96ea\u7684\u8eab\u4f53\u7ef7\u5f97\u50cf\u4e00\u5757\u94c1\uff0c\u5979\u6b7b\u6b7b\u5730\u54ac\u7740\u81ea\u5df1\u7684\u4e0b\u5507\uff0c\u4e0d\u8ba9\u81ea\u5df1\u53d1\u51fa\u4e00\u4e1d\u58f0\u97f3\u3002\u4f46\u5728\u660f\u6697\u7684\u5149\u7ebf\u4e0b\uff0c\u6211\u80fd\u6e05\u6670\u5730\u770b\u5230\uff0c\u5979\u7684\u5c0f\u8179\u5728\u5267\u70c8\u5730\u8d77\u4f0f\uff0c\u4e00\u80a1\u80a1\u900f\u660e\u7684\u3001\u6e7f\u6ed1\u7684\u7231\u6db2\uff0c\u6b63\u4e0d\u53d7\u63a7\u5236\u5730\u4ece\u88ab\u6211\u624b\u6307\u6491\u5f00\u7684\u9634\u9053\u53e3\u6d8c\u51fa\uff0c\u6cbe\u6ee1\u4e86\u6211\u7684\u624b\u638c\u3002\n\n\u5979\u4e5f\u5728\u6e34\u671b\u3002\n\n\u5c31\u5728\u8fd9\u65f6\uff0c\u4e00\u76f4\u7ad9\u5728\u65c1\u8fb9\u81ea\u6211\u629a\u6170\u7684\u6e29\u7476\uff0c\u5ffd\u7136\u52a8\u4e86\u3002\n\n\u5979\u7f13\u7f13\u5730\u5411\u6211\u8d70\u6765\uff0c\u90a3\u53cc\u603b\u662f\u6e29\u67d4\u5982\u6c34\u7684\u773c\u775b\u91cc\uff0c\u6b64\u523b\u71c3\u70e7\u7740\u4e24\u7c07\u5e7d\u6697\u7684\u3001\u4e0d\u987e\u4e00\u5207\u7684\u706b\u7130\u3002\u5979\u8d70\u5230\u6211\u7684\u9762\u524d\uff0c\u7136\u540e\uff0c\u5728\u6211\u548c\u6c5f\u96ea\u9519\u6115\u7684\u76ee\u5149\u4e2d\uff0c\u5979\u7f13\u7f13\u5730\u8dea\u4e86\u4e0b\u6765\u3002\n\n\u5979\u8dea\u5728\u4e86\u6211\u548c\u6c5f\u96ea\u7684\u9762\u524d\u3002\n\n\u5979\u62ac\u8d77\u5934\uff0c\u4ef0\u89c6\u7740\u6211\uff0c\u773c\u795e\u91cc\u662f\u6beb\u4e0d\u63a9\u9970\u7684\u3001\u8d64\u88f8\u88f8\u7684\u7948\u6c42\u548c\u6b32\u671b\u3002\u5979\u7684\u624b\uff0c\u4f9d\u65e7\u653e\u5728\u81ea\u5df1\u7684\u817f\u95f4\uff0c\u624b\u6307\u5728\u6e7f\u6da6\u7684\u9634\u8482\u4e0a\u5feb\u901f\u5730\u63c9\u6413\u7740\uff0c\u53d1\u51fa\u7ec6\u5fae\u7684\u3001\u9ecf\u817b\u7684\u6c34\u58f0\u3002\n\n\u201c\u9646\u6c89\u2026\u2026\u201d\n\n\u5979\u5f00\u53e3\u4e86\uff0c\u58f0\u97f3\u6c99\u54d1\u5f97\u50cf\u88ab\u706b\u70e7\u8fc7\u3002\n\n\u201c\u6c42\u4f60\u2026\u2026\u50cf\u4e4b\u524d\u6211\u8bf4\u7684\u90a3\u6837\u2026\u2026\u64cd\u6211\u2026\u2026\u201d\n\n\u201c\u50cf\u64cd\u4e00\u4e2a\u53ea\u61c2\u5f97\u5f20\u5f00\u817f\u7684\u2026\u2026\u6bcd\u72d7\u4e00\u6837\u2026\u2026\u201d\n\n\u8fd9\u53e5\u8bdd\uff0c\u50cf\u4e00\u9053\u60ca\u96f7\uff0c\u5728\u6211\uff0c\u5728\u6797\u521d\u590f\uff0c\u5728\u6c5f\u96ea\u7684\u8111\u6d77\u4e2d\u540c\u65f6\u70b8\u54cd\u3002\n\n\u6211\u770b\u7740\u5979\uff0c\u770b\u7740\u8fd9\u4e2a\u603b\u662f\u77e5\u6027\u3001\u6e29\u67d4\u7684\u5927\u59d0\u59d0\uff0c\u6b64\u523b\u5374\u8dea\u5728\u6211\u7684\u9762\u524d\uff0c\u7528\u6700\u5351\u5fae\u7684\u59ff\u6001\uff0c\u8bf4\u7740\u6700\u6deb\u8361\u7684\u8bdd\u8bed\u3002\u6211\u611f\u89c9\u81ea\u5df1\u8eab\u4f53\u91cc\u90a3\u5934\u88ab\u56da\u7981\u4e86\u4e8c\u5341\u591a\u5e74\u7684\u3001\u540d\u4e3a\u201c\u6b32\u671b\u201d\u7684\u91ce\u517d\uff0c\u5f7b\u5e95\u6323\u8131\u4e86\u7262\u7b3c\u3002\n\n\u6211\u677e\u5f00\u4e86\u6000\u91cc\u7684\u6797\u521d\u590f\uff0c\u4e5f\u62bd\u51fa\u4e86\u5728\u6c5f\u96ea\u4f53\u5185\u63a2\u7d22\u7684\u624b\u6307\u3002\n\n\u6211\u8d70\u5230\u6e29\u7476\u9762\u524d\uff0c\u5c45\u9ad8\u4e34\u4e0b\u5730\u770b\u7740\u5979\uff0c\u5634\u89d2\u6e10\u6e10\u9732\u51fa\u7b11\u610f\u3002\n\n\u4eca\u665a\uff0c\u4e0d\u53ea\u662f\u4f60\uff0c\u4f60\u4eec\u56db\u4e2a\uff0c\u4e00\u4e2a\u90fd\u8dd1\u4e0d\u6389\uff01\n\n\u6211\u53cc\u624b\u6293\u4f4f\u5979\u7684\u8111\u888b\uff0c\u5bf9\u51c6\u89d2\u5ea6\uff0c\u7136\u540e\u7528\u529b\u7684\u5f80\u524d\uff0c\u5c06\u6211\u65e9\u5df2\u633a\u7acb\u7684\u9634\u830e\uff0c\u5411\u7740\u5979\u7684\u5634\u5df4\u9001\u4e86\u8fdb\u53bb\u3002\n\n\u8fd9\u4e00\u665a\u5f88\u6f2b\u957f\uff0c\u4e5f\u5f88\u77ed\u6682\uff0c\u6211\u4eec\u4e00\u7537\u56db\u5973\u5728\u8fd9\u9690\u79d8\u7684\u7a7a\u95f4\uff0c\u4e00\u76f4\u4ee5\u6765\u88ab\u6211\u4eec\u5f53\u4f5c\u5bb6\u7684\u5730\u65b9\uff0c\u5c3d\u60c5\u7684\u91ca\u653e\u7740\u6240\u6709\u7684\u6b32\u671b\u3002\n\n\u63a5\u4e0b\u6765\u7684\u4e00\u5207\uff0c\u90fd\u50cf\u662f\u5931\u63a7\u7684\u7535\u5f71\u3002\n\n\u6211\u5fd8\u4e86\u65f6\u95f4\uff0c\u4e5f\u5fd8\u4e86\u81ea\u5df1\u662f\u8c01\u3002\u6211\u53ea\u77e5\u9053\u7d22\u53d6\uff0c\u5360\u6709\uff0c\u586b\u6ee1\u3002\n\n\u5979\u4eec\u4ee5\u524d\u90fd\u6ca1\u6709\u8fc7\u8fd9\u65b9\u9762\u7684\u7ecf\u9a8c\uff0c\u800c\u6211\u4e5f\u6ca1\u6709\uff0c\u56e0\u6b64\u6211\u53ea\u80fd\u4f9d\u7167\u4ece\u7f51\u7ad9\u4e0a\u5b66\u6765\u7684\u5404\u79cd\u77e5\u8bc6\uff0c\u4e0d\u65ad\u5f15\u5bfc\u7740\u4f17\u5973\u7684\u52a8\u4f5c\u3002\n\n\u6211\u8fdb\u5165\u4e86\u6797\u521d\u590f\u5e74\u8f7b\u800c\u5145\u6ee1\u6d3b\u529b\u7684\u8eab\u4f53\uff0c\u5728\u5979\u90a3\u5e26\u7740\u4e00\u80a1\u4e0d\u670d\u8f93\u7684\u5014\u5f3a\u52b2\u513f\u7684\u3001\u7d27\u81f4\u7684\u752c\u9053\u91cc\u51b2\u649e\u3002\u6211\u8fdb\u5165\u4e86\u6c5f\u96ea\u90a3\u770b\u4f3c\u51b0\u51b7\uff0c\u5b9e\u5219\u654f\u611f\u5230\u6781\u81f4\u7684\u3001\u6bcf\u4e00\u6b21\u88ab\u9876\u5230\u6df1\u5904\u90fd\u4f1a\u5267\u70c8\u75c9\u631b\u7684\u8eab\u4f53\u3002\u6211\u4e00\u6b21\u53c8\u4e00\u6b21\u5730\uff0c\u7528\u6700\u7c97\u66b4\u7684\u65b9\u5f0f\uff0c\u6ee1\u8db3\u4e86\u6e29\u7476\u90a3\u8bf4\u4e0d\u51fa\u53e3\u7684\u3001\u5351\u5fae\u7684\u6e34\u6c42\uff0c\u770b\u5979\u5728\u6781\u81f4\u7684\u75db\u82e6\u548c\u5feb\u611f\u4e2d\uff0c\u54ed\u558a\u7740\uff0c\u55b7\u6d8c\u7740\uff0c\u5f7b\u5e95\u574f\u6389\u3002\n\n\u6700\u540e\uff0c\u6211\u5728\u9e7f\u7720\u90a3\u53cc\u61f5\u61c2\u53c8\u597d\u5947\u7684\u773c\u775b\u6ce8\u89c6\u4e0b\uff0c\u8fdb\u5165\u4e86\u5979\u90a3\u7247\u6700\u7eaf\u6d01\u3001\u6700\u7a1a\u5ae9\u7684\u3001\u4ece\u672a\u6709\u4eba\u63a2\u7d22\u8fc7\u7684\u5904\u5973\u5730\u3002\n\n\u5f53\u90a3\u5c42\u8584\u8584\u7684\u3001\u8c61\u5f81\u7740\u4ec0\u4e48\u7684\u8584\u819c\uff0c\u88ab\u6211\u575a\u786c\u7684\u6b32\u671b\u6495\u88c2\u65f6\uff0c\u5979\u75bc\u5f97\u54ed\u4e86\u51fa\u6765\u3002\u4f46\u90a3\u54ed\u58f0\u5f88\u5feb\u5c31\u53d8\u6210\u4e86\u7ec6\u788e\u7684\u3001\u5e26\u7740\u65b0\u5947\u7684\u547b\u541f\u3002\n\n\u201c\u9646\u6c89\u2026\u2026\u91cc\u9762\u2026\u2026\u597d\u5947\u602a\u2026\u2026\u201d\n\n\u201c\u70ed\u70ed\u7684\u2026\u2026\u6da8\u6da8\u7684\u2026\u2026\u201d\n\n\u6211\u62b1\u7740\u5979\uff0c\u5728\u5979\u8033\u8fb9\uff0c\u7528\u6700\u6e29\u67d4\u7684\u58f0\u97f3\uff0c\u56de\u7b54\u5979\u3002\n\n\u201c\u4ee5\u540e\uff0c\u4f60\u4f1a\u4e60\u60ef\u7684\u3002\u201d\n\n\u521d\u6b21\u63d2\u5165\u7684\u75bc\u75db\uff0c\u6e10\u6e10\u8f6c\u53d8\u5230\u5fae\u5999\u7684\u5feb\u611f\uff0c\u518d\u5230\u5f7b\u5e95\u7684\u4eab\u53d7\u3002\n\n\u4ee5\u4e00\u654c\u56db\uff0c\u6211\u4e5f\u514d\u4e0d\u4e86\u7684\u6709\u4e9b\u624b\u5fd9\u811a\u4e71\uff0c\u4f46\u597d\u5728\u4e0d\u7ba1\u662f\u6797\u521d\u590f\uff0c\u6c5f\u96ea\u8fd8\u662f\u6e29\u7476\uff0c\u90fd\u8db3\u591f\u6e29\u67d4\uff0c\u4e5f\u8db3\u591f\u6709\u8010\u5fc3\u3002\n\n\u4e00\u80a1\u6df7\u5408\u4e86\u7cbe\u6db2\uff0c\u6deb\u6c34\uff0c\u4f53\u9999\u7684\u6deb\u9761\u5473\u9053\u5728\u6574\u4e2a\u5ba2\u5385\u53d1\u9175\uff0c\u4e0e\u4e4b\u4e92\u76f8\u547c\u5e94\u7684\u5219\u662f\u5728\u6211\u7684\u731b\u70c8\u653b\u52bf\u4e0b\u4e00\u6d6a\u9ad8\u8fc7\u4e00\u6d6a\u7684\u6d6a\u53eb\u58f0\u3002\n\n\u7ec8\u4e8e\uff0c\u4e5f\u4e0d\u77e5\u9053\u8fc7\u4e86\u591a\u4e45\uff0c\u6211\u7684\u6b32\u706b\u71c3\u5c3d\u4e86\u3002\n\n\u6211\u5598\u7740\u7c97\u6c14\uff0c\u8d64\u8eab\u88f8\u4f53\u7ad9\u5728\u5ba2\u5385\u4e2d\u592e\uff0c\u9634\u830e\u4f9d\u65e7\u633a\u76f4\uff0c\u73af\u987e\u56db\u5468\uff0c\u5de1\u89c6\u7740\u6211\u7684\u9886\u571f\u4ee5\u53ca\u5c5e\u4e8e\u6211\u7684\u5973\u4eba\u4eec\u3002\n\n\u5730\u677f\u4e0a\u904d\u5e03\u6deb\u6c34\uff0c\u6c99\u53d1\u4e0a\uff0c\u684c\u5b50\u4e0a\u4e5f\u5168\u90fd\u662f\u6211\u4eec\u6218\u6597\u7684\u75d5\u8ff9\u3002\n\n\u8fd8\u80fd\u9690\u9690\u7ea6\u7ea6\u770b\u5230\u6709\u4e9b\u8bb8\u7684\u4e0d\u660e\u663e\u8840\u8ff9\u6df7\u5728\u5176\u4e2d\u3002\n\n\u8fd9\u662f\u6211\u7684\u52cb\u7ae0\u3002\n\n\u5468\u8fb9\u7684\u6c99\u53d1\u4e0a\uff0c\u5730\u677f\u4e0a\uff0c\u684c\u5b50\u4e0a\uff0c\u6216\u8db4\u6216\u8eba\uff0c\u6216\u662f\u7fd8\u7740\u5c41\u80a1\uff0c\u6216\u662f\u5f20\u5f00\u53cc\u817f\uff0c\u56db\u4f4d\u8d64\u8eab\u88f8\u4f53\uff0c\u6ee1\u8138\u7ea2\u6655\u7684\u5973\u4eba\u5df2\u7ecf\u662f\u7cbe\u75b2\u529b\u5c3d\uff0c\u4e0d\u65ad\u5598\u606f\u7740\uff0c\u4eff\u4f5b\u88ab\u62bd\u5e72\u4e86\u6240\u6709\u529b\u6c14\u4e00\u822c\u3002\n\n\u5979\u4eec\u90fd\u5728\u770b\u6211\uff0c\u773c\u795e\u4e2d\u9676\u9189\u4e4b\u4f59\uff0c\u4e5f\u591a\u4e86\u4e9b\u4ee5\u524d\u4ece\u672a\u6709\u8fc7\u7684\u4e1c\u897f\u3002\n\n\u4e4f\u529b\u611f\uff0c\u865a\u5f31\u611f\u6d8c\u4e0a\u5fc3\u5934\uff0c\u5728\u6ee1\u8db3\u4e4b\u4f59\uff0c\u6211\u7adf\u662f\u4e0d\u7531\u5f97\u82e6\u7b11\u4e86\u4e00\u4e0b\u3002\n\n\u6211\u4eff\u4f5b\u5df2\u7ecf\u80fd\u611f\u53d7\u5230\uff0c\u4ee5\u540e\u8981\u9762\u4e34\u7684\u8003\u9a8c\u4e86\u3002\n\n\u4e0d\u8fc7\uff0c\u5f53\u4e0b\u7684\u65f6\u523b\uff0c\u6211\u60f3\u628a\u5b83\u8bb0\u5f55\u4e0b\u6765\u3002\n\n\u201c\u6211\u4eec\u5c31\u4ee5\u73b0\u5728\u7684\u6837\u5b50\uff0c\u62cd\u4e2a\u5408\u7167\u5427\uff1f\u201d\n\n\u6211\u8bf4\u3002\n\n\n\n61.\n\u6211\u90a3\u53e5\u5e26\u7740\u4e00\u4e1d\u6c99\u54d1\u548c\u73a9\u7b11\u7684\u8bf7\u6c42\uff0c\u50cf\u4e00\u9897\u6295\u5165\u5e73\u9759\u6e56\u9762\u7684\u77f3\u5b50\uff0c\u5728\u5979\u4eec\u56db\u4e2a\u4e4b\u95f4\u6fc0\u8d77\u4e86\u5c0f\u5c0f\u7684\u3001\u5bb3\u7f9e\u7684\u6d9f\u6f2a\u3002\n\n\u201c\u624d\u4e0d\u8981\uff01\u201d\n\n\u6700\u5148\u53d1\u51fa\u6297\u8bae\u7684\uff0c\u662f\u6797\u521d\u590f\u3002\u5979\u51e0\u4e4e\u662f\u7acb\u523b\u5c31\u4ece\u6c99\u53d1\u4e0a\u6323\u624e\u7740\u60f3\u5750\u8d77\u6765\uff0c\u53cc\u624b\u4e0b\u610f\u8bc6\u5730\u5c31\u60f3\u53bb\u6342\u4f4f\u81ea\u5df1\u7684\u80f8\u53e3\uff0c\u4f46\u6d51\u8eab\u9178\u8f6f\u5f97\u4e00\u70b9\u529b\u6c14\u90fd\u4f7f\u4e0d\u4e0a\uff0c\u6700\u540e\u53ea\u662f\u5f92\u52b3\u5730\u5728\u51cc\u4e71\u7684\u6c99\u53d1\u57ab\u4e0a\u6ed1\u4e86\u4e00\u4e0b\uff0c\u53c8\u91cd\u65b0\u8eba\u4e86\u56de\u53bb\u3002\u5979\u8138\u4e0a\u90a3\u521a\u521a\u624d\u892a\u53bb\u4e0d\u4e45\u7684\u6f6e\u7ea2\uff0c\u53c8\u4e00\u6b21\u8fc5\u901f\u5730\u8513\u5ef6\u5230\u4e86\u8033\u6839\u3002\n\n\u201c\u6211\u73b0\u5728\u8fd9\u4e2a\u6837\u5b50\u80af\u5b9a\u4e11\u6b7b\u4e86\uff01\u8eab\u4e0a\u9ecf\u7cca\u7cca\u7684\uff0c\u5168\u90fd\u662f\u2026\u2026\u90fd\u662f\u4f60\u7684\u5473\u9053\u2026\u2026\u201d\n\n\u5979\u8d8a\u8bf4\u58f0\u97f3\u8d8a\u5c0f\uff0c\u6700\u540e\u51e0\u4e4e\u53d8\u6210\u4e86\u868a\u5b50\u53eb\uff0c\u628a\u8138\u57cb\u8fdb\u4e86\u6c99\u53d1\u9760\u57ab\u91cc\uff0c\u53ea\u7559\u7ed9\u6211\u4e00\u4e2a\u901a\u7ea2\u7684\u8033\u6735\u5c16\u3002\n\n\u6c5f\u96ea\u6ca1\u6709\u8bf4\u8bdd\uff0c\u5979\u53ea\u662f\u9ed8\u9ed8\u5730\u4ece\u5730\u677f\u4e0a\u5750\u8d77\u8eab\uff0c\u4f38\u624b\u5c06\u88ab\u6c57\u6c34\u548c\u4f53\u6db2\u9ecf\u5728\u8138\u988a\u4e0a\u7684\u4e00\u7f15\u6e7f\u53d1\u62e8\u5230\u8033\u540e\uff0c\u7136\u540e\u9ed8\u9ed8\u5730\u5e76\u62e2\u4e86\u90a3\u53cc\u4fee\u957f\u7684\u3001\u6cbe\u6ee1\u4e86\u6211\u4eec\u6218\u6597\u75d5\u8ff9\u7684\u817f\u3002\u5979\u7684\u52a8\u4f5c\u5f88\u6162\uff0c\u5e26\u7740\u4e00\u79cd\u52ab\u540e\u4f59\u751f\u7684\u6175\u61d2\uff0c\u4f46\u90a3\u53cc\u603b\u662f\u51b0\u51b7\u7684\u773c\u775b\uff0c\u5374\u4e00\u76f4\u770b\u7740\u6211\uff0c\u773c\u795e\u91cc\u6709\u4e00\u79cd\u6211\u4ece\u672a\u89c1\u8fc7\u7684\u3001\u50cf\u662f\u88ab\u96e8\u6c34\u6d17\u5237\u8fc7\u7684\u6e05\u6f88\u3002\n\n\u201c\u8981\u62cd\u4ec0\u4e48\u6837\u7684\u5440\uff1f\u201d\n\n\u56de\u7b54\u6211\u7684\uff0c\u662f\u8fd8\u8db4\u5728\u5730\u6bef\u4e0a\u7684\u9e7f\u7720\u3002\u5979\u4ef0\u8d77\u90a3\u5f20\u7eaf\u771f\u5f97\u4e0d\u542b\u4e00\u4e1d\u6742\u8d28\u7684\u5c0f\u8138\uff0c\u597d\u5947\u5730\u770b\u7740\u6211\uff0c\u4f3c\u4e4e\u5b8c\u5168\u4e0d\u89c9\u5f97\u6211\u4eec\u73b0\u5728\u7684\u72b6\u6001\u6709\u4ec0\u4e48\u95ee\u9898\u3002\u5979\u751a\u81f3\u8fd8\u52aa\u529b\u5730\u7fd8\u4e86\u7fd8\u81ea\u5df1\u90a3\u88ab\u7cbe\u6db2\u5f04\u5f97\u4e00\u7247\u72fc\u85c9\u7684\u3001\u5706\u6da6\u7684\u5c41\u80a1\uff0c\u7528\u4e00\u79cd\u63a2\u8ba8\u5b66\u672f\u95ee\u9898\u7684\u8bed\u6c14\u95ee\u3002\n\n\u201c\u662f\u50cf\u73b0\u5728\u8fd9\u6837\uff0c\u8db4\u7740\u62cd\u597d\u770b\uff0c\u8fd8\u662f\u8eba\u7740\u62cd\u597d\u770b\uff1f\u201d\n\n\u53ea\u6709\u6e29\u7476\uff0c\u5979\u6491\u7740\u684c\u5b50\u8fb9\u7f18\uff0c\u7f13\u7f13\u5730\u7ad9\u8d77\u8eab\u3002\u521a\u624d\u90a3\u573a\u6f2b\u957f\u7684\u72c2\u6b22\uff0c\u4f3c\u4e4e\u4e5f\u8017\u5c3d\u4e86\u5979\u7684\u6240\u6709\u529b\u6c14\u3002\u5979\u7684\u53cc\u817f\u6709\u4e9b\u53d1\u8f6f\uff0c\u7ad9\u8d77\u6765\u7684\u65f6\u5019\u5fae\u5fae\u6643\u4e86\u4e00\u4e0b\u3002\u5979\u5c31\u90a3\u4e48\u8d64\u88f8\u7740\uff0c\u6beb\u4e0d\u5728\u610f\u5730\u8d70\u5230\u6211\u9762\u524d\uff0c\u8138\u4e0a\u5e26\u7740\u4e00\u4e1d\u65e0\u5948\u53c8\u5ba0\u6eba\u7684\u7b11\u3002\n\n\u201c\u5c31\u4f60\u82b1\u6837\u591a\u3002\u201d\n\n\u5979\u8bf4\u7740\uff0c\u5f2f\u4e0b\u8170\uff0c\u4ece\u4e00\u7247\u72fc\u85c9\u7684\u8863\u7269\u5806\u91cc\uff0c\u6361\u8d77\u4e86\u6211\u7684\u624b\u673a\uff0c\u9012\u7ed9\u6211\u3002\n\n\u201c\u5b9a\u65f6\u62cd\u6444\uff0c\u5341\u79d2\u3002\u201d\n\n\u201c\u4e0d\u8bb8\u62cd\u5f97\u592a\u6e05\u695a\u3002\u201d\n\n\u6211\u63a5\u8fc7\u624b\u673a\uff0c\u89e3\u9501\uff0c\u6253\u5f00\u4e86\u76f8\u673a\u3002\u6211\u770b\u7740\u5c4f\u5e55\u91cc\u6620\u51fa\u7684\u3001\u5979\u4eec\u56db\u4e2a\u90a3\u6563\u843d\u5728\u5ba2\u5385\u5404\u4e2a\u89d2\u843d\u7684\u3001\u6175\u61d2\u800c\u7f8e\u4e3d\u7684\u8d64\u88f8\u8eab\u4f53\uff0c\u4e5f\u770b\u5230\u4e86\u6211\u81ea\u5df1\uff0c\u90a3\u4e2a\u7ad9\u5728\u5979\u4eec\u4e2d\u95f4\u7684\u3001\u540c\u6837\u8d64\u8eab\u88f8\u4f53\u7684\u3001\u8138\u4e0a\u6302\u7740\u50bb\u7b11\u7684\u7537\u4eba\u3002\n\n\u6211\u628a\u624b\u673a\u9760\u5728\u8fdc\u5904\u7684\u4e66\u67b6\u4e0a\uff0c\u8c03\u6574\u597d\u89d2\u5ea6\uff0c\u6309\u4e0b\u4e86\u5b9a\u65f6\u62cd\u6444\u7684\u6309\u94ae\u3002\n\n\u201c\u6ef4\u2014\u2014\u201d\n\n\u4e00\u58f0\u8f7b\u54cd\uff0c\u5341\u79d2\u5012\u8ba1\u65f6\u5f00\u59cb\u4e86\u3002\n\n\u201c\u5582\uff01\u6211\u8fd8\u6ca1\u51c6\u5907\u597d\uff01\u201d\u6797\u521d\u590f\u53d1\u51fa\u4e00\u58f0\u60ca\u547c\u3002\n\n\u6e29\u7476\u7b11\u7740\u8d70\u8fc7\u53bb\uff0c\u628a\u8fd8\u5728\u88c5\u9e35\u9e1f\u7684\u6797\u521d\u590f\u4ece\u6c99\u53d1\u91cc\u62c9\u4e86\u8d77\u6765\uff0c\u8ba9\u5979\u9760\u5728\u81ea\u5df1\u8eab\u4e0a\u3002\u6c5f\u96ea\u4e5f\u9ed8\u9ed8\u5730\u8c03\u6574\u4e86\u4e00\u4e0b\u5750\u59ff\uff0c\u5c06\u8eab\u4f53\u8f6c\u5411\u955c\u5934\u7684\u65b9\u5411\u3002\u53ea\u6709\u9e7f\u7720\uff0c\u4f9d\u65e7\u4fdd\u6301\u7740\u5979\u90a3\u4e2a\u5929\u771f\u800c\u6027\u611f\u7684\u8db4\u5367\u59ff\u52bf\uff0c\u8fd8\u51b2\u7740\u955c\u5934\u7684\u65b9\u5411\uff0c\u6b6a\u4e86\u6b6a\u5934\u3002\n\n\u6211\u8d70\u5230\u5979\u4eec\u4e2d\u95f4\uff0c\u5728\u5979\u4eec\u8eab\u524d\u7684\u5730\u6bef\u4e0a\u5750\u4e86\u4e0b\u6765\u3002\n\n\u5728\u5012\u8ba1\u65f6\u7684\u6700\u540e\u4e00\u79d2\uff0c\u6211\u56de\u8fc7\u5934\uff0c\u770b\u7740\u5979\u4eec\u3002\n\n\u201c\u5494\u5693\u3002\u201d\n\n\u5feb\u95e8\u58f0\u54cd\u8d77\uff0c\u5c06\u8fd9\u4e00\u523b\uff0c\u5c06\u8fd9\u5e45\u7531\u4e16\u754c\u4e0a\u6700\u7f8e\u597d\u7684\u4e94\u5177\u8eab\u4f53\u6784\u6210\u7684\u3001\u51cc\u4e71\u800c\u6e29\u6696\u7684\u753b\u9762\uff0c\u6c38\u8fdc\u5730\u5b9a\u683c\u4e86\u4e0b\u6765\u3002\n\n\u62cd\u5b8c\u7167\uff0c\u90a3\u80a1\u7d27\u7ef7\u7684\u5174\u594b\u611f\u4f3c\u4e4e\u7ec8\u4e8e\u5f7b\u5e95\u892a\u53bb\uff0c\u6240\u6709\u4eba\u90fd\u50cf\u662f\u88ab\u62bd\u8d70\u4e86\u9aa8\u5934\u4e00\u6837\uff0c\u762b\u8f6f\u5728\u539f\u5730\uff0c\u5ba2\u5385\u91cc\u53ea\u5269\u4e0b\u6b64\u8d77\u5f7c\u4f0f\u7684\u3001\u5e26\u7740\u5026\u610f\u7684\u547c\u5438\u58f0\u3002\n\n\u6211\u8eba\u5728\u5730\u6bef\u4e0a\uff0c\u6795\u7740\u9e7f\u7720\u67d4\u8f6f\u7684\u5c0f\u8179\uff0c\u6797\u521d\u590f\u548c\u6c5f\u96ea\u6324\u5728\u6211\u8eab\u8fb9\uff0c\u6e29\u7476\u5219\u9760\u5728\u6c99\u53d1\u4e0a\uff0c\u7528\u811a\u5c16\u8f7b\u8f7b\u5730\u52fe\u7740\u6211\u7684\u5c0f\u817f\u3002\n\n\u6211\u4eec\u5c31\u8fd9\u6837\u5b89\u9759\u5730\u8eba\u7740\uff0c\u8c01\u90fd\u6ca1\u6709\u8bf4\u8bdd\u3002\n\n\u4e0d\u77e5\u9053\u8fc7\u4e86\u591a\u4e45\uff0c\u6e29\u7476\u7684\u58f0\u97f3\u624d\u8f7b\u8f7b\u5730\u54cd\u8d77\uff0c\u6253\u7834\u4e86\u8fd9\u7247\u6e29\u5b58\u7684\u5bc2\u9759\u3002\n\n\u201c\u597d\u4e86\uff0c\u6700\u5f00\u5fc3\u7684\u4e8b\u60c5\u505a\u5b8c\u4e86\u3002\u201d\n\n\u201c\u73b0\u5728\uff0c\u8be5\u8c08\u8c08\u90a3\u4ef6\u6700\u9ebb\u70e6\u7684\u4e8b\u60c5\u4e86\u3002\u201d\n\n\u5979\u7684\u76ee\u5149\uff0c\u843d\u5728\u4e86\u6c5f\u96ea\u7684\u8eab\u4e0a\u3002\n\n\u201c\u82cf\u6587\u6d69\uff0c\u8fd8\u6709\u5f20\u59d0\u3002\u201d\n\n\u201c\u660e\u5929\u5c31\u662f\u9152\u4f1a\u7684\u65e5\u5b50\u4e86\uff0c\u6211\u4eec\u603b\u5f97\u7ed9\u4ed6\u4eec\u4e00\u4e2a\u2018\u60ca\u559c\u2019\uff0c\u4e0d\u662f\u5417\uff1f\u201d\n\n\n\n62.\n\u201c\u8fd8\u8bb0\u5f97\u6211\u4eec\u7684\u8ba1\u5212\u5417\uff1f\u201d\n\n\u6e29\u7476\u7684\u8bdd\u97f3\u843d\u4e0b\uff0c\u5ba2\u5385\u91cc\u9677\u5165\u4e86\u4e00\u79cd\u5947\u5f02\u7684\u5bc2\u9759\u3002\n\n\u4e00\u4e2a\u7b80\u5355\uff0c\u7c97\u66b4\uff0c\u751a\u81f3\u6709\u4e9b\u8352\u8c2c\u7684\u8ba1\u5212\u3002\u4f46\u4ed4\u7ec6\u4e00\u60f3\uff0c\u5374\u53c8\u50cf\u662f\u76ee\u524d\u552f\u4e00\u80fd\u8d70\u7684\u8def\u3002\n\n\u7528\u4e00\u4e2a\u66f4\u5927\u7684\u3001\u770b\u8d77\u6765\u66f4\u201c\u771f\u5b9e\u201d\u7684\u65b0\u95fb\uff0c\u53bb\u8986\u76d6\u4e00\u4e2a\u6b63\u5728\u53d1\u9175\u7684\u4e11\u95fb\u3002\u7528\u6c5f\u96ea\u90a3\u65e0\u4eba\u6562\u8f7b\u6613\u64bc\u52a8\u7684\u5bb6\u4e16\u80cc\u666f\uff0c\u53bb\u5bf9\u6297\u82cf\u6587\u6d69\u548c\u5f20\u59d0\u5728\u6697\u5904\u4f7f\u51fa\u7684\u624b\u6bb5\u3002\n\n\u65e2\u7136\u662f\u4f60\u82cf\u6587\u6d69\u5148\u6697\u5730\u91cc\u52a8\u624b\uff0c\u5c31\u4e0d\u8981\u602a\u6211\u4eec\u5f53\u9762\u6253\u8138\u4e86\u3002\n\n\u8fd9\u786e\u5b9e\u662f\u6e29\u7476\u7684\u98ce\u683c\u3002\u51b7\u9759\uff0c\u7cbe\u51c6\uff0c\u4e00\u5200\u5207\u4e2d\u8981\u5bb3\uff0c\u5374\u53c8\u5e26\u7740\u4e00\u79cd\u4e0d\u8ba1\u540e\u679c\u7684\u3001\u51b7\u9177\u7684\u51b3\u7edd\u3002\n\n\u4ee3\u4ef7\uff0c\u662f\u6211\u4eec\u6240\u6709\u4eba\u3002\n\n\u4ece\u6b64\u4ee5\u540e\uff0c\u6211\u7684\u660e\u9762\u60c5\u4fa3\uff0c\u5c31\u662f\u6c5f\u96ea\u3002\n\n\u800c\u9e7f\u7720\uff0c\u6e29\u7476\uff0c\u6700\u91cd\u8981\u7684\u662f\u6797\u521d\u590f\uff0c\u53ea\u80fd\u4ee5\u597d\u670b\u53cb\u7684\u8eab\u4efd\uff0c\u7559\u5728\u6211\u8eab\u8fb9\u3002\n\n\u8fd9\u5c31\u662f\u9700\u8981\u4ed8\u51fa\u7684\u4ee3\u4ef7\u3002\n\n\u201c\u6211\u51c6\u5907\u597d\u4e86\u3002\u201d\n\n\u6700\u5148\u5f00\u53e3\u7684\uff0c\u662f\u6c5f\u96ea\u3002\u5979\u4e0d\u77e5\u9053\u4ec0\u4e48\u65f6\u5019\u5df2\u7ecf\u5750\u76f4\u4e86\u8eab\u4f53\uff0c\u5979\u770b\u7740\u6211\uff0c\u773c\u795e\u91cc\u6709\u4e00\u79cd\u5b64\u6ce8\u4e00\u63b7\u7684\u5e73\u9759\u3002\n\n\u5176\u5b9e\uff0c\u548c\u6211\u8fd9\u6837\u7684\u4eba\u5ba3\u5e03\u604b\u60c5\uff0c\u5979\u8981\u9762\u5bf9\u7684\u6765\u81ea\u8206\u8bba\uff0c\u6765\u81ea\u5bb6\u65cf\u7684\u98ce\u66b4\uff0c\u5e76\u4e0d\u6bd4\u6797\u521d\u590f\u5c0f\u3002\n\n\u6797\u521d\u590f\u62b1\u7740\u62b1\u6795\uff0c\u6ca1\u6709\u8bf4\u8bdd\u3002\u5979\u628a\u8138\u57cb\u5728\u67d4\u8edf\u7684\u6795\u5934\u91cc\uff0c\u53ea\u9732\u51fa\u4e00\u53cc\u773c\u775b\uff0c\u773c\u795e\u590d\u6742\u5730\u770b\u7740\u6211\u548c\u6c5f\u96ea\u3002\u6211\u80fd\u770b\u5230\u5979\u7d27\u7d27\u54ac\u7740\u7684\u4e0b\u5507\uff0c\u5df2\u7ecf\u6709\u4e9b\u53d1\u767d\u4e86\u3002\n\n\u8fd9\u4e2a\u8ba1\u5212\u91cc\uff0c\u727a\u7272\u6700\u5927\u7684\uff0c\u5c31\u662f\u5979\u3002\u5979\u4e0d\u4ec5\u8981\u773c\u7741\u7741\u770b\u7740\u81ea\u5df1\u559c\u6b22\u7684\u4eba\u548c\u522b\u4eba\u626e\u6f14\u60c5\u4fa3\uff0c\u8fd8\u8981\u4eb2\u81ea\u4e0a\u573a\uff0c\u4e3a\u4ed6\u4eec\u505a\u4f2a\u8bc1\uff0c\u626e\u6f14\u4e00\u4e2a\u65e0\u8f9c\u7684\u3001\u88ab\u7275\u8fde\u7684\u597d\u670b\u53cb\u3002\n\n\u8fd9\u5bf9\u5979\u6765\u8bf4\uff0c\u592a\u6b8b\u5fcd\u4e86\u3002\n\n\u4f46\u5982\u4eca\uff0c\u5927\u5bb6\u5df2\u7ecf\u628a\u6240\u6709\u5fc3\u58f0\uff0c\u90fd\u8bf4\u5f00\u4e86\u3002\n\n\u7075\u9b42\u4e0e\u8089\u4f53\u7684\u76f8\u4e92\u4ea4\u878d\u4e4b\u4e0b\uff0c\u5927\u5bb6\u5df2\u7ecf\u5f7b\u5e95\u6210\u4e3a\u4e00\u4f53\u4e86\u3002\n\n\u6e29\u7476\u770b\u7740\u5979\uff0c\u58f0\u97f3\u653e\u7f13\u4e86\u4e00\u4e9b\uff0c\u5e26\u7740\u4e00\u4e1d\u4e0d\u6613\u5bdf\u89c9\u7684\u6e29\u67d4\u3002\n\n\u201c\u521d\u590f\uff0c\u4f60\u662f\u6211\u4eec\u5f53\u4e2d\uff0c\u6700\u4f1a\u2018\u6f14\u620f\u2019\u7684\u4eba\u3002\u201d\n\n\u6797\u521d\u590f\u7684\u8eab\u4f53\u731b\u5730\u4e00\u98a4\u3002\n\n\u201c\u9152\u4f1a\u90a3\u5929\uff0c\u4f60\u4e0d\u9700\u8981\u505a\u4ec0\u4e48\u3002\u201d\n\n\u201c\u4f60\u53ea\u9700\u8981\u7ad9\u5728\u90a3\u91cc\uff0c\u8868\u73b0\u51fa\u4f60\u73b0\u5728\u8fd9\u4e2a\u6837\u5b50\u5c31\u884c\u3002\u201d\n\n\u201c\u59d4\u5c48\uff0c\u65e0\u8f9c\u3002\u628a\u8fd9\u4e9b\u60c5\u7eea\uff0c\u653e\u5927\u4e00\u767e\u500d\uff0c\u6f14\u7ed9\u6240\u6709\u4eba\u770b\u3002\u201d\n\n\u6e29\u7476\u7684\u8bdd\u5f88\u8f7b\uff0c\u4f46\u53c8\u5e26\u7740\u4e0d\u5bb9\u7f6e\u7591\u7684\u5a01\u4e25\u3002\n\n\u6797\u521d\u590f\u62ac\u8d77\u5934\uff0c\u90a3\u53cc\u59d4\u5c48\u7684\u773c\u775b\u6b7b\u6b7b\u5730\u76ef\u7740\u6e29\u7476\uff0c\u773c\u6cea\u53c8\u4e00\u6b21\u6beb\u65e0\u5f81\u5146\u5730\u6389\u4e86\u4e0b\u6765\u3002\u4f46\u8fd9\u4e00\u6b21\uff0c\u5979\u7684\u773c\u795e\u91cc\u6ca1\u6709\u4e86\u5d29\u6e83\u548c\u7edd\u671b\uff0c\u53ea\u6709\u4e00\u79cd\u88ab\u770b\u7a7f\u4e86\u7684\u3001\u5014\u5f3a\u7684\u59d4\u5c48\u3002\n\n\u5979\u5438\u4e86\u5438\u9f3b\u5b50\uff0c\u7528\u624b\u80cc\u80e1\u4e71\u5730\u62b9\u4e86\u4e00\u628a\u773c\u6cea\uff0c\u58f0\u97f3\u6c99\u54d1\uff0c\u5e26\u7740\u6d53\u91cd\u7684\u9f3b\u97f3\u3002\n\n\u201c\u77e5\u9053\u4e86\u3002\u201d\n\n\u201c\u4e0d\u5c31\u662f\u6f14\u620f\u5417\uff1f\u6211\u7684\u4e13\u4e1a\u3002\u201d\n\n\u5979\u8bf4\u5b8c\uff0c\u5c31\u4f4e\u4e0b\u5934\uff0c\u4e0d\u518d\u770b\u6211\u4eec\u3002\n\n\u201c\u90a3\u5c31\u8fd9\u4e48\u529e\u5427\u3002\u201d\n\n\u8ba1\u5212\uff0c\u5c31\u4ee5\u8fd9\u6837\u4e00\u79cd\u8fd1\u4e4e\u60e8\u70c8\u7684\u65b9\u5f0f\uff0c\u5168\u7968\u901a\u8fc7\u4e86\u3002\n\n\u5f53\u7136\u4e0d\u7b97\u7728\u5df4\u7740\u65e0\u8f9c\u5927\u773c\u775b\u7684\u9e7f\u7720\u3002\n\n\u6e29\u7476\u4f3c\u4e4e\u677e\u4e86\u53e3\u6c14\u3002\u5979\u8d70\u5230\u8336\u51e0\u524d\uff0c\u62ff\u8d77\u7eb8\u548c\u7b14\uff0c\u5f00\u59cb\u50cf\u4e00\u4e2a\u771f\u6b63\u7684\u4f5c\u6218\u53c2\u8c0b\u4e00\u6837\uff0c\u7f57\u5217\u7740\u63a5\u4e0b\u6765\u7684\u884c\u52a8\u6b65\u9aa4\u3002\n\n\u201c\u96ea\uff0c\u793c\u670d\u4f60\u6765\u89e3\u51b3\uff0c\u4e09\u5957\uff0c\u8981\u7b26\u5408\u9152\u4f1a\u7684\u4e3b\u9898\uff0c\u4f46\u4e0d\u80fd\u592a\u9ad8\u8c03\u3002\u201d\n\n\u201c\u9646\u6c89\uff0c\u4f60\u548c\u96ea\u7684\u2018\u60c5\u4fa3\u2019\u8eab\u4efd\uff0c\u9700\u8981\u4e00\u4e9b\u7ec6\u8282\u652f\u6491\u3002\u6bd4\u5982\uff0c\u4f60\u4eec\u9700\u8981\u6234\u4e0a\u5bf9\u6212\uff0c\u624b\u673a\u5c4f\u4fdd\u8981\u6362\u6210\u5408\u7167\u3002\u8fd9\u4e9b\u4e1c\u897f\uff0c\u96ea\u4f1a\u51c6\u5907\u597d\u3002\u201d\n\n\u201c\u521d\u590f\uff0c\u4f60\u7684\u4efb\u52a1\u6700\u91cd\u3002\u4f60\u9700\u8981\u7acb\u523b\u8054\u7cfb\u4f60\u7684\u6838\u5fc3\u7c89\u4e1d\u7fa4\uff0c\u7a33\u4f4f\u5979\u4eec\u7684\u60c5\u7eea\uff0c\u4f46\u662f\uff0c\u4e0d\u8981\u900f\u9732\u4efb\u4f55\u6211\u4eec\u7684\u8ba1\u5212\u3002\u201d\n\n\u201c\u8fd8\u6709\uff0c\u6700\u91cd\u8981\u7684\u4e00\u70b9\u3002\u201d\n\n\u6e29\u7476\u653e\u4e0b\u7b14\uff0c\u62ac\u8d77\u5934\uff0c\u76ee\u5149\u5728\u6211\u4eec\u6bcf\u4e2a\u4eba\u7684\u8138\u4e0a\u626b\u8fc7\u3002\n\n\u201c\u4ece\u73b0\u5728\u5f00\u59cb\uff0c\u5230\u660e\u665a\u9152\u4f1a\u7ed3\u675f\u524d\u3002\u9646\u6c89\uff0c\u4f60\u548c\u6c5f\u96ea\uff0c\u5fc5\u987b\u2018\u8fdb\u5165\u89d2\u8272\u2019\u3002\u201d\n\n\u201c\u4f60\u4eec\u8981\u50cf\u771f\u6b63\u7684\u60c5\u4fa3\u4e00\u6837\u2026\u2026\u751f\u6d3b\u5728\u4e00\u8d77\u3002\u201d\n\n\n\n63.\n\n\u6e29\u7476\u90a3\u53e5\u201c\u4f60\u4eec\u8981\u50cf\u771f\u6b63\u7684\u60c5\u4fa3\u4e00\u6837\u2026\u2026\u751f\u6d3b\u5728\u4e00\u8d77\u201d\uff0c\u50cf\u4e00\u9053\u65e0\u58f0\u7684\u547d\u4ee4\u3002\n\n\u5ba2\u5385\u91cc\u90a3\u7247\u52ab\u540e\u4f59\u751f\u7684\u6e29\u5b58\uff0c\u77ac\u95f4\u5c31\u88ab\u4e00\u79cd\u65b0\u7684\u3001\u66f4\u52a0\u5177\u4f53\u7684\u5c34\u5c2c\u6240\u53d6\u4ee3\u3002\n\n\u6211\u770b\u7740\u6c5f\u96ea\uff0c\u5979\u4e5f\u6b63\u770b\u7740\u6211\u3002\u6211\u4eec\u4e24\u4e2a\u4eba\u7684\u89c6\u7ebf\u5728\u7a7a\u4e2d\u78b0\u649e\u4e86\u4e00\u4e0b\uff0c\u7136\u540e\u5c31\u50cf\u4e24\u5757\u88ab\u70e7\u7ea2\u7684\u94c1\uff0c\u540c\u65f6\u70eb\u5f97\u5f39\u5f00\u4e86\u3002\u6211\u80fd\u770b\u5230\u5979\u90a3\u5f20\u603b\u662f\u6ca1\u4ec0\u4e48\u8868\u60c5\u7684\u8138\u4e0a\uff0c\u8fc5\u901f\u5730\u6cdb\u8d77\u4e86\u4e00\u5c42\u6781\u6de1\u7684\u3001\u51e0\u4e4e\u770b\u4e0d\u89c1\u7684\u7ea2\u6655\u3002\n\n\u201c\u624b\u673a\u62ff\u51fa\u6765\u3002\u201d\n\n\u6700\u5148\u6253\u7834\u6c89\u9ed8\u7684\uff0c\u4f9d\u65e7\u662f\u6e29\u7476\u3002\u5979\u5c31\u50cf\u4e00\u4e2a\u4e25\u5389\u7684\u5bfc\u6f14\uff0c\u5df2\u7ecf\u8fc5\u901f\u5730\u8fdb\u5165\u4e86\u89d2\u8272\u3002\n\n\u6211\u548c\u6c5f\u96ea\u90fd\u6709\u4e9b\u673a\u68b0\u5730\uff0c\u4ece\u5404\u81ea\u7684\u53e3\u888b\u91cc\u638f\u51fa\u4e86\u624b\u673a\u3002\n\n\u201c\u5c4f\u4fdd\u6362\u6210\u5408\u7167\u3002\u201d\n\n\u6e29\u7476\u7ad9\u5728\u6211\u4eec\u4e2d\u95f4\uff0c\u5c45\u9ad8\u4e34\u4e0b\u5730\u770b\u7740\u6211\u4eec\u3002\n\n\u5408\u7167\uff1f\u6211\u624b\u673a\u91cc\u54ea\u6709\u548c\u6c5f\u96ea\u5355\u72ec\u7684\u5408\u7167\uff1f\u6211\u4eec\u4e94\u4e2a\u4eba\u7684\u5927\u5408\u7167\u5012\u662f\u6709\u4e0d\u5c11\uff0c\u4f46\u5355\u72ec\u7684\u2026\u2026\u6211\u98de\u5feb\u5730\u5728\u8111\u5b50\u91cc\u641c\u7d22\u7740\u8bb0\u5fc6\uff0c\u4e00\u7247\u7a7a\u767d\u3002\n\n\u6c5f\u96ea\u4f3c\u4e4e\u4e5f\u60f3\u5230\u4e86\u8fd9\u4e2a\u95ee\u9898\uff0c\u5979\u7684\u7709\u5934\u5fae\u5fae\u76b1\u4e86\u8d77\u6765\u3002\n\n\u201c\u54df\uff0c\u8fd9\u5c31\u96be\u4f4f\u4e86\uff1f\u201d\n\n\u4e00\u4e2a\u51c9\u51c9\u7684\u58f0\u97f3\u4ece\u6c99\u53d1\u7684\u89d2\u843d\u91cc\u4f20\u6765\u3002\n\n\u662f\u6797\u521d\u590f\u3002\u5979\u62b1\u7740\u62b1\u6795\uff0c\u4fa7\u8eba\u5728\u6c99\u53d1\u4e0a\uff0c\u6b63\u7528\u4e00\u79cd\u4f3c\u7b11\u975e\u7b11\u7684\u8868\u60c5\u770b\u7740\u6211\u4eec\u3002\u5979\u7684\u58f0\u97f3\u91cc\u5e26\u7740\u4e00\u80a1\u660e\u663e\u7684\u3001\u9178\u6e9c\u6e9c\u7684\u5473\u9053\u3002\n\n\u201c\u5e73\u65f6\u4e0d\u662f\u8d70\u5f97\u633a\u8fd1\u7684\u5417\uff1f\u8fde\u5f20\u5355\u72ec\u7684\u7167\u7247\u90fd\u6ca1\u6709\u62cd\u8fc7\uff1f\u770b\u6765\u5173\u7cfb\u4e5f\u4e0d\u600e\u4e48\u6837\u561b\u3002\u201d\n\n\u6c5f\u96ea\u7684\u8138\u8272\u767d\u4e86\u4e00\u4e0b\u3002\u6211\u611f\u89c9\u81ea\u5df1\u7684\u8138\u988a\u4e5f\u6709\u4e9b\u53d1\u70eb\u3002\n\n\u6e29\u7476\u6ca1\u6709\u7406\u4f1a\u6797\u521d\u590f\u7684\u6311\u8845\uff0c\u5979\u53ea\u662f\u62ff\u51fa\u81ea\u5df1\u7684\u624b\u673a\uff0c\u70b9\u4e86\u51e0\u4e0b\uff0c\u7136\u540e\u5206\u522b\u53d1\u7ed9\u4e86\u6211\u548c\u6c5f\u96ea\u3002\n\n\u6211\u7684\u624b\u673a\u9707\u4e86\u4e00\u4e0b\uff0c\u662f\u4e00\u5f20\u7167\u7247\u3002\n\n\u7167\u7247\u7684\u80cc\u666f\uff0c\u662f\u5728\u6211\u4eec\u5927\u5b66\u65f6\u5e38\u53bb\u7684\u4e00\u5bb6\u65e7\u4e66\u5e97\u3002\u7167\u7247\u4e0a\uff0c\u6c5f\u96ea\u7a7f\u7740\u4e00\u8eab\u767d\u8272\u7684\u8fde\u8863\u88d9\uff0c\u6b63\u7ad9\u5728\u4e00\u6392\u9ad8\u5927\u7684\u4e66\u67b6\u524d\uff0c\u4fa7\u7740\u5934\uff0c\u8ba4\u771f\u5730\u770b\u7740\u4e00\u672c\u644a\u5f00\u5728\u624b\u91cc\u7684\u4e66\u3002\u5348\u540e\u7684\u9633\u5149\u4ece\u5979\u8eab\u540e\u7684\u7a97\u6237\u91cc\u7167\u8fdb\u6765\uff0c\u7ed9\u5979\u6574\u4e2a\u4eba\u90fd\u9540\u4e0a\u4e86\u4e00\u5c42\u6bdb\u8338\u8338\u7684\u3001\u6e29\u6696\u7684\u91d1\u8fb9\u3002\n\n\u800c\u6211\uff0c\u5c31\u7ad9\u5728\u5979\u7684\u8eab\u540e\uff0c\u770b\u7740\u5979\u3002\u6211\u7684\u624b\u91cc\u4e5f\u62ff\u7740\u4e00\u672c\u4e66\uff0c\u4f46\u6211\u6839\u672c\u6ca1\u5728\u770b\u4e66\uff0c\u6211\u7684\u76ee\u5149\uff0c\u5b8c\u5b8c\u5168\u5168\u5730\u843d\u5728\u4e86\u5979\u7684\u4fa7\u8138\u4e0a\u3002\n\n\u90a3\u5f20\u7167\u7247\u91cc\uff0c\u6211\u773c\u91cc\u7684\u6e29\u67d4\u548c\u4e13\u6ce8\uff0c\u662f\u6211\u81ea\u5df1\u90fd\u672a\u66fe\u5bdf\u89c9\u8fc7\u7684\u3002\n\n\u6211\u751a\u81f3\u4e0d\u8bb0\u5f97\uff0c\u8fd9\u5f20\u7167\u7247\u662f\u4ec0\u4e48\u65f6\u5019\u62cd\u7684\u3002\n\n\u201c\u5927\u4e8c\u90a3\u5e74\uff0c\u4f60\u4eec\u4fe9\u90fd\u5fd8\u4e86\u4ea4\u8bfb\u4e66\u62a5\u544a\uff0c\u4e00\u8d77\u53bb\u8865\u4f5c\u4e1a\u7684\u65f6\u5019\uff0c\u6211\u62cd\u7684\u3002\u201d\n\n\u6e29\u7476\u5e73\u9759\u5730\u89e3\u91ca\u4e86\u4e00\u53e5\uff0c\u7136\u540e\u53c8\u8865\u5145\u9053\u3002\n\n\u201c\u6362\u4e0a\u3002\u201d\n\n\u6211\u6c89\u9ed8\u7740\uff0c\u628a\u90a3\u5f20\u7167\u7247\uff0c\u8bbe\u7f6e\u6210\u4e86\u6211\u7684\u624b\u673a\u5c4f\u4fdd\u3002\u5f53\u6211\u6309\u4eae\u5c4f\u5e55\uff0c\u770b\u5230\u90a3\u5f20\u5b9a\u683c\u4e86\u8fc7\u53bb\u7684\u3001\u6e29\u6696\u7684\u753b\u9762\u65f6\uff0c\u6211\u7684\u5fc3\u810f\u50cf\u662f\u88ab\u4ec0\u4e48\u4e1c\u897f\u8f7b\u8f7b\u5730\u523a\u4e86\u4e00\u4e0b\uff0c\u53c8\u9178\u53c8\u9ebb\u3002\n\n\u6211\u770b\u5230\uff0c\u6c5f\u96ea\u4e5f\u9ed8\u9ed8\u5730\u6362\u4e0a\u4e86\u90a3\u5f20\u7167\u7247\u3002\n\n\u201c\u63a5\u4e0b\u6765\uff0c\u6212\u6307\u3002\u201d\n\n\u6e29\u7476\u8bf4\u3002\n\n\u6c5f\u96ea\u7ad9\u8d77\u8eab\uff0c\u4e00\u8a00\u4e0d\u53d1\u5730\u8d70\u4e0a\u4e86\u4e8c\u697c\u3002\u5f88\u5feb\uff0c\u5979\u5c31\u62ff\u7740\u4e00\u4e2a\u5c0f\u5c0f\u7684\u3001\u4e1d\u7ed2\u7684\u76d2\u5b50\u4e0b\u6765\u4e86\u3002\u76d2\u5b50\u662f\u6df1\u84dd\u8272\u7684\uff0c\u770b\u8d77\u6765\u5f88\u9ad8\u7ea7\u3002\n\n\u5979\u8d70\u5230\u6211\u9762\u524d\uff0c\u6253\u5f00\u4e86\u76d2\u5b50\u3002\n\n\u5979\u7b11\u4e86\u7b11\uff1a\u201c\u8fd9\u662f\u82cf\u6587\u6d69\u7ed9\u6211\u7684\uff0c\u9057\u5fd8\u5728\u89d2\u843d\u4e86\uff0c\u5e78\u597d\u6ca1\u4e22\u3002\u201d\n\n\u91cc\u9762\u9759\u9759\u5730\u8eba\u7740\u4e24\u679a\u6b3e\u5f0f\u7b80\u5355\u4f46\u8bbe\u8ba1\u611f\u5341\u8db3\u7684\u94c2\u91d1\u6212\u6307\uff0c\u6ca1\u6709\u94bb\u77f3\uff0c\u4e5f\u6ca1\u6709\u4efb\u4f55\u591a\u4f59\u7684\u88c5\u9970\uff0c\u53ea\u662f\u4e24\u4e2a\u7d20\u5708\u3002\n\n\u5979\u4ece\u91cc\u9762\u62ff\u51fa\u90a3\u679a\u5c3a\u5bf8\u7a0d\u5927\u7684\u7537\u6212\uff0c\u7136\u540e\u62ac\u8d77\u5934\uff0c\u770b\u7740\u6211\u3002\n\n\u201c\u624b\u3002\u201d\n\n\u5979\u7684\u58f0\u97f3\u5f88\u8f7b\uff0c\u50cf\u662f\u5728\u547d\u4ee4\uff0c\u53c8\u50cf\u662f\u5728\u8bf7\u6c42\u3002\n\n\u6211\u6709\u4e9b\u50f5\u786c\u5730\u4f38\u51fa\u4e86\u6211\u7684\u5de6\u624b\u3002\n\n\u5979\u62ff\u8d77\u6211\u7684\u624b\uff0c\u5979\u7684\u6307\u5c16\u5f88\u51c9\uff0c\u89e6\u78b0\u5230\u6211\u76ae\u80a4\u7684\u77ac\u95f4\uff0c\u6211\u611f\u89c9\u6211\u4eec\u4e24\u4e2a\u4eba\uff0c\u90fd\u540c\u65f6\u98a4\u6296\u4e86\u4e00\u4e0b\u3002\n\n\u5979\u4f4e\u7740\u5934\uff0c\u5f88\u4e13\u6ce8\u5730\uff0c\u60f3\u628a\u90a3\u679a\u6212\u6307\uff0c\u5957\u8fdb\u6211\u7684\u65e0\u540d\u6307\u91cc\u3002\n\n\u6216\u8bb8\u662f\u56e0\u4e3a\u7d27\u5f20\uff0c\u5979\u8bd5\u4e86\u597d\u51e0\u6b21\uff0c\u90a3\u679a\u51b0\u51c9\u7684\u6212\u6307\uff0c\u90fd\u5361\u5728\u4e86\u6211\u7684\u6307\u5173\u8282\u4e0a\uff0c\u600e\u4e48\u4e5f\u63a8\u4e0d\u8fdb\u53bb\u3002\n\n\u6211\u80fd\u611f\u89c9\u5230\uff0c\u5979\u7684\u624b\u5fc3\u91cc\uff0c\u4e5f\u6c81\u51fa\u4e86\u4e00\u5c42\u7ec6\u5bc6\u7684\u3001\u51b0\u51b7\u7684\u6c57\u3002\n\n\n\n64.\n\u201c\u5567\u3002\u201d\n\n\u4e00\u58f0\u6781\u8f7b\u7684\u3001\u5e26\u7740\u4e00\u4e1d\u4e0d\u8010\u70e6\u7684\u5482\u5634\u58f0\uff0c\u4ece\u6c99\u53d1\u7684\u89d2\u843d\u91cc\u4f20\u6765\u3002\n\n\u662f\u6797\u521d\u590f\u3002\u5979\u62b1\u7740\u62b1\u6795\uff0c\u6362\u4e86\u4e2a\u66f4\u8212\u670d\u7684\u59ff\u52bf\uff0c\u7528\u4e00\u79cd\u5ba1\u89c6\u7684\u3001\u6311\u5254\u7684\u76ee\u5149\u770b\u7740\u6211\u4eec\u4e24\u4e2a\u7b28\u62d9\u7684\u6837\u5b50\u3002\n\n\u201c\u6f14\u620f\u90fd\u4e0d\u4f1a\u6f14\uff0c\u8fd9\u8981\u662f\u88ab\u72d7\u4ed4\u62cd\u5230\uff0c\u660e\u5929\u5934\u6761\u5c31\u662f\u2018\u8c6a\u95e8\u5343\u91d1\u5f3a\u8feb\u7d20\u4eba\u7537\u53cb\u6234\u6212\u6307\uff0c\u7537\u65b9\u5173\u8282\u7c97\u5927\u7591\u4f3c\u4e0d\u613f\u2019\u3002\u201d\n\n\u5979\u7684\u8bdd\u50cf\u4e00\u6839\u7ec6\u7ec6\u7684\u9488\uff0c\u7cbe\u51c6\u5730\u624e\u5728\u4e86\u8fd9\u7247\u7d27\u7ef7\u800c\u5c34\u5c2c\u7684\u7a7a\u6c14\u4e0a\u3002\n\n\u6c5f\u96ea\u7684\u8eab\u4f53\u731b\u5730\u4e00\u50f5\uff0c\u5979\u50cf\u662f\u88ab\u70eb\u5230\u4e00\u6837\uff0c\u4e0b\u610f\u8bc6\u5730\u5c31\u8981\u628a\u624b\u7f29\u56de\u53bb\u3002\n\n\u6211\u6ca1\u6709\u8ba9\u5979\u5f97\u901e\u3002\n\n\u5728\u5979\u9000\u7f29\u7684\u524d\u4e00\u79d2\uff0c\u6211\u53cd\u624b\u63e1\u4f4f\u4e86\u5979\u90a3\u53ea\u51b0\u51c9\u7684\u3001\u6cbe\u6ee1\u4e86\u51b7\u6c57\u7684\u624b\u3002\n\n\u5979\u7684\u624b\u6307\u5f88\u7ec6\uff0c\u4e5f\u5f88\u51c9\uff0c\u5728\u6211\u6e29\u70ed\u7684\u638c\u5fc3\u91cc\u5fae\u5fae\u98a4\u6296\u7740\u3002\n\n\u6211\u62ac\u8d77\u5934\uff0c\u8fce\u4e0a\u4e86\u5979\u90a3\u53cc\u6709\u4e9b\u9519\u6115\u548c\u614c\u4e71\u7684\u773c\u775b\u3002\u6211\u6ca1\u6709\u8bf4\u8bdd\uff0c\u53ea\u662f\u770b\u7740\u5979\uff0c\u7136\u540e\uff0c\u53e6\u4e00\u53ea\u624b\u8986\u4e0a\u4e86\u6211\u4eec\u4ea4\u63e1\u7684\u624b\u80cc\uff0c\u7528\u4e00\u79cd\u7f13\u6162\u800c\u575a\u5b9a\u7684\u529b\u5ea6\uff0c\u5c06\u90a3\u679a\u5361\u5728\u6211\u6307\u5173\u8282\u4e0a\u7684\u3001\u51b0\u51b7\u7684\u6212\u6307\uff0c\u4e00\u70b9\u4e00\u70b9\u5730\uff0c\u63a8\u4e86\u8fdb\u53bb\u3002\n\n\u6212\u6307\u201c\u55d2\u201d\u7684\u4e00\u58f0\uff0c\u7ec8\u4e8e\u8d8a\u8fc7\u4e86\u5173\u8282\uff0c\u7a33\u7a33\u5730\u843d\u5728\u4e86\u6211\u7684\u65e0\u540d\u6307\u6839\u90e8\u3002\u5c3a\u5bf8\u4e0d\u5927\u4e0d\u5c0f\uff0c\u521a\u521a\u597d\u3002\n\n\u50cf\u662f\u4e00\u4e2a\u65e9\u5c31\u4e3a\u6211\u91cf\u8eab\u5b9a\u505a\u7684\u3001\u51b0\u51b7\u7684\u67b7\u9501\u3002\n\n\u4e5f\u4e0d\u77e5\u9053\u82cf\u6587\u6d69\u770b\u5230\u8fd9\u4e2a\u6212\u6307\uff0c\u4f1a\u662f\u4ec0\u4e48\u53cd\u5e94\uff1f\n\n\u6211\u7684\u624b\u6307\uff0c\u548c\u5979\u7684\u624b\u6307\uff0c\u8fd8\u4ea4\u7f20\u5728\u4e00\u8d77\u3002\u6211\u80fd\u6e05\u6670\u5730\u611f\u89c9\u5230\u5979\u8109\u640f\u7684\u8df3\u52a8\uff0c\u4e00\u4e0b\uff0c\u53c8\u4e00\u4e0b\uff0c\u5feb\u901f\u800c\u7d0a\u4e71\uff0c\u548c\u6211\u7684\u5fc3\u8df3\uff0c\u91cd\u5408\u5728\u4e86\u4e00\u8d77\u3002\n\n\u5ba2\u5385\u91cc\u5b89\u9759\u4e86\u4e0b\u6765\u3002\u6797\u521d\u590f\u6ca1\u6709\u518d\u8bf4\u8bdd\uff0c\u53ea\u662f\u628a\u8138\u57cb\u8fdb\u4e86\u62b1\u6795\u91cc\uff0c\u4e0d\u518d\u770b\u6211\u4eec\u3002\n\n\u201c\u8be5\u4f60\u4e86\u3002\u201d\n\n\u6211\u770b\u7740\u6c5f\u96ea\uff0c\u4f4e\u58f0\u8bf4\u3002\n\n\u5979\u50cf\u662f\u624d\u4ece\u68a6\u91cc\u60ca\u9192\u8fc7\u6765\uff0c\u614c\u4e71\u5730\u62bd\u56de\u4e86\u81ea\u5df1\u7684\u624b\uff0c\u7136\u540e\u4ece\u90a3\u4e2a\u4e1d\u7ed2\u76d2\u5b50\u91cc\uff0c\u62ff\u51fa\u4e86\u53e6\u4e00\u679a\u5973\u6212\u3002\u5979\u6ca1\u6709\u770b\u6211\uff0c\u4e5f\u6ca1\u6709\u8ba9\u6211\u5e2e\u5979\u6234\uff0c\u53ea\u662f\u4f4e\u7740\u5934\uff0c\u81ea\u5df1\u7528\u6700\u5feb\u7684\u901f\u5ea6\uff0c\u80e1\u4e71\u5730\u5c06\u90a3\u679a\u6212\u6307\u5957\u8fdb\u4e86\u81ea\u5df1\u7684\u65e0\u540d\u6307\u3002\n\n\u56e0\u4e3a\u592a\u7528\u529b\uff0c\u5979\u7684\u6307\u5173\u8282\u90fd\u88ab\u784c\u5f97\u6709\u4e9b\u53d1\u7ea2\u3002\n\n\u6e29\u7476\u770b\u7740\u6211\u4eec\uff0c\u90a3\u53cc\u603b\u662f\u5e26\u7740\u7b11\u610f\u7684\u773c\u775b\u91cc\uff0c\u6b64\u523b\u4e5f\u770b\u4e0d\u51fa\u662f\u4ec0\u4e48\u60c5\u7eea\u3002\u5979\u53ea\u662f\u70b9\u4e86\u70b9\u5934\uff0c\u50cf\u4e00\u4e2a\u5b8c\u6210\u4e86\u5de5\u4f5c\u4efb\u52a1\u7684\u5bfc\u6f14\u3002\n\n\u201c\u597d\u4e86\uff0c\u7b2c\u4e00\u6b65\u5b8c\u6210\u3002\u201d\n\n\u201c\u63a5\u4e0b\u6765\uff0c\u662f\u540c\u5c45\u3002\u201d\n\n\u5979\u7684\u8bdd\u97f3\u521a\u843d\uff0c\u6797\u521d\u590f\u5c31\u731b\u5730\u4ece\u62b1\u6795\u91cc\u62ac\u8d77\u5934\uff0c\u90a3\u53cc\u6c34\u6c6a\u6c6a\u7684\u773c\u775b\u7741\u5927\u5730\u77aa\u7740\u6e29\u7476\u3002\n\n\u201c\u4ec0\u4e48\u610f\u601d\uff1f\u8fd8\u8981\u7761\u5728\u4e00\u8d77\u5417\uff1f\u201d\n\n\u201c\u5f53\u7136\u3002\u201d\u6e29\u7476\u56de\u7b54\u5f97\u7406\u6240\u5f53\u7136\uff0c\u201c\u8981\u6f14\u620f\uff0c\u5c31\u8981\u6f14\u5168\u5957\u3002\u4eca\u665a\u9646\u6c89\u5230\u6c5f\u96ea\u7684\u623f\u95f4\u53bb\u7761\u3002\u201d\n\n\u5979\u8bf4\u5b8c\uff0c\u751a\u81f3\u6ca1\u6709\u7ed9\u6211\u4eec\u4efb\u4f55\u53cd\u9a73\u548c\u8ba8\u8bba\u7684\u673a\u4f1a\uff0c\u5c31\u76f4\u63a5\u7ad9\u8d77\u8eab\u3002\n\n\u201c\u8d81\u8fd9\u4e2a\u673a\u4f1a\uff0c\u4f60\u4eec\u4e24\u4e2a\u518d\u597d\u597d\u719f\u6089\u4e00\u4e0b\u5bf9\u65b9\u3002\u201d\n\n\u201c\u597d\u4e86\uff0c\u5f88\u665a\u4e86\uff0c\u90fd\u53bb\u4f11\u606f\u5427\u3002\u660e\u5929\uff0c\u8fd8\u6709\u4e00\u573a\u786c\u4ed7\u8981\u6253\u3002\u201d\n\n\u5979\u8bf4\u5b8c\uff0c\u5c31\u8f6c\u8eab\uff0c\u5e26\u7740\u597d\u5947\u5b9d\u5b9d\u4f3c\u7684\u9e7f\u7720\uff0c\u5934\u4e5f\u4e0d\u56de\u5730\u8d70\u5411\u4e86\u697c\u4e0a\u3002\n\n\u201c\u8eab\u4e0a\u9ecf\u7cca\u7cca\u7684\u597d\u96be\u53d7\uff0c\u7720\u7720\uff0c\u6211\u4eec\u6d17\u6fa1\u53bb\u3002\u201d\n\n\u5ba2\u5385\u91cc\uff0c\u53ea\u5269\u4e0b\u6211\u4eec\u4e09\u4e2a\u9762\u9762\u76f8\u89d1\u3002\n\n\u6211\u548c\u6c5f\u96ea\uff0c\u4ee5\u53ca\u90a3\u4e2a\u62b1\u7740\u62b1\u6795\uff0c\u54ac\u7259\u5207\u9f7f\u7684\u6797\u521d\u590f\u3002\n\n\u6211\u770b\u7740\u81ea\u5df1\u65e0\u540d\u6307\u4e0a\u90a3\u679a\u51b0\u51c9\u7684\u3001\u964c\u751f\u7684\u6212\u6307\uff0c\u611f\u89c9\u81ea\u5df1\u7684\u4eba\u751f\uff0c\u5c31\u5728\u521a\u624d\u90a3\u77ed\u77ed\u7684\u51e0\u5206\u949f\u91cc\uff0c\u88ab\u5f3a\u884c\u63b0\u5f2f\uff0c\u9a76\u5411\u4e86\u4e00\u4e2a\u6211\u5b8c\u5168\u65e0\u6cd5\u9884\u6d4b\u7684\u3001\u8352\u8bde\u7684\u8f68\u9053\u3002\n\n\u6c5f\u6c0f\u96c6\u56e2\u5343\u91d1\uff0c\u6c5f\u96ea\u7684\u6b63\u724c\u7537\u670b\u53cb\u5417\uff1f\n\n\n\n65.\n\u201c\u54b3\u54b3\uff01\u201d\n\n\u6211\u8f7b\u54b3\u4e86\u4e00\u4e0b\uff0c\u5df2\u7ecf\u8d70\u5230\u697c\u68af\u53e3\u7684\u6e29\u7476\u548c\u9e7f\u7720\u53cc\u53cc\u8f6c\u8fc7\u8eab\uff0c\u597d\u5947\u7684\u770b\u5411\u6211\u3002\n\n\u201c\u90a3\u4ec0\u4e48\uff0c\u6d17\u6fa1\u7684\u8bdd\uff0c\u6211\u4eec\u5e72\u8106\u4e00\u8d77\u6d17\u5427\u3002\u201d\n\n\u6211\u770b\u7740\u56db\u4e2a\u5973\u5b69\u5b50\uff0c\u5979\u4eec\u8d64\u88f8\u7684\u8eab\u4f53\u4e0a\u90fd\u8fd8\u9ecf\u7cca\u7cca\u7684\u3002\n\n\u542c\u5230\u8fd9\u8bdd\uff0c\u539f\u672c\u8868\u73b0\u5f97\u6c14\u547c\u547c\u7684\u6797\u521d\u590f\uff0c\u6c14\u52bf\u4e00\u6536\uff0c\u53c8\u7a81\u7136\u6709\u4e9b\u5bb3\u7f9e\u4e86\u3002\n\n\u6211\u770b\u7740\u5979\u90a3\u526f\u53c8\u7f9e\u53c8\u6c14\u7684\u6837\u5b50\uff0c\u53c8\u770b\u770b\u6c5f\u96ea\u90a3\u51b0\u5c71\u878d\u5316\u540e\u5e26\u7740\u4e00\u4e1d\u4e0d\u77e5\u6240\u63aa\u7684\u8868\u60c5\uff0c\u6700\u540e\u76ee\u5149\u79fb\u5230\u8fdc\u5904\u6e29\u7476\u7684\u8eab\u4e0a\u3002\u5979\u8138\u4e0a\u4f9d\u65e7\u6302\u7740\u90a3\u79cd\u5305\u5bb9\u4e00\u5207\u7684\u3001\u6e29\u67d4\u7684\u7b11\u610f\u3002\n\n\u201c\u597d\u554a\u3002\u201d\n\n\u5979\u76ee\u5149\u8f6c\u5411\u6797\u521d\u590f\u548c\u6c5f\u96ea\u3002\n\n\u201c\u53cd\u6b63\u8eab\u4e0a\u90fd\u810f\u516e\u516e\u7684\uff0c\u6b63\u597d\u4e00\u8d77\u6d17\u6d17\u3002\u201d\n\n\u5979\u8bf4\u7740\uff0c\u5c31\u90a3\u4e48\u8d64\u88f8\u7740\u8d70\u4e86\u8fc7\u6765\uff0c\u62c9\u8d77\u4e86\u8fd8\u5728\u6c99\u53d1\u4e0a\u88c5\u9e35\u9e1f\u7684\u6797\u521d\u590f\u3002\n\n\u201c\u8d70\u5566\uff0c\u518d\u8eba\u4e0b\u53bb\uff0c\u4f60\u8eab\u4e0a\u90fd\u8981\u957f\u8611\u83c7\u4e86\u3002\u201d\n\n\u6797\u521d\u590f\u534a\u63a8\u534a\u5c31\u5730\u88ab\u5979\u4ece\u6c99\u53d1\u91cc\u62c9\u4e86\u8d77\u6765\uff0c\u5634\u91cc\u8fd8\u5728\u5c0f\u58f0\u5730\u561f\u56d4\u7740\u3002\n\n\u201c\u6211\u817f\u8f6f\u2026\u2026\u90fd\u602a\u90a3\u4e2a\u6df7\u86cb\u2026\u2026\u201d\n\n\u6e29\u7476\u53c8\u7b11\u7740\u770b\u5411\u6c5f\u96ea\u3002\u6c5f\u96ea\u6ca1\u6709\u7b49\u5979\u5f00\u53e3\uff0c\u81ea\u5df1\u4e5f\u9ed8\u9ed8\u5730\u7ad9\u4e86\u8d77\u6765\uff0c\u52a8\u4f5c\u8fd8\u6709\u4e9b\u50f5\u786c\u3002\n\n\u6211\u770b\u7740\u5979\u4eec\u4e09\u4e2a\uff0c\u7136\u540e\u53c8\u770b\u5411\u7741\u7740\u4e00\u53cc\u597d\u5947\u7684\u5927\u773c\u775b\u770b\u7740\u6211\u4eec\u7684\u9e7f\u7720\u3002\n\n\u201c\u5c0f\u61d2\u732b\uff0c\u8981\u4e00\u8d77\u6d17\u767d\u767d\u5417\uff1f\u201d\n\n\u9e7f\u7720\u7acb\u523b\u5f00\u5fc3\u5730\u8df3\u4e86\u8d77\u6765\uff0c\u5149\u7740\u8eab\u5b50\u5c31\u671d\u6211\u4eec\u8dd1\u6765\uff0c\u50cf\u53ea\u7ec8\u4e8e\u7b49\u5230\u4e3b\u4eba\u53ec\u5524\u7684\u5c0f\u72d7\u3002\n\n\u201c\u597d\u8036\uff01\u201d\n\n\u6d74\u5ba4\u5f88\u5927\uff0c\u5de8\u5927\u7684\u5706\u5f62\u6d74\u7f38\u5360\u636e\u4e86\u623f\u95f4\u7684\u4e00\u89d2\uff0c\u65c1\u8fb9\u662f\u72ec\u7acb\u7684\u6dcb\u6d74\u95f4\u3002\u6e29\u7476\u8d70\u8fc7\u53bb\uff0c\u62e7\u5f00\u4e86\u6d74\u7f38\u7684\u6c34\u9f99\u5934\uff0c\u70ed\u6c34\u5954\u6d8c\u800c\u51fa\uff0c\u5f88\u5feb\uff0c\u6574\u4e2a\u6d74\u5ba4\u5c31\u5f25\u6f2b\u8d77\u4e86\u4e00\u5c42\u6e29\u6696\u7684\u3001\u6726\u80e7\u7684\u6c34\u6c7d\u3002\n\n\u6797\u521d\u590f\u4e00\u8fdb\u6d74\u5ba4\uff0c\u5c31\u8ddf\u6ca1\u9aa8\u5934\u4f3c\u7684\uff0c\u76f4\u63a5\u6ed1\u8fdb\u4e86\u8fd8\u5728\u653e\u6c34\u7684\u6d74\u7f38\u91cc\uff0c\u53d1\u51fa\u4e00\u58f0\u8212\u670d\u7684\u53f9\u606f\u3002\u9e7f\u7720\u4e5f\u6709\u6837\u5b66\u6837\uff0c\u8ddf\u7740\u8df3\u4e86\u8fdb\u53bb\uff0c\u6e85\u8d77\u4e00\u5927\u7247\u6c34\u82b1\uff0c\u60f9\u5f97\u6797\u521d\u590f\u4e00\u9635\u5c16\u53eb\u3002\n\n\u6c5f\u96ea\u72b9\u8c6b\u4e86\u4e00\u4e0b\uff0c\u4e5f\u9ed8\u9ed8\u5730\u8de8\u8fdb\u4e86\u6d74\u7f38\uff0c\u5728\u79bb\u5979\u4eec\u7a0d\u8fdc\u7684\u4e00\u89d2\u5750\u4e0b\u3002\u6e29\u7476\u5219\u9760\u5728\u6d74\u7f38\u8fb9\uff0c\u770b\u7740\u5979\u4eec\u6253\u95f9\u3002\n\n\u6211\u7ad9\u5728\u95e8\u53e3\uff0c\u770b\u7740\u6d74\u7f38\u91cc\u8fd9\u5e45\u6d3b\u8272\u751f\u9999\u7684\u753b\u9762\uff0c\u4e00\u65f6\u6709\u4e9b\u4e0d\u77e5\u6240\u63aa\u3002\n\n\u201c\u50bb\u7ad9\u7740\u5e72\u561b\uff1f\u7b49\u7740\u6211\u4eec\u8bf7\u4f60\u8fdb\u6765\u5417\uff1f\u201d\n\n\u662f\u6e29\u7476\u7684\u58f0\u97f3\u3002\u5979\u9760\u5728\u6d74\u7f38\u8fb9\u7f18\uff0c\u6c34\u6c7d\u6c24\u6c32\u4e86\u5979\u7684\u8138\uff0c\u8ba9\u5979\u770b\u8d77\u6765\u6bd4\u5e73\u65f6\u66f4\u52a0\u6e29\u67d4\uff0c\u4e5f\u66f4\u52a0\u2026\u2026\u8bf1\u4eba\u3002\n\n\u6211\u8fd9\u624d\u78e8\u78e8\u8e6d\u8e6d\u5730\u8d70\u4e86\u8fc7\u53bb\uff0c\u4e5f\u8de8\u8fdb\u4e86\u6d74\u7f38\u3002\u6c34\u5f88\u70ed\uff0c\u77ac\u95f4\u5305\u88f9\u4e86\u6211\u7684\u8eab\u4f53\uff0c\u51b2\u5237\u6389\u4e86\u4e00\u8eab\u7684\u75b2\u60eb\u548c\u9ecf\u817b\u3002\u6d74\u7f38\u5f88\u5927\uff0c\u6211\u4eec\u4e94\u4e2a\u4eba\u6324\u5728\u91cc\u9762\uff0c\u867d\u7136\u6709\u4e9b\u62e5\u6324\uff0c\u4f46\u76ae\u80a4\u4e0e\u76ae\u80a4\u4e4b\u95f4\u90a3\u79cd\u6e29\u70ed\u800c\u6ed1\u817b\u7684\u89e6\u611f\uff0c\u5374\u5e26\u6765\u4e00\u79cd\u524d\u6240\u672a\u6709\u7684\u3001\u4eb2\u5bc6\u65e0\u95f4\u7684\u5b89\u5fc3\u611f\u3002\n\n\u201c\u4ee5\u540e\u6211\u4eec\u4e5f\u80fd\u7ecf\u5e38\u4e00\u8d77\u6d17\u5417\uff1f\u201d\n\n\u9e7f\u7720\u5e26\u7740\u5174\u594b\u548c\u671f\u5f85\u95ee\u3002\n\n\u201c\u5f53\u7136\u5566\uff01\u201d\n\n\u6e29\u7476\u6478\u6478\u5979\u7684\u5934\uff0c\u6e29\u548c\u7684\u7b11\u7b11\u3002\n\n\u6211\u521a\u60f3\u653e\u677e\u4e00\u4e0b\uff0c\u4e00\u53ea\u767d\u7699\u7684\u5c0f\u811a\u5c31\u5ffd\u7136\u4ece\u6c34\u4e0b\u4f38\u4e86\u8fc7\u6765\uff0c\u4e0d\u8f7b\u4e0d\u91cd\u5730\u8e39\u4e86\u8e39\u6211\u7684\u5c0f\u817f\u3002\n\n\u662f\u6797\u521d\u590f\u3002\u5979\u8db4\u5728\u6d74\u7f38\u8fb9\uff0c\u4e0b\u5df4\u6401\u5728\u624b\u81c2\u4e0a\uff0c\u4fa7\u7740\u8138\u770b\u6211\uff0c\u90a3\u53cc\u6c34\u6c6a\u6c6a\u7684\u773c\u775b\u91cc\u6ee1\u662f\u72e1\u9ee0\u3002\n\n\u201c\u5582\uff0c\u7f6a\u9b41\u7978\u9996\uff0c\u4e0d\u6765\u4f3a\u5019\u4e00\u4e0b\u53d7\u5bb3\u8005\u5417\uff1f\u6211\u7684\u8170\u90fd\u5feb\u65ad\u4e86\u3002\u201d\n\n\u6211\u770b\u7740\u5979\u90a3\u526f\u6837\u5b50\uff0c\u65e0\u5948\u5730\u7b11\u4e86\u7b11\uff0c\u62ff\u8fc7\u65c1\u8fb9\u7684\u6c90\u6d74\u9732\u548c\u6d74\u7403\uff0c\u632a\u5230\u5979\u8eab\u8fb9\u3002\u6ce1\u6cab\u5f88\u5feb\u5c31\u4e30\u5bcc\u8d77\u6765\uff0c\u6211\u628a\u67d4\u8f6f\u7684\u6d74\u7403\u6309\u5728\u5979\u5149\u6ed1\u7684\u8eab\u4f53\u4e0a\uff0c\u7f13\u7f13\u5730\u6253\u7740\u5708\u3002\u5979\u7684\u76ae\u80a4\u5f88\u7ec6\u817b\uff0c\u5728\u70ed\u6c34\u7684\u6d78\u6ce1\u4e0b\u6cdb\u7740\u4e00\u5c42\u6f02\u4eae\u7684\u7c89\u8272\u3002\u6211\u7684\u624b\u987a\u7740\u5979\u4f18\u7f8e\u7684\u8eab\u4f53\u66f2\u7ebf\uff0c\u4e00\u70b9\u4e00\u70b9\u5730\u5411\u4e0b\uff0c\u6ed1\u8fc7\u5979\u5f62\u72b6\u4f18\u7f8e\u7684\u4e73\u623f\uff0c\u6700\u540e\u505c\u5728\u4e86\u5979\u795e\u79d8\u7684\u79c1\u4eba\u5730\u5e26\u3002\n\n\u5979\u5728\u6211\u624b\u638c\u78b0\u4e0a\u53bb\u7684\u77ac\u95f4\uff0c\u8eab\u4f53\u731b\u5730\u4e00\u98a4\uff0c\u53d1\u51fa\u4e00\u58f0\u7ec6\u788e\u7684\u3001\u538b\u6291\u4e0d\u4f4f\u7684\u547b\u541f\u3002\n\n\u201c\u554a\uff01\u574f\u4eba\uff01\u201d\n\n\u6211\u563f\u563f\u4e00\u7b11\u3002\n\n\u6413\u6d17\u5b8c\u4e86\u6797\u521d\u590f\uff0c\u6211\u53c8\u5bf9\u4e0a\u4e86\u6e29\u7476\u7684\u76ee\u5149\uff0c\u5979\u5634\u89d2\u9732\u51fa\u4e86\u597d\u770b\u7684\u5f27\u5ea6\uff0c\u6307\u7740\u81ea\u5df1\u7684\u8eab\u4f53\u3002\n\n\u201c\u9646\u516c\u5b50\uff0c\u5e2e\u6211\u4eec\u51e0\u4e2a\u90fd\u6413\u4e00\u4e0b\u600e\u4e48\u6837\uff1f\u201d\n\n\u548c\u6797\u521d\u590f\u7684\u7d27\u81f4\u4e0d\u540c\uff0c\u6e29\u7476\u7684\u8eab\u4f53\u8981\u4e30\u8174\u4e00\u4e9b\uff0c\u6bcf\u4e00\u5bf8\u808c\u80a4\u90fd\u5e26\u7740\u4e00\u79cd\u6210\u719f\u7684\u3001\u6070\u5230\u597d\u5904\u7684\u67d4\u8f6f\u3002\u5f53\u6211\u5e2e\u5979\u6e05\u6d17\u80f8\u524d\u65f6\uff0c\u90a3\u4e24\u56e2\u5de8\u5927\u7684\u3001\u6c89\u7538\u7538\u7684\u67d4\u8f6f\u5728\u6211\u638c\u5fc3\u4e0b\u53d8\u6362\u7740\u5f62\u72b6\uff0c\u9876\u7aef\u7684\u4e73\u5934\u65e9\u5df2\u786c\u633a\u5982\u77f3\u3002\n\n\u8f6e\u5230\u6c5f\u96ea\u65f6\uff0c\u5979\u663e\u5f97\u6709\u4e9b\u50f5\u786c\u548c\u4e0d\u81ea\u5728\u3002\u6211\u6709\u4e9b\u4e0d\u6562\u770b\u5979\u7684\u773c\u775b\uff0c\u53ea\u80fd\u4e13\u6ce8\u5730\u3001\u8fd1\u4e4e\u8654\u8bda\u5730\u4e3a\u5979\u6e05\u6d17\u7740\u540e\u80cc\u3002\u5979\u7684\u80cc\u5f88\u7626\uff0c\u80fd\u6e05\u6670\u5730\u6478\u5230\u8774\u8776\u9aa8\u7684\u8f6e\u5ed3\u3002\u5f53\u6211\u7684\u624b\u65e0\u610f\u95f4\u6ed1\u8fc7\u5979\u7684\u814b\u4e0b\u65f6\uff0c\u5979\u6574\u4e2a\u4eba\u90fd\u7ef7\u7d27\u4e86\uff0c\u53d1\u51fa\u4e00\u58f0\u6781\u8f7b\u7684\u3001\u50cf\u5c0f\u732b\u4e00\u6837\u7684\u60ca\u547c\u3002\n\n\u6700\u540e\u662f\u9e7f\u7720\u3002\u5979\u50cf\u6761\u5149\u6ed1\u7684\u5c0f\u9c7c\u4e00\u6837\uff0c\u76f4\u63a5\u8eba\u5728\u4e86\u6211\u7684\u6000\u91cc\uff0c\u628a\u6574\u4e2a\u540e\u80cc\u90fd\u4ea4\u7ed9\u4e86\u6211\u3002\u5979\u7684\u8eab\u4f53\u8fd8\u5e26\u7740\u5c11\u5973\u7684\u9752\u6da9\uff0c\u76ae\u80a4\u767d\u5f97\u50cf\u900f\u660e\u4e00\u6837\uff0c\u6211\u751a\u81f3\u80fd\u770b\u5230\u5e95\u4e0b\u6de1\u9752\u8272\u7684\u8840\u7ba1\u3002\u5979\u4f3c\u4e4e\u5f88\u4eab\u53d7\uff0c\u8212\u670d\u5730\u772f\u7740\u773c\u775b\uff0c\u5589\u5499\u91cc\u53d1\u51fa\u6ee1\u8db3\u7684\u3001\u5495\u565c\u5495\u565c\u7684\u58f0\u97f3\u3002\n\n\u201c\u54ce\u5440\uff0c\u597d\u786c\uff0c\u6233\u5230\u6211\u4e86\uff01\u201d\n\n\u88ab\u6211\u518d\u5ea6\u575a\u633a\u7684\u9634\u830e\u6233\u5230\u540e\uff0c\u5979\u62b1\u6028\u7740\u3002\n\n\u6211\u7d22\u6027\u76f4\u63a5\u5c06\u5979\u5fae\u5fae\u62ac\u8d77\uff0c\u5355\u5200\u76f4\u5165\u7684\u518d\u5ea6\u4ece\u5979\u90a3\u7c89\u5ae9\u7684\u5c0f\u7a74\u4e2d\u63d2\u4e86\u8fdb\u53bb\u3002\n\n\u201c\u554a\uff01\u201d\n\n\u6362\u6765\u4e86\u5979\u7684\u4e00\u58f0\u60ca\u547c\u3002\n\n\u770b\u5230\u8fd9\u4e00\u5e55\uff0c\u6797\u521d\u590f\u5634\u5df4\u6709\u4e9b\u4e0d\u6ee1\u7684\u5fae\u5fae\u561f\u8d77\uff0c\u800c\u6e29\u7476\u5219\u662f\u5fae\u5fae\u4e00\u7b11\u3002\n\n\u90fd\u6413\u6d17\u5e72\u51c0\u540e\uff0c\u6d74\u7f38\u91cc\u7684\u6c34\u5df2\u7ecf\u6709\u4e9b\u6d51\u6d4a\u4e86\u3002\n\n\u6211\u4eec\u4ece\u6d74\u7f38\u91cc\u51fa\u6765\uff0c\u7528\u5de8\u5927\u7684\u6d74\u5dfe\u64e6\u5e72\u8eab\u4f53\u3002\u7136\u540e\uff0c\u6e29\u7476\u53f9\u4e86\u53e3\u6c14\u3002\n\n\u201c\u597d\u4e86\uff0c\u516c\u4e3b\u4eec\uff0c\u6b22\u4e50\u7684\u65f6\u5149\u7ed3\u675f\u4e86\u3002\u73b0\u5728\uff0c\u8be5\u6765\u6253\u626b\u6211\u4eec\u81ea\u5df1\u7684\u2018\u6218\u573a\u2019\u4e86\u3002\u201d\n\n\u5979\u7684\u76ee\u5149\u843d\u5728\u6211\u8eab\u4e0a\uff0c\u5e26\u7740\u4e00\u4e1d\u4fc3\u72ed\u7684\u7b11\u610f\u3002\n\n\u201c\u5c24\u5176\u662f\u67d0\u4f4d\u7cbe\u529b\u65fa\u76db\u7684\u5148\u751f\uff0c\u4f60\u7684\u2018\u4f5c\u54c1\u2019\u53ef\u662f\u904d\u5730\u5f00\u82b1\u5462\u3002\u201d\n\n\n\n\n66.\n\u6e29\u7476\u90a3\u53e5\u5e26\u7740\u4fc3\u72ed\u7b11\u610f\u7684\u8c03\u4f83\uff0c\u8ba9\u5ba2\u5385\u91cc\u521a\u521a\u8fd8\u6c89\u6d78\u5728\u6e29\u5b58\u91cc\u7684\u51e0\u4e2a\u4eba\uff0c\u77ac\u95f4\u90fd\u95f9\u4e86\u4e2a\u5927\u7ea2\u8138\u3002\n\n\u201c\u7476\u7476\u59d0\uff01\u201d\u6797\u521d\u590f\u7b2c\u4e00\u4e2a\u53d1\u51fa\u6297\u8bae\uff0c\u5979\u4f38\u624b\u5c31\u60f3\u53bb\u6342\u6e29\u7476\u7684\u5634\uff0c\u4f46\u521a\u4ece\u6d74\u7f38\u91cc\u51fa\u6765\uff0c\u6d51\u8eab\u90fd\u8fd8\u8f6f\u7ef5\u7ef5\u7684\uff0c\u811a\u4e0b\u4e00\u6ed1\uff0c\u5dee\u70b9\u6454\u5012\uff0c\u5e78\u597d\u88ab\u6e29\u7476\u773c\u75be\u624b\u5feb\u5730\u6276\u4f4f\u4e86\u3002\n\n\u201c\u8fd8\u8bf4\u5462\uff0c\u201d\u6797\u521d\u590f\u7ad9\u7a33\u4e86\uff0c\u4e0d\u670d\u6c14\u5730\u633a\u4e86\u633a\u80f8\uff0c\u90a3\u4e24\u9897\u521a\u521a\u88ab\u6211\u63c9\u6413\u8fc7\u7684\u3001\u8fd8\u5e26\u7740\u7ea2\u6655\u7684\u4e73\u5c16\u5728\u7a7a\u6c14\u4e2d\u5fae\u5fae\u98a4\u6296\uff0c\u201c\u4e5f\u4e0d\u77e5\u9053\u662f\u8c01\uff0c\u521a\u624d\u53eb\u5f97\u6700\u5927\u58f0\uff0c\u8ddf\u8981\u88ab\u6740\u4e86\u4e00\u6837\u3002\u201d\n\n\u6e29\u7476\u7684\u8138\u4e5f\u96be\u5f97\u5730\u7ea2\u4e86\u4e00\u4e0b\uff0c\u5979\u4f38\u51fa\u624b\u6307\uff0c\u4e0d\u8f7b\u4e0d\u91cd\u5730\u70b9\u4e86\u4e00\u4e0b\u6797\u521d\u590f\u7684\u989d\u5934\u3002\n\n\u201c\u5c31\u4f60\u8bdd\u591a\u3002\u201d\n\n\u6c5f\u96ea\u6ca1\u6709\u53c2\u4e0e\u5979\u4eec\u7684\u6597\u5634\u3002\u51e0\u4eba\u6765\u5230\u5ba2\u5385\u540e\uff0c\u5979\u53ea\u662f\u9ed8\u9ed8\u5730\u770b\u4e86\u4e00\u773c\u90a3\u7247\u72fc\u85c9\u7684\u5730\u677f\uff0c\u7136\u540e\u8f6c\u8eab\u8d70\u8fdb\u4e86\u50a8\u7269\u95f4\uff0c\u4ece\u91cc\u9762\u62ff\u51fa\u4e86\u62d6\u628a\u548c\u6c34\u6876\u3002\n\n\u9e7f\u7720\u5219\u50cf\u4e00\u53ea\u597d\u5947\u7684\u5c0f\u52a8\u7269\uff0c\u5149\u7740\u811a\uff0c\u5c0f\u5fc3\u7ffc\u7ffc\u5730\u8e29\u8fc7\u90a3\u4e9b\u8fd8\u5e26\u7740\u9ecf\u817b\u75d5\u8ff9\u7684\u5730\u677f\uff0c\u8d70\u5230\u6c99\u53d1\u524d\uff0c\u62ff\u8d77\u4e00\u4e2a\u62b1\u6795\uff0c\u4f38\u51fa\u5c0f\u5c0f\u7684\u624b\u6307\uff0c\u597d\u5947\u5730\u6cbe\u4e86\u4e00\u70b9\u5df2\u7ecf\u534a\u5e72\u7684\u3001\u6211\u4eec\u6df7\u5408\u5728\u4e00\u8d77\u7684\u4f53\u6db2\uff0c\u7136\u540e\u653e\u5230\u9f3b\u5b50\u524d\u95fb\u4e86\u95fb\u3002\n\n\u201c\u5514\u2026\u2026\u6709\u70b9\u50cf\u2026\u2026\u54b8\u5473\u7684\u725b\u5976\uff1f\u201d\n\n\u5979\u62ac\u8d77\u5934\uff0c\u90a3\u53cc\u7eaf\u51c0\u7684\u5927\u773c\u775b\u91cc\u5145\u6ee1\u4e86\u5b66\u672f\u6027\u7684\u63a2\u7a76\uff0c\u770b\u7740\u6211\u3002\n\n\u6211\u611f\u89c9\u81ea\u5df1\u7684\u8138\u988a\u201c\u8f70\u201d\u7684\u4e00\u4e0b\u5c31\u70e7\u4e86\u8d77\u6765\u3002\n\n\u201c\u4e0d\u8bb8\u5c1d\uff01\u201d\n\n\u6797\u521d\u590f\u548c\u6e29\u7476\u51e0\u4e4e\u662f\u5f02\u53e3\u540c\u58f0\u5730\u53d1\u51fa\u4e00\u58f0\u60ca\u547c\uff0c\u4e24\u4e2a\u4eba\u4e00\u4e2a\u7bad\u6b65\u51b2\u8fc7\u53bb\uff0c\u4e00\u4e2a\u62a2\u8d70\u4e86\u9e7f\u7720\u624b\u91cc\u7684\u62b1\u6795\uff0c\u4e00\u4e2a\u62c9\u4f4f\u4e86\u5979\u8fd8\u60f3\u7ee7\u7eed\u63a2\u7d22\u7684\u624b\u3002\n\n\u5c31\u8fd9\u6837\uff0c\u4e00\u573a\u4e71\u7cdf\u7cdf\u7684\u3001\u53f2\u65e0\u524d\u4f8b\u7684\u201c\u88f8\u4f53\u5927\u626b\u9664\u201d\u5f00\u59cb\u4e86\u3002\n\n\u6211\u4eec\u4e94\u4e2a\u4eba\uff0c\u8eab\u4e0a\u90fd\u4e00\u4e1d\u4e0d\u6302\u3002\u6e29\u7476\u8d1f\u8d23\u6307\u6325\uff0c\u5979\u628a\u6211\u4eec\u51e0\u4e2a\u7684\u4efb\u52a1\u5206\u914d\u5f97\u660e\u660e\u767d\u767d\u3002\u6c5f\u96ea\u8d1f\u8d23\u62d6\u5730\uff0c\u5979\u62ff\u7740\u62d6\u628a\uff0c\u4e00\u4e1d\u4e0d\u82df\u5730\uff0c\u4ece\u5ba2\u5385\u7684\u6bcf\u4e00\u4e2a\u89d2\u843d\u5f00\u59cb\u6e05\u7406\u3002\u6797\u521d\u590f\u8d1f\u8d23\u64e6\u62ed\u5bb6\u5177\uff0c\u5979\u62ff\u7740\u62b9\u5e03\uff0c\u8dea\u5728\u5730\u6bef\u4e0a\uff0c\u6485\u7740\u90a3\u9897\u633a\u7fd8\u7684\u3001\u5f62\u72b6\u5b8c\u7f8e\u7684\u5c41\u80a1\uff0c\u7528\u529b\u5730\u64e6\u7740\u8336\u51e0\u7684\u8fb9\u8fb9\u89d2\u89d2\u3002\n\n\u9e7f\u7720\u7684\u4efb\u52a1\u6700\u7b80\u5355\uff0c\u5c31\u662f\u628a\u6240\u6709\u6563\u843d\u5728\u5730\u4e0a\u7684\u3001\u6211\u4eec\u51e0\u4e2a\u7684\u8863\u670d\uff0c\u90fd\u6536\u8d77\u6765\uff0c\u6254\u8fdb\u6d17\u8863\u673a\u3002\u5979\u62b1\u7740\u4e00\u5806\u4e71\u4e03\u516b\u7cdf\u7684\u3001\u751a\u81f3\u8fd8\u6cbe\u7740\u4e0d\u660e\u6db2\u4f53\u7684\u8863\u7269\uff0c\u5728\u5ba2\u5385\u91cc\u8dd1\u6765\u8dd1\u53bb\uff0c\u50cf\u4e00\u53ea\u52e4\u52b3\u7684\u5c0f\u871c\u8702\u3002\n\n\u800c\u6211\uff0c\u5219\u88ab\u5206\u914d\u4e86\u6700\u8270\u5de8\u7684\u4efb\u52a1\u2014\u2014\u6e05\u7406\u6c99\u53d1\u3002\u90a3\u5f20\u53ef\u601c\u7684\u5e03\u827a\u6c99\u53d1\uff0c\u662f\u6218\u51b5\u6700\u6fc0\u70c8\u7684\u5730\u65b9\uff0c\u6c99\u53d1\u57ab\u4e0a\u3001\u9760\u80cc\u4e0a\uff0c\u751a\u81f3\u7f1d\u9699\u91cc\uff0c\u90fd\u7559\u4e0b\u4e86\u6211\u4eec\u75af\u72c2\u7684\u75d5\u8ff9\u3002\u6211\u62ff\u7740\u6e05\u6d01\u5242\u548c\u5237\u5b50\uff0c\u51e0\u4e4e\u662f\u8dea\u5728\u90a3\u91cc\uff0c\u4e00\u70b9\u4e00\u70b9\u5730\u5237\u6d17\u7740\u3002\n\n\u6574\u4e2a\u5ba2\u5385\u91cc\uff0c\u5145\u6ee1\u4e86\u5404\u79cd\u5404\u6837\u7684\u58f0\u97f3\u3002\u6c34\u6876\u78b0\u649e\u7684\u58f0\u97f3\uff0c\u62b9\u5e03\u6469\u64e6\u7684\u58f0\u97f3\uff0c\u8fd8\u6709\u5979\u4eec\u51e0\u4e2a\u65f6\u4e0d\u65f6\u7206\u53d1\u51fa\u7684\u5b09\u7b11\u6253\u95f9\u58f0\u3002\n\n\u201c\u54ce\u5440\uff01\u201d\n\n\u662f\u6797\u521d\u590f\u7684\u60ca\u547c\u3002\u6211\u56de\u5934\u770b\u53bb\uff0c\u53ea\u89c1\u5979\u8dea\u5728\u5730\u6bef\u4e0a\uff0c\u4e0d\u77e5\u9053\u600e\u4e48\u56de\u4e8b\uff0c\u624b\u91cc\u7684\u62b9\u5e03\u6389\u5230\u4e86\u8336\u51e0\u5e95\u4e0b\u3002\u5979\u6485\u7740\u5c41\u80a1\uff0c\u52aa\u529b\u5730\u4f38\u957f\u624b\u81c2\u53bb\u591f\uff0c\u90a3\u4e2a\u59ff\u52bf\u8ba9\u5979\u8eab\u4f53\u7684\u4e0b\u534a\u90e8\u5206\uff0c\u5b8c\u5b8c\u5168\u5168\u5730\u66b4\u9732\u5728\u4e86\u6211\u7684\u773c\u524d\u3002\u90a3\u4e24\u74e3\u88ab\u6211\u8e42\u8e8f\u4e86\u4e00\u665a\u4e0a\u7684\u3001\u5706\u6da6\u7684\u81c0\u8089\uff0c\u6b64\u523b\u6b63\u968f\u7740\u5979\u7684\u52a8\u4f5c\u5fae\u5fae\u6643\u52a8\u7740\uff0c\u4e2d\u95f4\u90a3\u9053\u5e7d\u6df1\u7684\u3001\u8fd8\u5e26\u7740\u4e00\u4e1d\u7ea2\u80bf\u7684\u7f1d\u9699\uff0c\u82e5\u9690\u82e5\u73b0\u3002\n\n\u6211\u611f\u89c9\u81ea\u5df1\u7684\u5589\u5499\u53c8\u5f00\u59cb\u53d1\u5e72\u3002\n\n\u201c\u9646\u6c89\uff01\u4f60\u53d1\u4ec0\u4e48\u5446\uff01\u5feb\u6765\u5e2e\u6211\u4e00\u4e0b\uff01\u201d\u5979\u56de\u8fc7\u5934\uff0c\u51b2\u6211\u558a\u9053\u3002\n\n\u6211\u521a\u60f3\u8fc7\u53bb\uff0c\u53e6\u4e00\u5177\u67d4\u8f6f\u7684\u3001\u5149\u6d01\u7684\u8eab\u4f53\u5c31\u4ece\u6211\u65c1\u8fb9\u6324\u4e86\u8fc7\u53bb\u3002\u662f\u9e7f\u7720\u3002\n\n\u5979\u4e5f\u5b66\u7740\u6797\u521d\u590f\u7684\u6837\u5b50\uff0c\u6485\u8d77\u5c41\u80a1\uff0c\u8db4\u5728\u5730\u4e0a\u5f80\u8336\u51e0\u5e95\u4e0b\u770b\u3002\n\n\u201c\u5728\u8fd9\u91cc\u5440\uff01\u201d\n\n\u6211\u770b\u7740\u773c\u524d\u8fd9\u5e45\u7531\u4e24\u4e2a\u540c\u6837\u8d64\u88f8\u3001\u540c\u6837\u633a\u7fd8\u7684\u5c41\u80a1\u6784\u6210\u7684\u3001\u6781\u5177\u51b2\u51fb\u529b\u7684\u753b\u9762\uff0c\u611f\u89c9\u81ea\u5df1\u521a\u521a\u624d\u5e73\u606f\u4e0b\u53bb\u7684\u6b32\u671b\uff0c\u53c8\u4e00\u6b21\u6709\u4e86\u62ac\u5934\u7684\u8d8b\u52bf\u3002\n\n\u201c\u4f60\u4eec\u4e24\u4e2a\u5728\u5e72\u4ec0\u4e48\uff1f\u53e0\u7f57\u6c49\u5417\uff1f\u201d\u6e29\u7476\u65e0\u5948\u7684\u58f0\u97f3\u4ece\u65c1\u8fb9\u4f20\u6765\u3002\n\n\u82b1\u4e86\u5c06\u8fd1\u4e00\u4e2a\u5c0f\u65f6\uff0c\u6211\u4eec\u624d\u7ec8\u4e8e\u628a\u8fd9\u4e2a\u5bb6\u6062\u590d\u4e86\u539f\u6837\u3002\n\n\u5ba2\u5385\u91cc\u7a97\u660e\u51e0\u51c0\uff0c\u7a7a\u6c14\u4e2d\u5f25\u6f2b\u7740\u6d88\u6bd2\u6c34\u548c\u6e05\u6d01\u5242\u6df7\u5408\u5728\u4e00\u8d77\u7684\u3001\u6e05\u65b0\u7684\u5473\u9053\uff0c\u4eff\u4f5b\u521a\u521a\u90a3\u573a\u75af\u72c2\u7684\u3001\u6deb\u9761\u7684\u6d3e\u5bf9\uff0c\u53ea\u662f\u4e00\u573a\u4e0d\u771f\u5b9e\u7684\u68a6\u3002\n\n\u6240\u6709\u4eba\u90fd\u7d2f\u5f97\u4e0d\u884c\uff0c\u6a2a\u4e03\u7ad6\u516b\u5730\u5012\u5728\u65b0\u6362\u7684\u5e72\u51c0\u5730\u6bef\u4e0a\uff0c\u50cf\u51e0\u6761\u88ab\u51b2\u4e0a\u4e86\u5cb8\u7684\u3001\u8131\u6c34\u7684\u9c7c\u3002\n\n\u6211\u8eba\u5728\u6700\u4e2d\u95f4\uff0c\u9e7f\u7720\u6795\u7740\u6211\u7684\u809a\u5b50\uff0c\u6797\u521d\u590f\u9760\u7740\u6211\u7684\u80a9\u8180\uff0c\u6c5f\u96ea\u5219\u96be\u5f97\u5730\u6ca1\u6709\u8eb2\u5f00\uff0c\u8eba\u5728\u4e86\u6211\u7684\u53e6\u4e00\u8fb9\u3002\u6e29\u7476\u5219\u62ff\u4e86\u4e2a\u62b1\u6795\uff0c\u9760\u5728\u6c99\u53d1\u817f\u4e0a\uff0c\u95ed\u7740\u773c\u775b\uff0c\u957f\u957f\u5730\u8212\u4e86\u4e00\u53e3\u6c14\u3002\n\n\u6211\u4eec\u5c31\u8fd9\u6837\u5b89\u9759\u5730\u8eba\u7740\uff0c\u611f\u53d7\u7740\u5f7c\u6b64\u7684\u4f53\u6e29\u548c\u547c\u5438\uff0c\u4e00\u79cd\u524d\u6240\u672a\u6709\u7684\u3001\u5b89\u5b81\u800c\u6e29\u6696\u7684\u5e78\u798f\u611f\uff0c\u5c06\u6211\u4eec\u6bcf\u4e2a\u4eba\u90fd\u7d27\u7d27\u5730\u5305\u88f9\u4f4f\u3002\n\n\u201c\u597d\u4e86\u3002\u201d\n\n\u4e0d\u77e5\u9053\u8fc7\u4e86\u591a\u4e45\uff0c\u6e29\u7476\u7684\u58f0\u97f3\u624d\u518d\u6b21\u54cd\u8d77\u3002\u5979\u7741\u5f00\u773c\uff0c\u770b\u7740\u6211\u548c\u6c5f\u96ea\u3002\n\n\u201c\u65e9\u70b9\u4f11\u606f\u5427\uff0c\u660e\u665a\u7684\u620f\uff0c\u8981\u5f00\u573a\u4e86\u3002\u201d\n\n\n\n\n67.\n\u6e29\u7476\u90a3\u53e5\u5e26\u7740\u7b11\u610f\u7684\u201c\u660e\u665a\u7684\u620f\uff0c\u8981\u5f00\u573a\u4e86\u201d\uff0c\u50cf\u4e00\u76c6\u51b7\u6c34\uff0c\u6d47\u7184\u4e86\u5ba2\u5385\u91cc\u521a\u521a\u5347\u817e\u8d77\u7684\u3001\u90a3\u70b9\u52ab\u540e\u4f59\u751f\u7684\u6175\u61d2\u6e29\u60c5\u3002\n\n\u662f\u7684\uff0c\u4e00\u5207\u90fd\u8fd8\u6ca1\u6709\u7ed3\u675f\u3002\n\n\u5ba2\u5385\u91cc\u77ac\u95f4\u5b89\u9759\u4e86\u4e0b\u6765\u3002\u6211\u80fd\u611f\u89c9\u5230\uff0c\u6797\u521d\u590f\u548c\u6c5f\u96ea\u7684\u76ee\u5149\uff0c\u90fd\u50cf\u63a2\u7167\u706f\u4e00\u6837\u805a\u7126\u5728\u4e86\u6211\u8eab\u4e0a\u3002\n\n\u201c\u65e9\u70b9\u4f11\u606f\uff0c\u660e\u5929\u2026\u2026\u53ef\u662f\u5f88\u8017\u8d39\u4f53\u529b\u7684\u4e00\u5929\u3002\u201d\n\n\u5979\u7ad9\u4e86\u8d77\u6765\uff0c\u5f80\u697c\u4e0a\u8d70\u53bb\uff0c\u8d64\u88f8\u7684\u8eab\u5f71\u6d88\u5931\u5728\u697c\u68af\u62d0\u89d2\u3002\n\n\u201c\u6211\u4e5f\u8981\u7761\u89c9\u53bb\u5566\uff01\u201d\n\n\u9e7f\u7720\u4f38\u4e86\u4e2a\u61d2\u8170\u3002\n\n\u201c\u7d2f\u6b7b\u4e86\u3002\u201d\n\n\u73b0\u5728\uff0c\u5ba2\u5385\u91cc\u53ea\u5269\u4e0b\u6211\u4eec\u4e09\u4e2a\u4eba\uff0c\u6c14\u6c1b\u6709\u4e9b\u5c34\u5c2c\u3002\n\n\u201c\u90a3\u4e2a\u2026\u2026\u6211\u4e5f\u53bb\u7761\u4e86\uff01\u201d\n\n\u6797\u521d\u590f\u51e0\u4e4e\u662f\u7acb\u523b\u5c31\u8df3\u4e86\u8d77\u6765\uff0c\u5979\u751a\u81f3\u6ca1\u770b\u6211\u548c\u6c5f\u96ea\u4e00\u773c\uff0c\u549a\u549a\u549a\u7684\u56de\u5230\u81ea\u5df1\u623f\u95f4\uff0c\u7830\u7684\u4e00\u58f0\u5173\u4e0a\u4e86\u95e8\uff0c\u50cf\u662f\u8eab\u540e\u6709\u9b3c\u5728\u8ffd\u3002\n\n\u597d\u4e86\u3002\n\n\u73b0\u5728\u53ea\u5269\u4e0b\u6211\u548c\u6c5f\u96ea\u4e86\u3002\n\n\u6211\u4eec\u4e24\u4e2a\u4eba\uff0c\u7ad9\u5728\u8fd9\u7a7a\u65f7\u5f97\u6709\u4e9b\u8fc7\u5206\u7684\u5ba2\u5385\u91cc\uff0c\u76f8\u987e\u65e0\u8a00\u3002\n\n\u201c\u6211\u2026\u2026\u6211\u5148\u4e0a\u53bb\u3002\u201d\n\n\u6700\u540e\uff0c\u8fd8\u662f\u6c5f\u96ea\u5148\u5f00\u4e86\u53e3\u3002\u5979\u7684\u8138\u6709\u4e9b\u5fae\u5fae\u7684\u7ea2\u6da6\u3002\n\n\u6211\u4e00\u4e2a\u4eba\u5728\u5ba2\u5385\u91cc\u7ad9\u4e86\u5f88\u4e45\uff0c\u624d\u957f\u957f\u5730\u53f9\u4e86\u4e00\u53e3\u6c14\uff0c\u4e5f\u8d70\u4e0a\u4e86\u697c\u3002\n\n\u7ec8\u7a76\u8fd8\u662f\u6709\u4e9b\u4e0d\u9002\u5e94\u554a\u3002\n\n\u4e3b\u5367\u7684\u623f\u95e8\u865a\u63a9\u7740\uff0c\u91cc\u9762\u900f\u51fa\u4e00\u70b9\u660f\u9ec4\u7684\u5e8a\u5934\u706f\u7684\u5149\u3002\u6211\u6572\u4e86\u6572\u95e8\uff0c\u91cc\u9762\u6ca1\u6709\u56de\u5e94\u3002\u6211\u72b9\u8c6b\u4e86\u4e00\u4e0b\uff0c\u8fd8\u662f\u8f7b\u8f7b\u5730\u63a8\u5f00\u4e86\u95e8\u3002\n\n\u623f\u95f4\u5f88\u5927\uff0c\u7a7a\u6c14\u91cc\u5f25\u6f2b\u7740\u6c5f\u96ea\u8eab\u4e0a\u90a3\u79cd\u597d\u95fb\u7684\u3001\u6e05\u51b7\u7684\u9999\u6c14\u3002\n\n\u5979\u6ca1\u6709\u5728\u5e8a\u4e0a\u3002\u623f\u95f4\u6d74\u5ba4\u91cc\u4f20\u6765\u54d7\u54d7\u7684\u6c34\u58f0\uff0c\u5979\u53c8\u53bb\u6d17\u6fa1\u4e86\u3002\n\n\u6211\u73af\u987e\u4e86\u4e00\u5708\uff0c\u5728\u5e8a\u8fb9\u5750\u4e0b\uff0c\u611f\u89c9\u6d51\u8eab\u90fd\u4e0d\u81ea\u5728\u3002\u65e0\u540d\u6307\u4e0a\u90a3\u679a\u51b0\u51c9\u7684\u6212\u6307\uff0c\u5728\u6b64\u523b\u663e\u5f97\u683c\u5916\u6709\u5b58\u5728\u611f\uff0c\u784c\u5f97\u6211\u751f\u75bc\u3002\n\n\u6d74\u5ba4\u7684\u6c34\u58f0\u505c\u4e86\u3002\n\n\u53c8\u8fc7\u4e86\u5f88\u4e45\uff0c\u6d74\u5ba4\u7684\u95e8\u624d\u88ab\u62c9\u5f00\u4e00\u6761\u7f1d\u3002\u6c5f\u96ea\u7a7f\u7740\u4e00\u8eab\u9ed1\u8272\u7684\u4e1d\u8d28\u7761\u888d\uff0c\u88f9\u5f97\u4e25\u4e25\u5b9e\u5b9e\uff0c\u6e7f\u6f09\u6f09\u7684\u957f\u53d1\u7528\u6bdb\u5dfe\u5305\u7740\uff0c\u53ea\u9732\u51fa\u4e00\u5f20\u88ab\u70ed\u6c14\u84b8\u5f97\u901a\u7ea2\u7684\u5c0f\u8138\u3002\n\n\u5979\u770b\u5230\u6211\u5750\u5728\u5e8a\u8fb9\uff0c\u8138\u8272\u5fae\u7ea2\uff0c\u968f\u540e\u8f6c\u8fc7\u8eab\u62ff\u8d77\u5439\u98ce\u673a\u5439\u8d77\u4e86\u5934\u53d1\u3002\n\n\u201c\u989d\uff0c\u6211\u4e0a\u4e2a\u5395\u6240\u3002\u201d\n\n\u7b49\u6211\u4e0a\u5b8c\u5395\u6240\u51fa\u6765\uff0c\u623f\u95f4\u91cc\u53ea\u5f00\u7740\u4e00\u76cf\u660f\u6697\u7684\u5e8a\u5934\u706f\u3002\u6c5f\u96ea\u5df2\u7ecf\u8eba\u5728\u4e86\u5e8a\u4e0a\uff0c\u4f46\u5979\u8eba\u5728\u5e8a\u7684\u6700\u8fb9\u7f18\uff0c\u80cc\u5bf9\u7740\u6211\uff0c\u628a\u81ea\u5df1\u88f9\u5728\u88ab\u5b50\u91cc\uff0c\u50cf\u4e00\u4e2a\u8695\u5b9d\u5b9d\uff0c\u53ea\u7559\u4e0b\u4e00\u5934\u4e4c\u9ed1\u957f\u53d1\u94fa\u6563\u5728\u6795\u5934\u4e0a\u3002\n\n\u5c3d\u7ba1\u5df2\u7ecf\u505a\u4e86\u6700\u4eb2\u5bc6\u7684\u4e8b\u60c5\uff0c\u4f46\u5728\u4e00\u8d77\u7761\u89c9\u8fd8\u662f\u4f1a\u5bb3\u7f9e\u554a\u3002\n\n\u6bd5\u7adf\uff0c\u8fd9\u592a\u50cf\u771f\u6b63\u7684\u60c5\u4fa3\u4e86\u3002\n\n\u53ea\u6709\u6211\u4eec\u4e24\u4e2a\u4eba\u800c\u5df2\u3002\n\n\u6211\u53f9\u4e86\u53e3\u6c14\uff0c\u5728\u5979\u7a7a\u51fa\u7684\u3001\u53e6\u4e00\u8fb9\u7684\u5e8a\u6cbf\u4e0a\uff0c\u4e5f\u8eba\u4e86\u4e0b\u6765\u3002\n\n\u5e8a\u5f88\u5927\uff0c\u6211\u4eec\u4e24\u4e2a\u4eba\u4e4b\u95f4\uff0c\u9694\u7740\u4e00\u4e2a\u8db3\u4ee5\u518d\u8eba\u4e0b\u4e24\u4e2a\u4eba\u7684\u3001\u6709\u4e9b\u51b0\u51b7\u7684\u8ddd\u79bb\u3002\n\n\u623f\u95f4\u91cc\u53ea\u5269\u4e0b\u6211\u4eec\u4e24\u4e2a\u4eba\u6b64\u8d77\u5f7c\u4f0f\u7684\u3001\u540c\u6837\u538b\u6291\u800c\u7d27\u5f20\u7684\u547c\u5438\u58f0\u3002\n\n\u5c31\u5728\u6211\u4ee5\u4e3a\u8fd9\u4e00\u665a\u5c31\u8981\u5728\u8fd9\u6837\u7684\u5c34\u5c2c\u4e2d\u5ea6\u8fc7\u65f6\uff0c\u5367\u5ba4\u7684\u95e8\uff0c\u5ffd\u7136\u88ab\u201c\u5431\u5440\u201d\u4e00\u58f0\uff0c\u8f7b\u8f7b\u5730\u63a8\u5f00\u4e86\u3002\n\n\u4e00\u4e2a\u7a7f\u7740\u7c89\u8272\u540a\u5e26\u7761\u8863\u7684\u8eab\u5f71\uff0c\u62b1\u7740\u4e00\u4e2a\u6795\u5934\uff0c\u8e51\u624b\u8e51\u811a\u5730\u4ece\u95e8\u7f1d\u91cc\u6324\u4e86\u8fdb\u6765\u3002\n\n\u662f\u6797\u521d\u590f\u3002\n\n\u5979\u51b2\u7740\u6211\uff0c\u6bd4\u4e86\u4e00\u4e2a\u201c\u5618\u201d\u7684\u624b\u52bf\uff0c\u8138\u4e0a\u6302\u7740\u90a3\u79cd\u6211\u518d\u719f\u6089\u4e0d\u8fc7\u7684\u3001\u8d3c\u516e\u516e\u7684\u7b11\u5bb9\u3002\u7136\u540e\uff0c\u5979\u5c31\u90a3\u4e48\u5149\u7740\u811a\uff0c\u8d70\u5230\u4e86\u6211\u548c\u6c5f\u96ea\u4e2d\u95f4\u90a3\u7247\u7a7a\u65f7\u7684\u5730\u5e26\uff0c\u6380\u5f00\u88ab\u5b50\uff0c\u4ece\u5e8a\u5c3e\u5229\u7d22\u5730\u94bb\u4e86\u8fdb\u6765\u3002\n\n\u201c\u563f\u563f\uff0c\u201d\u5979\u6324\u5728\u6211\u4eec\u4e2d\u95f4\uff0c\u5f97\u610f\u5730\u7b11\u4e86\u4e00\u58f0\uff0c\u7136\u540e\u4e00\u5de6\u4e00\u53f3\uff0c\u4f38\u624b\u5206\u522b\u62b1\u4f4f\u4e86\u6211\u548c\u6c5f\u96ea\u7684\u8170\uff0c\u201c\u4e00\u4e2a\u4eba\u7761\u592a\u51b7\u4e86\uff0c\u6211\u6765\u7ed9\u4f60\u4eec\u6696\u6696\u5e8a\u3002\u201d\n\n\n\n\n68.\n\u53c8\u7ecf\u8fc7\u4e86\u6ca1\u7f9e\u6ca1\u81ca\u7684\u4e00\u665a\u540e\uff0c\u7b2c\u4e8c\u5929\u665a\u4e0a\uff0c\u9152\u4f1a\u5982\u671f\u800c\u81f3\u3002\n\n\u57ce\u897f\u7684\u79c1\u4eba\u4f1a\u6240\uff0c\u706f\u706b\u901a\u660e\uff0c\u50cf\u4e00\u5ea7\u77d7\u7acb\u5728\u591c\u8272\u4e2d\u7684\u3001\u7528\u91d1\u94b1\u548c\u6743\u529b\u5806\u780c\u800c\u6210\u7684\u6c34\u6676\u5bab\u6bbf\u3002\u95e8\u53e3\u505c\u6ee1\u4e86\u5404\u5f0f\u5404\u6837\u7684\u8c6a\u8f66\uff0c\u7a7f\u7740\u534e\u4e3d\u793c\u670d\u7684\u7537\u7537\u5973\u5973\u4eec\uff0c\u8138\u4e0a\u6302\u7740\u7cbe\u81f4\u800c\u758f\u79bb\u7684\u7b11\u5bb9\uff0c\u4ece\u6211\u4eec\u8eab\u8fb9\u8d70\u8fc7\uff0c\u5e26\u8d77\u4e00\u9635\u9635\u9ad8\u7ea7\u9999\u6c34\u548c\u96ea\u8304\u6df7\u5408\u7684\u5473\u9053\u3002\n\n\u8bb8\u591a\u4eba\u770b\u5411\u6211\u7684\u76ee\u5149\uff0c\u90fd\u663e\u5f97\u6709\u4e9b\u597d\u5947\u3002\n\n\u6211\u6709\u4e9b\u4e0d\u81ea\u5728\u5730\u626f\u4e86\u626f\u9886\u5e26\uff0c\u611f\u89c9\u8116\u5b50\u88ab\u52d2\u5f97\u6709\u70b9\u5598\u4e0d\u8fc7\u6c14\u3002\u8fd9\u662f\u6c5f\u96ea\u4e3a\u6211\u51c6\u5907\u7684\u897f\u88c5\uff0c\u526a\u88c1\u5408\u4f53\uff0c\u9762\u6599\u8003\u7a76\uff0c\u4ef7\u683c\u6807\u7b7e\u4e0a\u7684\u96f6\u591a\u5230\u8ba9\u6211\u770b\u4e0d\u61c2\u3002\u4f46\u6211\u7a7f\u7740\u5b83\uff0c\u5374\u611f\u89c9\u81ea\u5df1\u50cf\u4e00\u4e2a\u5077\u7a7f\u4e86\u5927\u4eba\u8863\u670d\u7684\u5c0f\u4e11\u3002\n\n\u201c\u522b\u52a8\u3002\u201d\n\n\u8eab\u65c1\u4f20\u6765\u6c5f\u96ea\u51b0\u51b7\u7684\u58f0\u97f3\u3002\u5979\u4f38\u51fa\u624b\uff0c\u90a3\u53cc\u603b\u662f\u5f88\u51c9\u7684\u624b\u6307\u78b0\u4e86\u78b0\u6211\u7684\u9886\u7ed3\uff0c\u5e2e\u6211\u8c03\u6574\u4e86\u4e00\u4e0b\u89d2\u5ea6\u3002\u5979\u7684\u6307\u5c16\u5e26\u7740\u4e00\u4e1d\u4e0d\u6613\u5bdf\u7684\u98a4\u6296\u3002\n\n\u5979\u4eca\u665a\u5f88\u7f8e\u3002\n\n\u4e00\u6761\u6df1\u84dd\u8272\u7684\u9732\u80a9\u957f\u88d9\uff0c\u886c\u5f97\u5979\u672c\u5c31\u767d\u7699\u7684\u76ae\u80a4\u50cf\u662f\u5728\u53d1\u5149\u3002\u957f\u53d1\u88ab\u7cbe\u5fc3\u6253\u7406\u8fc7\uff0c\u76d8\u5728\u8111\u540e\uff0c\u9732\u51fa\u4f18\u7f8e\u7684\u5929\u9e45\u9888\u3002\u5979\u6ca1\u6709\u6234\u9879\u94fe\uff0c\u8116\u5b50\u4e0a\u7a7a\u8361\u8361\u7684\uff0c\u5374\u66f4\u663e\u5f97\u6e05\u51b7\u9ad8\u8d35\u3002\n\n\u5979\u7684\u624b\u81c2\uff0c\u6b63\u7d27\u7d27\u5730\u633d\u7740\u6211\u7684\u80f3\u818a\u3002\u9694\u7740\u4e00\u5c42\u8584\u8584\u7684\u897f\u88c5\u9762\u6599\uff0c\u6211\u80fd\u6e05\u6670\u5730\u611f\u89c9\u5230\u5979\u8eab\u4f53\u7684\u50f5\u786c\u548c\u51b0\u51b7\u3002\n\n\u6211\u4eec\u50cf\u4e00\u5bf9\u771f\u6b63\u7684\u3001\u5373\u5c06\u8d70\u4e0a\u6218\u573a\u7684\u4f34\u4fa3\u3002\n\n\u4e0d\u8fdc\u5904\uff0c\u6797\u521d\u590f\u548c\u5f20\u59d0\u4ece\u53e6\u4e00\u8f86\u8c6a\u8f66\u4e0a\u4e0b\u6765\u3002\u5979\u7a7f\u7740\u4e00\u6761\u767d\u8272\u7684\u516c\u4e3b\u88d9\uff0c\u5986\u5bb9\u7cbe\u81f4\u5f97\u50cf\u4e2a\u6d0b\u5a03\u5a03\u3002\u5979\u770b\u5230\u4e86\u6211\u4eec\uff0c\u773c\u795e\u5728\u6211\u4eec\u4ea4\u63e1\u7684\u624b\u81c2\u4e0a\u505c\u7559\u4e86\u4e0d\u5230\u534a\u79d2\uff0c\u7136\u540e\u5c31\u50cf\u88ab\u70eb\u5230\u4e00\u6837\uff0c\u8fc5\u901f\u79fb\u5f00\u4e86\u89c6\u7ebf\uff0c\u8138\u4e0a\u9732\u51fa\u4e86\u4e00\u4e2a\u6070\u5230\u597d\u5904\u7684\u3001\u5e26\u7740\u4e00\u4e1d\u758f\u79bb\u548c\u832b\u7136\u7684\u8868\u60c5\u3002\n\n\u5979\u5df2\u7ecf\u8fdb\u5165\u4e86\u89d2\u8272\u3002\n\n\u6211\u4eec\u6ca1\u6709\u4ea4\u6d41\uff0c\u751a\u81f3\u6ca1\u6709\u70b9\u5934\u3002\u5c31\u50cf\u4e09\u4e2a\u88ab\u547d\u8fd0\u5b89\u6392\u5728\u540c\u4e00\u4e2a\u821e\u53f0\u4e0a\u7684\u3001\u4e92\u4e0d\u76f8\u8bc6\u7684\u6f14\u5458\u3002\n\n\u6211\u4eec\u4e00\u8d77\u8d70\u8fdb\u4e86\u90a3\u4e2a\u91d1\u78a7\u8f89\u714c\u7684\u592
