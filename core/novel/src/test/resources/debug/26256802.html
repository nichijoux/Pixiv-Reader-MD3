\u81ea\u5df1\u60f3\u8981\u7684\u3002\u4f46\u5176\u5b9e\uff0c\u6211\u81ea\u5df1\u6700\u60f3\u8981\u7684\uff0c\u662f\u6211\u6700\u4e0d\u6562\u5199\uff0c\u4e5f\u6700\u4e0d\u6562\u627f\u8ba4\u7684\u4e1c\u897f\u3002\u201d\n\n\u5979\u62ac\u8d77\u5934\uff0c\u76ee\u5149\u8d8a\u8fc7\u6211\u548c\u6797\u521d\u590f\uff0c\u76f4\u76f4\u5730\u770b\u5411\u6c5f\u96ea\u3002\n\n\u201c\u6211\u5ac9\u5992\u4f60\u4eec\u6240\u6709\u4eba\u3002\u201d\n\n\u201c\u6211\u5ac9\u5992\u521d\u590f\u7684\u6562\u7231\u6562\u6068\uff0c\u5ac9\u5992\u6c5f\u96ea\u7684\u7eaf\u7cb9\uff0c\u751a\u81f3\u5ac9\u5992\u7720\u7720\u7684\u2026\u2026\u53ef\u4ee5\u4ec0\u4e48\u90fd\u4e0d\u7528\u60f3\u3002\u201d\n\n\u201c\u56e0\u4e3a\u4f60\u4eec\u662f\u771f\u5b9e\u7684\u3002\u4f60\u4eec\u7684\u75db\u82e6\uff0c\u4f60\u4eec\u7684\u5feb\u4e50\uff0c\u4f60\u4eec\u7684\u5ac9\u5992\uff0c\u90fd\u662f\u70ed\u6c14\u817e\u817e\u7684\uff0c\u662f\u6d3b\u7740\u7684\u3002\u201d\n\n\u201c\u800c\u6211\uff0c\u50cf\u4e00\u4e2a\u7cbe\u81f4\u7684\u3001\u88c5\u6ee1\u4e86\u7406\u8bba\u7684\u7a7a\u58f3\u3002\u6211\u6e34\u671b\u88ab\u586b\u6ee1\uff0c\u6e34\u671b\u88ab\u2026\u2026\u7c97\u66b4\u5730\u5bf9\u5f85\uff0c\u6e34\u671b\u6709\u4e2a\u4eba\u80fd\u6495\u788e\u6211\u6240\u6709\u7684\u7406\u6027\u548c\u4f2a\u88c5\uff0c\u8ba9\u6211\u771f\u771f\u6b63\u6b63\u5730\u75bc\u4e00\u6b21\uff0c\u6216\u8005\u7231\u4e00\u6b21\u3002\u201d\n\n\u5979\u7684\u76ee\u5149\uff0c\u6700\u7ec8\u7f13\u7f13\u5730\u3001\u6c89\u7538\u7538\u5730\uff0c\u843d\u5728\u4e86\u6211\u7684\u8138\u4e0a\u3002\n\n\u90a3\u53cc\u603b\u662f\u6e29\u67d4\u5f97\u50cf\u6c34\u7684\u773c\u775b\u91cc\uff0c\u6b64\u523b\uff0c\u7ffb\u6d8c\u7740\u6211\u4ece\u672a\u89c1\u8fc7\u7684\u3001\u538b\u6291\u4e86\u8bb8\u4e45\u7684\u3001\u6c79\u6d8c\u7684\u6b32\u671b\u3002\n\n\u201c\u9646\u6c89\u3002\u201d\n\n\u201c\u6211\u60f3\u8981\u4f60\u3002\u201d\n\n\u63a5\u4e0b\u6765\uff0c\u5979\u7684\u8bdd\u8ba9\u5728\u5ea7\u7684\u6240\u6709\u4eba\u90fd\u9707\u60ca\u4e86\u3002\n\n\u201c\u6211\u60f3\u8981\u4f60\u72e0\u72e0\u5730\u5360\u6709\u6211\uff0c\u50cf\u5bf9\u5f85\u4e00\u4e2a\u5a4a\u5b50\u4e00\u6837\u64cd\u6211\uff0c\u8ba9\u6211\u4e3a\u4f60\u54ed\uff0c\u4e3a\u4f60\u53eb\uff0c\u4e3a\u4f60\u53d8\u6210\u4e00\u4e2a\u53ea\u77e5\u9053\u7d22\u6c42\u7684\u3001\u771f\u6b63\u7684\u5973\u4eba\u3002\u201d\n\n\u201c\u800c\u4e0d\u662f\u73b0\u5728\u8fd9\u4e2a\u2026\u2026\u4ec0\u4e48\u90fd\u61c2\uff0c\u5374\u53c8\u4ec0\u4e48\u90fd\u5f97\u4e0d\u5230\u7684\uff0c\u6e29\u7476\u3002\u201d\n\n\n\n49.\n\u6e29\u7476\u90a3\u53e5\u77f3\u7834\u5929\u60ca\u7684\u544a\u767d\uff0c\u50cf\u4e00\u9897\u6295\u5165\u7edd\u5bf9\u96f6\u5ea6\u73af\u5883\u91cc\u7684\u70b8\u5f39\uff0c\u77ac\u95f4\u51bb\u7ed3\u4e86\u5ba2\u5385\u91cc\u6240\u6709\u7684\u65f6\u95f4\u548c\u7a7a\u6c14\u3002\n\n\u6211\u7684\u5927\u8111\u4e00\u7247\u7a7a\u767d\u3002\n\n\u6211\u770b\u7740\u5979\uff0c\u770b\u7740\u90a3\u5f20\u603b\u662f\u5e26\u7740\u6e29\u67d4\u7b11\u610f\u7684\u3001\u77e5\u6027\u7684\u8138\uff0c\u6b64\u523b\u5374\u56e0\u4e3a\u5766\u9732\u4e86\u6700\u6df1\u5904\u7684\u6b32\u671b\u800c\u67d3\u4e0a\u4e86\u4e00\u5c42\u8106\u5f31\u7684\u3001\u5b64\u6ce8\u4e00\u63b7\u7684\u7ea2\u6655\u3002\u5979\u90a3\u53cc\u603b\u662f\u50cf\u6df1\u6f6d\u4e00\u6837\u5e73\u9759\u7684\u773c\u775b\uff0c\u6b64\u523b\u6b63\u7ffb\u6d8c\u7740\u6211\u4e0d\u6562\u76f4\u89c6\u7684\u3001\u6eda\u70eb\u7684\u6f29\u6da1\u3002\n\n\u5979\u8bf4\u7684\u6bcf\u4e00\u4e2a\u5b57\uff0c\u90fd\u50cf\u70d9\u94c1\u4e00\u6837\uff0c\u6df1\u6df1\u5730\u70d9\u5728\u6211\u7684\u795e\u7ecf\u4e0a\u3002\n\n\u201c\u2026\u2026\u50cf\u5bf9\u5f85\u4e00\u4e2a\u5a4a\u5b50\u4e00\u6837\u64cd\u6211\u2026\u2026\u201d\n\n\u201c\u2026\u2026\u4e3a\u4f60\u54ed\uff0c\u4e3a\u4f60\u53eb\u2026\u2026\u201d\n\n\u8fd9\u4e9b\u6211\u53ea\u6562\u5728\u6700\u9690\u79d8\u7684\u68a6\u91cc\u5076\u5c14\u95ea\u8fc7\u7684\u3001\u5145\u6ee1\u4e86\u7f6a\u6076\u611f\u7684\u8bcd\u6c47\uff0c\u5c31\u8fd9\u4e48\u88ab\u5979\u7528\u4e00\u79cd\u5e73\u9759\u5230\u8fd1\u4e4e\u6b8b\u5fcd\u7684\u8bed\u6c14\uff0c\u6e05\u6670\u5730\u8bf4\u4e86\u51fa\u6765\u3002\n\n\u6211\u611f\u89c9\u81ea\u5df1\u7684\u547c\u5438\u90fd\u88ab\u593a\u8d70\u4e86\u3002\u4e00\u80a1\u71e5\u70ed\u7684\u3001\u5e26\u7740\u8165\u5473\u7684\u8840\u6c14\uff0c\u4ece\u6211\u7684\u5c0f\u8179\u731b\u5730\u51b2\u4e86\u4e0a\u6765\uff0c\u76f4\u9876\u5230\u6211\u7684\u5929\u7075\u76d6\u3002\u6211\u7684\u8033\u6735\u91cc\u55e1\u55e1\u4f5c\u54cd\uff0c\u773c\u524d\u7684\u4e00\u5207\u90fd\u5f00\u59cb\u53d8\u5f97\u6a21\u7cca\uff0c\u53ea\u5269\u4e0b\u5979\u90a3\u53cc\u71c3\u70e7\u7740\u6b32\u671b\u7684\u773c\u775b\u3002\n\n\u6211\u751a\u81f3\u80fd\u611f\u89c9\u5230\uff0c\u6211\u7684\u8eab\u4f53\uff0c\u5728\u8fd9\u4e00\u523b\uff0c\u53ef\u803b\u5730\u3001\u4e0d\u53d7\u63a7\u5236\u5730\uff0c\u8d77\u4e86\u53cd\u5e94\u3002\n\n\u65c1\u8fb9\u7684\u6797\u521d\u590f\u548c\u6c5f\u96ea\uff0c\u4e5f\u5b8c\u5168\u88ab\u9707\u4f4f\u4e86\u3002\u5979\u4eec\u8138\u4e0a\u7684\u8868\u60c5\uff0c\u662f\u4e00\u79cd\u6df7\u6742\u7740\u9707\u60ca\u3001\u9519\u6115\u548c\u67d0\u79cd\u2026\u2026\u8bf4\u4e0d\u6e05\u7684\u3001\u88ab\u89e6\u52a8\u4e86\u7684\u590d\u6742\u795e\u60c5\u3002\u5979\u4eec\u5927\u6982\u4e5f\u4ece\u672a\u60f3\u8fc7\uff0c\u8fd9\u4e2a\u603b\u662f\u50cf\u5927\u59d0\u59d0\u4e00\u6837\u7167\u987e\u7740\u5979\u4eec\u3001\u4e3a\u5979\u4eec\u89e3\u51b3\u6240\u6709\u95ee\u9898\u7684\u6e29\u7476\uff0c\u5185\u5fc3\u6df1\u5904\uff0c\u7adf\u7136\u85cf\u7740\u8fd9\u6837\u4e00\u7247\u72c2\u91ce\u800c\u7edd\u671b\u7684\u7126\u571f\u3002\n\n\u6ca1\u6709\u4eba\u8bf4\u8bdd\u3002\n\n\u6574\u4e2a\u4e16\u754c\uff0c\u4eff\u4f5b\u90fd\u5728\u7b49\u5f85\u6211\u7684\u56de\u7b54\u3002\n\n\u7b49\u5f85\u6211\u5bf9\u8fd9\u4efd\u6700\u8d64\u88f8\u3001\u6700\u80ae\u810f\uff0c\u4e5f\u6700\u7eaf\u7cb9\u7684\u6b32\u671b\uff0c\u505a\u51fa\u5ba3\u5224\u3002\n\n\u6211\u611f\u89c9\u81ea\u5df1\u50cf\u4e00\u4e2a\u7ad9\u5728\u60ac\u5d16\u8fb9\u7684\u3001\u53ef\u7b11\u7684\u61e6\u592b\u3002\u5f80\u524d\u4e00\u6b65\uff0c\u662f\u4e07\u52ab\u4e0d\u590d\u7684\u6df1\u6e0a\uff0c\u9000\u540e\u4e00\u6b65\uff0c\u662f\u5979\u4eec\u6240\u6709\u4eba\u7834\u788e\u7684\u5fc3\u3002\n\n\u6211\u8be5\u600e\u4e48\u529e\uff1f\n\n\u6211\u80fd\u600e\u4e48\u529e\uff1f\n\n\u6211\u7684\u5634\u5507\u52a8\u4e86\u52a8\uff0c\u5589\u5499\u5e72\u5f97\u50cf\u8981\u5192\u70df\u3002\u6211\u770b\u7740\u6e29\u7476\uff0c\u53c8\u770b\u770b\u8eab\u8fb9\u540c\u6837\u8106\u5f31\u3001\u540c\u6837\u7b49\u5f85\u7740\u7684\u6797\u521d\u590f\u548c\u6c5f\u96ea\u3002\u5979\u4eec\u6bcf\u4e00\u4e2a\u4eba\u7684\u8138\uff0c\u5979\u4eec\u6bcf\u4e00\u4e2a\u4eba\u7684\u773c\u6cea\uff0c\u5979\u4eec\u6bcf\u4e00\u4e2a\u4eba\u7684\u75db\u82e6\u548c\u6e34\u6c42\uff0c\u50cf\u4e00\u5f20\u5de8\u5927\u7684\u3001\u5bc6\u4e0d\u900f\u98ce\u7684\u7f51\uff0c\u5c06\u6211\u7262\u7262\u5730\u56f0\u5728\u4e2d\u592e\u3002\n\n\u6211\u5ffd\u7136\u60f3\u8d77\u5f88\u4e45\u4ee5\u524d\uff0c\u6211\u4eec\u8fd8\u5728\u5927\u5b66\u793e\u56e2\u7684\u65f6\u5019\uff0c\u6709\u4e00\u6b21\u9732\u8425\uff0c\u665a\u4e0a\u4e0b\u4e86\u66b4\u96e8\uff0c\u6211\u4eec\u6240\u6709\u4eba\u90fd\u88ab\u56f0\u5728\u4e86\u4e00\u4e2a\u5c0f\u5c0f\u7684\u5e10\u7bf7\u91cc\u3002\u90a3\u65f6\u5019\uff0c\u6211\u4e5f\u662f\u50cf\u73b0\u5728\u8fd9\u6837\uff0c\u88ab\u5979\u4eec\u4e09\u4e2a\u7d27\u7d27\u5730\u56f4\u5728\u4e2d\u95f4\u3002\u5e10\u7bf7\u5916\u9762\u662f\u72c2\u98ce\u548c\u96f7\u9e23\uff0c\u4f46\u5e10\u7bf7\u91cc\u9762\uff0c\u5374\u56e0\u4e3a\u5f7c\u6b64\u7684\u4f53\u6e29\u548c\u547c\u5438\uff0c\u800c\u53d8\u5f97\u5f02\u5e38\u6e29\u6696\u548c\u5b89\u5fc3\u3002\n\n\u90a3\u65f6\u5019\uff0c\u6797\u521d\u590f\u6795\u7740\u6211\u7684\u80f3\u818a\uff0c\u6c5f\u96ea\u9760\u7740\u6211\u7684\u540e\u80cc\uff0c\u6e29\u7476\u5728\u5e2e\u6211\u4eec\u6396\u7740\u7761\u888b\u7684\u8fb9\u89d2\u3002\n\n\u90a3\u65f6\u5019\uff0c\u8fd8\u6ca1\u8ba4\u8bc6\u9e7f\u7720\u5462\u3002\n\n\u6211\u90a3\u65f6\u5019\u5c31\u5728\u60f3\uff0c\u5982\u679c\u65f6\u95f4\u80fd\u6c38\u8fdc\u505c\u7559\u5728\u8fd9\u4e00\u523b\uff0c\u8be5\u6709\u591a\u597d\u3002\n\n\u4e00\u80a1\u5de8\u5927\u7684\u3001\u65e0\u6cd5\u8a00\u55bb\u7684\u9178\u6da9\uff0c\u731b\u5730\u6d8c\u4e0a\u4e86\u6211\u7684\u773c\u7736\u3002\n\n\u6211\u518d\u4e5f\u65e0\u6cd5\u5fcd\u53d7\u4e86\u3002\n\n\u6211\u4ece\u6c99\u53d1\u4e0a\u7ad9\u4e86\u8d77\u6765\uff0c\u5728\u5979\u4eec\u4e09\u4e2a\u4eba\u9707\u60ca\u7684\u76ee\u5149\u4e2d\uff0c\u4e00\u6b65\u4e00\u6b65\u5730\uff0c\u8d70\u5230\u4e86\u5ba2\u5385\u7684\u4e2d\u592e\uff0c\u90a3\u4e2a\u88ab\u5979\u4eec\u6240\u6709\u4eba\u6ce8\u89c6\u7740\u7684\u4f4d\u7f6e\u3002\n\n\u7136\u540e\uff0c\u6211\u505a\u4e86\u4e00\u4ef6\u6211\u81ea\u5df1\u90fd\u65e0\u6cd5\u60f3\u8c61\u7684\u4e8b\u60c5\u3002\n\n\u6211\u7f13\u7f13\u5730\uff0c\u90d1\u91cd\u5730\uff0c\u53cc\u819d\u8dea\u5728\u4e86\u90a3\u5f20\u67d4\u8f6f\u7684\u3001\u51b0\u51b7\u7684\u5730\u6bef\u4e0a\u3002\n\n\u6211\u5411\u7740\u5979\u4eec\u4e0b\u8dea\uff0c\u5c31\u597d\u50cf\u8fd9\u662f\u4e00\u79cd\u8d4e\u7f6a\u4f3c\u7684\u3002\n\n\u201c\u6211\u4e0d\u77e5\u9053\u8be5\u600e\u4e48\u529e\u3002\u201d\n\n\u6211\u7684\u58f0\u97f3\u5f88\u8f7b\uff0c\u5e26\u7740\u6d53\u91cd\u7684\u3001\u65e0\u6cd5\u6291\u5236\u7684\u9f3b\u97f3\uff0c\u50cf\u662f\u5728\u5bf9\u5979\u4eec\u8bf4\uff0c\u53c8\u50cf\u662f\u5728\u5bf9\u6211\u81ea\u5df1\u8bf4\u3002\n\n\u201c\u6211\u9009\u4e0d\u4e86\u3002\u201d\n\n\u201c\u6211\u9009\u521d\u590f\uff0c\u5c31\u4f1a\u4f24\u5bb3\u6c5f\u96ea\u548c\u6e29\u7476\u3002\u6211\u9009\u6c5f\u96ea\uff0c\u4f60\u4eec\u53e6\u5916\u4e24\u4e2a\u600e\u4e48\u529e\uff1f\u6211\u9009\u6e29\u7476\uff0c\u6211\u53c8\u600e\u4e48\u5bf9\u5f97\u8d77\u521d\u590f\u548c\u6c5f\u96ea\uff1f\u201d\n\n\u201c\u8fd8\u6709\u9e7f\u7720\uff0c\u6211\u751a\u81f3\u90fd\u4e0d\u77e5\u9053\u8be5\u7528\u4ec0\u4e48\u65b9\u5f0f\u548c\u5979\u76f8\u5904\u3002\u201d\n\n\u201c\u5979\u592a\u7eaf\u6d01\u4e86\u3002\u201d\n\n\u201c\u6211\u5c31\u662f\u8fd9\u4e48\u4e00\u4e2a\u8d2a\u5fc3\u7684\u3001\u81ea\u79c1\u7684\u3001\u6ca1\u7528\u7684\u6df7\u86cb\u3002\u201d\n\n\u201c\u6211\u4ec0\u4e48\u90fd\u60f3\u8981\uff0c\u5230\u6700\u540e\uff0c\u5374\u4ec0\u4e48\u90fd\u7ed9\u4e0d\u4e86\u4f60\u4eec\u3002\u6211\u7ed9\u4e0d\u4e86\u521d\u590f\u504f\u7231\uff0c\u7ed9\u4e0d\u4e86\u6c5f\u96ea\u627f\u8bfa\uff0c\u4e5f\u7ed9\u4e0d\u4e86\u6e29\u7476\u4f60\u60f3\u8981\u7684\u2026\u2026\u90a3\u79cd\u5360\u6709\u3002\u201d\n\n\u201c\u6211\u548c\u4f60\u4eec\uff0c\u672c\u6765\u5c31\u4e0d\u662f\u4e00\u4e2a\u4e16\u754c\u7684\u4eba\u3002\u201d\n\n\u201c\u6211\u552f\u4e00\u80fd\u7ed9\u7684\u2026\u2026\u201d\n\n\u6211\u62ac\u8d77\u5934\uff0c\u770b\u7740\u5979\u4eec\u4e09\u4e2a\u90a3\u4e00\u5f20\u5f20\u5199\u6ee1\u4e86\u9519\u6115\u548c\u6cea\u75d5\u7684\u8138\uff0c\u773c\u6cea\u7ec8\u4e8e\u4e0d\u53d7\u63a7\u5236\u5730\uff0c\u4ece\u6211\u7684\u773c\u7736\u91cc\u6eda\u843d\u4e0b\u6765\u3002\n\n\u201c\u2026\u2026\u53ea\u6709\u6211\u8fd9\u4e2a\u4eba\u4e86\u3002\u201d\n\n\u201c\u5982\u679c\u4f60\u4eec\u4e0d\u5acc\u5f03\u7684\u8bdd\uff0c\u5982\u679c\u4f60\u4eec\u8fd8\u613f\u610f\u8981\u7684\u8bdd\u2026\u2026\u201d\n\n\u201c\u5c31\u628a\u6211\u5f53\u6210\u4e00\u4e2a\u4e1c\u897f\u5427\u3002\u201d\n\n\u201c\u4f60\u4eec\u53ef\u4ee5\u4e00\u8d77\u62e5\u6709\u6211\uff0c\u4e00\u8d77\u4f7f\u7528\u6211\uff0c\u4e00\u8d77\u5206\u4eab\u6211\u3002\u4f60\u4eec\u60f3\u600e\u4e48\u6837\u2026\u2026\u90fd\u53ef\u4ee5\u3002\u201d\n\n\u201c\u53ea\u8981\u4f60\u4eec\u522b\u518d\u54ed\u4e86\u3002\u201d\n\n\u201c\u4e5f\u522b\u518d\u2026\u2026\u79bb\u5f00\u6211\u4e86\u3002\u201d\n\n\u6211\u8bf4\u5b8c\uff0c\u5c31\u518d\u4e5f\u8bf4\u4e0d\u51fa\u4e00\u4e2a\u5b57\u3002\u6211\u4f4e\u4e0b\u5934\uff0c\u989d\u5934\u62b5\u7740\u51b0\u51b7\u7684\u5730\u6bef\uff0c\u50cf\u4e00\u4e2a\u6700\u8654\u8bda\u7684\u3001\u7b49\u5f85\u7740\u795e\u660e\u964d\u4e0b\u6700\u7ec8\u88c1\u51b3\u7684\u7f6a\u4eba\u3002\n\n\n\n50.\n\u6211\u8dea\u5728\u90a3\u91cc\uff0c\u773c\u795e\u4f4e\u5782\uff0c\u4e0d\u6562\u53bb\u770b\u5979\u4eec\u7684\u773c\u775b\uff0c\u50cf\u4e00\u5c0a\u6b63\u5728\u5fcf\u6094\u7684\u3001\u4e11\u964b\u7684\u77f3\u50cf\u3002\n\n\u771f\u662f\u591f\u65e0\u803b\u554a\u3002\n\n\u6574\u4e2a\u4e16\u754c\u90fd\u5b89\u9759\u4e86\u3002\n\n\u6211\u542c\u4e0d\u5230\u54ed\u58f0\uff0c\u542c\u4e0d\u5230\u8bf4\u8bdd\u58f0\uff0c\u751a\u81f3\u542c\u4e0d\u5230\u547c\u5438\u58f0\u3002\u65f6\u95f4\u4eff\u4f5b\u5728\u8fd9\u4e00\u523b\u88ab\u62c9\u957f\u3001\u51dd\u56fa\uff0c\u53d8\u6210\u4e86\u4e00\u5757\u900f\u660e\u7684\u3001\u6c89\u91cd\u7684\u7425\u73c0\uff0c\u5c06\u6211\u4eec\u56db\u4e2a\u4eba\u7262\u7262\u5730\u5c01\u5b58\u5728\u91cc\u9762\u3002\n\n\u6211\u4e0d\u77e5\u9053\u8fc7\u4e86\u591a\u4e45\uff0c\u53ef\u80fd\u662f\u4e00\u5206\u949f\uff0c\u4e5f\u53ef\u80fd\u662f\u4e00\u4e2a\u4e16\u7eaa\u3002\n\n\u4e00\u9635\u8f7b\u5fae\u7684\u3001\u5e03\u6599\u6469\u64e6\u7684\u58f0\u97f3\uff0c\u6253\u7834\u4e86\u8fd9\u7247\u6b7b\u5bc2\u3002\n\n\u6211\u611f\u89c9\u5230\u6709\u4eba\u5728\u6211\u9762\u524d\u8e72\u4e86\u4e0b\u6765\u3002\n\n\u4e00\u53cc\u6e29\u6696\u7684\u7684\u624b\uff0c\u8f7b\u8f7b\u5730\u3001\u8bd5\u63a2\u6027\u5730\uff0c\u78b0\u4e86\u78b0\u6211\u7684\u624b\u81c2\u3002\n\n\u662f\u6e29\u7476\u3002\n\n\u201c\u8d77\u6765\u3002\u201d\n\n\u5979\u7684\u58f0\u97f3\u5f88\u8f7b\uff0c\u5f88\u67d4\uff0c\u5374\u5e26\u7740\u4e00\u79cd\u4e0d\u5bb9\u7f6e\u7591\u7684\u3001\u75b2\u60eb\u7684\u6c99\u54d1\u3002\n\n\u6211\u6ca1\u6709\u52a8\uff0c\u4f9d\u65e7\u4fdd\u6301\u7740\u90a3\u4e2a\u5351\u5fae\u7684\u59ff\u52bf\u3002\u6211\u4e0d\u6562\u8d77\u6765\uff0c\u6211\u6015\u4e00\u62ac\u5934\uff0c\u770b\u5230\u7684\u662f\u5979\u4eec\u538c\u6076\u548c\u5931\u671b\u7684\u773c\u795e\u3002\n\n\u90a3\u53cc\u624b\u81c2\uff0c\u5f00\u59cb\u7528\u529b\uff0c\u60f3\u8981\u628a\u6211\u4ece\u5730\u4e0a\u62c9\u8d77\u6765\u3002\n\n\u201c\u9646\u6c89\uff0c\u4f60\u8d77\u6765\u3002\u201d\n\n\u8fd9\u4e00\u6b21\uff0c\u5979\u7684\u58f0\u97f3\u91cc\u5e26\u4e0a\u4e86\u4e00\u4e1d\u98a4\u6296\uff0c\u50cf\u662f\u5728\u6073\u6c42\u3002\n\n\u7d27\u63a5\u7740\uff0c\u53e6\u4e00\u53cc\u51b0\u51b7\u7684\u3001\u5e26\u7740\u6cea\u75d5\u7684\u624b\uff0c\u4e5f\u6293\u4f4f\u4e86\u6211\u7684\u53e6\u4e00\u53ea\u80f3\u818a\u3002\u662f\u6797\u521d\u590f\u3002\u5979\u6ca1\u6709\u8bf4\u8bdd\uff0c\u53ea\u662f\u7528\u5c3d\u4e86\u5168\u8eab\u7684\u529b\u6c14\uff0c\u548c\u6e29\u7476\u4e00\u8d77\uff0c\u628a\u6211\u5f80\u4e0a\u62c9\u3002\u5979\u7684\u6307\u7532\u56e0\u4e3a\u7528\u529b\u800c\u6df1\u6df1\u5730\u9677\u8fdb\u4e86\u6211\u7684\u76ae\u80a4\u91cc\uff0c\u4f20\u6765\u4e00\u9635\u523a\u75db\u3002\n\n\u6211\u50cf\u4e00\u4e2a\u6ca1\u6709\u9aa8\u5934\u7684\u3001\u4efb\u4eba\u6446\u5e03\u7684\u6728\u5076\uff0c\u88ab\u5979\u4eec\u4e24\u4e2a\u4ece\u5730\u4e0a\u786c\u751f\u751f\u5730\u62fd\u4e86\u8d77\u6765\uff0c\u91cd\u65b0\u6309\u56de\u4e86\u6c99\u53d1\u4e0a\u3002\n\n\u6211\u7684\u8eab\u4f53\u9677\u8fdb\u67d4\u8f6f\u7684\u6c99\u53d1\u91cc\uff0c\u4f46\u6211\u611f\u89c9\u81ea\u5df1\u4f9d\u65e7\u8dea\u5728\u51b0\u51b7\u7684\u5730\u677f\u4e0a\uff0c\u7075\u9b42\u8fd8\u5728\u90a3\u4e2a\u5351\u5fae\u7684\u4f4d\u7f6e\uff0c\u65e0\u6cd5\u8d77\u8eab\u3002\n\n\u6211\u4f4e\u7740\u5934\uff0c\u4e0d\u6562\u770b\u5979\u4eec\u3002\n\n\u201c\u4f60\u89c9\u5f97\u8fd9\u6837\u5f88\u597d\u73a9\u5417\uff1f\u201d\n\n\u662f\u6c5f\u96ea\u7684\u58f0\u97f3\u3002\n\n\u5979\u7684\u58f0\u97f3\u4e0d\u5927\uff0c\u5374\u50cf\u4e00\u628a\u51b0\u51b7\u7684\u3001\u950b\u5229\u7684\u9525\u5b50\uff0c\u72e0\u72e0\u5730\u624e\u8fdb\u4e86\u6211\u7684\u5fc3\u810f\u91cc\u3002\u6211\u731b\u5730\u62ac\u8d77\u5934\uff0c\u770b\u5230\u4e86\u5979\u3002\n\n\u5979\u4f9d\u65e7\u7ad9\u5728\u843d\u5730\u7a97\u524d\uff0c\u6ca1\u6709\u8fc7\u6765\u3002\u5979\u770b\u7740\u6211\uff0c\u90a3\u53cc\u603b\u662f\u50cf\u7ed3\u4e86\u51b0\u7684\u773c\u775b\uff0c\u6b64\u523b\u5374\u50cf\u71c3\u70e7\u7684\u3001\u9ed1\u8272\u7684\u706b\u7130\u3002\u90a3\u706b\u7130\u91cc\uff0c\u6ca1\u6709\u611f\u52a8\uff0c\u6ca1\u6709\u540c\u60c5\uff0c\u53ea\u6709\u4e00\u79cd\u88ab\u6df1\u6df1\u523a\u75db\u4e86\u7684\u3001\u6ed4\u5929\u7684\u6124\u6012\u3002\n\n\u201c\u628a\u81ea\u5df1\u5f53\u6210\u4e00\u4e2a\u4e1c\u897f\uff1f\u4efb\u7531\u6211\u4eec\u4f7f\u7528\uff1f\u4f60\u89c9\u5f97\u8fd9\u662f\u5728\u8d4e\u7f6a\u5417\uff1f\u4f60\u89c9\u5f97\u8fd9\u662f\u4f60\u552f\u4e00\u80fd\u7ed9\u6211\u4eec\u7684\u4e1c\u897f\uff1f\u201d\n\n\u5979\u7684\u58f0\u97f3\u8d8a\u6765\u8d8a\u5927\uff0c\u6bcf\u4e00\u4e2a\u5b57\u90fd\u50cf\u4e00\u8bb0\u8033\u5149\uff0c\u72e0\u72e0\u5730\u6247\u5728\u6211\u7684\u8138\u4e0a\u3002\n\n\u201c\u9646\u6c89\uff0c\u4f60\u9519\u4e86\u3002\u201d\n\n\u201c\u4f60\u8fd9\u4e0d\u662f\u5728\u7231\u6211\u4eec\uff0c\u4f60\u662f\u5728\u4fae\u8fb1\u6211\u4eec\u3002\u201d\n\n\u201c\u4f60\u662f\u5728\u7528\u4f60\u90a3\u5957\u81ea\u4ee5\u4e3a\u662f\u7684\u3001\u5ec9\u4ef7\u7684\u81ea\u6211\u727a\u7272\uff0c\u6765\u60e9\u7f5a\u6211\u4eec\u6bcf\u4e00\u4e2a\u4eba\uff01\u201d\n\n\u201c\u4f60\u4ee5\u4e3a\u6211\u4eec\u60f3\u8981\u7684\u662f\u4ec0\u4e48\uff1f\u662f\u4e00\u4e2a\u6ca1\u6709\u7075\u9b42\u7684\u3001\u4efb\u4eba\u6446\u5e03\u7684\u6027\u73a9\u5177\u5417\uff1f\u662f\u4e00\u4e2a\u9700\u8981\u6211\u4eec\u50cf\u5206\u8d43\u4e00\u6837\u53bb\u74dc\u5206\u7684\u6218\u5229\u54c1\u5417\uff1f\u201d\n\n\u5979\u4e00\u6b65\u4e00\u6b65\u5730\u5411\u6211\u8d70\u6765\uff0c\u6bcf\u4e00\u6b65\u90fd\u50cf\u662f\u8e29\u5728\u6211\u7684\u5fc3\u4e0a\u3002\u5979\u8d70\u5230\u6211\u7684\u9762\u524d\uff0c\u5c45\u9ad8\u4e34\u4e0b\u5730\u770b\u7740\u6211\uff0c\u90a3\u53cc\u71c3\u70e7\u7740\u6012\u706b\u7684\u773c\u775b\u91cc\uff0c\u4e0d\u77e5\u4ec0\u4e48\u65f6\u5019\uff0c\u5df2\u7ecf\u84c4\u6ee1\u4e86\u6cea\u6c34\u3002\n\n\u201c\u4f60\u62ac\u8d77\u5934\uff0c\u770b\u7740\u6211\u3002\u201d\n\n\u5979\u7684\u58f0\u97f3\u5728\u98a4\u6296\u3002\n\n\u201c\u6211\u4eec\u60f3\u8981\u7684\uff0c\u4ece\u6765\u90fd\u53ea\u6709\u4e00\u4e2a\u3002\u201d\n\n\u201c\u5c31\u662f\u4e00\u4e2a\u4f1a\u7b11\uff0c\u4f1a\u54ed\uff0c\u4f1a\u56e0\u4e3a\u5f97\u5230\u6211\u4eec\u800c\u5f00\u5fc3\uff0c\u4f1a\u56e0\u4e3a\u5931\u53bb\u6211\u4eec\u800c\u75db\u82e6\u7684\uff0c\u6d3b\u751f\u751f\u7684\uff0c\u9646\u6c89\u3002\u201d\n\n\u4e00\u6ef4\u6eda\u70eb\u7684\u773c\u6cea\uff0c\u4ece\u5979\u773c\u7736\u91cc\u5760\u843d\uff0c\u7838\u5728\u4e86\u6211\u7684\u624b\u80cc\u4e0a\u3002\n\n\u70eb\u5f97\u6211\u6574\u4e2a\u4eba\u90fd\u731b\u5730\u4e00\u98a4\u3002\n\n\n\n51.\n\u6c5f\u96ea\u90a3\u6ef4\u6eda\u70eb\u7684\u773c\u6cea\uff0c\u50cf\u4e00\u6ef4\u70d9\u94c1\uff0c\u5728\u6211\u51b0\u51b7\u7684\u624b\u80cc\u4e0a\u7559\u4e0b\u4e86\u4e00\u4e2a\u6c38\u6052\u7684\u5370\u8bb0\u3002\n\n\u6211\u62ac\u8d77\u5934\uff0c\u900f\u8fc7\u81ea\u5df1\u6a21\u7cca\u7684\u6cea\u773c\uff0c\u770b\u7740\u5979\u3002\u770b\u7740\u5979\u90a3\u5f20\u56e0\u4e3a\u6124\u6012\u548c\u60b2\u4f24\u800c\u626d\u66f2\uff0c\u5374\u53c8\u56e0\u6b64\u800c\u663e\u5f97\u65e0\u6bd4\u771f\u5b9e\u7684\u8138\u3002\n\n\u201c\u6d3b\u751f\u751f\u7684\u2026\u2026\u9646\u6c89\u2026\u2026\u201d\n\n\u6211\u5583\u5583\u5730\u91cd\u590d\u7740\u8fd9\u53e5\u8bdd\uff0c\u611f\u89c9\u81ea\u5df1\u50cf\u4e00\u4e2a\u7b2c\u4e00\u6b21\u542c\u5230\u4eba\u7c7b\u8bed\u8a00\u7684\u91ce\u517d\u3002\u6211\u4e00\u76f4\u4ee5\u4e3a\uff0c\u6211\u6700\u5927\u7684\u4ef7\u503c\uff0c\u5c31\u662f\u6210\u4e3a\u5979\u4eec\u7684\u540e\u76fe\uff0c\u4e3a\u5979\u4eec\u63d0\u4f9b\u4e00\u4e2a\u6e29\u6696\u7684\u3001\u53ef\u4ee5\u5378\u4e0b\u6240\u6709\u9632\u5907\u7684\u6e2f\u6e7e\u3002\u6240\u4ee5\u6211\u62fc\u547d\u5730\u60f3\u5bf9\u5979\u4eec\u6bcf\u4e00\u4e2a\u4eba\u597d\uff0c\u62fc\u547d\u5730\u60f3\u628a\u6240\u6709\u95ee\u9898\u90fd\u81ea\u5df1\u625b\u4e0b\u6765\u3002\n\n\u5230\u5934\u6765\uff0c\u6211\u5374\u6210\u4e86\u90a3\u4e2a\u6700\u9700\u8981\u88ab\u62ef\u6551\u7684\u4eba\u3002\n\n\u6211\u4ee5\u4e3a\u6211\u8dea\u4e0b\u53bb\uff0c\u662f\u627f\u62c5\u4e86\u6240\u6709\u3002\n\n\u539f\u6765\uff0c\u6211\u53ea\u662f\u5728\u7528\u6700\u6b8b\u5fcd\u7684\u65b9\u5f0f\uff0c\u9003\u907f\u4e86\u6240\u6709\u3002\n\n\u6e29\u7476\u4e0d\u77e5\u9053\u4ec0\u4e48\u65f6\u5019\uff0c\u5df2\u7ecf\u8d70\u5230\u4e86\u6c5f\u96ea\u7684\u8eab\u8fb9\u3002\u5979\u6ca1\u6709\u8bf4\u8bdd\uff0c\u53ea\u662f\u4f38\u51fa\u624b\uff0c\u8f7b\u8f7b\u5730\u63e1\u4f4f\u4e86\u6c5f\u96ea\u6b63\u5728\u98a4\u6296\u7684\u624b\u81c2\uff0c\u7ed9\u4e86\u5979\u4e00\u4e2a\u65e0\u58f0\u7684\u652f\u6491\u3002\n\n\u6797\u521d\u590f\u8d70\u5230\u6211\u7684\u53e6\u4e00\u8fb9\uff0c\u8e72\u4e0b\u8eab\uff0c\u4ef0\u7740\u90a3\u5f20\u54ed\u5f97\u4e00\u584c\u7cca\u6d82\u7684\u5c0f\u8138\u770b\u7740\u6211\u3002\n\n\u201c\u662f\u554a\uff0c\u4f60\u8fd9\u4e2a\u7b28\u86cb\u3002\u201d\n\n\u5979\u7684\u58f0\u97f3\u6c99\u54d1\uff0c\u5e26\u7740\u6d53\u91cd\u7684\u9f3b\u97f3\uff0c\u4f46\u90a3\u53cc\u7ea2\u80bf\u7684\u773c\u775b\u91cc\uff0c\u5374\u5e26\u7740\u4e00\u79cd\u524d\u6240\u672a\u6709\u7684\u6e05\u6f88\u3002\n\n\u201c\u6211\u867d\u7136\u6545\u610f\u8bf4\u90a3\u53e5\u8bdd\u6c14\u6c5f\u96ea\uff0c\u4f46\u4f60\u77e5\u9053\u6211\u6700\u6015\u7684\u662f\u4ec0\u4e48\u5417\uff1f\u201d\n\n\u5979\u6ca1\u6709\u7b49\u6211\u56de\u7b54\u3002\n\n\u201c\u6211\u6700\u6015\u7684\uff0c\u662f\u4f60\u771f\u7684\u4f1a\u50cf\u6211\u8bf4\u7684\u90a3\u6837\uff0c\u53d8\u6210\u4e00\u4e2a\u53ea\u5c5e\u4e8e\u6211\u4e00\u4e2a\u4eba\u7684\u4e1c\u897f\u3002\u90a3\u6837\u7684\u8bdd\uff0c\u4f60\u5c31\u4e0d\u662f\u90a3\u4e2a\u4f1a\u5728\u6211\u800d\u5c0f\u6027\u5b50\u7684\u65f6\u5019\uff0c\u65e0\u5948\u5730\u53f9\u7740\u6c14\uff0c\u7136\u540e\u7ed9\u6211\u5939\u4e00\u5757\u6700\u5927\u7684\u7ea2\u70e7\u8089\u7684\u9646\u6c89\u4e86\u3002\u201d\n\n\u201c\u6211\u60f3\u8981\u7684\uff0c\u662f\u4f60\u8fd9\u4e2a\u4eba\u554a\u3002\u662f\u90a3\u4e2a\u4f1a\u7b11\uff0c\u4f1a\u65e0\u5948\uff0c\u4f1a\u56e0\u4e3a\u6211\u4eec\u800c\u5934\u75db\u7684\u9646\u6c89\u3002\u5c31\u7b97\u4f60\u8981\u5206\u7ed9\u5979\u4eec\uff0c\u5c31\u7b97\u6211\u53ea\u80fd\u5f97\u5230\u4e00\u5c0f\u5757\u2026\u2026\u6211\u4e5f\u8981\u90a3\u4e00\u5c0f\u5757\u662f\u771f\u7684\uff0c\u662f\u70ed\u7684\uff0c\u662f\u6d3b\u7684\u3002\u201d\n\n\u5979\u8bf4\u7740\uff0c\u4f38\u51fa\u90a3\u53ea\u53d7\u4e86\u4f24\u7684\u624b\uff0c\u7528\u6307\u5c16\u8f7b\u8f7b\u5730\u3001\u7b28\u62d9\u5730\u78b0\u4e86\u78b0\u6211\u8138\u4e0a\u7684\u6cea\u75d5\u3002\n\n\u201c\u800c\u4e0d\u662f\u4e00\u5757\u51b7\u51b0\u51b0\u7684\u3001\u88ab\u6211\u4eec\u5206\u6389\u7684\u8089\u3002\u201d\n\n\u6e29\u7476\u770b\u7740\u6211\u4eec\uff0c\u4e5f\u8f7b\u8f7b\u5730\u53f9\u4e86\u53e3\u6c14\u3002\n\n\u201c\u9646\u6c89\uff0c\u4f60\u628a\u81ea\u5df1\u5f53\u6210\u2018\u4e1c\u897f\u2019\uff0c\u662f\u56e0\u4e3a\u4f60\u5bb3\u6015\u3002\u4f60\u5bb3\u6015\u627f\u62c5\u4e0d\u8d77\u6211\u4eec\u6240\u6709\u4eba\u7684\u611f\u60c5\uff0c\u5bb3\u6015\u8f9c\u8d1f\u6211\u4eec\u7684\u671f\u5f85\uff0c\u6240\u4ee5\u4f60\u5e72\u8106\u653e\u5f03\u4e86\u505a\u2018\u4eba\u2019\u7684\u8d44\u683c\uff0c\u56e0\u4e3a\u2018\u4e1c\u897f\u2019\u662f\u4e0d\u9700\u8981\u8d1f\u8d23\u4efb\u7684\u3002\u201d\n\n\u201c\u53ef\u662f\uff0c\u7231\uff0c\u4ece\u6765\u90fd\u4e0d\u662f\u4e00\u9053\u9009\u62e9\u9898\u3002\u201d\n\n\u5979\u7684\u58f0\u97f3\u5f88\u8f7b\uff0c\u5374\u50cf\u4e00\u628a\u94a5\u5319\uff0c\u6253\u5f00\u4e86\u6211\u5fc3\u91cc\u6700\u540e\u4e00\u9053\u3001\u4e5f\u662f\u6700\u575a\u56fa\u7684\u4e00\u6247\u95e8\u3002\n\n\u201c\u7231\u662f\u4e00\u79cd\u80fd\u529b\u3002\u662f\u4e00\u79cd\u8ba9\u4f60\u80fd\u540c\u65f6\u4e3a\u521d\u590f\u7684\u7b11\u5bb9\u800c\u5f00\u5fc3\uff0c\u4e3a\u6c5f\u96ea\u7684\u773c\u6cea\u800c\u5fc3\u75db\uff0c\u4e3a\u7720\u7720\u7684\u4f9d\u8d56\u800c\u6ee1\u8db3\uff0c\u4e5f\u4e3a\u6211\u2026\u2026\u90a3\u4e9b\u8bf4\u4e0d\u51fa\u53e3\u7684\u6b32\u671b\u800c\u56f0\u6270\u7684\u80fd\u529b\u3002\u201d\n\n\u201c\u4f60\u4e0d\u662f\u4ec0\u4e48\u90fd\u7ed9\u4e0d\u4e86\u6211\u4eec\u3002\u201d\n\n\u5979\u770b\u7740\u6211\uff0c\u773c\u795e\u91cc\u662f\u524d\u6240\u672a\u6709\u7684\u6e29\u67d4\u548c\u575a\u5b9a\u3002\n\n\u201c\u4f60\u5df2\u7ecf\u7ed9\u4e86\u6211\u4eec\u6700\u91cd\u8981\u7684\u4e1c\u897f\u3002\u201d\n\n\u201c\u4f60\u7ed9\u4e86\u6211\u4eec\u4e00\u4e2a\u53ef\u4ee5\u653e\u4e0b\u6240\u6709\u4f2a\u88c5\uff0c\u53ef\u4ee5\u54ed\uff0c\u53ef\u4ee5\u7b11\uff0c\u53ef\u4ee5\u5f7c\u6b64\u5ac9\u5992\uff0c\u5374\u53c8\u80fd\u5728\u6700\u5173\u952e\u7684\u65f6\u5019\uff0c\u7ad9\u5728\u4e00\u8d77\u7684\u5730\u65b9\u3002\u201d\n\n\u201c\u4f60\u7ed9\u4e86\u6211\u4eec\u2026\u2026\u4e00\u4e2a\u5bb6\u3002\u201d\n\n\u5979\u8bf4\u5b8c\uff0c\u5ba2\u5385\u91cc\u518d\u6b21\u9677\u5165\u4e86\u6c89\u9ed8\u3002\n\n\u4f46\u8fd9\u4e00\u6b21\uff0c\u6c89\u9ed8\u4e0d\u518d\u662f\u51b0\u51b7\u548c\u538b\u6291\u7684\u3002\u5b83\u50cf\u4e00\u573a\u66b4\u96e8\u8fc7\u540e\u7684\u3001\u5b81\u9759\u7684\u9ec4\u660f\uff0c\u7a7a\u6c14\u91cc\u8fd8\u5e26\u7740\u6e7f\u6f09\u6f09\u7684\u3001\u6ce5\u571f\u7684\u5473\u9053\uff0c\u4f46\u8fdc\u5904\u7684\u5929\u8fb9\uff0c\u5df2\u7ecf\u900f\u51fa\u4e86\u4e00\u4e1d\u5fae\u5f31\u7684\u3001\u6e29\u6696\u7684\u971e\u5149\u3002\n\n\u6c5f\u96ea\u7684\u547c\u5438\u6e10\u6e10\u5e73\u590d\u4e86\u4e0b\u6765\u3002\u5979\u677e\u5f00\u6e29\u7476\u7684\u624b\uff0c\u8d70\u5230\u6211\u7684\u9762\u524d\uff0c\u4f38\u51fa\u624b\u3002\n\n\u4e0d\u662f\u8981\u62c9\u6211\uff0c\u4e5f\u4e0d\u662f\u8981\u6253\u6211\u3002\n\n\u5979\u53ea\u662f\u644a\u5f00\u624b\u638c\uff0c\u638c\u5fc3\u91cc\uff0c\u9759\u9759\u5730\u8eba\u7740\u4e00\u9897\u7528\u9521\u7eb8\u5305\u7740\u7684\u3001\u67e0\u6aac\u5473\u7684\u786c\u7cd6\u3002\n\n\u201c\u7ed9\u3002\u201d\n\n\u5979\u770b\u7740\u6211\uff0c\u8138\u4e0a\u8fd8\u6302\u7740\u6cea\u75d5\uff0c\u58f0\u97f3\u4f9d\u65e7\u5e26\u7740\u4e00\u4e1d\u6c99\u54d1\uff0c\u4f46\u90a3\u53cc\u603b\u662f\u51b0\u51b7\u7684\u773c\u775b\u91cc\uff0c\u5374\u50cf\u662f\u878d\u5316\u4e86\u7684\u3001\u6625\u5929\u7684\u6e56\u6c34\u3002\n\n\u201c\u5f88\u9178\u7684\u3002\u201d\n\n\u201c\u4f60\u5c1d\u5c1d\u3002\u201d\n\n\n\n52.\n\u6211\u770b\u7740\u6c5f\u96ea\u638c\u5fc3\u91cc\u7684\u90a3\u9897\u7cd6\uff0c\u611f\u89c9\u5b83\u6bd4\u5168\u4e16\u754c\u7684\u94bb\u77f3\u90fd\u8981\u6c89\u91cd\u3002\n\n\u90a3\u5c42\u900f\u660e\u7684\u3001\u5e26\u7740\u67e0\u6aac\u56fe\u6848\u7684\u7cd6\u7eb8\uff0c\u5728\u5ba2\u5385\u660f\u9ec4\u7684\u706f\u5149\u4e0b\uff0c\u53cd\u5c04\u7740\u7ec6\u788e\u7684\u5149\u8292\u3002\u6211\u80fd\u770b\u5230\u5979\u5fae\u5fae\u98a4\u6296\u7684\u6307\u5c16\uff0c\u548c\u638c\u5fc3\u56e0\u4e3a\u7d27\u5f20\u800c\u6c81\u51fa\u7684\u3001\u7ec6\u5bc6\u7684\u6c57\u73e0\u3002\n\n\u6211\u7684\u5589\u7ed3\u4e0a\u4e0b\u6eda\u52a8\u4e86\u4e00\u4e0b\uff0c\u611f\u89c9\u81ea\u5df1\u7684\u773c\u775b\u53c8\u5f00\u59cb\u53d1\u9178\u3002\n\n\u6211\u4f38\u51fa\u624b\uff0c\u6307\u5c16\u78b0\u89e6\u5230\u5979\u7684\u638c\u5fc3\uff0c\u90a3\u91cc\u7684\u76ae\u80a4\u51b0\u51b7\u3001\u67d4\u8f6f\u3002\u6211\u6ca1\u6709\u7acb\u523b\u62ff\u8d77\u90a3\u9897\u7cd6\uff0c\u800c\u662f\u7528\u6211\u90a3\u53ea\u6ca1\u6709\u88ab\u6cea\u6c34\u6253\u6e7f\u7684\u624b\uff0c\u8f7b\u8f7b\u5730\u3001\u7b28\u62d9\u5730\uff0c\u5c06\u5979\u51b0\u51b7\u7684\u624b\u6307\uff0c\u8fde\u540c\u90a3\u9897\u7cd6\u4e00\u8d77\uff0c\u5305\u88f9\u5728\u4e86\u6211\u7684\u638c\u5fc3\u91cc\u3002\n\n\u5979\u7684\u8eab\u4f53\u731b\u5730\u4e00\u98a4\uff0c\u50cf\u4e00\u53ea\u53d7\u60ca\u7684\u5c0f\u9e7f\uff0c\u4f46\u6ca1\u6709\u6323\u8131\u3002\n\n\u201c\u55ef\u3002\u201d\n\n\u6211\u4ece\u5589\u5499\u91cc\u6324\u51fa\u4e00\u4e2a\u4e0d\u6210\u8c03\u7684\u97f3\u8282\uff0c\u7b97\u662f\u56de\u7b54\u3002\n\n\u6211\u770b\u7740\u5979\uff0c\u53c8\u8f6c\u8fc7\u5934\uff0c\u770b\u5411\u7ad9\u5728\u4e00\u65c1\uff0c\u773c\u7736\u901a\u7ea2\u7684\u6797\u521d\u590f\uff0c\u548c\u90a3\u4e2a\u9760\u5728\u7a97\u8fb9\uff0c\u8138\u4e0a\u5e26\u7740\u4e00\u4e1d\u75b2\u60eb\u5374\u53c8\u5982\u91ca\u91cd\u8d1f\u7684\u5fae\u7b11\u7684\u6e29\u7476\u3002\n\n\u6211\u677e\u5f00\u6c5f\u96ea\u7684\u624b\uff0c\u62ff\u8d77\u90a3\u9897\u7cd6\uff0c\u5265\u5f00\u90a3\u5c42\u8584\u8584\u7684\u7cd6\u7eb8\uff0c\u653e\u8fdb\u4e86\u5634\u91cc\u3002\n\n\u4e00\u80a1\u6781\u81f4\u7684\u3001\u86ee\u4e0d\u8bb2\u7406\u7684\u9178\u5473\uff0c\u77ac\u95f4\u5728\u6211\u7684\u820c\u5c16\u4e0a\u70b8\u5f00\uff0c\u50cf\u4e00\u9053\u767d\u8272\u7684\u95ea\u7535\uff0c\u76f4\u51b2\u5929\u7075\u76d6\u3002\u6211\u7684\u4e94\u5b98\u4e0d\u53d7\u63a7\u5236\u5730\u76b1\u5728\u4e86\u4e00\u8d77\uff0c\u53e3\u6c34\u75af\u72c2\u5730\u5206\u6ccc\uff0c\u8bd5\u56fe\u53bb\u4e2d\u548c\u90a3\u80a1\u9738\u9053\u7684\u9178\u6da9\u3002\n\n\u201c\u5657\u55e4\u2014\u2014\u201d\n\n\u4e00\u58f0\u6ca1\u5fcd\u4f4f\u7684\u3001\u5e26\u7740\u6d53\u91cd\u9f3b\u97f3\u7684\u7b11\u58f0\uff0c\u4ece\u8eab\u8fb9\u4f20\u6765\u3002\n\n\u662f\u6797\u521d\u590f\u3002\n\n\u5979\u770b\u7740\u6211\u88ab\u9178\u5f97\u9f87\u7259\u54a7\u5634\u7684\u8822\u6837\uff0c\u7ec8\u4e8e\u7834\u6d95\u4e3a\u7b11\u3002\u5979\u8fd9\u4e00\u7b11\uff0c\u5c31\u50cf\u63a8\u5012\u4e86\u7b2c\u4e00\u5757\u591a\u7c73\u8bfa\u9aa8\u724c\uff0c\u6c5f\u96ea\u90a3\u5f20\u603b\u662f\u7d27\u7ef7\u7740\u7684\u3001\u51b0\u51b7\u7684\u8138\uff0c\u4e5f\u7ec8\u4e8e\u6709\u4e86\u4e00\u4e1d\u677e\u52a8\uff0c\u5634\u89d2\u4e0d\u53d7\u63a7\u5236\u5730\u5411\u4e0a\u626c\u8d77\u4e86\u4e00\u4e2a\u5c0f\u5c0f\u7684\u3001\u51e0\u4e4e\u770b\u4e0d\u89c1\u7684\u5f27\u5ea6\u3002\n\n\u5c31\u8fde\u4e00\u76f4\u7ad9\u5728\u7a97\u8fb9\u7684\u6e29\u7476\uff0c\u4e5f\u8d70\u8fc7\u6765\uff0c\u4f38\u51fa\u624b\uff0c\u50cf\u5b89\u629a\u5c0f\u52a8\u7269\u4e00\u6837\uff0c\u63c9\u4e86\u63c9\u6211\u7684\u5934\u53d1\u3002\n\n\u201c\u7b28\u86cb\u3002\u201d\n\n\u5979\u8bf4\u3002\n\n\u6211\u88ab\u90a3\u80a1\u9178\u5473\u523a\u6fc0\u5f97\u773c\u6cea\u76f4\u6d41\uff0c\u5634\u91cc\u542b\u7740\u7cd6\uff0c\u542b\u7cca\u4e0d\u6e05\u5730\u8bd5\u56fe\u4e3a\u81ea\u5df1\u8fa9\u89e3\u3002\n\n\u201c\u6211\u2026\u2026\u6211\u4ee5\u4e3a\u2026\u2026\u6ca1\u8fd9\u4e48\u9178\u2026\u2026\u201d\n\n\u6211\u7684\u8bdd\u88ab\u5979\u4eec\u7684\u7b11\u58f0\u5f7b\u5e95\u6df9\u6ca1\u4e86\u3002\n\n\u90a3\u7b11\u58f0\uff0c\u4e00\u5f00\u59cb\u8fd8\u5e26\u7740\u4e00\u4e1d\u538b\u6291\u548c\u54fd\u54bd\uff0c\u4f46\u5f88\u5feb\uff0c\u5c31\u53d8\u5f97\u6e05\u8106\u3001\u660e\u4eae\uff0c\u5145\u6ee1\u4e86\u52ab\u540e\u4f59\u751f\u7684\u91ca\u653e\u611f\u3002\u5979\u4eec\u4e09\u4e2a\u4eba\uff0c\u7b11\u7740\uff0c\u95f9\u7740\uff0c\u6797\u521d\u590f\u751a\u81f3\u8fd8\u4f38\u51fa\u624b\uff0c\u50cf\u62a5\u590d\u4e00\u6837\u7528\u529b\u5730\u634f\u4e86\u634f\u6211\u7684\u8138\u3002\n\n\u5979\u4eec\u7b11\u7740\u7b11\u7740\uff0c\u773c\u6cea\u53c8\u90fd\u6d41\u4e86\u4e0b\u6765\u3002\n\n\u8fd9\u4e00\u6b21\u7684\u773c\u6cea\uff0c\u4e0d\u518d\u662f\u75db\u82e6\u548c\u7edd\u671b\u7684\u3002\u5b83\u548c\u6b64\u523b\u6211\u5634\u91cc\u7684\u90a3\u9897\u7cd6\u4e00\u6837\uff0c\u9178\u6da9\uff0c\u5374\u53c8\u5e26\u7740\u4e00\u4e1d\u65e0\u6cd5\u8a00\u55bb\u7684\u3001\u6e05\u6f88\u7684\u56de\u7518\u3002\n\n\u6211\u5750\u5728\u5979\u4eec\u4e2d\u95f4\uff0c\u4efb\u7531\u5979\u4eec\u201c\u6b3a\u8d1f\u201d\uff0c\u5634\u91cc\u90a3\u9897\u9178\u5f97\u8981\u547d\u7684\u7cd6\uff0c\u4e5f\u7ec8\u4e8e\u5f00\u59cb\u6162\u6162\u5730\u878d\u5316\uff0c\u91ca\u653e\u51fa\u91cc\u9762\u5305\u88f9\u7740\u7684\u4e00\u4e1d\u4e1d\u751c\u610f\u3002\n\n\u6211\u770b\u7740\u5979\u4eec\u4e09\u4e2a\uff0c\u770b\u7740\u5979\u4eec\u90a3\u4e00\u5f20\u5f20\u54ed\u82b1\u4e86\u7684\u3001\u5374\u53c8\u56e0\u6b64\u800c\u663e\u5f97\u65e0\u6bd4\u751f\u52a8\u548c\u771f\u5b9e\u7684\u8138\uff0c\u6211\u5ffd\u7136\u89c9\u5f97\uff0c\u81ea\u5df1\u597d\u50cf\u4ece\u6765\u6ca1\u6709\u50cf\u8fd9\u4e00\u523b\u4e00\u6837\uff0c\u5982\u6b64\u6e05\u6670\u5730\u2026\u2026\u6d3b\u5728\u8fd9\u4e2a\u4e16\u754c\u4e0a\u3002\n\n\u6211\u4eec\u5c31\u8fd9\u6837\uff0c\u5728\u8fd9\u4e2a\u51b7\u6e05\u5f97\u50cf\u535a\u7269\u9986\u4e00\u6837\u7684\u8c6a\u534e\u516c\u5bd3\u91cc\uff0c\u5728\u8fd9\u4e2a\u53ef\u4ee5\u4fef\u77b0\u6574\u5ea7\u57ce\u5e02\u6700\u7e41\u534e\u591c\u666f\u7684\u843d\u5730\u7a97\u524d\uff0c\u54ed\u7740\uff0c\u7b11\u7740\uff0c\u95f9\u7740\uff0c\u50cf\u4e09\u4e2a\u50bb\u74dc\u4e00\u6837\uff0c\u5206\u4eab\u7740\u4e00\u9897\u7cd6\u7684\u9178\u751c\u3002\n\n\u4e0d\u77e5\u9053\u8fc7\u4e86\u591a\u4e45\uff0c\u76f4\u5230\u6211\u4eec\u6240\u6709\u4eba\u90fd\u7b11\u5f97\u6ca1\u529b\u6c14\u4e86\uff0c\u54ed\u5f97\u773c\u775b\u90fd\u80bf\u4e86\uff0c\u624d\u7ec8\u4e8e\u7cbe\u75b2\u529b\u5c3d\u5730\uff0c\u6a2a\u4e03\u7ad6\u516b\u5730\u5012\u5728\u4e86\u90a3\u5f20\u5de8\u5927\u7684\u3001\u67d4\u8f6f\u7684\u6c99\u53d1\u4e0a\u3002\n\n\u6797\u521d\u590f\u6795\u7740\u6211\u7684\u817f\uff0c\u6c5f\u96ea\u9760\u7740\u6211\u7684\u80a9\u8180\uff0c\u6e29\u7476\u5219\u8eba\u5728\u53e6\u4e00\u5934\u3002\u6211\u4eec\u8c01\u90fd\u6ca1\u6709\u8bf4\u8bdd\uff0c\u53ea\u662f\u5b89\u9759\u5730\u542c\u7740\u5f7c\u6b64\u7684\u547c\u5438\u58f0\u3002\n\n\u7535\u89c6\u91cc\u7684\u7efc\u827a\u8282\u76ee\u4e0d\u77e5\u9053\u4ec0\u4e48\u65f6\u5019\u5df2\u7ecf\u7ed3\u675f\u4e86\uff0c\u5f00\u59cb\u64ad\u653e\u8d77\u4e00\u90e8\u6df1\u591c\u7684\u8001\u7535\u5f71\u3002\n\n\u6211\u7684\u624b\u673a\u5728\u53e3\u888b\u91cc\u9707\u52a8\u4e86\u4e00\u4e0b\u3002\n\n\u6211\u62ff\u51fa\u6765\uff0c\u662f\u9e7f\u7720\u5728\u6211\u4eec\u51e0\u4e2a\u7684\u7fa4\u804a\u4e2d\u53d1\u6765\u7684\u6d88\u606f\u3002\n\n\u201c\u7476\u7476\u59d0\uff0c\u53c8\u67e5\u5230\u4e86\u4e00\u4e9b\u4e1c\u897f\u3002\u82cf\u6587\u6d69\u7684\u9152\u4f1a\uff0c\u9080\u8bf7\u4e86\u4e00\u5bb6\u53eb\u2018\u591c\u8272\u2019\u7684\u5a92\u4f53\uff0c\u8fd9\u5bb6\u5a92\u4f53\u7684\u8001\u677f\uff0c\u548c\u5f20\u59d0\u662f\u5927\u5b66\u540c\u5b66\u3002\u201d\n\n\u201c\u53e6\u5916\u2026\u2026\u201d\n\n\u201c\u6211\u628a\u6211\u4eec\u522b\u5885\u7684\u76d1\u63a7\uff0c\u63a5\u5230\u6211\u7535\u8111\u4e0a\u4e86\u3002\u521a\u624d\u6709\u8f86\u9ed1\u8272\u7684\u5546\u52a1\u8f66\uff0c\u5728\u6211\u4eec\u5bb6\u95e8\u53e3\u505c\u4e86\u5f88\u4e45\u624d\u8d70\u3002\u201d\n\n\u201c\u9646\u6c89\uff0c\u6211\u5bb3\u6015\u3002\u201d\n\n\u201c\u4f60\u4eec\u2026\u2026\u4ec0\u4e48\u65f6\u5019\u56de\u6765\uff1f\u201d\n\n\n\n53.\n\u9e7f\u7720\u90a3\u51e0\u6761\u5145\u6ee1\u4e0d\u5b89\u548c\u6050\u60e7\u7684\u6d88\u606f\uff0c\u50cf\u51e0\u5757\u6295\u5165\u5e73\u9759\u6e56\u9762\u7684\u51b0\u5757\uff0c\u77ac\u95f4\u6253\u7834\u4e86\u5ba2\u5385\u91cc\u521a\u521a\u624d\u5efa\u7acb\u8d77\u6765\u7684\u3001\u8106\u5f31\u7684\u6e29\u99a8\u3002\n\n\u6c99\u53d1\u4e0a\u521a\u521a\u8fd8\u5e26\u7740\u6cea\u75d5\u7684\u7b11\u610f\u51dd\u56fa\u4e86\u3002\u6211\u4eec\u56db\u4e2a\u4eba\u9762\u9762\u76f8\u89d1\uff0c\u52ab\u540e\u4f59\u751f\u7684\u90a3\u70b9\u5e86\u5e78\uff0c\u88ab\u4e00\u79cd\u66f4\u5177\u4f53\u3001\u66f4\u8feb\u5728\u7709\u776b\u7684\u5371\u9669\u611f\u8fc5\u901f\u53d6\u4ee3\u3002\n\n\u6e29\u7476\u6700\u5148\u53cd\u5e94\u8fc7\u6765\uff0c\u5979\u7acb\u523b\u62ff\u8d77\u81ea\u5df1\u7684\u624b\u673a\uff0c\u5728\u7fa4\u91cc\u56de\u590d\u3002\n\n\u201c\u7720\u7720\u522b\u6015\uff0c\u628a\u95e8\u7a97\u90fd\u9501\u597d\uff0c\u62c9\u4e0a\u7a97\u5e18\uff0c\u4e0d\u8981\u51fa\u58f0\u3002\u6211\u4eec\u9a6c\u4e0a\u5c31\u56de\u6765\u3002\u201d\n\n\u5979\u6253\u5b8c\u5b57\uff0c\u62ac\u8d77\u5934\uff0c\u76ee\u5149\u5728\u6211\u4eec\u4e09\u4e2a\u4eba\u7684\u8138\u4e0a\u4e00\u4e00\u626b\u8fc7\u3002\u90a3\u53cc\u603b\u662f\u5f88\u6e29\u67d4\u7684\u773c\u775b\u91cc\uff0c\u6b64\u523b\u91cd\u65b0\u71c3\u8d77\u4e86\u51b7\u9759\u800c\u9510\u5229\u7684\u706b\u7130\u3002\n\n\u201c\u770b\u6765\uff0c\u6211\u4eec\u6ca1\u6709\u65f6\u95f4\u5728\u8fd9\u91cc\u611f\u6168\u4e86\u3002\u201d\n\n\u5979\u7ad9\u8d77\u8eab\uff0c\u52a8\u4f5c\u679c\u65ad\u3002\n\n\u201c\u82cf\u6587\u6d69\u548c\u5f20\u59d0\u5df2\u7ecf\u5f00\u59cb\u884c\u52a8\u4e86\u3002\u76d1\u89c6\u522b\u5885\uff0c\u53ea\u662f\u7b2c\u4e00\u6b65\u3002\u4ed6\u4eec\u662f\u5728\u8b66\u544a\u6211\u4eec\uff0c\u4e5f\u662f\u5728\u8bd5\u63a2\u6211\u4eec\u3002\u201d\n\n\u201c\u6211\u4eec\u4e0d\u80fd\u5206\u5f00\u3002\u201d\u6c5f\u96ea\u4e5f\u7ad9\u4e86\u8d77\u6765\uff0c\u5979\u7684\u58f0\u97f3\u6062\u590d\u4e86\u4e00\u8d2f\u7684\u51b0\u51b7\uff0c\u4f46\u90a3\u51b0\u51b7\u91cc\uff0c\u5374\u591a\u4e86\u4e00\u79cd\u4e0d\u5bb9\u7f6e\u7591\u7684\u575a\u5b9a\uff0c\u201c\u7720\u7720\u4e00\u4e2a\u4eba\u5728\u5bb6\u592a\u5371\u9669\u4e86\u3002\u201d\n\n\u6797\u521d\u590f\u4e5f\u64e6\u5e72\u4e86\u8138\u4e0a\u7684\u773c\u6cea\uff0c\u5979\u4ece\u6c99\u53d1\u4e0a\u8df3\u4e0b\u6765\uff0c\u773c\u795e\u91cc\u95ea\u70c1\u7740\u4e00\u79cd\u5014\u5f3a\u7684\u3001\u4e0d\u670d\u8f93\u7684\u5149\u8292\u3002\n\n\u201c\u5bf9\uff0c\u6211\u4eec\u56de\u53bb\uff01\u6211\u5012\u8981\u770b\u770b\uff0c\u4ed6\u4eec\u6562\u628a\u6211\u600e\u4e48\u6837\uff01\u201d\n\n\u6211\u770b\u7740\u5979\u4eec\u4e09\u4e2a\uff0c\u770b\u7740\u5979\u4eec\u5728\u7ecf\u5386\u4e86\u5d29\u6e83\u548c\u5766\u767d\u4e4b\u540e\uff0c\u50cf\u4e09\u53ea\u53d7\u4f24\u540e\u91cd\u65b0\u805a\u62e2\u5728\u4e00\u8d77\u7684\u96cc\u72ee\uff0c\u4eae\u51fa\u4e86\u81ea\u5df1\u7684\u722a\u7259\u3002\u6211\u611f\u89c9\u81ea\u5df1\u80f8\u53e3\u90a3\u56e2\u56e0\u4e3a\u6050\u60e7\u548c\u65e0\u529b\u800c\u51dd\u7ed3\u7684\u51b0\u5757\uff0c\u4e5f\u5f00\u59cb\u6162\u6162\u878d\u5316\uff0c\u53d8\u6210\u4e86\u4e00\u80a1\u6eda\u70eb\u7684\u70ed\u6d41\u3002\n\n\u201c\u8d70\u3002\u201d\n\n\u6211\u8bf4\u3002\u53ea\u6709\u4e00\u4e2a\u5b57\uff0c\u5374\u662f\u6211\u4eca\u5929\u8bf4\u8fc7\u7684\uff0c\u6700\u6709\u529b\uff0c\u4e5f\u6700\u6e05\u9192\u7684\u4e00\u4e2a\u5b57\u3002\n\n\u6211\u4eec\u6ca1\u6709\u518d\u6d6a\u8d39\u4e00\u79d2\u949f\u3002\n\n\u6e29\u7476\u548c\u6797\u521d\u590f\u8fc5\u901f\u5730\u53bb\u697c\u4e0a\u6362\u56de\u4e86\u81ea\u5df1\u7684\u8863\u670d\uff0c\u6c5f\u96ea\u5219\u62ff\u8d77\u624b\u673a\uff0c\u5f00\u59cb\u8054\u7cfb\u5979\u7684\u4eba\u624b\uff0c\u5b89\u6392\u522b\u5885\u5468\u56f4\u7684\u5b89\u4fdd\u95ee\u9898\u3002\u6211\u5219\u8d70\u5230\u53a8\u623f\uff0c\u628a\u51b0\u7bb1\u91cc\u80fd\u627e\u5230\u7684\uff0c\u6709\u4eba\u5b9a\u671f\u66f4\u6362\u7684\u6240\u6709\u901f\u98df\u98df\u54c1\u3001\u6c34\u679c\u548c\u996e\u6599\uff0c\u90fd\u88c5\u8fdb\u4e86\u51e0\u4e2a\u5de8\u5927\u7684\u8d2d\u7269\u888b\u91cc\u3002\n\n\u6211\u77e5\u9053\uff0c\u63a5\u4e0b\u6765\u7684\u4e09\u5929\uff0c\u90a3\u4e2a\u5bb6\uff0c\u5c06\u6210\u4e3a\u6211\u4eec\u7684\u5821\u5792\uff0c\u4e5f\u662f\u6211\u4eec\u7684\u7262\u7b3c\u3002\n\n\u5341\u5206\u949f\u540e\uff0c\u6211\u4eec\u91cd\u65b0\u5750\u8fdb\u4e86\u6c5f\u96ea\u90a3\u8f86\u767d\u8272\u7684\u8dd1\u8f66\u91cc\u3002\n\n\u8fd9\u4e00\u6b21\uff0c\u8f66\u91cc\u7684\u6c14\u6c1b\u548c\u6765\u7684\u65f6\u5019\u622a\u7136\u4e0d\u540c\u3002\u6ca1\u6709\u4e86\u90a3\u79cd\u4ee4\u4eba\u7a92\u606f\u7684\u6c89\u9ed8\u548c\u731c\u5fcc\uff0c\u53d6\u800c\u4ee3\u4e4b\u7684\u662f\u4e00\u79cd\u7d27\u7ef7\u7684\u3001\u540c\u4ec7\u654c\u5ffe\u7684\u56e2\u7ed3\u3002\n\n\u6797\u521d\u590f\u548c\u6e29\u7476\u5750\u5728\u540e\u5ea7\uff0c\u6b63\u5728\u4f4e\u58f0\u8ba8\u8bba\u7740\u4ec0\u4e48\u3002\u6797\u521d\u590f\u62ff\u7740\u624b\u673a\uff0c\u767b\u5f55\u4e86\u81ea\u5df1\u7684\u7c89\u4e1d\u540e\u63f4\u4f1a\u7684\u7ba1\u7406\u8d26\u53f7\uff0c\u4f3c\u4e4e\u5728\u4ea4\u4ee3\u7740\u4ec0\u4e48\u3002\u6e29\u7476\u5219\u5728\u4e00\u65c1\uff0c\u65f6\u4e0d\u65f6\u5730\u7ed9\u5979\u4e00\u4e9b\u5efa\u8bae\u3002\n\n\u6c5f\u96ea\u4f9d\u65e7\u5750\u5728\u526f\u9a7e\u9a76\uff0c\u5979\u6302\u65ad\u4e86\u7535\u8bdd\uff0c\u4fa7\u8fc7\u5934\uff0c\u770b\u7740\u6211\u3002\n\n\u201c\u6211\u5df2\u7ecf\u8ba9\u6211\u7684\u4eba\u60f3\u529e\u6cd5\u6e05\u7406\u4e86\u522b\u5885\u5468\u56f4\uff0c\u6682\u65f6\u4e0d\u4f1a\u6709\u4eba\u4e86\u3002\u201d\n\n\u201c\u4f46\u662f\uff0c\u82cf\u6587\u6d69\u90a3\u8fb9\u2026\u2026\u201d\u5979\u987f\u4e86\u4e00\u4e0b\uff0c\u773c\u795e\u91cc\u95ea\u8fc7\u4e00\u4e1d\u75db\u82e6\uff0c\u4f46\u5f88\u5feb\u5c31\u88ab\u4e00\u79cd\u66f4\u575a\u51b3\u7684\u60c5\u7eea\u6240\u53d6\u4ee3\uff0c\u201c\u4ed6\u4e0d\u4f1a\u5584\u7f62\u7518\u4f11\u7684\u3002\u4f60\u2026\u2026\u4e0a\u73ed\u8981\u5c0f\u5fc3\u3002\u201d\n\n\u6211\u70b9\u4e86\u70b9\u5934\uff0c\u63e1\u7740\u65b9\u5411\u76d8\u7684\u624b\uff0c\u53c8\u7d27\u4e86\u4e00\u4e9b\u3002\n\n\u201c\u4f60\u4eec\u4e5f\u662f\u3002\u201d\n\n\u8f66\u5b50\u5728\u591c\u8272\u4e2d\u98de\u9a70\uff0c\u91cd\u65b0\u56de\u5230\u4e86\u6211\u4eec\u719f\u6089\u7684\u90ca\u533a\u3002\u5f53\u90a3\u680b\u719f\u6089\u7684\u3001\u5728\u591c\u8272\u4e2d\u4eae\u7740\u6e29\u6696\u706f\u5149\u7684\u522b\u5885\u51fa\u73b0\u5728\u89c6\u91ce\u91cc\u65f6\uff0c\u6211\u4eec\u6240\u6709\u4eba\u7684\u5fc3\uff0c\u90fd\u4e0d\u7531\u81ea\u4e3b\u5730\u63ea\u7d27\u4e86\u3002\n\n\u90a3\u91cc\uff0c\u6709\u6211\u4eec\u60f3\u8981\u5b88\u62a4\u7684\u4e1c\u897f\uff0c\u4e5f\u6709\u4e00\u4e2a\u6b63\u5728\u7b49\u7740\u6211\u4eec\u7684\u3001\u5bb3\u6015\u7684\u5bb6\u4eba\u3002\n\n\u6211\u628a\u8f66\u505c\u8fdb\u9662\u5b50\uff0c\u6211\u4eec\u51e0\u4e4e\u662f\u540c\u65f6\u63a8\u5f00\u8f66\u95e8\uff0c\u5feb\u6b65\u51b2\u5411\u5927\u95e8\u3002\n\n\u6c5f\u96ea\u7528\u6307\u7eb9\u6253\u5f00\u4e86\u95e8\u3002\n\n\u95e8\u5f00\u7684\u77ac\u95f4\uff0c\u4e00\u4e2a\u5c0f\u5c0f\u7684\u3001\u7a7f\u7740\u5bbd\u5927T\u6064\u7684\u767d\u8272\u8eab\u5f71\uff0c\u5c31\u5e26\u7740\u4e00\u9635\u98ce\u548c\u538b\u6291\u7684\u54ed\u8154\uff0c\u731b\u5730\u6251\u8fdb\u4e86\u6211\u7684\u6000\u91cc\u3002\n\n\u662f\u9e7f\u7720\u3002\n\n\u5979\u5149\u7740\u811a\uff0c\u8eab\u4e0a\u51b0\u51c9\uff0c\u6574\u4e2a\u4eba\u90fd\u5728\u53d1\u6296\u3002\u5979\u7d27\u7d27\u5730\u62b1\u7740\u6211\u7684\u8170\uff0c\u628a\u8138\u57cb\u5728\u6211\u7684\u80f8\u53e3\uff0c\u653e\u58f0\u5927\u54ed\u8d77\u6765\u3002\n\n\u201c\u6211\u597d\u6015\u2026\u2026\u6211\u4ee5\u4e3a\u4f60\u4eec\u4e0d\u8981\u6211\u4e86\u2026\u2026\u201d\n\n\u90a3\u54ed\u58f0\u5145\u6ee1\u4e86\u88ab\u629b\u5f03\u7684\u6050\u60e7\u548c\u5931\u800c\u590d\u5f97\u7684\u59d4\u5c48\uff0c\u50cf\u4e00\u628a\u5c0f\u9524\u5b50\uff0c\u4e00\u4e0b\u4e00\u4e0b\u5730\uff0c\u6572\u6253\u5728\u6211\u4eec\u6bcf\u4e2a\u4eba\u7684\u5fc3\u4e0a\u3002\n\n\u6211\u4f38\u51fa\u624b\uff0c\u5c06\u5979\u5c0f\u5c0f\u7684\u3001\u98a4\u6296\u7684\u8eab\u4f53\u7d27\u7d27\u62b1\u4f4f\u3002\n\n\u201c\u6ca1\u4e8b\u4e86\u3002\u201d\n\n\u6211\u4f4e\u5934\uff0c\u5728\u5979\u94f6\u767d\u8272\u7684\u3001\u67d4\u8f6f\u7684\u53d1\u9876\u4e0a\uff0c\u8f7b\u8f7b\u5730\u543b\u4e86\u4e00\u4e0b\u3002\n\n\u201c\u6211\u4eec\u56de\u6765\u4e86\u3002\u201d\n\n\u201c\u6211\u4eec\u90fd\u5728\u3002\u201d\n\n\n\n54.\n\u6211\u7d27\u7d27\u5730\u62b1\u7740\u6000\u91cc\u745f\u745f\u53d1\u6296\u7684\u9e7f\u7720\uff0c\u5c31\u50cf\u62b1\u7740\u8fd9\u4e2a\u4e16\u754c\u4e0a\u6700\u540e\u4e00\u70b9\u6e29\u6696\u3002\u6e29\u7476\u3001\u6c5f\u96ea\u548c\u6797\u521d\u590f\uff0c\u4ece\u6211\u8eab\u540e\u56f4\u4e86\u8fc7\u6765\uff0c\u5f62\u6210\u4e00\u4e2a\u4fdd\u62a4\u7684\u3001\u6e29\u6696\u7684\u5708\uff0c\u5c06\u6211\u4eec\u4e24\u4e2a\u4eba\u5305\u88f9\u5728\u4e2d\u95f4\u3002\n\n\u6e29\u7476\u4f38\u51fa\u624b\uff0c\u8f7b\u8f7b\u5730\u629a\u6478\u7740\u9e7f\u7720\u7684\u540e\u80cc\uff0c\u5e2e\u5979\u987a\u7740\u6c14\u3002\u6797\u521d\u590f\u5219\u628a\u624b\u642d\u5728\u4e86\u6211\u7684\u80a9\u8180\u4e0a\uff0c\u7528\u529b\u5730\u634f\u4e86\u634f\uff0c\u50cf\u662f\u5728\u7ed9\u6211\u4f20\u9012\u529b\u91cf\u3002\u6c5f\u96ea\u6ca1\u6709\u8bf4\u8bdd\uff0c\u5979\u53ea\u662f\u9ed8\u9ed8\u5730\u8d70\u5230\u7384\u5173\uff0c\u628a\u90a3\u6247\u655e\u5f00\u7684\u5927\u95e8\uff0c\u91cd\u91cd\u5730\u5173\u4e0a\uff0c\u7136\u540e\u843d\u4e0b\u4e86\u5b89\u5168\u9501\u3002\n\n\u201c\u5494\u54d2\u201d\u4e00\u58f0\uff0c\u5c06\u5916\u9762\u90a3\u4e2a\u5145\u6ee1\u5371\u9669\u548c\u6076\u610f\u7684\u4e16\u754c\uff0c\u5f7b\u5e95\u9694\u7edd\u5728\u5916\u3002\n\n\u9e7f\u7720\u5728\u6211\u6000\u91cc\u54ed\u4e86\u5f88\u4e45\uff0c\u76f4\u5230\u628a\u6211\u7684\u6574\u7247\u80f8\u895f\u90fd\u54ed\u5f97\u6e7f\u900f\uff0c\u624d\u6e10\u6e10\u505c\u4e86\u4e0b\u6765\u3002\u5979\u62ac\u8d77\u90a3\u5f20\u6cea\u75d5\u6591\u9a73\u7684\u5c0f\u8138\uff0c\u7ea2\u7740\u773c\u775b\uff0c\u770b\u770b\u6211\uff0c\u53c8\u770b\u770b\u56f4\u7740\u6211\u4eec\u7684\u4e09\u4e2a\u4eba\u3002\n\n\u201c\u6211\u2026\u2026\u6211\u4ee5\u4e3a\u6211\u4eec\u771f\u8981\u5206\u5f00\u4e86\u3002\u201d\u5979\u7684\u58f0\u97f3\u8fd8\u5e26\u7740\u6d53\u91cd\u7684\u9f3b\u97f3\u3002\n\n\u201c\u662f\u554a\uff0c\u6211\u4eec\u5dee\u70b9\u5c31\u5377\u6b3e\u79c1\u9003\u4e86\uff0c\u5c31\u7559\u4e0b\u4f60\u4e00\u4e2a\u4eba\u770b\u5bb6\u3002\u201d\u6797\u521d\u590f\u5f00\u53e3\u4e86\uff0c\u5979\u7684\u58f0\u97f3\u6c99\u54d1\uff0c\u4f46\u8bed\u6c14\u91cc\u5374\u5e26\u7740\u4e00\u4e1d\u52ab\u540e\u4f59\u751f\u7684\u3001\u6545\u4f5c\u8f7b\u677e\u7684\u620f\u8c11\uff0c\u201c\u8c01\u8ba9\u4f60\u662f\u6211\u4eec\u8fd9\u91cc\u6700\u53ef\u7231\u7684\u5c0f\u5bcc\u5a46\u5462\u3002\u201d\n\n\u9e7f\u7720\u6123\u4e86\u4e00\u4e0b\uff0c\u7728\u4e86\u7728\u90a3\u53cc\u6c34\u6d17\u8fc7\u4e00\u6837\u6e05\u6f88\u7684\u773c\u775b\uff0c\u4f3c\u4e4e\u6ca1\u53cd\u5e94\u8fc7\u6765\u3002\n\n\u201c\u5657\u55e4\u201d\u4e00\u58f0\uff0c\u6e29\u7476\u5148\u7b11\u4e86\u51fa\u6765\u3002\u6c5f\u96ea\u90a3\u5f20\u603b\u662f\u51b0\u51b7\u7684\u8138\u4e0a\uff0c\u4e5f\u518d\u6b21\u6709\u4e86\u4e00\u4e1d\u82e5\u6709\u82e5\u65e0\u7684\u7b11\u610f\u3002\n\n\u8fd9\u538b\u6291\u4e86\u6574\u6574\u4e00\u5929\u7684\u3001\u4ee4\u4eba\u7a92\u606f\u7684\u6c1b\u56f4\uff0c\u5c31\u5728\u6797\u521d\u590f\u8fd9\u53e5\u534a\u771f\u534a\u5047\u7684\u73a9\u7b11\u91cc\uff0c\u5f7b\u5e95\u6d88\u6563\u4e86\u3002\n\n\u6211\u677e\u5f00\u62b1\u7740\u9e7f\u7720\u7684\u624b\uff0c\u770b\u7740\u5979\u3002\n\n\u201c\u53bb\u6d17\u4e2a\u6fa1\uff0c\u6362\u8eab\u8863\u670d\u3002\u201d\u6211\u7684\u58f0\u97f3\u5f88\u67d4\u548c\uff0c\u201c\u7136\u540e\uff0c\u6211\u4eec\u5403\u996d\u3002\u201d\n\n\u201c\u5403\u4ec0\u4e48\uff1f\u201d\u9e7f\u7720\u4e0b\u610f\u8bc6\u5730\u95ee\uff0c\u773c\u775b\u91cc\u7acb\u523b\u95ea\u70c1\u8d77\u5bf9\u98df\u7269\u7684\u6e34\u671b\u3002\n\n\u201c\u706b\u9505\u3002\u201d\n\n\u8fd9\u4e00\u6b21\uff0c\u56de\u7b54\u5979\u7684\u4e0d\u662f\u6211\uff0c\u800c\u662f\u6c5f\u96ea\u3002\n\n\u5979\u770b\u7740\u6211\u4eec\u6240\u6709\u4eba\uff0c\u90a3\u53cc\u603b\u662f\u51b0\u51b7\u7684\u773c\u775b\u91cc\uff0c\u6b64\u523b\u50cf\u878d\u5316\u4e86\u7684\u3001\u6625\u5929\u7684\u6e56\u6c34\uff0c\u5012\u6620\u7740\u6211\u4eec\u6bcf\u4e2a\u4eba\u7684\u5f71\u5b50\u3002\n\n\u201c\u4eca\u665a\uff0c\u5403\u706b\u9505\u3002\u201d\n\n\u5979\u4e00\u5b57\u4e00\u987f\u5730\u8bf4\uff0c\u50cf\u662f\u5728\u5ba3\u5e03\u4e00\u4e2a\u4e0d\u5bb9\u7f6e\u7591\u7684\u51b3\u5b9a\u3002\n\n\u4e8e\u662f\uff0c\u8fd9\u4e2a\u521a\u521a\u7ecf\u5386\u4e86\u4e00\u573a\u5de8\u5927\u98ce\u66b4\u7684\u5bb6\uff0c\u5c31\u5728\u6c5f\u96ea\u8fd9\u53e5\u7b80\u5355\u7684\u63d0\u8bae\u91cc\uff0c\u91cd\u65b0\u6062\u590d\u4e86\u5b83\u5e94\u6709\u7684\u3001\u4e71\u7cdf\u7cdf\u5374\u53c8\u751f\u673a\u52c3\u52c3\u7684\u79e9\u5e8f\u3002\n\n\u6211\u8d1f\u8d23\u4ece\u50a8\u7269\u95f4\u628a\u90a3\u53e3\u5de8\u5927\u7684\u94dc\u9505\u548c\u7535\u78c1\u7089\u642c\u8fc7\u6765\u3002\u6e29\u7476\u5219\u7cfb\u4e0a\u56f4\u88d9\uff0c\u5f00\u59cb\u6e05\u6d17\u5404\u79cd\u852c\u83dc\u3002\u6797\u521d\u590f\u81ea\u544a\u594b\u52c7\u5730\u8d1f\u8d23\u6446\u653e\u7897\u7b77\u548c\u8c03\u5236\u8638\u6599\uff0c\u5979\u54fc\u7740\u4e0d\u6210\u8c03\u7684\u65b0\u6b4c\uff0c\u811a\u6b65\u8f7b\u5feb\u3002\n\n\u6c5f\u96ea\u4ece\u90a3\u4e2a\u4e13\u95e8\u7528\u6765\u50a8\u85cf\u9ad8\u7ea7\u98df\u6750\u7684\u51b0\u7bb1\u91cc\uff0c\u62ff\u51fa\u4e86\u4e00\u76d8\u76d8\u54c1\u8d28\u6781\u4f73\u7684\u3001\u5207\u5f97\u8584\u5982\u8749\u7ffc\u7684\u96ea\u82b1\u548c\u725b\u3002\n\n\u800c\u9e7f\u7720\uff0c\u6d17\u5b8c\u6fa1\u540e\uff0c\u4f9d\u65e7\u662f\u5149\u7740\u8eab\u5b50\uff0c\u50cf\u4e00\u53ea\u5feb\u4e50\u7684\u3001\u767d\u8272\u7684\u5c0f\u7cbe\u7075\uff0c\u5728\u6211\u4eec\u4e2d\u95f4\u7a7f\u68ad\uff0c\u4e00\u4f1a\u513f\u8dd1\u5230\u6e29\u7476\u8eab\u8fb9\uff0c\u5077\u5403\u4e00\u6839\u521a\u6d17\u597d\u7684\u9ec4\u74dc\uff0c\u4e00\u4f1a\u513f\u53c8\u8dd1\u5230\u6211\u811a\u8fb9\uff0c\u4ef0\u7740\u8138\u95ee\u6211\u706b\u9505\u4ec0\u4e48\u65f6\u5019\u624d\u80fd\u597d\u3002\n\n\u5979\u4f3c\u4e4e\u5b8c\u5168\u4e0d\u5728\u610f\u81ea\u5df1\u8d64\u8eab\u88f8\u4f53\uff0c\u5176\u4ed6\u4eba\u4e5f\u5bf9\u6b64\u4e60\u4ee5\u4e3a\u5e38\u3002\u6797\u521d\u590f\u751a\u81f3\u8fd8\u5728\u8def\u8fc7\u5979\u7684\u65f6\u5019\uff0c\u574f\u7b11\u7740\u5728\u5979\u633a\u7fd8\u7684\u3001\u5149\u6d01\u7684\u5c41\u80a1\u4e0a\u4e0d\u8f7b\u4e0d\u91cd\u5730\u62cd\u4e86\u4e00\u4e0b\uff0c\u53d1\u51fa\u4e00\u58f0\u6e05\u8106\u7684\u54cd\u58f0\u3002\n\n\u9e7f\u7720\u201c\u5440\u201d\u4e86\u4e00\u58f0\uff0c\u56de\u5934\u77aa\u4e86\u5979\u4e00\u773c\uff0c\u5374\u4e5f\u6ca1\u771f\u7684\u751f\u6c14\uff0c\u8f6c\u8eab\u5c31\u6251\u5230\u6c5f\u96ea\u6000\u91cc\u53bb\u544a\u72b6\u4e86\u3002\n\n\u6c5f\u96ea\u62b1\u7740\u5979\uff0c\u65e0\u5948\u5730\u6447\u4e86\u6447\u5934\uff0c\u7136\u540e\u8ddf\u5413\u552c\u4f3c\u7684\u5c0f\u4e2b\u5934\u8bf4\u7740\u4ec0\u4e48\uff0c\u5bb3\u5f97\u9e7f\u7720\u4e00\u4e0b\u5b50\u795e\u7ecf\u516e\u516e\u8d77\u6765\u3002\n\n\u6211\u770b\u7740\u773c\u524d\u8fd9\u5e45\u753b\u9762\uff0c\u770b\u7740\u5979\u4eec\u7b11\u7740\uff0c\u95f9\u7740\uff0c\u611f\u89c9\u81ea\u5df1\u50cf\u5728\u505a\u68a6\u3002\u90a3\u4e9b\u75db\u82e6\uff0c\u90a3\u4e9b\u773c\u6cea\uff0c\u90a3\u4e9b\u731c\u5fcc\u548c\u4e89\u5435\uff0c\u90fd\u50cf\u4e0a\u4e2a\u4e16\u7eaa\u53d1\u751f\u7684\u4e8b\u60c5\u4e00\u6837\uff0c\u53d8\u5f97\u9065\u8fdc\u800c\u4e0d\u771f\u5b9e\u3002\n\n\u5f88\u5feb\uff0c\u94dc\u9505\u91cc\u7684\u6c64\u5e95\u5c31\u5f7b\u5e95\u6cb8\u817e\u4e86\uff0c\u53d1\u51fa\u201c\u5495\u561f\u5495\u561f\u201d\u7684\u3001\u4ee4\u4eba\u6109\u60a6\u7684\u58f0\u54cd\u3002\u7ea2\u8272\u7684\u8fa3\u6cb9\u7ffb\u6eda\u7740\uff0c\u767d\u8272\u7684\u9aa8\u6c64\u6563\u53d1\u7740\u6d53\u90c1\u7684\u9999\u6c14\u3002\u6211\u4eec\u4e94\u4e2a\u4eba\u56f4\u5750\u5728\u6e29\u6696\u7684\u3001\u6c24\u6c32\u7684\u84b8\u6c7d\u91cc\uff0c\u628a\u5404\u79cd\u5404\u6837\u65b0\u9c9c\u7684\u98df\u6750\u4e0b\u8fdb\u9505\u91cc\u3002\n\n\u201c\u9646\u6c89\uff0c\u7ed9\u6211\u70eb\u4e00\u7247\u6bdb\u809a\uff0c\u8981\u4e03\u4e0a\u516b\u4e0b\u7684\u90a3\u79cd\uff01\u201d\n\n\u201c\u7476\u7476\u59d0\uff0c\u6211\u7684\u829d\u9ebb\u9171\u5feb\u6ca1\u4e86\uff01\u201d\n\n\u201c\u6c5f\u96ea\u6c5f\u96ea\uff0c\u90a3\u4e2a\u8089\u597d\u597d\u5403\uff0c\u6211\u8fd8\u60f3\u5403\uff01\u201d\n\n\u201c\u9646\u6c89\uff0c\u6211\u8981\u867e\u6ed1\uff01\u201d\n\n\u6211\u88ab\u5979\u4eec\u56db\u4e2a\u4f7f\u5524\u5f97\u56e2\u56e2\u8f6c\uff0c\u4e00\u4f1a\u513f\u635e\u83dc\uff0c\u4e00\u4f1a\u513f\u8c03\u9171\uff0c\u4e00\u4f1a\u513f\u6dae\u8089\uff0c\u5fd9\u5f97\u4e0d\u4ea6\u4e50\u4e4e\u3002\u4f46\u6211\u7684\u5fc3\u91cc\uff0c\u5374\u88ab\u4e00\u79cd\u524d\u6240\u672a\u6709\u7684\u3001\u5de8\u5927\u7684\u5e78\u798f\u611f\u548c\u6ee1\u8db3\u611f\uff0c\u586b\u5f97\u6ee1\u6ee1\u5f53\u5f53\u3002\n\n\u8fd9\u6216\u8bb8\uff0c\u5c31\u662f\u6211\u4e00\u76f4\u4ee5\u6765\uff0c\u6700\u60f3\u8981\u7684\uff0c\u5374\u53c8\u6700\u4e0d\u6562\u5962\u6c42\u7684\u4e1c\u897f\u3002\n\n\u5403\u5f97\u5dee\u4e0d\u591a\u7684\u65f6\u5019\uff0c\u6e29\u7476\u5ffd\u7136\u653e\u4e0b\u7b77\u5b50\uff0c\u770b\u7740\u6211\u3002\n\n\u201c\u9646\u6c89\uff0c\u8fc7\u4e24\u5929\u5c31\u662f\u4f60\u751f\u65e5\u4e86\u5427\uff1f\u201d\n\n\u6211\u6123\u4e86\u4e00\u4e0b\uff0c\u624d\u60f3\u8d77\u6765\uff0c\u597d\u50cf\uff0c\u786e\u5b9e\u662f\u3002\n\n\n\n55.\n\u6211\u88ab\u6e29\u7476\u95ee\u5f97\u4e00\u6123\uff0c\u8111\u5b50\u91cc\u98de\u5feb\u5730\u8ba1\u7b97\u4e86\u4e00\u4e0b\u65e5\u671f\u3002\u597d\u50cf\u2026\u2026\u8fd8\u771f\u662f\u540e\u5929\u3002\u8fd9\u6bb5\u65f6\u95f4\u53d1\u751f\u4e86\u592a\u591a\u4e8b\uff0c\u5175\u8352\u9a6c\u4e71\uff0c\u6211\u65e9\u5c31\u628a\u81ea\u5df1\u7684\u751f\u65e5\u5fd8\u5f97\u4e00\u5e72\u4e8c\u51c0\u4e86\u3002\n\n\u201c\u597d\u50cf\u662f\u2026\u2026\u201d\u6211\u6709\u4e9b\u4e0d\u786e\u5b9a\u5730\u56de\u7b54\u3002\n\n\u6211\u7684\u8bdd\u97f3\u521a\u843d\uff0c\u684c\u4e0a\u7684\u6c14\u6c1b\u77ac\u95f4\u5c31\u53d8\u4e86\u3002\n\n\u6797\u521d\u590f\u90a3\u53cc\u521a\u521a\u624d\u54ed\u8fc7\u7684\u3001\u53c8\u7ea2\u53c8\u80bf\u7684\u773c\u775b\u4e00\u4e0b\u5b50\u4eae\u4e86\u8d77\u6765\uff0c\u50cf\u4e24\u9897\u88ab\u91cd\u65b0\u70b9\u71c3\u7684\u5c0f\u661f\u661f\u3002\u5979\u548c\u8eab\u8fb9\u7684\u6c5f\u96ea\u4ea4\u6362\u4e86\u4e00\u4e2a\u610f\u5473\u6df1\u957f\u7684\u773c\u795e\uff0c\u6c5f\u96ea\u90a3\u5f20\u603b\u662f\u6ca1\u4ec0\u4e48\u8868\u60c5\u7684\u8138\u4e0a\uff0c\u4e5f\u9732\u51fa\u4e86\u4e00\u4e1d\u6781\u96be\u5bdf\u89c9\u7684\u3001\u50cf\u662f\u8ba1\u8c0b\u5f97\u901e\u7684\u7b11\u610f\u3002\n\n\u5c31\u8fde\u4e00\u5411\u53ea\u5bf9\u98df\u7269\u611f\u5174\u8da3\u7684\u9e7f\u7720\uff0c\u4e5f\u653e\u4e0b\u4e86\u624b\u91cc\u7684\u7b77\u5b50\uff0c\u6b6a\u7740\u5934\u770b\u7740\u6211\uff0c\u773c\u795e\u91cc\u95ea\u70c1\u7740\u5174\u594b\u7684\u5149\u8292\u3002\n\n\u53ea\u6709\u6e29\u7476\uff0c\u4f9d\u65e7\u662f\u90a3\u526f\u6e29\u67d4\u5e26\u7b11\u7684\u6a21\u6837\uff0c\u5979\u62ff\u8d77\u7b77\u5b50\uff0c\u7ed9\u6211\u7897\u91cc\u5939\u4e86\u4e00\u5927\u5757\u70eb\u597d\u7684\u548c\u725b\u3002\n\n\u201c\u54ce\u5440\uff0c\u90a3\u53ef\u5f97\u597d\u597d\u5e86\u795d\u4e00\u4e0b\u4e86\u3002\u201d\u6797\u521d\u590f\u62d6\u957f\u4e86\u58f0\u97f3\uff0c\u8bed\u6c14\u91cc\u6ee1\u662f\u85cf\u4e0d\u4f4f\u7684\u7b11\u610f\uff0c\u201c\u6211\u4eec\u7684\u5927\u529f\u81e3\uff0c\u9a6c\u4e0a\u5c31\u8981\u8fc7\u751f\u65e5\u4e86\uff0c\u4f60\u4eec\u8bf4\uff0c\u8be5\u9001\u4ed6\u70b9\u4ec0\u4e48\u597d\u5462\uff1f\u201d\n\n\u5979\u8bf4\u7740\uff0c\u7528\u624b\u8098\u78b0\u4e86\u78b0\u8eab\u8fb9\u7684\u6c5f\u96ea\u3002\n\n\u6c5f\u96ea\u6162\u6761\u65af\u7406\u5730\u7528\u9910\u5dfe\u64e6\u4e86\u64e6\u5634\uff0c\u770b\u4e86\u4e00\u773c\u88ab\u8fa3\u6cb9\u70eb\u5f97\u5634\u5507\u901a\u7ea2\u7684\u6211\uff0c\u6de1\u6de1\u5730\u8bf4\u3002\n\n\u201c\u4ed6\u4ec0\u4e48\u90fd\u7f3a\u3002\u201d\n\n\u201c\u7f3a\u4eba\u7ba1\uff0c\u7f3a\u4eba\u75bc\uff0c\u8fd8\u7f3a\u5fc3\u773c\u3002\u201d\n\n\u6e29\u7476\u7b11\u7740\u6447\u4e86\u6447\u5934\uff0c\u5979\u770b\u7740\u6211\uff0c\u773c\u795e\u91cc\u5374\u5e26\u7740\u4e00\u4e1d\u8ba4\u771f\u3002\n\n\u201c\u6ca1\u5173\u7cfb\uff0c\u6211\u4eec\u66ff\u4ed6\u60f3\u597d\u4e86\u3002\u201d\n\n\u201c\u9646\u6c89\uff0c\u4f60\u90a3\u5929\u4ec0\u4e48\u90fd\u4e0d\u7528\u7ba1\uff0c\u4e5f\u4ec0\u4e48\u90fd\u4e0d\u7528\u95ee\u3002\u201d\n\n\u201c\u628a\u65f6\u95f4\u7a7a\u51fa\u6765\uff0c\u7b49\u7740\u6536\u793c\u7269\u5c31\u884c\u3002\u201d\n\n\u5979\u4eec\u4e09\u4e2a\u4eba\u4e00\u5531\u4e00\u548c\uff0c\u8bdd\u91cc\u8bdd\u5916\u90fd\u900f\u7740\u4e00\u80a1\u4e0d\u5bb9\u6211\u62d2\u7edd\u7684\u3001\u795e\u79d8\u516e\u516e\u7684\u9ed8\u5951\u3002\u6211\u770b\u7740\u5979\u4eec\uff0c\u5fc3\u91cc\u90a3\u80a1\u56e0\u4e3a\u5371\u673a\u800c\u7d27\u7ef7\u7684\u5f26\uff0c\u5f7b\u5e95\u677e\u5f1b\u4e86\u4e0b\u6765\uff0c\u53d6\u800c\u4ee3\u4e4b\u7684\uff0c\u662f\u4e00\u79cd\u6e29\u6696\u7684\u3001\u88ab\u5e78\u798f\u5305\u88f9\u7684\u3001\u8f7b\u98d8\u98d8\u7684\u832b\u7136\u3002\n\n\u6211\u603b\u89c9\u5f97\uff0c\u5979\u4eec\u8bf4\u7684\u201c\u793c\u7269\u201d\uff0c\u597d\u50cf\u4e0d\u4ec5\u4ec5\u662f\u793c\u7269\u90a3\u4e48\u7b80\u5355\u3002\n\n\u63a5\u4e0b\u6765\u7684\u65f6\u95f4\uff0c\u98ce\u5e73\u6d6a\u9759\u3002\n\n\u4e00\u5207\u90fd\u5e73\u9759\u5f97\u6709\u4e9b\u8be1\u5f02\u3002\n\n\u4f46\u6211\u4eec\u90fd\u77e5\u9053\uff0c\u8fd9\u4e0d\u662f\u7ed3\u675f\uff0c\u53ea\u662f\u66b4\u98ce\u96e8\u6765\u4e34\u524d\uff0c\u4ee4\u4eba\u7a92\u606f\u7684\u5b81\u9759\u3002\u9e7f\u7720\u7684\u7535\u8111\u4e0a\uff0c\u4f9d\u65e7\u663e\u793a\u7740\u6211\u4eec\u522b\u5885\u5468\u56f4\u6709\u51e0\u4e2a\u53ef\u7591\u7684\u4fe1\u53f7\u6e90\u5728\u5f98\u5f8a\u3002\n\n\u6211\u4eec\u50cf\u662f\u88ab\u4e00\u53ea\u770b\u4e0d\u89c1\u7684\u624b\uff0c\u60ac\u5728\u4e86\u534a\u7a7a\u4e2d\uff0c\u4e0d\u77e5\u9053\u4e0b\u4e00\u79d2\uff0c\u662f\u4f1a\u5b89\u7136\u843d\u5730\uff0c\u8fd8\u662f\u4f1a\u7c89\u8eab\u788e\u9aa8\u3002\n\n\u4f46\u5728\u8fd9\u79cd\u8be1\u5f02\u7684\u5e73\u9759\u4e4b\u4e0b\uff0c\u6211\u4eec\u8fd9\u4e2a\u5c0f\u5c0f\u7684\u5bb6\uff0c\u5374\u524d\u6240\u672a\u6709\u5730\u70ed\u95f9\u548c\u56e2\u7ed3\u8d77\u6765\u3002\n\n\u5979\u4eec\u56db\u4e2a\uff0c\u5f7b\u5e95\u628a\u6211\u6392\u9664\u5728\u4e86\u5979\u4eec\u7684\u201c\u5c0f\u56e2\u4f53\u201d\u4e4b\u5916\u3002\u6574\u5929\u90fd\u805a\u5728\u4e00\u8d77\uff0c\u5173\u7740\u623f\u95e8\uff0c\u4e0d\u77e5\u9053\u5728\u91cc\u9762\u5600\u5600\u5495\u5495\u5730\u5546\u91cf\u7740\u4ec0\u4e48\u3002\u6bcf\u6b21\u6211\u4e00\u9760\u8fd1\uff0c\u5979\u4eec\u5c31\u4f1a\u7acb\u523b\u5664\u58f0\uff0c\u7136\u540e\u7528\u4e00\u79cd\u201c\u8fd9\u91cc\u6ca1\u4f60\u4e8b\u201d\u7684\u773c\u795e\u628a\u6211\u8d76\u8d70\u3002\n\n\u9e7f\u7720\u751a\u81f3\u90fd\u987e\u4e0d\u4e0a\u770b\u5979\u4e00\u76f4\u8ffd\u7684\u52a8\u6f2b\u4e86\uff0c\u6bcf\u5929\u795e\u795e\u79d8\u79d8\u5730\u62b1\u7740\u4e2a\u7b14\u8bb0\u672c\u7535\u8111\uff0c\u5728\u51e0\u4e2a\u623f\u95f4\u91cc\u7a9c\u6765\u7a9c\u53bb\u3002\u6709\u4e00\u6b21\u6211\u8def\u8fc7\u5979\u95e8\u53e3\uff0c\u8fd8\u542c\u5230\u91cc\u9762\u4f20\u6765\u6797\u521d\u590f\u7684\u58f0\u97f3\u3002\n\n\u201c\u8fd9\u4e2a\u706f\u5149\u662f\u4e0d\u662f\u592a\u4eae\u4e86\uff1f\u6211\u89c9\u5f97\u6697\u4e00\u70b9\u6bd4\u8f83\u6709\u60c5\u8c03\u3002\u201d\n\n\u201c\u4e0d\u884c\uff0c\u592a\u6697\u4e86\u62cd\u51fa\u6765\u4e0d\u597d\u770b\u3002\u201d\n\n\u201c\u8c01\u8bf4\u8981\u62cd\u7167\u4e86\uff01\u201d\n\n\u7136\u540e\u5c31\u662f\u4e00\u9635\u5b09\u7b11\u6253\u95f9\u7684\u58f0\u97f3\u3002\n\n\u6211\u95ee\u5979\u4eec\u5728\u5e72\u4ec0\u4e48\uff0c\u5979\u4eec\u5c31\u5f02\u53e3\u540c\u58f0\u5730\u544a\u8bc9\u6211\uff1a\u201c\u5728\u51c6\u5907\u4f60\u7684\u751f\u65e5\u60ca\u559c\u3002\u201d\n\n\u6211\u8d8a\u53d1\u89c9\u5f97\u4e0d\u5b89\u3002\n\n\u7ec8\u4e8e\uff0c\u5230\u4e86\u6211\u751f\u65e5\u90a3\u5929\u3002\n\n\u90a3\u5929\u6211\u7167\u5e38\u53bb\u4e0a\u4e86\u73ed\uff0c\u4e00\u6574\u5929\u90fd\u5fc3\u795e\u4e0d\u5b81\u3002\u6e29\u7476\u7279\u610f\u53d1\u4fe1\u606f\u53ee\u5631\u6211\uff0c\u665a\u4e0a\u4e5d\u70b9\u5fc5\u987b\u5230\u5bb6\uff0c\u4e0d\u8bb8\u65e9\uff0c\u4e5f\u4e0d\u8bb8\u665a\u3002\n\n\u6211\u6390\u7740\u70b9\uff0c\u4e5d\u70b9\u6574\uff0c\u51c6\u65f6\u628a\u8f66\u505c\u8fdb\u4e86\u9662\u5b50\u3002\n\n\u6211\u7ad9\u5728\u5bb6\u95e8\u53e3\uff0c\u6df1\u5438\u4e86\u4e00\u53e3\u6c14\uff0c\u624b\u5fc3\u91cc\u5168\u662f\u6c57\u3002\u6211\u611f\u89c9\u81ea\u5df1\u4e0d\u50cf\u662f\u5728\u56de\u5bb6\uff0c\u5012\u50cf\u662f\u4e00\u4e2a\u5373\u5c06\u8d70\u4e0a\u5211\u573a\u7684\u56da\u72af\uff0c\u5728\u7b49\u5f85\u7740\u547d\u8fd0\u7684\u6700\u7ec8\u5ba3\u5224\u3002\n\n\u6211\u6253\u5f00\u4e86\u95e8\u3002\n\n\u5c4b\u5b50\u91cc\u4e00\u7247\u6f06\u9ed1\u3002\n\n\u6240\u6709\u7684\u706f\u90fd\u5173\u7740\uff0c\u7a97\u5e18\u4e5f\u62c9\u5f97\u4e25\u4e25\u5b9e\u5b9e\uff0c\u6ca1\u6709\u4e00\u4e1d\u5149\u4eae\u3002\u5b89\u9759\u5f97\u80fd\u542c\u5230\u81ea\u5df1\u7684\u5fc3\u8df3\u58f0\u3002\n\n\u201c\u2026\u2026\u6709\u4eba\u5417\uff1f\u201d\n\n\u6211\u8bd5\u63a2\u6027\u5730\u53eb\u4e86\u4e00\u58f0\uff0c\u58f0\u97f3\u5728\u7a7a\u65f7\u7684\u7384\u5173\u91cc\u56de\u8361\u3002\n\n\u6ca1\u6709\u4eba\u56de\u7b54\u3002\n\n\u5c31\u5728\u6211\u4ee5\u4e3a\u5979\u4eec\u662f\u4e0d\u662f\u5728\u8ddf\u6211\u5f00\u4ec0\u4e48\u6076\u4f5c\u5267\u73a9\u7b11\u7684\u65f6\u5019\uff0c\u5ba2\u5385\u7684\u65b9\u5411\uff0c\u5ffd\u7136\u4eae\u8d77\u4e86\u4e00\u675f\u67d4\u548c\u7684\u3001\u6e29\u6696\u7684\u7535\u5b50\u70db\u5149\u3002\n\n\u7d27\u63a5\u7740\uff0c\u662f\u7b2c\u4e8c\u675f\uff0c\u7b2c\u4e09\u675f\uff0c\u7b2c\u56db\u675f\u2026\u2026\n\n\u65e0\u6570\u652f\u5c0f\u5c0f\u7684\u3001\u6447\u66f3\u7684\u7535\u5b50\u8721\u70db\uff0c\u88ab\u4f9d\u6b21\u70b9\u4eae\uff0c\u5b83\u4eec\u88ab\u6446\u653e\u5728\u5730\u4e0a\uff0c\u4ece\u5ba2\u5385\u7684\u5165\u53e3\uff0c\u4e00\u76f4\u5ef6\u4f38\u5230\u6df1\u5904\uff0c\u50cf\u4e00\u6761\u901a\u5f80\u672a\u77e5\u4e16\u754c\u7684\u3001\u95ea\u95ea\u53d1\u5149\u7684\u94f6\u6cb3\u3002\n\n\u800c\u5728\u90a3\u6761\u94f6\u6cb3\u7684\u5c3d\u5934\uff0c\u56db\u4e2a\u719f\u6089\u7684\u8eab\u5f71\uff0c\u5c31\u90a3\u4e48\u9759\u9759\u5730\u7ad9\u5728\u90a3\u91cc\u3002\n\n\u5f53\u6211\u770b\u6e05\u5979\u4eec\u7684\u90a3\u4e00\u523b\uff0c\u6211\u611f\u89c9\u81ea\u5df1\u5168\u8eab\u7684\u8840\u6db2\uff0c\u90fd\u5728\u77ac\u95f4\u51dd\u56fa\u4e86\u3002\n\n\u5979\u4eec\u6240\u6709\u4eba\u7684\u8eab\u4e0a\uff0c\u90fd\u4e00\u4e1d\u4e0d\u6302\u3002\n\n\n\n56.\n\u6211\u7ad9\u5728\u7384\u5173\u7684\u9634\u5f71\u91cc\uff0c\u4e00\u52a8\u4e0d\u52a8\uff0c\u50cf\u4e00\u5c0a\u88ab\u77ac\u95f4\u77f3\u5316\u7684\u96d5\u50cf\u3002\n\n\u6211\u7684\u5927\u8111\u505c\u6b62\u4e86\u8fd0\u8f6c\uff0c\u547c\u5438\u4e5f\u4eff\u4f5b\u88ab\u4e00\u53ea\u65e0\u5f62\u7684\u624b\u627c\u4f4f\uff0c\u6240\u6709\u7684\u611f\u5b98\u90fd\u88ab\u773c\u524d\u8fd9\u5e45\u8d85\u8d8a\u4e86\u73b0\u5b9e\u3001\u751a\u81f3\u8d85\u8d8a\u4e86\u6240\u6709\u60f3\u8c61\u7684\u753b\u9762\u5f7b\u5e95\u5265\u593a\u4e86\u3002\n\n\u5979\u4eec\u5c31\u90a3\u6837\u8d64\u88f8\u7740\uff0c\u5e76\u6392\u7ad9\u5728\u8fd9\u7247\u7531\u70db\u5149\u94fa\u5c31\u7684\u94f6\u6cb3\u5c3d\u5934\u3002\n\n\u5de6\u8fb9\u662f\u6797\u521d\u590f\u3002\u5979\u90a3\u603b\u662f\u5145\u6ee1\u6d3b\u529b\u7684\u8eab\u4f53\uff0c\u5728\u6447\u66f3\u7684\u70db\u5149\u4e0b\uff0c\u5448\u73b0\u51fa\u4e00\u79cd\u5065\u5eb7\u800c\u5bcc\u6709\u5f39\u6027\u7684\u871c\u8272\u5149\u6cfd\u3002\u5979\u7684\u53cc\u624b\u6709\u4e9b\u4e0d\u5b89\u5730\u80cc\u5728\u8eab\u540e\uff0c\u53cc\u817f\u5e76\u62e2\uff0c\u7ad9\u5f97\u7b14\u76f4\uff0c\u80f8\u90e8\u633a\u8d77\uff0c\u50cf\u4e00\u4e2a\u7b49\u5f85\u68c0\u9605\u7684\u3001\u7d27\u5f20\u7684\u58eb\u5175\u3002\u90a3\u53cc\u603b\u662f\u5e26\u7740\u7b11\u610f\u7684\u773c\u775b\uff0c\u6b64\u523b\u6b63\u4e00\u7728\u4e0d\u7728\u5730\u770b\u7740\u6211\uff0c\u773c\u795e\u91cc\u662f\u8c41\u51fa\u53bb\u4e00\u5207\u7684\u7f9e\u6da9\u548c\u51b3\u7edd\u3002\n\n\u5979\u8eab\u8fb9\u662f\u6c5f\u96ea\u3002\u5979\u767d\u5f97\u50cf\u4e0a\u597d\u7684\u7f8a\u8102\u7389\uff0c\u808c\u80a4\u5728\u660f\u6697\u7684\u5149\u7ebf\u4e0b\u7ec6\u817b\u5f97\u4eff\u4f5b\u5728\u53d1\u5149\u3002\u5979\u4e0d\u50cf\u6797\u521d\u590f\u90a3\u6837\u7d27\u7ef7\uff0c\u4f46\u4e5f\u7565\u663e\u4e0d\u81ea\u7136\uff0c\u53cc\u81c2\u6709\u4e9b\u522b\u626d\u7684\u5782\u5728\u8eab\u4f53\u4e24\u4fa7\u3002\u5979\u5c31\u90a3\u4e48\u770b\u7740\u6211\uff0c\u90a3\u53cc\u603b\u662f\u50cf\u7ed3\u4e86\u51b0\u7684\u773c\u775b\uff0c\u6b64\u523b\u5728\u70db\u5149\u7684\u6620\u7167\u4e0b\uff0c\u50cf\u4e24\u6f6d\u878d\u5316\u4e86\u7684\u3001\u6df1\u4e0d\u89c1\u5e95\u7684\u6e56\u6c34\uff0c\u91cc\u9762\u6e05\u6670\u5730\u5012\u6620\u7740\u6211\u9519\u6115\u7684\u3001\u5446\u6ede\u7684\u5f71\u5b50\u3002\n\n\u4e2d\u95f4\u7684\u662f\u6e29\u7476\u3002\u5979\u6bd4\u53e6\u5916\u4e24\u4eba\u8981\u9ad8\u4e00\u4e9b\uff0c\u8eab\u6750\u4e30\u8174\u800c\u5300\u79f0\uff0c\u50cf\u4e00\u5c0a\u6210\u719f\u9971\u6ee1\u7684\u3001\u53e4\u5e0c\u814a\u7684\u5973\u795e\u96d5\u50cf\u3002\u5979\u7684\u8138\u4e0a\u5e26\u7740\u6211\u4eec\u6240\u719f\u6089\u7684\u3001\u6e29\u67d4\u7684\u7b11\u610f\uff0c\u90a3\u7b11\u5bb9\u91cc\u6ca1\u6709\u4e00\u4e1d\u4e00\u6beb\u7684\u6deb\u9761\uff0c\u53ea\u6709\u4e00\u79cd\u5305\u5bb9\u4e00\u5207\u7684\u3001\u4ee4\u4eba\u5b89\u5fc3\u7684\u5b81\u9759\u3002\u5979\u770b\u7740\u6211\uff0c\u773c\u795e\u50cf\u6708\u5149\u4e00\u6837\uff0c\u6e29\u67d4\u5730\u3001\u65e0\u58f0\u5730\uff0c\u5305\u88f9\u7740\u6211\u3002\n\n\u6700\u53f3\u8fb9\u7684\u662f\u9e7f\u7720\u3002\u5979\u6bd4\u5176\u4ed6\u4eba\u90fd\u8981\u5a07\u5c0f\uff0c\u50cf\u4e00\u6735\u542b\u82de\u5f85\u653e\u7684\u3001\u767d\u8272\u7684\u82b1\u3002\u5979\u5149\u7740\u811a\uff0c\u6709\u4e9b\u4e0d\u5b89\u5730\u8737\u7f29\u7740\u811a\u8dbe\u3002\u5927\u6982\u662f\u56e0\u4e3a\u4e0d\u4e60\u60ef\u8fd9\u6837\u7684\u573a\u9762\uff0c\u5979\u7684\u5c0f\u8138\u7ea2\u6251\u6251\u7684\uff0c\u4e0d\u6562\u76f4\u89c6\u6211\uff0c\u773c\u795e\u8eb2\u95ea\u7740\uff0c\u4e00\u4f1a\u513f\u770b\u770b\u5730\u677f\uff0c\u4e00\u4f1a\u513f\u53c8\u5077\u5077\u5730\u3001\u98de\u5feb\u5730\u779f\u6211\u4e00\u773c\uff0c\u7136\u540e\u53c8\u50cf\u53d7\u60ca\u7684\u5c0f\u5154\u5b50\u4e00\u6837\u8fc5\u901f\u79fb\u5f00\u3002\n\n\u5979\u4eec\u7684\u8eab\u4f53\uff0c\u5c31\u8fd9\u6837\u5b8c\u5b8c\u6574\u6574\u5730\u3001\u6beb\u65e0\u4fdd\u7559\u5730\uff0c\u66b4\u9732\u5728\u6211\u7684\u9762\u524d\u3002\u5f62\u72b6\u5404\u5f02\u7684\u4e73\u623f\uff0c\u5e73\u5766\u6216\u67d4\u8f6f\u7684\u5c0f\u8179\uff0c\u4ee5\u53ca\u817f\u95f4\u90a3\u7247\u795e\u79d8\u7684\u3001\u88ab\u7cbe\u5fc3\u6253\u7406\u8fc7\u7684\u533a\u57df\u2026\u2026\u6240\u6709\u7684\u4e00\u5207\uff0c\u90fd\u88ab\u90a3\u6e29\u6696\u800c\u6447\u66f3\u7684\u70db\u5149\uff0c\u52fe\u52d2\u51fa\u4e00\u79cd\u8fd1\u4e4e\u795e\u5723\u7684\u3001\u4ee4\u4eba\u6655\u7729\u7684\u7f8e\u4e3d\u8f6e\u5ed3\u3002\n\n\u8fd9\u4e0d\u662f\u52fe\u5f15\uff0c\u4e5f\u4e0d\u662f\u8bf1\u60d1\u3002\n\n\u6211\u4ece\u5979\u4eec\u7684\u773c\u795e\u91cc\uff0c\u770b\u4e0d\u5230\u4e00\u4e1d\u4e00\u6beb\u7684\u60c5\u6b32\u3002\u6211\u53ea\u770b\u5230\u4e86\u4e00\u79cd\u6700\u7eaf\u7cb9\u3001\u6700\u5766\u8bda\u3001\u4e5f\u6700\u7b28\u62d9\u7684\u5949\u732e\u3002\u5979\u4eec\u50cf\u662f\u53c2\u52a0\u4e00\u573a\u795e\u5723\u7684\u796d\u5178\u7684\u796d\u54c1\uff0c\u5c06\u81ea\u5df1\u6700\u5b9d\u8d35\u7684\u3001\u6700\u79c1\u5bc6\u7684\u4e00\u5207\uff0c\u6beb\u65e0\u4fdd\u7559\u5730\uff0c\u4f5c\u4e3a\u4e00\u4efd\u793c\u7269\uff0c\u732e\u796d\u7ed9\u4e86\u5979\u4eec\u5171\u540c\u4fe1\u4ef0\u7684\u3001\u552f\u4e00\u7684\u795e\u660e\u3002\n\n\u800c\u6211\uff0c\u5c31\u662f\u90a3\u4e2a\u53ef\u7b11\u7684\u3001\u4e0d\u914d\u62e5\u6709\u8fd9\u4e00\u5207\u7684\u3001\u552f\u4e00\u7684\u795e\u660e\u3002\n\n\u201c\u751f\u65e5\u5feb\u4e50\uff0c\u9646\u6c89\u3002\u201d\n\n\u662f\u6e29\u7476\u6700\u5148\u5f00\u4e86\u53e3\u3002\u5979\u7684\u58f0\u97f3\u5f88\u8f7b\uff0c\u5f88\u67d4\uff0c\u5728\u8fd9\u7247\u7edd\u5bf9\u7684\u5bc2\u9759\u91cc\uff0c\u50cf\u4e00\u7247\u7fbd\u6bdb\uff0c\u8f7b\u8f7b\u5730\u843d\u5728\u4e86\u6211\u7684\u5fc3\u6e56\u4e0a\u3002\n\n\u201c\u4f60\u4e0d\u662f\u8bf4\uff0c\u4f60\u4ec0\u4e48\u90fd\u7ed9\u4e0d\u4e86\u6211\u4eec\u5417\uff1f\u201d\n\n\u6797\u521d\u590f\u4e5f\u5f00\u53e3\u4e86\uff0c\u5979\u7684\u58f0\u97f3\u5e26\u7740\u4e00\u4e1d\u65e0\u6cd5\u6291\u5236\u7684\u3001\u7f9e\u6da9\u7684\u98a4\u6296\u3002\n\n\u201c\u90a3\u73b0\u5728\uff0c\u6362\u6211\u4eec\u6765\u7ed9\u4f60\u4e86\u3002\u201d\n\n\u6c5f\u96ea\u770b\u7740\u6211\uff0c\u90a3\u53cc\u603b\u662f\u51b0\u51b7\u7684\u773c\u775b\u91cc\uff0c\u7b2c\u4e00\u6b21\uff0c\u6d41\u9732\u51fa\u4e00\u79cd\u8fd1\u4e4e\u5351\u5fae\u7684\u3001\u5c0f\u5c0f\u7684\u7948\u6c42\u3002\n\n\u201c\u6211\u4eec\u628a\u81ea\u5df1\uff0c\u5f53\u6210\u793c\u7269\uff0c\u9001\u7ed9\u4f60\u3002\u201d\n\n\u201c\u4f60\u2026\u2026\u613f\u610f\u6536\u4e0b\u5417\uff1f\u201d\n\n\u9e7f\u7720\u4ece\u5934\u5230\u5c3e\u90fd\u6ca1\u6562\u8bf4\u8bdd\uff0c\u5979\u53ea\u662f\u5728\u6c5f\u96ea\u8bf4\u5b8c\u4e4b\u540e\uff0c\u770b\u7740\u6211\uff0c\u7136\u540e\u7528\u529b\u5730\u3001\u91cd\u91cd\u5730\u70b9\u4e86\u70b9\u5934\uff0c\u4eff\u4f5b\u7528\u5c3d\u4e86\u5168\u8eab\u7684\u529b\u6c14\u3002\n\n\n\n57.\n\u6211\u611f\u89c9\u81ea\u5df1\u50cf\u4e00\u4e2a\u6eba\u6c34\u7684\u4eba\u3002\n\n\u88ab\u5979\u4eec\u90a3\u4e00\u53e5\u53e5\u6700\u67d4\u8f6f\u3001\u4e5f\u6700\u6c89\u91cd\u7684\u544a\u767d\uff0c\u5f7b\u5e95\u62d6\u5165\u4e86\u540d\u4e3a\u201c\u5e78\u798f\u201d\u7684\u3001\u6e29\u6696\u7684\u6df1\u6d77\u91cc\u3002\u6211\u5f20\u7740\u5634\uff0c\u5374\u65e0\u6cd5\u547c\u5438\uff0c\u53ea\u80fd\u4efb\u7531\u90a3\u706d\u9876\u7684\u3001\u4ee4\u4eba\u6655\u7729\u7684\u60c5\u611f\u6d2a\u6d41\uff0c\u4ece\u56db\u9762\u516b\u65b9\u5c06\u6211\u5305\u88f9\uff0c\u704c\u6ee1\u6211\u7684\u80ba\uff0c\u6df9\u6ca1\u6211\u6240\u6709\u7684\u7406\u667a\u548c\u601d\u8003\u3002\n\n\u201c\u6536\u4e0b\u2026\u2026\u201d\n\n\u6211\u7684\u5634\u5507\u52a8\u4e86\u52a8\uff0c\u5374\u53ea\u80fd\u53d1\u51fa\u4e00\u4e2a\u7834\u788e\u7684\u3001\u4e0d\u6210\u8c03\u7684\u97f3\u8282\u3002\n\n\u6211\u600e\u4e48\u6562\uff1f\n\n\u6211\u51ed\u4ec0\u4e48\uff1f\n\n\u6211\u770b\u7740\u5979\u4eec\uff0c\u770b\u7740\u5979\u4eec\u5728\u70db\u5149\u4e0b\u71a0\u71a0\u751f\u8f89\u7684\u3001\u6beb\u65e0\u7455\u75b5\u7684\u8eab\u4f53\uff0c\u770b\u7740\u5979\u4eec\u90a3\u5199\u6ee1\u4e86\u7d27\u5f20\u3001\u671f\u5f85\u548c\u5b64\u6ce8\u4e00\u63b7\u7684\u773c\u775b\u3002\u5979\u4eec\u6bcf\u4e00\u4e2a\u4eba\uff0c\u90fd\u662f\u8fd9\u4e2a\u4e16\u754c\u4e0a\u72ec\u4e00\u65e0\u4e8c\u7684\u73cd\u5b9d\u3002\u800c\u6211\uff0c\u53ea\u662f\u4e00\u4e2a\u81ea\u79c1\u3001\u61e6\u5f31\u3001\u8fde\u81ea\u5df1\u7684\u5fc3\u90fd\u770b\u4e0d\u6e05\u695a\u7684\u666e\u901a\u4eba\u3002\n\n\u6211\u6709\u4ec0\u4e48\u8d44\u683c\uff0c\u53bb\u6536\u4e0b\u8fd9\u6837\u4e00\u4efd\u6c89\u91cd\u5230\u8db3\u4ee5\u538b\u57ae\u6211\u7075\u9b42\u7684\u793c\u7269\uff1f\n\n\u6211\u7684\u8eab\u4f53\uff0c\u5f00\u59cb\u4e0d\u53d7\u63a7\u5236\u5730\u5411\u540e\u9000\u3002\n\n\u4e00\u6b65\uff0c\u53c8\u4e00\u6b65\u3002\n\n\u6211\u60f3\u9003\u3002\n\n\u6211\u60f3\u4ece\u8fd9\u4e2a\u8fc7\u4e8e\u7f8e\u597d\u7684\u3001\u4e0d\u771f\u5b9e\u7684\u68a6\u5883\u91cc\u9003\u51fa\u53bb\u3002\u56e0\u4e3a\u6211\u77e5\u9053\uff0c\u68a6\u9192\u4e4b\u540e\uff0c\u7559\u7ed9\u6211\u7684\uff0c\u53ea\u4f1a\u662f\u66f4\u6df1\u7684\u3001\u65e0\u5e95\u7684\u6df1\u6e0a\u3002\n\n\u6211\u7684\u540e\u80cc\uff0c\u62b5\u5728\u4e86\u7384\u5173\u51b0\u51b7\u7684\u5899\u58c1\u4e0a\uff0c\u9000\u65e0\u53ef\u9000\u3002\n\n\u770b\u5230\u6211\u7684\u52a8\u4f5c\uff0c\u5979\u4eec\u56db\u4e2a\u4eba\u7684\u8138\u4e0a\uff0c\u90fd\u51fa\u73b0\u4e86\u4e00\u4e1d\u614c\u4e71\u548c\u53d7\u4f24\u7684\u795e\u60c5\u3002\u5c24\u5176\u662f\u6797\u521d\u590f\uff0c\u5979\u90a3\u53cc\u521a\u521a\u624d\u4eae\u8d77\u6765\u7684\u773c\u775b\uff0c\u77ac\u95f4\u5c31\u9eef\u6de1\u4e86\u4e0b\u53bb\uff0c\u5634\u5507\u4e5f\u56e0\u4e3a\u59d4\u5c48\u800c\u5fae\u5fae\u5730\u762a\u4e86\u8d77\u6765\u3002\n\n\u201c\u4f60\u2026\u2026\u4f60\u4e0d\u613f\u610f\u5417\uff1f\u201d\u5979\u7684\u58f0\u97f3\u5e26\u7740\u54ed\u8154\u3002\n\n\u4e0d\u662f\u7684\u3002\n\n\u6211\u4e0d\u662f\u4e0d\u613f\u610f\u3002\n\n\u6211\u662f\u4e0d\u6562\u3002\n\n\u6211\u5f20\u4e86\u5f20\u5634\uff0c\u60f3\u8981\u89e3\u91ca\uff0c\u4f46\u5589\u5499\u91cc\u50cf\u88ab\u4e00\u56e2\u6eda\u70eb\u7684\u68c9\u82b1\u5835\u4f4f\u4e86\uff0c\u4e00\u4e2a\u5b57\u90fd\u8bf4\u4e0d\u51fa\u6765\u3002\u6211\u53ea\u80fd\u7edd\u671b\u5730\u3001\u75db\u82e6\u5730\u6447\u7740\u5934\u3002\n\n\u5c31\u5728\u8fd9\u65f6\uff0c\u4e00\u76f4\u6c89\u9ed8\u7740\u7684\u6c5f\u96ea\uff0c\u5ffd\u7136\u52a8\u4e86\u3002\n\n\u5979\u4ece\u90a3\u7247\u70db\u5149\u7684\u94f6\u6cb3\u91cc\u8d70\u4e86\u51fa\u6765\uff0c\u4e00\u6b65\u4e00\u6b65\u5730\uff0c\u671d\u7740\u6211\u8fd9\u4e2a\u8eb2\u5728\u9634\u5f71\u91cc\u7684\u61e6\u592b\u8d70\u6765\u3002\u5979\u4f9d\u65e7\u662f\u8d64\u8eab\u88f8\u4f53\u7684\uff0c\u90a3\u5177\u5728\u70db\u5149\u4e0b\u767d\u5f97\u50cf\u5728\u53d1\u5149\u7684\u8eab\u4f53\uff0c\u5c31\u8fd9\u4e48\u6beb\u65e0\u906e\u62e6\u5730\u3001\u4e00\u6b65\u4e00\u6b65\u5730\u5411\u6211\u9760\u8fd1\u3002\n\n\u6211\u7684\u5fc3\u810f\u968f\u7740\u5979\u7684\u811a\u6b65\uff0c\u4e00\u4e0b\u4e00\u4e0b\u5730\u72c2\u8df3\u4e0d\u6b62\uff0c\u51e0\u4e4e\u8981\u4ece\u80f8\u8154\u91cc\u70b8\u5f00\u3002\n\n\u5979\u8d70\u5230\u6211\u7684\u9762\u524d\uff0c\u505c\u4e0b\u3002\n\n\u6211\u4eec\u4e4b\u95f4\uff0c\u53ea\u9694\u7740\u4e0d\u5230\u534a\u7c73\u7684\u8ddd\u79bb\u3002\u6211\u80fd\u95fb\u5230\u5979\u8eab\u4e0a\u6c90\u6d74\u540e\u6de1\u6de1\u7684\u9999\u6c14\uff0c\u80fd\u770b\u5230\u5979\u56e0\u4e3a\u7d27\u5f20\u800c\u5fae\u5fae\u8d77\u4f0f\u7684\u3001\u5f62\u72b6\u7f8e\u597d\u7684\u80f8\u90e8\uff0c\u751a\u81f3\u80fd\u770b\u6e05\u5979\u957f\u957f\u7684\u776b\u6bdb\u4e0a\uff0c\u90a3\u9897\u56e0\u4e3a\u7d27\u5f20\u800c\u51dd\u7ed3\u7684\u3001\u7ec6\u5c0f\u7684\u6c34\u73e0\u3002\n\n\u5979\u6ca1\u6709\u8bf4\u8bdd\uff0c\u53ea\u662f\u62ac\u8d77\u5934\uff0c\u7528\u90a3\u53cc\u5df2\u7ecf\u878d\u5316\u4e86\u6240\u6709\u51b0\u96ea\u7684\u3001\u50cf\u6625\u6c34\u4e00\u6837\u6e05\u6f88\u7684\u773c\u775b\uff0c\u9759\u9759\u5730\u770b\u7740\u6211\u3002\n\n\u7136\u540e\uff0c\u5979\u7f13\u7f13\u5730\u3001\u90d1\u91cd\u5730\uff0c\u5411\u6211\u4f38\u51fa\u4e86\u5979\u7684\u624b\u3002\n\n\u5979\u7684\u638c\u5fc3\u5411\u4e0a\uff0c\u624b\u6307\u5fae\u5fae\u8737\u66f2\uff0c\u50cf\u662f\u5728\u9080\u8bf7\uff0c\u53c8\u50cf\u662f\u5728\u4e5e\u6c42\u3002\n\n\u6211\u770b\u7740\u5979\u90a3\u53ea\u624b\uff0c\u90a3\u53ea\u66fe\u7ecf\u51b0\u51b7\u5730\u3001\u56fa\u6267\u5730\u4e3e\u7740\u4e00\u5757\u5de7\u514b\u529b\uff0c\u90a3\u53ea\u66fe\u7ecf\u6124\u6012\u5730\u6525\u7d27\uff0c\u6b64\u523b\u5374\u4ee5\u4e00\u79cd\u6700\u67d4\u8f6f\u3001\u6700\u8106\u5f31\u7684\u59ff\u6001\uff0c\u5411\u6211\u655e\u5f00\u7684\u624b\u3002\n\n\u6211\u611f\u89c9\u81ea\u5df1\u7684\u773c\u775b\uff0c\u53c8\u4e00\u6b21\u88ab\u6eda\u70eb\u7684\u6db2\u4f53\u6a21\u7cca\u4e86\u3002\n\n\u6211\u518d\u4e5f\u65e0\u6cd5\u601d\u8003\u3002\n\n\u6211\u53ea\u662f\u51ed\u7740\u672c\u80fd\uff0c\u7f13\u7f13\u5730\u62ac\u8d77\u6211\u90a3\u53ea\u56e0\u4e3a\u6050\u60e7\u800c\u98a4\u6296\u4e0d\u5df2\u7684\u3001\u51b0\u51b7\u7684\u624b\uff0c\u7136\u540e\uff0c\u8f7b\u8f7b\u5730\uff0c\u50cf\u5bf9\u5f85\u4e00\u4ef6\u6700\u6613\u788e\u7684\u73cd\u5b9d\u4e00\u6837\uff0c\u653e\u8fdb\u4e86\u5979\u7684\u638c\u5fc3\u91cc\u3002\n\n\u5979\u7684\u624b\u6307\uff0c\u77ac\u95f4\u6536\u62e2\uff0c\u5c06\u6211\u7684\u624b\uff0c\u7d27\u7d27\u5730\u3001\u7d27\u7d27\u5730\u63e1\u4f4f\u3002\n\n\u5979\u7684\u624b\u5fc3\uff0c\u5f88\u6696\u3002\n\n\u5979\u63e1\u7740\u6211\u7684\u624b\uff0c\u6ca1\u6709\u518d\u591a\u8bf4\u4ec0\u4e48\uff0c\u53ea\u662f\u8f6c\u8eab\uff0c\u62c9\u7740\u6211\uff0c\u4e00\u6b65\u4e00\u6b65\u5730\uff0c\u91cd\u65b0\u8d70\u56de\u4e86\u90a3\u7247\u7531\u70db\u5149\u7ec4\u6210\u7684\u3001\u6e29\u6696\u7684\u94f6\u6cb3\u91cc\u3002\n\n\u6e29\u7476\u3001\u6797\u521d\u590f\u548c\u9e7f\u7720\uff0c\u90fd\u9759\u9759\u5730\u770b\u7740\u6211\u4eec\u3002\n\n\u6c5f\u96ea\u62c9\u7740\u6211\uff0c\u8d70\u5230\u4e86\u5979\u4eec\u7684\u9762\u524d\u3002\u7136\u540e\uff0c\u5979\u677e\u5f00\u6211\u7684\u624b\uff0c\u8f6c\u800c\u63e1\u4f4f\u4e86\u5979\u8eab\u8fb9\u6797\u521d\u590f\u7684\u624b\u3002\u6797\u521d\u590f\u6123\u4e86\u4e00\u4e0b\uff0c\u4e5f\u53cd\u624b\u63e1\u4f4f\u4e86\u5979\u3002\u7136\u540e\uff0c\u5979\u53c8\u4f38\u51fa\u624b\uff0c\u63e1\u4f4f\u4e86\u53e6\u4e00\u8fb9\u6e29\u7476\u7684\u624b\u3002\u6e29\u7476\u4e5f\u5fae\u7b11\u7740\uff0c\u63e1\u4f4f\u4e86\u5979\uff0c\u7136\u540e\uff0c\u5979\u4f38\u51fa\u53e6\u4e00\u53ea\u624b\uff0c\u5c06\u90a3\u4e2a\u6700\u77ee\u7684\u3001\u6709\u4e9b\u597d\u5947\u7684\u9e7f\u7720\uff0c\u4e5f\u62c9\u4e86\u8fdb\u6765\u3002\n\n\u5979\u4eec\u56db\u4e2a\u4eba\uff0c\u624b\u62c9\u7740\u624b\uff0c\u5728\u6211\u9762\u524d\uff0c\u7ad9\u6210\u4e86\u4e00\u6392\u3002\n\n\u50cf\u4e00\u9053\u7528\u4e16\u754c\u4e0a\u6700\u7f8e\u597d\u7684\u8840\u8089\u7b51\u6210\u7684\u3001\u6e29\u67d4\u7684\u5899\u3002\n\n\u4e00\u9053\u5c06\u6211\u6240\u6709\u9000\u8def\u90fd\u5f7b\u5e95\u5835\u6b7b\uff0c\u5374\u53c8\u4e3a\u6211\u9694\u7edd\u4e86\u6240\u6709\u98ce\u96e8\u7684\u5899\u3002\n\n\u201c\u9646\u6c89\u3002\u201d\n\n\u5979\u4eec\u56db\u4e2a\u4eba\uff0c\u7528\u56db\u79cd\u4e0d\u540c\u7684\u58f0\u7ebf\uff0c\u5374\u5e26\u7740\u540c\u4e00\u79cd\u4e0d\u5bb9\u6211\u62d2\u7edd\u7684\u3001\u6e29\u67d4\u7684\u56fa\u6267\uff0c\u5f02\u53e3\u540c\u58f0\u5730\uff0c\u53eb\u51fa\u4e86\u6211\u7684\u540d\u5b57\u3002\n\n\u201c\u751f\u65e5\u5feb\u4e50\u3002\u201d\n\n\u201c\u4ece\u4eca\u5929\u8d77\uff0c\u6211\u4eec\uff0c\u662f\u4f60\u7684\u4e86\u3002\u201d\n\n\n\n58.\n\u6211\u611f\u89c9\u81ea\u5df1\u50cf\u4e00\u4e2a\u88ab\u6d77\u6d6a\u51b2\u5237\u4e86\u5343\u4e07\u904d\u7684\u3001\u987d\u56fa\u7684\u7901\u77f3\uff0c\u7ec8\u4e8e\u5728\u90a3\u53e5\u6e29\u67d4\u7684\u3001\u4e0d\u5bb9\u62d2\u7edd\u7684\u5ba3\u544a\u91cc\uff0c\u88ab\u5f7b\u5e95\u51fb\u788e\uff0c\u5316\u6210\u4e86\u6e29\u6696\u6c99\u6ee9\u4e0a\u6700\u67d4\u8f6f\u7684\u4e00\u6367\u6c99\u3002\n\n\u6211\u7684\u773c\u6cea\u518d\u4e5f\u65e0\u6cd5\u6291\u5236\uff0c\u50cf\u65ad\u4e86\u7ebf\u7684\u73e0\u5b50\u4e00\u6837\uff0c\u6eda\u6eda\u800c\u4e0b\u3002\u6211\u751a\u81f3\u53d1\u4e0d\u51fa\u4efb\u4f55\u58f0\u97f3\uff0c\u53ea\u80fd\u5f20\u7740\u5634\uff0c\u50cf\u4e2a\u50bb\u5b50\u4e00\u6837\uff0c\u65e0\u58f0\u5730\u3001\u72fc\u72c8\u5730\u54ed\u7740\u3002\n\n\u6211\u4e0d\u662f\u5728\u60b2\u4f24\u3002\n\n\u6211\u53ea\u662f\u2026\u2026\u88ab\u4e00\u79cd\u8fc7\u4e8e\u5e9e\u5927\u7684\u3001\u8fc7\u4e8e\u6eda\u70eb\u7684\u5e78\u798f\uff0c\u70eb\u5f97\u904d\u4f53\u9cde\u4f24\u3002\n\n\u6211\u770b\u7740\u5979\u4eec\uff0c\u770b\u7740\u5979\u4eec\u624b\u62c9\u7740\u624b\uff0c\u50cf\u4e00\u9053\u4e0d\u53ef\u903e\u8d8a\u7684\u3001\u6e29\u67d4\u7684\u57ce\u5899\uff0c\u5c06\u6211\u6240\u6709\u7684\u9000\u8def\u548c\u61e6\u5f31\u90fd\u5f7b\u5e95\u5c01\u6b7b\u3002\u6211\u770b\u7740\u5979\u4eec\u90a3\u4e00\u5f20\u5f20\u6302\u7740\u6cea\u75d5\uff0c\u5374\u53c8\u56e0\u6b64\u800c\u663e\u5f97\u65e0\u6bd4\u751f\u52a8\u548c\u7f8e\u4e3d\u7684\u8138\u3002\n\n\u6211\u7f13\u7f13\u5730\uff0c\u7f13\u7f13\u5730\uff0c\u4f38\u51fa\u4e86\u6211\u90a3\u53ea\u8fd8\u5728\u98a4\u6296\u7684\u624b\u3002\n\n\u6211\u6ca1\u6709\u53bb\u78b0\u5979\u4eec\u4efb\u4f55\u4e00\u4e2a\u4eba\u3002\n\n\u6211\u53ea\u662f\u4f38\u51fa\u624b\uff0c\u7528\u6307\u5c16\uff0c\u8f7b\u8f7b\u5730\u78b0\u4e86\u78b0\u6797\u521d\u590f\u548c\u6c5f\u96ea\u4ea4\u63e1\u5728\u4e00\u8d77\u7684\u90a3\u53ea\u624b\u3002\u7136\u540e\uff0c\u53c8\u78b0\u4e86\u78b0\u6c5f\u96ea\u548c\u6e29\u7476\u4ea4\u63e1\u7684\u624b\u3002\u6700\u540e\uff0c\u662f\u6e29\u7476\u548c\u9e7f\u7720\u3002\n\n\u5979\u4eec\u7684\u624b\uff0c\u90fd\u63e1\u5f97\u5f88\u7d27\u3002\n\n\u6211\u7ec8\u4e8e\u660e\u767d\u4e86\u3002\n\n\u8fd9\u4efd\u793c\u7269\uff0c\u5979\u4eec\u4e0d\u4ec5\u4ec5\u662f\u9001\u7ed9\u4e86\u6211\u3002\n\n\u4e5f\u662f\u9001\u7ed9\u4e86\u5979\u4eec\u5f7c\u6b64\u3002\n\n\u6211\u6536\u56de\u624b\uff0c\u7528\u624b\u80cc\u80e1\u4e71\u5730\u64e6\u4e86\u4e00\u628a\u8138\u4e0a\u7684\u773c\u6cea\u548c\u9f3b\u6d95\uff0c\u7136\u540e\uff0c\u5728\u8fd9\u4e2a\u8352\u8bde\u5f97\u50cf\u68a6\u5883\u4e00\u6837\u7684\u3001\u795e\u5723\u7684\u70db\u5149\u796d\u5178\u91cc\uff0c\u6211\u7ec8\u4e8e\uff0c\u9732\u51fa\u4e86\u4eca\u665a\u7b2c\u4e00\u4e2a\u3001\u4e5f\u662f\u6700\u96be\u770b\u7684\u4e00\u4e2a\u7b11\u5bb9\u3002\n\n\u201c\u90a3\u2026\u2026\u201d\n\n\u6211\u6e05\u4e86\u6e05\u55d3\u5b50\uff0c\u611f\u89c9\u81ea\u5df1\u7684\u58f0\u97f3\u6c99\u54d1\u5f97\u50cf\u78e8\u7802\u7eb8\u3002\n\n\u201c\u2026\u2026\u793c\u7269\uff0c\u6211\u73b0\u5728\u53ef\u4ee5\u62c6\u4e86\u5417\uff1f\u201d\n\n\u6211\u7684\u8bdd\u97f3\u521a\u843d\uff0c\u6797\u521d\u590f\u90a3\u5f20\u54ed\u82b1\u4e86\u7684\u8138\uff0c\u77ac\u95f4\u5c31\u7ea2\u5230\u4e86\u8033\u6839\u3002\u5979\u50cf\u662f\u88ab\u8e29\u4e86\u5c3e\u5df4\u7684\u732b\u4e00\u6837\uff0c\u4e0b\u610f\u8bc6\u5730\u5c31\u60f3\u677e\u5f00\u624b\u53bb\u6342\u4f4f\u81ea\u5df1\u7684\u8eab\u4f53\uff0c\u4f46\u53c8\u88ab\u8eab\u8fb9\u7684\u6c5f\u96ea\u548c\u6e29\u7476\u7262\u7262\u5730\u62c9\u4f4f\u4e86\u3002\n\n\u6c5f\u96ea\u7684\u8138\u4e0a\u4e5f\u6cdb\u8d77\u4e86\u4e00\u5c42\u6781\u6de1\u7684\u7ea2\u6655\uff0c\u5979\u504f\u8fc7\u5934\uff0c\u4e0d\u6562\u770b\u6211\uff0c\u53ea\u662f\u7528\u6ca1\u4ec0\u4e48\u6e29\u5ea6\u7684\u58f0\u97f3\uff0c\u5c0f\u58f0\u5730\u561f\u56d4\u4e86\u4e00\u53e5\u3002\n\n\u201c\u2026\u2026\u4e0d\u8981\u8138\u3002\u201d\n\n\u9e7f\u7720\u5219\u50cf\u662f\u6ca1\u5b8c\u5168\u542c\u61c2\uff0c\u5979\u53ea\u662f\u6b6a\u7740\u5934\uff0c\u90a3\u53cc\u6e05\u6f88\u7684\u773c\u775b\u91cc\u5145\u6ee1\u4e86\u597d\u5947\uff0c\u770b\u770b\u6211\uff0c\u53c8\u770b\u770b\u8eab\u8fb9\u51e0\u4e2a\u8138\u7ea2\u7684\u59d0\u59d0\u3002\n\n\u53ea\u6709\u6e29\u7476\uff0c\u4f9d\u65e7\u662f\u90a3\u526f\u6e29\u67d4\u53c8\u5e26\u7740\u4e00\u4e1d\u65e0\u5948\u7684\u7b11\u610f\u3002\u5979\u770b\u7740\u6211\uff0c\u773c\u795e\u50cf\u6c34\u4e00\u6837\uff0c\u4eff\u4f5b\u5728\u8bf4\uff1a\u6211\u5c31\u77e5\u9053\u4f60\u4f1a\u8fd9\u4e48\u8bf4\u3002\n\n\u5979\u677e\u5f00\u4e86\u62c9\u7740\u9e7f\u7720\u7684\u624b\uff0c\u7f13\u7f13\u5730\u5411\u6211\u8d70\u6765\u3002\n\n\u5979\u8d70\u5230\u6211\u7684\u9762\u524d\uff0c\u8eab\u4e0a\u5e26\u7740\u4e00\u80a1\u6c90\u6d74\u540e\u7684\u3001\u6e29\u6696\u7684\u6c34\u6c7d\u548c\u6de1\u6de1\u7684\u9999\u6c14\u3002\u5979\u6ca1\u6709\u8bf4\u8bdd\uff0c\u53ea\u662f\u4f38\u51fa\u53cc\u81c2\uff0c\u50cf\u90a3\u5929\u665a\u4e0a\u4e00\u6837\uff0
